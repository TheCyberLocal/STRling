[package]
name = "strling"
version = "3.0.0"
authors = ["STRling Team"]
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "STRling portable regex-intent compiler for Rust"
homepage = "https://github.com/strling-lang/strling"
repository = "https://github.com/strling-lang/strling"
documentation = "https://github.com/strling-lang/strling/tree/main/bindings/rust/docs"
readme = "bindings/rust/README.md"
keywords = ["strling", "regex", "regexp", "pattern", "parser"]
categories = ["parsing", "text-processing", "development-tools"]
include = [
    "/core/src/lib_public.rs",
    "/core/src/capability_evaluation.rs",
    "/core/src/capability_pipeline.rs",
    "/core/src/compiler_pipeline.rs",
    "/core/src/diagnostic_generation.rs",
    "/core/src/ecmascript_lowering.rs",
    "/core/src/ecmascript_serialization.rs",
    "/core/src/editor_intelligence.rs",
    "/core/src/explanation.rs",
    "/core/src/kernel.rs",
    "/core/src/no_match_explanation.rs",
    "/core/src/normalization.rs",
    "/core/src/portability_diagnostics.rs",
    "/core/src/portability_planning.rs",
    "/core/src/python_re_lowering.rs",
    "/core/src/python_re_serialization.rs",
    "/core/src/regex_frontend.rs",
    "/core/src/safety_analysis.rs",
    "/core/src/semantic_analysis.rs",
    "/core/src/semantic_conversion.rs",
    "/core/src/semantic_frontend.rs",
    "/core/src/semantic_rewrite.rs",
    "/core/src/simply.rs",
    "/core/src/stdlib.rs",
    "/core/src/structural_analysis.rs",
    "/core/src/target_lowering.rs",
    "/core/src/target_serialization.rs",
    "/core/src/conformance/**/*.rs",
    "/core/src/diagnostic/**/*.rs",
    "/core/src/diagnostic_generation/**/*.rs",
    "/core/src/portability_planning/**/*.rs",
    "/core/src/protocol/**/*.rs",
    "/core/src/safety_analysis/**/*.rs",
    "/core/src/semantic/**/*.rs",
    "/core/src/semantic_analysis/**/*.rs",
    "/core/src/source/**/*.rs",
    "/core/src/target/**/*.rs",
    "/core/src/validation/**/*.rs",
    "/spec/contracts/1.0/examples/compile-request/regex-compat-malformed.json",
    "/spec/contracts/1.0/examples/compile-request/regex-compat-success.json",
    "/spec/contracts/1.0/examples/compile-request/target-artifact.json",
    "/spec/portability/equivalence/1.0/atomic-literal-elision.cases.json",
    "/spec/portability/equivalence/1.0/exact-once-repetition-elision.cases.json",
    "/spec/portability/equivalence/1.0/registry.json",
    "/spec/stdlib/essential_5.json",
    "/spec/stdlib/registry/1.0/canonical-semantics.json",
    "/spec/targets/profiles/ecmascript-2024.json",
    "/spec/targets/profiles/pcre2-10.42.json",
    "/spec/targets/profiles/pcre2-10.43.json",
    "/spec/targets/profiles/python-re-3.11-bytes.json",
    "/spec/targets/profiles/python-re-3.11.json",
    "/tests/conformance/ecmascript-runtime-certification.json",
    "/tests/conformance/pcre2-runtime-certification.json",
    "/tests/conformance/python-re-runtime-certification.json",
    "/bindings/rust/tests/facade.rs",
    "/bindings/rust/examples/*.rs",
    "/bindings/rust/README.md",
    "/bindings/rust/docs/**/*.md",
    "/LICENSE",
]
autobins = false
autoexamples = false
autotests = false
autobenches = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"

[lib]
name = "strling"
path = "core/src/lib_public.rs"

[[test]]
name = "facade"
path = "bindings/rust/tests/facade.rs"

[[example]]
name = "adapter_projection"
path = "bindings/rust/examples/adapter_projection.rs"

[[example]]
name = "demo"
path = "bindings/rust/examples/demo.rs"
