record_version: 1.0.0
waiver_id: WVR-PERL-PARSER-CASE-001
status: accepted
rule: Tracked paths must not collide under case-insensitive filesystem comparison.
scope:
  description: The existing Perl binding contains two distinct parser modules whose paths differ only by filename case.
  paths:
    - bindings/perl/lib/STRling/Core/Parser.pm
    - bindings/perl/lib/STRling/Core/parser.pm
rationale: Removing or merging either module without a dedicated Perl compatibility analysis could change module loading and runtime behavior. The hygiene scanner must report only this exact pair as a governed exception.
retirement:
  condition: Retire after a contained Perl compatibility task proves one canonical module path on case-sensitive and case-insensitive filesystems and passes the full Perl test baseline.
  replacement_work:
    - Reconcile the duplicate-cased Perl parser modules without changing public behavior.
