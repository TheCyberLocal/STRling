record_version: 1.0.0
waiver_id: WVR-SEC-NPM-TOOLING-001
status: accepted
rule: SEC-VULN-BLOCKING
scope:
    description: Exact high or critical npm advisory bindings present only through repository development and packaging dependency chains at the baseline review.
    paths:
        - package.json
        - package-lock.json
        - tooling/lsp-server/package.json
        - tooling/lsp-server/package-lock.json
        - bindings/typescript/package.json
        - bindings/typescript/package-lock.json
rationale: >-
    The affected locked packages are reached through development, test, documentation, or extension-packaging chains rather than STRling runtime dependencies. Broad dependency modernization is outside this security-baseline task and could change supported tool behavior. The exact current advisory/package/version bindings are accepted for thirty days while a contained compatibility-preserving tooling update is prepared; any new advisory, severity, version, package, or dependency root remains blocking.
