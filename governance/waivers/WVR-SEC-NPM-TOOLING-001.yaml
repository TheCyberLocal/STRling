retirement:
    condition: Retire after a dedicated dependency-remediation change updates or isolates every exact affected development chain and passes the relevant package, extension, documentation, and canonical quality baselines.
    expires_on: "2026-09-10"
    replacement_work:
        - Prepare minimal compatibility-preserving updates for the affected development and packaging dependency chains.
        - Re-run authoritative npm audit and remove each match as its exact advisory binding is eliminated.
