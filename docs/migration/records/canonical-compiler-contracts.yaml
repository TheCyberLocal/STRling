required_verification:
    - name: Canonical contract validation
      command: python3 tooling/contract_validation.py
      expected_result: Every canonical schema, authored example, target profile, and conformance case passes schema and cross-contract validation while controlled invalid cases are rejected.
    - name: Repository quality and certification
      command: PATH=/tmp/strling-pinned-tools:$PATH BUNDLER_VERSION=2.4.20 ./strling check all; PATH=/tmp/strling-pinned-tools:$PATH BUNDLER_VERSION=2.4.20 ./strling certify all
      expected_result: All enforced repository and binding hardgates pass from committed state; governed transitional capabilities remain explicit.
    - name: Contract-focused tests
      command: python3 -m unittest tooling.tests.test_canonical_contracts
      expected_result: Positive, negative, deterministic serialization, identity, source-coordinate, and cross-contract tests pass.
    - name: Structured and documentation validation
      command: parse changed JSON and YAML; validate local Markdown links; git diff --check
      expected_result: Structured documents parse, links resolve, and patch hygiene passes.
checkpoints:
    - name: Existing representation audit and contract invariants
      status: passed
      evidence:
          - check: Clean committed starting state
            command: git status --short --branch; git rev-parse HEAD
            result: passed
            details: Work began from a clean architecture/v4 tree at 33f7a9ebe983029964be0a2ef9db96369f186282.
          - check: Legacy representation audit
            command: TypeScript and binding AST/IR/compiler/diagnostics review; legacy base, PCRE2, conformance, feature, LSP, and target evidence review
            result: passed
            details: Accepted construct and normalization behavior were retained as compatibility evidence while unstable capture references, absent provenance, universal-AST assumptions, implementation-authored expectations, and timeless target facts were rejected as canonical constraints.
          - check: Cross-contract design decisions
            command: spec/contracts/INVARIANTS.md
            result: passed
            details: Syntax/semantic/target boundaries, opaque node and logical capture identity, UTF-8 byte spans, normalized IR form, separate derived analyses, structured failure, three portability statuses, closed-world objects, and one independent contract-suite version were ratified.
          - check: Existing integrity and quality hardgates
            command: pinned Ruff 0.15.21; ./strling check all --json; ./strling certify all --json
            result: passed
            details: Both all-component aggregates exited zero after all enforced checks passed; only pre-existing governed incomplete, deferred, and transitional capabilities remained.
          - check: Focused checkpoint verification
            command: ./strling format --check repository; ./strling hygiene; ./strling generate --check; ./strling contracts --check; ./strling governance; python3 tooling/baseline.py --check; git diff --check
            result: passed
            details: Formatting, hygiene, unchanged generation/public contracts, active-task declarations, architecture fitness, frozen baseline reproduction, and patch integrity passed.
    - name: Source and Semantic IR contracts
      status: passed
      evidence:
          - check: Source identity provenance and coordinates
            command: spec/contracts/1.0/source.schema.json; Unicode and immutable-reference examples
            result: passed
            details: SourceDocument separates opaque identity, frontend/dialect, exact inline or digest-pinned referenced content, specification version, and provenance; spans are explicit half-open UTF-8 byte offsets and legacy UTF-32 values require conversion.
          - check: Canonical target-neutral Semantic IR
            command: spec/contracts/1.0/semantic-ir.schema.json; spec/contracts/1.0/examples/semantic-ir
            result: passed
            details: Twelve semantic node kinds, logical captures, explicit wildcard/class/assertion intent, atomicity, repetition, optional source origins, and source-less construction are represented without target fragments, host values, or syntax-only grouping.
          - check: Normalization identity and negative contracts
            command: python3 tooling/contract_validation.py
            result: passed
            details: Two Draft 2020-12 schemas and four positive examples passed; ten controlled malformed examples were rejected for schema shape, duplicate node/capture identity, unresolved capture, invalid UTF-8 attribution, undeclared source, nested sequence, uncoalesced literals, reversed bounds, and target leakage.
          - check: Focused schema and invariant tests
            command: ruff format/check tooling contract files; python3 -m unittest tooling.tests.test_canonical_contracts; git diff --check
            result: passed
            details: Seven tests passed for schema validity, positive and negative corpora, every node category, source-less semantics, Unicode byte boundaries, and deterministic Unicode-preserving serialization; formatting, lint, and patch integrity passed.
    - name: Diagnostic and compiler protocol contracts
      status: passed
      evidence:
          - check: Structured diagnostic contract
            command: spec/contracts/1.0/diagnostic.schema.json; spec/contracts/1.0/PROTOCOL.md
            result: passed
            details: Stable code, occurrence, severity ownership, phase, category, optional UTF-8 attribution, related locations, advice, and non-overlapping deterministic text edits are independent of presentation prose.
          - check: Deterministic request and structured result protocol
            command: spec/contracts/1.0/compile-request.schema.json; spec/contracts/1.0/compile-result.schema.json
            result: passed
            details: Exactly one source or normalized Semantic IR input, explicit specification and target selection, narrow options, requested outputs, succeeded/failed outcomes, independent sections, structured unsupported-frontend failure, and error-suppressed artifacts are transport and filesystem independent.
          - check: Partial results and derived analysis boundary
            command: spec/contracts/1.0/analysis.schema.json; spec/contracts/1.0/portability.schema.json; request/result exchange validation
            result: passed
            details: Partial semantics require explicit diagnostic recovery mode and cannot feed downstream phases; node facts and requirements remain keyed results, profiles are immutable references, and overall portability is the least-supported decision.
          - check: Positive negative ordering attribution and round-trip tests
            command: python3 tooling/contract_validation.py; python3 -m unittest tooling.tests.test_canonical_contracts
            result: passed
            details: Seven Draft 2020-12 schemas, fourteen positive objects, and seventeen controlled invalid objects passed their expected outcomes; thirteen tests covered success, diagnostic-only failure, partial recovery, unsupported frontend, deterministic diagnostic ordering, source attribution, node reference integrity, and canonical JSON round trips.
    - name: Target profile portability and artifact contracts
      status: passed
      evidence:
          - check: Version-aware target profile model
            command: spec/contracts/1.0/target-profile.schema.json; spec/targets/profiles
            result: passed
            details: Profiles independently identify immutable profile revision, engine and optional runtime versions, compatible specification versions, enumerated capability scope, typed availability constraints, selected compile/runtime options, and primary evidence; unlisted capabilities remain unknown.
          - check: Authored PCRE2 ECMAScript and Python profiles
            command: validate pcre2-10.42.json, pcre2-10.43.json, ecmascript-2024.json, and python-re-3.11.json
            result: passed
            details: The same PCRE2 engine has distinct 10.42 and 10.43 profiles for fixed versus bounded variable-length lookbehind; ECMAScript 2024 and Python re 3.11 prove edition and runtime-version representations without claiming a complete capability matrix.
          - check: Portability and deterministic TargetArtifact
            command: spec/contracts/1.0/portability.schema.json; spec/contracts/1.0/target-artifact.schema.json; spec/contracts/1.0/TARGETS.md
            result: passed
            details: Status is exactly native, equivalent_rewrite, or unsupported; unsupported plans cannot emit. Artifacts separate UTF-8 pattern text, options, immutable profile reference, resolved requirements, mappings, and emission diagnostics with deterministic ordering.
          - check: Profile fingerprint constraints and artifact validation
            command: python3 tooling/contract_validation.py; python3 -m unittest tooling.tests.test_canonical_contracts
            result: passed
            details: Nine Draft 2020-12 schemas, twenty-four positive objects, and twenty-four controlled invalid objects passed expected outcomes; seventeen tests covered engine-version distinctions, canonical profile fingerprints, required option separation, source maps, target compile exchange, malformed versions, unavailable/constrained capabilities, and deterministic round trips.
    - name: Specification-authored conformance contract
      status: passed
      evidence:
          - check: Specification-owned case and authority-manifest contracts
            command: spec/contracts/1.0/conformance-case.schema.json; spec/contracts/1.0/conformance-manifest.schema.json; spec/conformance/README.md
            result: passed
            details: Cases require stable IDs, explicit specification version, specification authorship, one source or semantic input, and only the expectation layers they exercise; cases cannot declare themselves normative, while content-addressed manifest status requires ratified delegation before becoming normative.
          - check: Draft seed corpus
            command: spec/conformance/cases; spec/conformance/manifest.json
            result: passed
            details: Four independently authored draft cases cover exact/factual semantics, structured parser diagnostics, abstract positive/negative matching with logical captures, and version-aware target support; the manifest pins every case ID, path, and canonical JSON fingerprint.
          - check: Legacy evidence boundary
            command: conformance compatibility_evidence fields; existing specification authority classification
            result: passed
            details: Historical tests/spec fixtures are cited only as transitional compatibility evidence and are absent from the specification authority manifest; implementation output cannot self-promote through schema conformance or case-local status.
          - check: Ownership combination identity and target-reference validation
            command: python3 tooling/contract_validation.py; python3 -m unittest tooling.tests.test_canonical_contracts
            result: passed
            details: Eleven Draft 2020-12 schemas, twenty-nine positive objects, and thirty-three controlled invalid objects passed expected outcomes; twenty-one tests cover manifest ownership, stable membership and fingerprints, non-self-promotion, invalid error/execution combinations, logical captures, target resolution, explicit specification association, layer independence, and deterministic round trips.
    - name: Cross-contract certification
      status: passed
      evidence:
          - check: Cross-family ownership and boundary certification
            command: spec/contracts/CERTIFICATION.md; python3 tooling/contract_validation.py
            result: passed
            details: One owner is defined for shared versions, source coordinates, node and capture identities, diagnostics, profile references, portability status, and conformance authority; suite validation rejects target syntax in Semantic IR, frontend syntax in target contracts, unresolved links, duplicate schema IDs, and inconsistent contract versions.
          - check: Authority indexes and mandatory hardgate
            command: spec/README.md; docs/spec_links.md; toolchain.json; governance/architecture-rules.json
            result: passed
            details: Specification authority now identifies all canonical families, draft specification-authored conformance, version-aware profiles, and legacy compatibility schemas correctly; canonical validation runs in both check and certify and schema-reference governance covers the new suite.
          - check: Controlled cross-contract negatives and focused tests
            command: python3 tooling/contract_validation.py; python3 -m unittest tooling.tests.test_canonical_contracts
            result: passed
            details: Eleven Draft 2020-12 schemas, twenty-nine positive objects, thirty-three controlled invalid objects, nine linked authority documents, and twenty-two focused tests passed, including suite ownership, leakage, ordering, identity, profile, manifest, and deterministic serialization checks.
          - check: Full committed-state repository certification
            command: PATH=/tmp/strling-pinned-tools:$PATH BUNDLER_VERSION=2.4.20 ./strling check all --json; PATH=/tmp/strling-pinned-tools:$PATH BUNDLER_VERSION=2.4.20 ./strling certify all --json
            result: passed
            details: Clean checkpoint commit 83dd053de15168a145098d1976f598708dd6e99b passed both all-component aggregates with zero failed or unavailable enforced results; formatting, hygiene, lint, typecheck, build, tests, generation, contracts, governance, baseline, architecture fitness, canonical validation, and the TypeScript baseline all passed while governed incomplete capabilities remained explicit.
    - name: Completion and kernel-implementation readiness
      status: passed
      evidence:
          - check: Canonical contract system
            result: passed
            details: Source/provenance, target-neutral normalized Semantic IR, derived keyed analysis, diagnostics, deterministic compiler request/result, version-aware target profiles, portability plans, TargetArtifact, and specification-authored conformance are coherent, independently versioned where necessary, and machine-readable.
          - check: Preserved product behavior and explicit transitions
            result: passed
            details: No parser, grammar, compiler, emitter, target, binding, package, LSP, or public API behavior was migrated or intentionally changed; shallow AST/IR, legacy base/PCRE2 schemas, generated fixtures, duplicated binding models, and emitter capability tables remain compatibility evidence.
          - check: Canonical Rust kernel readiness
            result: passed
            details: The repository is ready to establish a canonical Rust kernel skeleton and schema-backed domain types against contract suite 1.0.0 without yet migrating frontends, target lowering, emitters, or adapters.
