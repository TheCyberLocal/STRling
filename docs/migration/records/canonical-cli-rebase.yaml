change_classification:
    semantic_change:
        level: none
        evidence:
            - The CLI transports existing canonical frontend, semantic, explanation, conversion, portability, lowering, and serialization behavior and cannot define language meaning.
    public_api_change:
        level: none
        evidence:
            - CP1 changes no executable CLI, kernel, binding, package, or public-contract surface; it only locks the later additive boundary.
        affected_surfaces: []
    schema_change:
        level: none
        evidence:
            - CP1 creates no schema; the independently versioned CLI response schema remains CP2 work.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Canonical diagnostic codes, severities, messages, ordering, suppression, and source spans remain owned by the existing compiler stages; human rendering is non-normative.
    target_behavior_change:
        level: none
        evidence:
            - CP1 does not execute or change target behavior; it freezes the future orchestration boundary around existing certified lowerers and serializers.
    architecture_change:
        level: none
        evidence:
            - CP1 records the intended POSIX, PowerShell, Rust-kernel, and Python-retirement boundaries without changing dependency direction or executable architecture.
    generated_output_change:
        level: none
        evidence:
            - CP1 changes no registered generated artifact.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: CLI response contracts and command corpus
      command: python3 -m tooling.canonical_cli_contract --check && python3 -m unittest tooling.tests.test_canonical_cli_contract
      expected_result: Closed versioned schemas and fixtures lock every command, format, exit, input mode, profile mode, compatibility disposition, output-safety rule, and malformed case without defining compiler semantics.
    - name: Canonical CLI and library parity
      command: cargo test --manifest-path core/Cargo.toml --test canonical_cli --test target_artifact_orchestration --test frontend_orchestration --test simply_adapter_transport --locked
      expected_result: CLI requests and direct library calls produce identical canonical CompileResult and TargetArtifact data, reuse one explanation execution, preserve Simply compatibility, and pass stdin/file, diagnostics, exit, broken-pipe, and output-safety cases.
    - name: Affected compatibility and public surfaces
      command: python3 -m unittest tooling.tests.test_frontend_orchestration_architecture tooling.tests.test_public_contracts tooling.tests.test_documentation_integrity && python3 tooling/public_contracts.py --check
      expected_result: Python/TypeScript CLI smoke coverage uses the canonical Rust route, POSIX and PowerShell help/dispatch agree, the shadow Python CLI is absent, and only declared additive public surfaces change.
    - name: Repository and campaign certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && python3 tooling/migration_differential.py --repeat-runs 3 && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: Rust, affected bindings, migration, architecture, security, governance, documentation, public/generated contracts, canonical profiles, patch integrity, and clean-tree checks pass or retain only explicitly recorded inherited environment limitations.
