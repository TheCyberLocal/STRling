            details: >-
                The Rust binary implements compile, import, explain, migrate, semantic check, target list/inspect, and retained Simply/raw-request forms. Eleven executable CLI tests cover direct request/result and artifact parity, deterministic source provenance, imported provenance, subject privacy, exact migration, failed-output absence, create-new output refusal, canonical output-option ordering, five-profile inspection, exits 2/64/69/74, human diagnostic streams, and retired legacy option rejection. Existing frontend and Simply transport suites remain green.
