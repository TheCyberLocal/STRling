            details: >-
                Commit 2d4bb71aff5fbdc822e5bc84014ff033668c3e4b composes the existing certified PCRE2, ECMAScript, and Python re lowerer/serializer paths for TargetArtifact requests and exposes the explanation produced by the same stage execution. All five authored profiles equal their direct backend artifacts; repeated evidence is deterministic; compile() remains result-identical; unsupported targets remain explicit without fabricated output.
          - check: Canonical command transport and safety
