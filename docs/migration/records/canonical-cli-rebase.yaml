change_classification:
    semantic_change:
        level: none
        evidence:
            - The CLI transports existing canonical frontend, semantic, explanation, conversion, portability, lowering, and serialization behavior and cannot define language meaning.
    public_api_change:
        level: additive
        evidence:
            - CP2 adds only the independent strling.cli 1.0 response contract; executable CLI, kernel, CompileRequest, CompileResult, Simply, binding, and package APIs remain unchanged.
        affected_surfaces:
            - schema-cli
    schema_change:
        level: additive
        evidence:
            - The closed CLI schema composes canonical compiler, explanation, no-match, conversion, and target-profile values without modifying any owning schema; the test-manifest schema governs only non-normative verification design.
        affected_surfaces:
            - schema-cli
    diagnostic_change:
        level: none
        evidence:
            - Canonical diagnostic codes, severities, messages, ordering, suppression, and source spans remain owned by the existing compiler stages; human rendering is non-normative.
    target_behavior_change:
        level: none
        evidence:
            - CP1 does not execute or change target behavior; it freezes the future orchestration boundary around existing certified lowerers and serializers.
    architecture_change:
        level: additive
        evidence:
            - CP2 adds a versioned CLI transport-contract island and offline validation corpus without changing executable dependency direction or product routing.
    generated_output_change:
        level: none
        evidence:
            - CP1 changes no registered generated artifact.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: CLI response contracts and command corpus
      command: python3 -m tooling.canonical_cli_contract --check && python3 -m unittest tooling.tests.test_canonical_cli_contract
      expected_result: Closed versioned schemas and fixtures lock every command, format, exit, input mode, profile mode, compatibility disposition, output-safety rule, and malformed case without defining compiler semantics.
    - name: Canonical CLI and library parity
      command: cargo test --manifest-path core/Cargo.toml --test canonical_cli --test target_artifact_orchestration --test frontend_orchestration --test simply_adapter_transport --locked
      expected_result: CLI requests and direct library calls produce identical canonical CompileResult and TargetArtifact data, reuse one explanation execution, preserve Simply compatibility, and pass stdin/file, diagnostics, exit, broken-pipe, and output-safety cases.
    - name: Affected compatibility and public surfaces
      command: python3 -m unittest tooling.tests.test_frontend_orchestration_architecture tooling.tests.test_public_contracts tooling.tests.test_documentation_integrity && python3 tooling/public_contracts.py --check
      expected_result: Python/TypeScript CLI smoke coverage uses the canonical Rust route, POSIX and PowerShell help/dispatch agree, the shadow Python CLI is absent, and only declared additive public surfaces change.
    - name: Repository and campaign certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && python3 tooling/migration_differential.py --repeat-runs 3 && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: Rust, affected bindings, migration, architecture, security, governance, documentation, public/generated contracts, canonical profiles, patch integrity, and clean-tree checks pass or retain only explicitly recorded inherited environment limitations.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and command inventory
            result: passed
            details: The clean architecture/v4 boundary at ed3cb1b records raw Rust CompileRequest and Simply transports, POSIX-only product dispatch, a PowerShell parity gap, the legacy Python parser/schema/PCRE2 emitter command, the quality-check name conflict, existing exit and stream behavior, and all owned tests and documentation references.
          - check: Canonical architecture boundary
            result: passed
            details: The command tree, request-construction boundary, exact-profile resolution, unchanged CompileResult and Simply contracts, additive same-execution explanation projection, existing certified target lowerer/serializer routing, no-match and conversion composition, source identity/provenance policy, and explicit semantic exclusions are locked before implementation.
          - check: Transport, compatibility, and safety contract
            result: passed
            details: Machine/human modes, strling.cli 1.0 schema scope, stdout/stderr rules, exits 0/2/64/69/70/74, broken-pipe disposition, non-overwriting atomic-new output policy, deterministic semantic-check dispatch, retained raw compile/Simply forms, and retired ambiguous Python --schema/--emit behavior are recorded without fabricated implementation evidence.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed CLI response contract
            result: passed
            details: >-
                strling.cli 1.0.0 defines exactly six closed response alternatives: completed and compile-failed explanation, completed and compile-failed migration, target list, and target inspect. Compile/import/JSON check remain direct CompileResult 1.0 values and Simply retains its existing adapter response. All embedded values reference their owning canonical schemas; raw subject text, target probes, parser semantics, and heuristics have no CLI fields.
          - check: Complete command, profile, exit, and compatibility denominator
            result: passed
            details: >-
                The verification-design manifest freezes eight commands, all five authored target profiles with exact canonical fingerprints, exits 0/2/64/69/70/74, six compatibility dispositions, 19 coverage requirements, and 42 sorted cases spanning JSON/human modes, stdin/files, provenance, malformed inputs, diagnostics, resources, profile/version selection, output safety, broken pipes, wrapper parity, determinism, and direct result/artifact parity.
          - check: Positive composition and mutation resistance
            result: passed
            details: >-
                The offline validator composes six positive response alternatives from existing canonical request/result, explanation, no-match, conversion, and target-profile examples rather than copying semantic values. Six controlled mutations covering wrong version/tag, missing required evidence, illegal evidence on compile failure, and unknown fields are rejected. Ten focused tests cover denominator shrinkage, duplicate identities, missing coverage, profile-fingerprint drift, schema positives/negatives, and privacy boundaries. The suite fingerprint is sha256:b28e6d10d278b60a0690d784bac2af930f130736b4bf95257b439e4f5bbeb8e2.
