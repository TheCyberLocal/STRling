change_classification:
    semantic_change:
        level: none
        evidence:
            - Quality proofs report immutable canonical semantics; they do not change accepted language, match behavior, captures, assertions, or rewrites.
    public_api_change:
        level: none
        evidence:
            - The governed kernel facade signature and all binding/package surfaces remain unchanged; evidence types remain in the excluded certified-stage module surface.
        affected_surfaces: []
    schema_change:
        level: none
        evidence:
            - New diagnostics use the existing 1.0 Diagnostic contract and SemanticValidity category without adding wire fields or enum values.
        affected_surfaces: []
    diagnostic_change:
        level: additive
        evidence:
            - Adds seven stable STRL-QUALITY codes for complete target-neutral semantic proofs while preserving STRL-SAFETY-0001 through STRL-SAFETY-0005 exactly.
    target_behavior_change:
        level: none
        evidence:
            - No target profile, capability, portability, lowering, serialization, runtime harness, or conformance expectation changes.
    architecture_change:
        level: additive
        evidence:
            - Canonical diagnostic generation gains an internal proof substage consuming only the already-required normalized program and certified foundational and structural facts.
            - Architecture fitness extends target-neutral enforcement to the diagnostic-generation submodule and rejects any raw-source, target, product, frontend, binding, editor, or runtime dependency.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Closed quality-code and proof certification
      command: cargo test --manifest-path core/Cargo.toml --test semantic_quality_diagnostics --test semantic_quality_diagnostic_properties --locked
      expected_result: Every and only the seven closed proof conditions emits its stable code, severity, evidence, source projection, and advice; adversarial near misses and unknown conditions remain silent; normalization and source-less generation are deterministic.
    - name: Existing diagnostic preservation and complete kernel regression
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings
      expected_result: STRL-SAFETY-0001 through 0005, their evidence and severities remain exact, all existing kernel behavior passes, and the implementation builds warning-free.
    - name: Contract and architecture certification
      command: python3 tooling/contract_validation.py && python3 tooling/core_contract_validation.py && python3 tooling/core_stage_boundaries.py && python3 -m unittest tooling.tests.test_canonical_contracts tooling.tests.test_diagnostic_architecture tooling.tests.test_core_contracts
      expected_result: The new diagnostic fixture validates under the unchanged schema and controlled mutations prove certified-fact dependency, target neutrality, no raw-source scanning, and no parallel analyzer or product route.
    - name: Repository and profile certification
      command: python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check
      expected_result: All available hardgates pass, no public or generated surface drifts, inherited host-only gaps remain explicit without waiver, and the final committed tree is clean.
checkpoints:
