title: Proof-backed semantic quality diagnostics
status: in_progress
objective: Preserve the five certified target-neutral safety diagnostics and extend canonical diagnostic generation with deterministic typed evidence for provably unreachable, degenerate, contradictory, overlapping, or suspicious semantic structures, without raw-source heuristics, style-only warnings, target/runtime claims, automatic rewrites, product migration, or language-semantic changes.
