change_classification:
    semantic_change:
        level: none
        evidence:
            - Quality proofs report immutable canonical semantics; they do not change accepted language, match behavior, captures, assertions, or rewrites.
    public_api_change:
        level: none
        evidence:
            - The governed kernel facade signature and all binding/package surfaces remain unchanged; evidence types remain in the excluded certified-stage module surface.
        affected_surfaces: []
    schema_change:
        level: none
        evidence:
            - New diagnostics use the existing 1.0 Diagnostic contract and SemanticValidity category without adding wire fields or enum values.
        affected_surfaces: []
    diagnostic_change:
        level: additive
        evidence:
            - Adds seven stable STRL-QUALITY codes for complete target-neutral semantic proofs while preserving STRL-SAFETY-0001 through STRL-SAFETY-0005 exactly.
    target_behavior_change:
        level: additive
        evidence:
            - Adds one Diagnostic-contract example under the repository path classified as target-behavior evidence; it exercises target-neutral semantic quality output and does not change any target profile, capability, portability, lowering, serialization, runtime harness, or conformance expectation.
    architecture_change:
        level: additive
        evidence:
            - Canonical diagnostic generation gains an internal proof substage consuming only the already-required normalized program and certified foundational and structural facts.
            - Architecture fitness extends target-neutral enforcement to the diagnostic-generation submodule and rejects any raw-source, target, product, frontend, binding, editor, or runtime dependency.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Closed quality-code and proof certification
      command: cargo test --manifest-path core/Cargo.toml --test semantic_quality_diagnostics --test semantic_quality_diagnostic_properties --locked
      expected_result: Every and only the seven closed proof conditions emits its stable code, severity, evidence, source projection, and advice; adversarial near misses and unknown conditions remain silent; normalization and source-less generation are deterministic.
    - name: Existing diagnostic preservation and complete kernel regression
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings
      expected_result: STRL-SAFETY-0001 through 0005, their evidence and severities remain exact, all existing kernel behavior passes, and the implementation builds warning-free.
    - name: Contract and architecture certification
      command: python3 tooling/contract_validation.py && python3 tooling/core_contract_validation.py && python3 tooling/core_stage_boundaries.py && python3 -m unittest tooling.tests.test_canonical_contracts tooling.tests.test_diagnostic_architecture tooling.tests.test_core_contracts
      expected_result: The new diagnostic fixture validates under the unchanged schema and controlled mutations prove certified-fact dependency, target neutrality, no raw-source scanning, and no parallel analyzer or product route.
    - name: Reviewed migration and exact cross-engine non-regression
      command: ./strling migration-differential --repeat-runs 3 && STRLING_PCRE2_1042_LIBRARY=/exact/libpcre2-10.42.so STRLING_PCRE2_1043_LIBRARY=/exact/libpcre2-10.43.so STRLING_NODE_22_BINARY=/exact/node-v22.23.2/bin/node STRLING_CPYTHON_311_BINARY=/exact/cpython-3.11.15/bin/python3.11 python3 -m tooling.shared_cross_engine_corpus --json --check --repeat-runs 2 && python3 -m tooling.portability_matrix --json --check
      expected_result: The reviewed canonical-boundary identity changes only for the intended diagnostic implementation; every corpus, route, source-observation, historical-peer, and replacement-review identity remains stable; exact shared observations and the zero-unresolved portability matrix reproduce unchanged.
    - name: Repository and profile certification
      command: python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check
      expected_result: All available hardgates pass, no public or generated surface drifts, inherited host-only gaps remain explicit without waiver, and the final committed tree is clean.
checkpoints:
    - name: Preserved analysis and diagnostic inventory
      status: passed
      evidence:
          - check: Canonical prerequisite boundary
            result: passed
            details: Foundational analysis already owns nullability, Unicode-scalar bounds, consumption, and logical capture/reference relationships. Structural analysis owns zero-width progress and exact symbolic overlap. Safety analysis owns five positive safety findings and typed uncertainty. Diagnostic generation validates exact correspondence and preserves structured evidence; P12-T04 does not need to change any prerequisite owner.
          - check: Preserved external behavior
            result: passed
            details: STRL-SAFETY-0001 through STRL-SAFETY-0005, compiler-policy severities, messages, source rules, advice, ordering, uncertainty silence, and the target-neutral compiler pipeline are complete and must remain regression-locked.
          - check: Remaining proof-backed gap
            result: passed
            details: No canonical code currently reports provable zero-maximum or exact-once repetitions, exact duplicate alternatives, complementary same-position assertions, explicit set-member intersection, or backreferences to proven zero-width captures. The existing fact stores can prove these without raw-source or target heuristics.
    - name: Closed quality proof and diagnostic contract
      status: passed
      evidence:
          - check: Seven-code false-positive boundary
            result: passed
            details: Seven typed QualityFindingCode and QualityEvidence variants implement only the locked zero-maximum, non-possessive exact-once, duplicate-branch, boundary-contradiction, lookaround-contradiction, explicit set-overlap, and zero-width-backreference proofs. Semantic-shape comparison ignores only NodeId and SourceOrigin, explicit set overlap retains a Unicode-scalar witness, consuming nodes reset assertion regions, possessive exact-once and every unproved or target-dependent near miss remain silent.
    - name: Canonical generator implementation and source projection
      status: passed
      evidence:
          - check: Integrated generation
            result: passed
            details: Canonical generate_diagnostics owns one private quality proof submodule, retains distinct DiagnosticEvidence::Safety and ::Quality provenance, and orders both by stable code/node/evidence identities. The combined bound is 4,096 safety plus 4,096 quality records with fail-closed overflow. Primary and related locations project only canonical origins; character-set indices/witnesses stay typed evidence. The existing crate-private pipeline returns advisory safety and quality diagnostics without target or product routing.
    - name: Property, contract, and architecture certification
      status: passed
      evidence:
          - check: Positive, negative, adversarial, and mutation evidence
            result: passed
            details: Thirteen focused Rust tests cover all seven mappings, every false-positive guard, source-backed projection, source-less evidence, all five preserved safety identities, and 128 fixed-seed candidates through repeated normalization/generation. The new quality fixture validates under the unchanged Diagnostic schema; canonical contracts pass 11 schemas, 60 positive, 33 negative, and core mapping passes 96 fixtures. Forty-four focused Python contract/architecture tests pass, including controlled missing-substage, target, portability, raw-source, and process dependency mutations.
    - name: Complete repository and P12-T04 certification
      status: passed
      evidence:
          - check: Task-closing hardgates
            result: passed
            details: At clean migration-review commit 427902e331b401827dcb8489e79f2e2e38c69c73, every Rust all-target test and warning-denied Clippy pass, all 486 tooling tests pass, canonical contracts validate 11 schemas with 60 positive and 33 negative fixtures, core mapping validates 96 fixtures, and formatting, documentation integrity across 146 files, public/generated contracts, governance, and patch integrity pass. The reviewed three-run migration differential passes at baseline sha256:67d84aa74329f649c57c8f4004e749a567c7649ea71272a6b4e36aedda710f3b; the renewal changes only the canonical-boundary and baseline self-fingerprints. Two exact shared-corpus runs reproduce 20 cases, 100 applications, and observation sha256:9a575b86e8ea43590b24fcc2bda2d3a7b80ed25fa98694f46924b247abd3493c. The matrix reproduces sha256:11f70923cdc200b132d7f68077fd840f3d38cf9aff63949fae24d703b68ea205 with zero semantic-divergent or unresolved entries. Local passes 26/26; Pull Request records 44/46 and Full 76/83 passed with zero failures or waivers. Full passes both exact PCRE2 versions, Node 22.23.2, CPython 3.11.15, shared-corpus, and matrix operations. Only inherited Bundler, Swift, and dependency-risk scanner availability remains explicit carry-forward.
