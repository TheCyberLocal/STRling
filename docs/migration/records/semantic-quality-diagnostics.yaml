    - name: Property, contract, and architecture certification
      status: planned
      evidence:
          - check: Positive, negative, adversarial, and mutation evidence
            result: not_run
            details: Awaiting every-code fixtures, safety preservation, fixed-seed determinism, normalization and source-less properties, unchanged-schema fixture validation, and controlled architecture failures.
    - name: Complete repository and P12-T04 certification
      status: planned
      evidence:
          - check: Task-closing hardgates
            result: not_run
            details: Awaiting all Rust and tooling tests, contracts, shared corpus where relevant, formatting, public/generated checks, governance, documentation, migration differential, Local/Pull Request/Full profiles, clean final commit, and P12-T05 handoff.
