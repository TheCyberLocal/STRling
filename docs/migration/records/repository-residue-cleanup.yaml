            result: passed
            details: Retired four stale C/Swift/Rust registry families. Lua release rockspec materialization now has one tested canonical producer, while Lua and LSP disposable package outputs are enforced exactly by Full and Release operations.
          - check: Focused contract verification
            result: passed
            details: Lua/generated/version/removal-inventory tests pass; Ruff, version synchronization, public contracts, static suppression accounting, documentation integrity, and governance pass. Full generated-artifact renewal follows the immutable cleanup commit because source and profile identities legitimately changed.
    - name: Repository-wide integration and certification
      status: in_progress
      evidence:
          - check: Failed Full candidate preservation
            command: ./strling profile full --json --artifact target/codex-tools/p19-t04-full-e28a5ecb.json
            result: failed
            details: Clean immutable candidate e28a5ecb27772e12ba20499beb6e9f96dfa6838a records 118 passed, 2 failed, 1 governed waiver, 0 unavailable, and 0 incomplete operations. The 1,564,008-byte artifact has file SHA-256 02b826d5b362f915756d1f25d58132066faff5369ffbe74638cd6f8c170e6524 and evidence fingerprint 872a1f71d89bf311dd1893da2e9bb0fdd50fdd8b6cb077501baa1f7ba7b7104e; it remains immutable under target/codex-tools and is not rerun or promoted.
          - check: Governed performance failure classification
            result: failed
            details: latency:cli-startup/fixture:simply-tiny consumed 64 samples and failed its unchanged relative ceiling by 245,785 ns (median 30,876,000 ns; baseline 27,845,650 ns; relative ceiling 30,630,215 ns) while passing the 33,414,780 ns absolute ceiling. MAD was 7,605,550 ns and p95 was 52,484,100 ns; evidence fingerprint 131bca77cef8055dd3f2cb39a29a80fbe940abca96a66cce3c2c6efc0cb43996 is preserved without reinterpretation or replay.
          - check: Cross-failure root-cause evidence
            result: passed
            details: No P19-T04 commit changes CLI, kernel, interop, runner, performance policy, or LSP source; governed runner/kernel/interop binaries match the baseline exactly. A separate Fortress evaluation created host-work directories at 20:35, 20:50, and 21:16 local time and remained active across the 21:46 Full artifact boundary. The CLI samples show a contention regime shift from a 40,535,100 ns median for samples 1-38 to 24,709,900 ns for samples 39-64. The final test@lsp operation ran inside the same overlap window; its exact focused command subsequently passes all 570 tests in 225.90 seconds. The performance failure is classified as an environment-qualification blind spot, and the LSP failure as external-load interference rather than cleanup-induced product or dependency regression.
          - check: Corrective isolation contract
            command: python3 -m pytest tooling/tests/test_performance_resource_certification.py -q -p no:cacheprovider
            result: passed
            details: The performance producer now records fail-closed heavyweight-process isolation immediately before and after every coordinate and stops after the first measured failure. Thirty-eight focused contract tests pass in governed WSL, including positive detection, workload rejection, and unprovable-scan rejection. A live diagnostic check correctly identifies the still-active unrelated fortress and Cargo processes without invoking any governed benchmark sample.
          - check: Corrected-candidate focused verification
            result: passed
            details: After the unrelated evaluator ended naturally, the exact LSP command passes 570 tests in 224.89 seconds; focused canonical CLI and compiler-boundary suites pass 11/11 and 13/13; the performance contract passes 38/38. Registered generation/check mode, all 27 public-contract surfaces, architecture and governance, documentation integrity, dependency/license integrity, content/workflow security, and live dependency risk all pass with WVR-SEC-VSCE-LICENSE-001 unchanged. Ruff, formatting, and patch integrity pass, and no standalone governed performance sample is consumed.
          - check: Performance contract and artifact invariance
            result: passed
            details: The baseline, manifest, and native Windows conditioner are byte-identical to e28a5ecb. Baseline/environment/conditioning identities remain 49e2c9f5a26b1aee657e436ec813386d7e5e290310a18484fc71aef9c48f6c3e, b6e8cd40fdb7904fc54dc98665f3e9bdbef37675d0097a8224dc75c5d9424e09, and 1ad397b374ea1fc4153e527f89ae2e7a473a8e6a87616dc4c341e0f7acc8cb76. Existing runner/kernel/interop binaries exactly match governed SHA-256 values fcdb2dabf4be37edf89037e58de751a1778c0ba3f119cf223a82c361423a46b5, 752d22200cec9143a9a6b6574767cc80fc02f0d909fa105fb57249184406348c, and 800d0942fdc96d91493669ec2038fdcd97470454a1eaa925353aaa2894eb3cee. No threshold, ceiling, sample, statistic, stability, resource, conditioning, baseline, or identity requirement changes.
          - check: Evidence-backed production capacity contract
            command: python3 -m unittest tooling.tests.test_production_certification -v
            result: passed
            details: Repository and history searches prove 250 GiB existed only as a hard-coded P18-T06 recovery-era launcher check introduced by 3d363306; no current profile, performance/environment contract, manifest, or governance source assigned it permanent authority. The terminally green 38c62e1 Full workspace occupies 27,862,002,338 bytes (25.948512 GiB) across core, binding, target, LSP, and root JavaScript output families. Release's sequential execution may retain its outer tree while isolated reproducibility/package and clean-install staging are live, so the governed contract reserves three rounded 32 GiB workspace envelopes plus a separate 16 GiB emergency reserve. Its 112 GiB precondition passes the current 135.28 GiB host, fails closed one byte below the requirement, and rechecks the reserve at each outer production stage boundary without referencing unrelated project caches.
          - check: Clean-worktree governed-input rejection
            command: npm run test:all -- --profile release --all --no-reuse --plain
            result: failed
            details: Corrected candidate 91236ff8ec1b2626b73b9ea520d2bb442c24b4e5 passed exact-runtime reconstruction, all 18 setup surfaces, the pinned Rust build, and 30 registered generator families before legacy-removal-inventory-evidence failed because its exact P18 production-certification input is intentionally ignored and absent from a fresh Git worktree. The Release profile never started and zero benchmark samples were consumed. Failure artifact SHA-256 6468e111687e2cefa6f79648dafc32a445a160de2f9b864632608d46a4aba445 is preserved without promotion.
          - check: Hash-bound governed-input materialization
            command: python3 -m unittest tooling.tests.test_production_certification -v
            result: passed
            details: The production launcher now reads the tracked legacy-removal inventory, accepts only an artifacts/production-certification path beneath the authority root, authenticates the ignored P18 artifact against its tracked SHA-256, copies it into the detached worktree, reauthenticates the copied bytes, and records its identity in structured environment evidence. Missing inputs, path traversal, and hash drift fail closed; no current-source build, package, generated output, or performance evidence is reused.
