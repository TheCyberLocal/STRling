change_classification:
    semantic_change:
        level: none
        evidence:
            - No language, parser, semantic IR, analysis, planning, lowering, target, diagnostic, stdlib, or runtime behavior is changed.
    public_api_change:
        level: none
        evidence:
            - Supported and Preview binding APIs, CLI commands, editor surfaces, and package entrypoints remain unchanged.
        affected_surfaces: []
    schema_change:
        level: compatible
        evidence:
            - Generated-artifact governance gains an explicit profile-enforced lifecycle for deterministic disposable outputs already certified in Full and Release.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - No diagnostic identity or wording contract changes.
    target_behavior_change:
        level: none
        evidence:
            - No capability, rewrite, emission, serialization, or real-engine expectation changes.
    architecture_change:
        level: compatible
        evidence:
            - Expired migration residue is removed and two current package-output families receive exact canonical ownership without performing the final P19-T05 ratchet.
            - The corrective certification harness now rejects a known unrelated Windows evaluator/build workload immediately before and after every governed performance coordinate; performance budgets, samples, statistics, conditioning, baselines, environment identity, and product behavior are unchanged.
            - The production launcher replaces the incident-specific P18-T06 250 GiB recovery floor with a fail-closed 112 GiB capacity contract derived from the 25.948512 GiB terminally green Full workspace, three rounded 32 GiB simultaneous workspace envelopes, and a separate 16 GiB emergency reserve checked at every outer production stage boundary.
    generated_output_change:
        level: compatible
        evidence:
            - The root package lock is regenerated by npm after removing root-only legacy TypeScript/Jest dependencies, and registered legacy-removal evidence is renewed from the amended authoritative inventory.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Fresh inventory and hygiene
      command: python tooling/hygiene.py && python -m tooling.legacy_removal_inventory --check --json && git diff --check
      expected_result: No unexplained large, binary, temporary, encoding, casing, mode, fixture, or repository-state residue remains.
    - name: Generated ownership and dependency integrity
      command: python tooling/generated_artifacts.py --check && python tooling/sync_versions.py --check && npm ci --ignore-scripts --no-audit --no-fund
      expected_result: Every governed generated family has a live exact owner, root dependency installation follows the reduced lock, and checks leave the tree clean.
    - name: Focused cleanup verification
      command: python -m pytest tooling/tests/test_generated_artifacts.py tooling/tests/test_lua_rockspec.py tooling/tests/test_sync_versions.py -q && python -m unittest tooling.tests.test_static_analysis tooling.tests.test_legacy_removal_inventory -v
      expected_result: Disposable-output enforcement, Lua materialization, suppression accounting, and removal-inventory completeness fail closed and pass their checked-in contracts.
    - name: Repository integration contracts
      command: python tooling/public_contracts.py --check && python tooling/governance.py --json && python tooling/documentation_integrity.py --json && python tooling/security.py integrity --json && python tooling/security.py content --json && python tooling/security.py risk --json
      expected_result: Public contracts, architecture, governance, documentation, dependency/license/security, and the unchanged governed waiver remain valid.
    - name: Canonical closure profiles
      command: ./strling profile local --json && ./strling profile pull-request --json && ./strling profile full --json && ./strling profile release --json
      expected_result: Every mandatory operation passes or retains only the existing governed waiver, with zero failed, unavailable, or incomplete results.
checkpoints:
    - name: Fresh inventory and scope lock
      status: passed
      evidence:
          - check: Certified starting boundary
            result: passed
            details: Clean architecture/v4 at ea7442a4f4970d5dae92b48e18305e1604d25538 with P19-T03 evidence present; 2,367 tracked files total 23,439,566 bytes and initial free disk is 271.22 GiB.
          - check: Repository hygiene census
            command: python tooling/hygiene.py
            result: passed
            details: All 2,367 tracked files pass large-file, binary, temporary-file, UTF-8, LF/BOM, final-newline, executable-mode, and case-collision policy with zero findings.
    - name: Deletion contract and dependency proof
      status: passed
      evidence:
          - check: P19-T01 cleanup reconciliation
            result: passed
            details: The live population is exactly 126 obsolete C implementation-derived fixture copies and 126 unused Swift projections. The C generated test skeleton and Rust conformance build source/output are already absent; only their stale registry declarations remain.
          - check: Non-reachability proof
            result: passed
            details: CMake, SwiftPM, package scripts, profile operations, release workflows, and repository imports have no consumer for the 252 fixtures. The C generator targets the retired implementation oracle; the Swift projector and its test become unreachable with those families.
          - check: Frozen retained boundary
            result: passed
            details: All 596 data-only historical JSON fixtures, three legacy-reference history files, historical audit narratives, current lockfiles, allowlisted binaries, governed generated artifacts, performance baselines, and WVR-SEC-VSCE-LICENSE-001 are retained. The Perl parser-case exception remains P19-T05 work.
          - check: Additional dead-tool proof
            result: passed
            details: audit_hint_parity.py and audit_hints.py import deleted binding-local authority; audit_precision.py scrapes retired implementation test output. No package, profile, workflow, or product path invokes them.
    - name: Cleanup implementation and focused verification
      status: passed
      evidence:
          - check: Obsolete residue removal
            result: passed
            details: "Deleted 258 tracked files: 126 unused C implementation-derived fixture copies, 126 unused Swift projections, and 6 dead migration/oracle tools and tests. No product source, public surface, or retained historical fixture was deleted."
          - check: Dependency and manifest cleanup
            command: npm ci --ignore-scripts --no-audit --no-fund && npm ls --depth=0
            result: passed
            details: Removed the four root-only legacy TypeScript/Jest development dependencies and their transitive lock residue; the root install now contains only prettier@3.3.3.
