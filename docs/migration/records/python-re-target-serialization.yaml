required_verification:
    - name: Python serializer and artifact unit/property certification
      command: cargo test --manifest-path core/Cargo.toml --test python_re_serialization --test python_re_serialization_properties --locked
      expected_result: Every operation, precedence rule, str/bytes literal and class escape, capture/reference, anchor, lookaround, wildcard, canonical flag, option/requirement projection, source-map span, failure category, deterministic JSON/fingerprint, immutable input, and generated mutation passes.
    - name: TargetArtifact compatibility and architecture fitness
      command: python3 -m unittest tooling.tests.test_python_re_serialization_architecture tooling.tests.test_core_contracts && python3 tooling/core_contract_validation.py
      expected_result: Python artifacts use the existing contract canonically, and controlled mutations reject policy recomputation, peer reuse, runtime/ambient/product dependencies, target-neutral reverse dependencies, and direct bypass.
    - name: Exact CPython runtime certification
      command: STRLING_CPYTHON_311_BINARY=/exact/cpython-3.11.15/bin/python3.11 python3 -m tooling.python_re_runtime_certification --json --repeat-runs 2
      expected_result: The official-source CPython 3.11.15 Linux x86-64 build executes all bounded str/bytes, span, capture, assertion, anchor/newline, case, Unicode, atomic, possessive, error, zero-length, rewrite, negative-version, and determinism cases twice with one stable certification-result-v1 digest.
    - name: Complete kernel and repository certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py && python3 tooling/migration_differential.py --repeat-runs 3 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check
      expected_result: Every available hardgate passes, exact runtime evidence is recorded by Full, reviewed boundary evidence is current, host-only gaps remain unavailable without waiver, and the final committed tree is clean.
checkpoints:
    - name: Python artifact, syntax, runtime, and profile inventory
      status: passed
      evidence:
          - check: Read-first contract and stage inventory
            result: passed
            details: PythonReLoweringPlan supplies a validated closed operation tree, exact str/bytes pattern kind, deterministic captures, global case intent, required options, completed requirements and rewrites, and provenance. TargetArtifact already supplies pattern source and flags, immutable profile reference, engine options, requirements, UTF-8 source mapping, and diagnostics; no schema change is required. Because profile option values are immutable, exact bytes artifact provenance requires a separate companion profile rather than mutation of the governed str profile.
          - check: Immutable bytes applicability profile correction
            result: passed
            details: The existing profile:python-re/3.11 is permanently python.pattern_kind=str. P11-T04 requires executable bytes artifacts, so governed scope adds profile:python-re/3.11-bytes with the same CPython 3.11 runtime, bytes option, explicit unavailability of Unicode scalar/class/property capabilities, and its own exact fingerprint. An ungoverned synthetic profile or relaxed serializer identity check is prohibited.
          - check: Normative Python syntax and execution authority
            result: passed
            details: Official Python 3.11 re documentation governs pattern syntax, scoped modes, str/bytes distinctions, captures and references, anchors, Unicode and ASCII classes, fixed lookbehind, atomic groups, possessive quantifiers, compilation, matching, spans, and errors. Peer targets and the historical binding remain non-normative migration evidence.
          - check: Exact maintained runtime selection
            result: passed
            details: Official CPython 3.11.15, released 2026-03-03 as the current security-fix source release, is selected. Its XZ source archive SHA-256 is 272179ddd9a2e41a0fc8e42e33dfbdca0b3711aa5abf372d3f2d51543d09b625. Certification will record the derived Linux x86-64 executable and build fingerprints and will reject host Python 3.12/Windows 3.13 substitution.
    - name: Deterministic Python serializer
      status: passed
      evidence:
          - check: Implementation and focused proof
            result: passed
            details: The pure serializer validates and immutably consumes only PythonReLoweringPlan, emits canonical Python source and optional i flag, projects exact str/bytes profile identity, options, requirements, rewrite evidence, diagnostics, and UTF-8 source maps, and validates the completed TargetArtifact. Five focused unit, four generated property, two resource-bound, eleven target-contract, and four canonical-profile tests pass.
          - check: Exact str and bytes profile authority
            result: passed
            details: profile:python-re/3.11 version 1.2.0 retains immutable python.pattern_kind=str with SHA-256 55e7f0bc93e2192d5f09f6c4ef65b6bff0dc831571059d80edf9b8b661f80a6c. The new profile:python-re/3.11-bytes version 1.0.0 fixes python.pattern_kind=bytes, explicitly rejects Unicode-only capabilities, and validates at SHA-256 2ba10d0f9ba00c0f5685fc20a40ae436937952074558d8bba89ffe6bb244dfca. Exact profile identity is fail-closed.
          - check: Canonical Python syntax and failures
            result: passed
            details: Alternation and repetition grouping, named and numbered captures/references, fixed lookbehind, atomic and possessive forms, scoped dot-all/multiline/ASCII/Unicode semantics, Python-native LF line anchors, strict input anchors, verbose-sensitive escaping, mixed and outer-negated sets, bytes ASCII limits, the CPython repetition maximum, all-or-nothing output, and stable STRL-PYTHON_RE_EMIT-0001 through -0008 diagnostics are covered.
    - name: Controlled CPython harness, corpus, and quality-profile integration
      status: passed
      evidence:
          - check: Runtime protocol and exact execution evidence
            result: passed
            details: The fixed isolated harness and host orchestrator verify the official CPython 3.11.15 archive SHA-256 272179ddd9a2e41a0fc8e42e33dfbdca0b3711aa5abf372d3f2d51543d09b625, derived executable SHA-256 1fbfa9ca2d8b4a1180be898c8de67732deee8aff7bb838012acb63764be83232, cpython-311 cache tag and SOABI, linux-x86_64 platform, exact profiles, corpus, harness, bounded process environment, and two-run semantic determinism. Host CPython 3.12.3 is recorded with accepted_as_target=false.
          - check: Exact CPython 3.11.15 semantic proof
            result: passed
            details: Each run executes 16 detailed cases, three compile-error cases, two rewrite variants, and 128 generated cases for 149 requests total, split into 81 str and 68 bytes requests. Both runs pass with zero mismatches, corpus SHA-256 b778d5e9df54346666d2e7ca99eb56c97d477af1c7d15f29491a3df172512d0a, formatted harness SHA-256 f335bd48b27e8b149b198371896f1aff8019370ead8b28151fd8ed4491f5e8b8, semantic SHA-256 3dc0ad3f8e93fb61c4fcccd12b1aa555390ac8d133604f36946e613a53dfc911, and deterministic operation SHA-256 4d076e05837e10cc3a4bc0af9badd8d68161c5fbde9d3f634750886d3a2ab789.
          - check: Full and Release quality integration
            result: passed
            details: certification.python-re-runtime is registered immediately after ECMAScript certification in Full and Release definition 1.7.0, returns certification-result-v1 evidence, is absent from Local and Pull Request, and preserves structured unavailable, incomplete, and failed states without substitution.
    - name: Complete repository and migration certification
      status: passed
      evidence:
          - check: Full hardgate evidence
            result: passed
            details: Rust 1.75.0 all-target tests and warning-denied Clippy pass; exact Ruff 0.15.21 and Prettier 3.3.3 pass; 82 focused Python quality/runtime/architecture tests, 11 core schema mappings with 79 fixtures, public contracts, generated artifacts, governance, documentation integrity, the three-repeat migration differential, and patch integrity pass. The canonical boundary renewal under exact Node 22 is sha256:39d61ddc8b747a274e051e73c8e0aebc09004a6df23b188460fe70c6086b3493 with reviewed baseline sha256:8127c22a016013ff9751540ce39615fa780291da675082f2668bae5d63e4da5c.
          - check: Clean Local, Pull Request, and Full profiles
            result: passed
            details: At clean commit 3232e816bde01712912262bf4b1dffd1b178b00d, Local passes all 26 operations. Pull Request records 44 passed, zero failed, and only repository-managed Ruby Bundler mismatch and missing Swift as unavailable. Full 1.7.0 records 74 passed, zero failed or incomplete, and seven inherited host/scanner unavailabilities; exact PCRE2 10.42/10.43, ECMAScript Node 22, and Python CPython 3.11.15 runtime certifications pass. Full evidence fingerprint is d4547ba5c81b24f9014ff6679203cc6e92e50821404bdec6c5b8e2a58a5160eb.
          - check: Explicit environment carry-forward
            result: passed
            details: Pull Request carries only Ruby Bundler version mismatch and missing Swift. Full carries Ruby lint/build/test, Swift typecheck/build/test, and the existing structured dependency-risk scanner unavailability. No unavailable operation is represented as passing and no waiver or requirement weakening was introduced.
