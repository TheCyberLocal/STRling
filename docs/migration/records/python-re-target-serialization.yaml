title: Deterministic Python re serialization and exact CPython execution certification
status: complete
objective: Serialize one validated PythonReLoweringPlan into deterministic Python re source, canonical flags, profile-owned pattern-kind options, resolved requirements, generated provenance, and a canonical TargetArtifact, then certify bounded str and bytes artifact execution against exact pinned CPython 3.11 evidence without adding product runtime, binding, package, or publication behavior.
