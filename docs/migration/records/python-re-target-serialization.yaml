required_verification:
    - name: Python serializer and artifact unit/property certification
      command: cargo test --manifest-path core/Cargo.toml --test python_re_serialization --test python_re_serialization_properties --locked
      expected_result: Every operation, precedence rule, str/bytes literal and class escape, capture/reference, anchor, lookaround, wildcard, canonical flag, option/requirement projection, source-map span, failure category, deterministic JSON/fingerprint, immutable input, and generated mutation passes.
    - name: TargetArtifact compatibility and architecture fitness
      command: python3 -m unittest tooling.tests.test_python_re_serialization_architecture tooling.tests.test_core_contracts && python3 tooling/core_contract_validation.py
      expected_result: Python artifacts use the existing contract canonically, and controlled mutations reject policy recomputation, peer reuse, runtime/ambient/product dependencies, target-neutral reverse dependencies, and direct bypass.
    - name: Exact CPython runtime certification
      command: STRLING_CPYTHON_311_BINARY=/exact/cpython-3.11.15/bin/python3.11 python3 -m tooling.python_re_runtime_certification --json --repeat-runs 2
      expected_result: The official-source CPython 3.11.15 Linux x86-64 build executes all bounded str/bytes, span, capture, assertion, anchor/newline, case, Unicode, atomic, possessive, error, zero-length, rewrite, negative-version, and determinism cases twice with one stable certification-result-v1 digest.
    - name: Complete kernel and repository certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py && python3 tooling/migration_differential.py --repeat-runs 3 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check
      expected_result: Every available hardgate passes, exact runtime evidence is recorded by Full, reviewed boundary evidence is current, host-only gaps remain unavailable without waiver, and the final committed tree is clean.
checkpoints:
    - name: Python artifact, syntax, runtime, and profile inventory
      status: passed
      evidence:
          - check: Read-first contract and stage inventory
            result: passed
            details: PythonReLoweringPlan supplies a validated closed operation tree, exact str/bytes pattern kind, deterministic captures, global case intent, required options, completed requirements and rewrites, and provenance. TargetArtifact already supplies pattern source and flags, immutable profile reference, engine options, requirements, UTF-8 source mapping, and diagnostics; no schema change is required. Because profile option values are immutable, exact bytes artifact provenance requires a separate companion profile rather than mutation of the governed str profile.
          - check: Immutable bytes applicability profile correction
            result: passed
            details: The existing profile:python-re/3.11 is permanently python.pattern_kind=str. P11-T04 requires executable bytes artifacts, so governed scope adds profile:python-re/3.11-bytes with the same CPython 3.11 runtime, bytes option, explicit unavailability of Unicode scalar/class/property capabilities, and its own exact fingerprint. An ungoverned synthetic profile or relaxed serializer identity check is prohibited.
          - check: Normative Python syntax and execution authority
            result: passed
            details: Official Python 3.11 re documentation governs pattern syntax, scoped modes, str/bytes distinctions, captures and references, anchors, Unicode and ASCII classes, fixed lookbehind, atomic groups, possessive quantifiers, compilation, matching, spans, and errors. Peer targets and the historical binding remain non-normative migration evidence.
          - check: Exact maintained runtime selection
            result: passed
            details: Official CPython 3.11.15, released 2026-03-03 as the current security-fix source release, is selected. Its XZ source archive SHA-256 is 272179ddd9a2e41a0fc8e42e33dfbdca0b3711aa5abf372d3f2d51543d09b625. Certification will record the derived Linux x86-64 executable and build fingerprints and will reject host Python 3.12/Windows 3.13 substitution.
