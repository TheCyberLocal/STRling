        - tooling/governance.py
        - tooling/public_contracts.py
        - tooling/tests/test_adapter_certification.py
        - tooling/tests/test_governance.py
        - tooling/tests/test_public_contracts.py
    forbidden_paths:
        - bindings/interop/src/**
        - bindings/csharp/**
