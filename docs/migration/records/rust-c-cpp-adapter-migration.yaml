change_classification:
    semantic_change:
        level: compatible
        evidence:
            - Host facades consume existing canonical compiler, frontend, target, diagnostic, Simply, and standard-library contracts and are forbidden from creating or modifying semantics.
            - The exact Rust 1.70 MSRV proof replaces post-1.70 `std::io::Error::other` constructors in the kernel and its repository-only projection examples with behaviorally equivalent stable `Error::new(ErrorKind::Other, ...)` forms; error kinds and messages remain identical.
            - Canonical standard-library registry and audit edits correct only Rust, C, and C++ implementation/test path references after semantic-copy deletion; helper definitions, guarantee levels, cases, semantic forms, and runtime observations remain byte-for-byte equivalent through regenerated projections.
        affected_surfaces: []
    public_api_change:
        level: breaking
        evidence:
            - CP3 replaces the Rust binding-owned parser/compiler/emitter module tree with a curated typed canonical facade. Deep implementation paths are intentionally removed; canonical request/result, target, diagnostic, Simply, and standard-library types become the supported surface.
            - C retains its canonical adapter surface and adds only the versioned array-based merge function needed for safe C++ move-only sequence delegation. C++ intentionally replaces the historical compiler-stage headers and string-emitting helpers with the installed response/client, move-only Simply pattern, and registry-backed Essential facade; all additions and removals are captured by enforced declaration snapshots.
            - The generated TypeScript standard-library metadata constant changes only because the registry fingerprint includes the corrected Rust, C, and C++ implementation/test references; helper semantics and TypeScript behavior do not change.
            - The Program Owner explicitly authorized this fingerprint-only TypeScript generated output and public-contract snapshot regeneration on 2026-08-19; TypeScript semantics, behavior, API shape, and implementation remain outside scope.
        affected_surfaces:
            - c-public-api
            - cpp-public-api
            - typescript-public-api
    schema_change:
        level: additive
        evidence:
            - CP2 adds only a migration-evidence schema for the closed adapter case denominator and legacy baseline; canonical compiler, frontend, target, standard-library, and interop schemas remain unchanged.
            - CP3 extends the architecture-rule schema only with the native-adapter boundary configuration needed to enforce C/C++ delegation and semantic-copy retirement; no language, compiler, frontend, target, or interop payload changes.
            - CP3 adds the C++ installed-header declaration extractor mechanism to the public-surface registry schema so namespace, overload, access, and move/copy contracts can be enforced; product schemas remain unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: intentional-correction
        evidence:
            - Deleting the Rust binding-owned hint engine removes its historical local diagnostic behavior. The facade forwards canonical diagnostics and stable interop error identities unchanged; host exception or result projection does not redefine their meaning.
        affected_surfaces: []
    target_behavior_change:
        level: intentional-correction
        evidence:
            - The Rust facade removes its binding-local PCRE2 emitter, while C and C++ remove their local emission paths; every target-aware facade routes through the exact caller-supplied canonical TargetProfile. No new API infers a host or repository default.
        affected_surfaces: []
    architecture_change:
        level: intentional-correction
        evidence:
            - Rust now depends on the curated public strling-kernel facade and removes its binding-owned core and emitter stages; C and C++ delegate through the stable native chain and remove their corresponding semantic copies.
            - Rust 1.70 correctly rejects a public item that exposes a crate-private stage type; the capability pipeline enum, output, and entrypoint are made explicitly crate-private, matching the existing private module and documented kernel architecture.
            - The C package now delegates all execution and owned-buffer release through strling.c-abi v1, removes its binding-owned parser/IR/hint/emitter sources and third-party regex/JSON dependencies, and is protected by an enforced native-adapter architecture rule.
            - The C++ package is now a C++17 RAII facade over STRling::c, removes all binding-owned parser/AST/IR/compiler/emitter/hint sources and download-time dependencies, and is protected by an enforced C/native-only architecture rule plus an exact installed-header declaration snapshot.
            - Pull-request profile 1.10.0 and full/release profiles 1.16.0 include the enforceable strict Rust, C, and C++ lint/test operations, preserve profile-superset ordering, and make every migrated adapter gate part of canonical certification.
        affected_surfaces: []
    generated_output_change:
        level: intentional-correction
        evidence:
            - CP2 adds one governed deterministic compatibility baseline reproduced from the immutable P17-T02 starting commit and exact public/semantic-copy path sets. No package output or product source is generated.
            - CP3 regenerates the governed Rust Cargo lock after replacing the historical dependency graph with the local canonical kernel facade; package versions remain unchanged and no publication occurs.
            - CP3 updates the Rust, C, and C++ implementation/test references in the canonical standard-library registry and audit, then regenerates only registered compatibility, binding-support, documentation, and fingerprint projections. Helper contracts and observations do not change.
            - CP3 removes the retired Conan recipe from version-synchronized outputs and the retired GTest manifest from dependency inventory. Exact runtime observations remain valid because the semantic contract digest and all 585 application results are unchanged.
        affected_surfaces: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Rust/C/C++ adapter contract and deletion denominator
      command: python tooling/adapter_certification.py --check
      expected_result: Exact API, compatibility, refusal, canonical parity, ownership, RAII, package, architecture, and semantic-copy deletion cases validate with shrinkage resistance.
    - name: Focused package and cross-language conformance
      command: ./strling test rust && ./strling test c && ./strling test cpp && python tooling/adapter_certification.py --certify
      expected_result: Rust, C, and C++ expose identical canonical results and artifacts through their declared surfaces with no binding-owned parser/compiler/emitter execution.
    - name: Public, generated, architecture, security, and repository profiles
      command: python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && python tooling/governance.py && python tooling/security.py integrity --json && python tooling/migration_differential.py --repeat-runs 3 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: API snapshots, generated authority, dependency direction, migration behavior, package graphs, executable profile operations, and exact environmental limitations are recorded with a clean tree and no task-owned failure.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and public-surface starting boundary
            result: passed
            details: Starting anchor b0eecd19b7f4680f6c90f3fecde92df5c11eddf7 was clean on architecture/v4. The migration denominator is 93 Rust/C/C++ source or header files and approximately 22,000 lines; Rust has 23 source files, C has 41, and C++ has 29. Existing public governance is enforced for c-public-api and transitional for cpp-public-api and rust-public-api.
          - check: Dependency and API ownership lock
            result: passed
            details: The Rust package is a curated typed facade over strling-kernel; C uses only strling.c-abi v1 and the generated strling_interop.h; C++ is an RAII layer over the stable C/native contract. Compatibility translation must fail closed and may not execute a binding-local parser, compiler, emitter, or regex fallback.
          - check: Target, ownership, packaging, and exclusion lock
            result: passed
            details: Canonical calls require an exact supplied target profile; only deprecated targetless compatibility calls may use an explicit generated pcre2-10.43 projection; ownership, error, and concurrency rules follow the stable interop contract; builds and installs are local only; no publication, support-tier decision, interop v2, package version bump, or other binding migration is authorized.
          - check: CP1 governance and reproducibility validation
            command: node_modules/.bin/prettier --check <CP1 files> && python tooling/governance.py && python tooling/documentation_integrity.py && python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && git diff --check
            result: passed
            details: Governance contracts, scope, declarations, and enforced architecture rules pass; documentation integrity covers 190 files and 7 executable examples; every enforced public surface is unchanged; every enforced generated family is synchronized; formatting and patch whitespace pass. The public/generated check used a host temporary directory because the Windows workspace sandbox denied extractor temporary-file creation; the host run passed without changing repository outputs.
