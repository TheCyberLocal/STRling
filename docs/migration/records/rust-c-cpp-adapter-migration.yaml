record_version: 2.0.0
title: Canonical Rust facade and C/C++ adapter migration
status: in_progress
objective: Rebuild the Rust package as a curated facade over the public canonical kernel and replace C/C++ semantic copies with thin native adapters while preserving or explicitly retiring compatibility surfaces.
scope:
    diff:
        base: b0eecd19b7f4680f6c90f3fecde92df5c11eddf7
        head: working-tree
    allowed_paths:
        - .github/workflows/ci.yml
        - bindings/c/**
