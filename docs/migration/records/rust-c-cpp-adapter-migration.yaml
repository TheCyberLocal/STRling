change_classification:
    semantic_change:
        level: compatible
        evidence:
            - Host facades consume existing canonical compiler, frontend, target, diagnostic, Simply, and standard-library contracts and are forbidden from creating or modifying semantics.
            - The exact Rust 1.70 MSRV proof replaces post-1.70 `std::io::Error::other` constructors in the kernel and its repository-only projection examples with behaviorally equivalent stable `Error::new(ErrorKind::Other, ...)` forms; error kinds and messages remain identical.
            - Canonical standard-library registry and audit edits correct only Rust implementation/test path references after semantic-copy deletion; helper definitions, guarantee levels, cases, semantic forms, and runtime observations remain byte-for-byte equivalent through regenerated projections.
        affected_surfaces: []
    public_api_change:
        level: breaking
        evidence:
            - CP3 replaces the Rust binding-owned parser/compiler/emitter module tree with a curated typed canonical facade. Deep implementation paths are intentionally removed; canonical request/result, target, diagnostic, Simply, and standard-library types become the supported surface. C and C++ declarations remain unchanged until their contained CP3 steps.
            - The generated TypeScript standard-library metadata constant changes only because the registry fingerprint includes the corrected Rust implementation and test references; helper semantics and TypeScript behavior do not change.
            - The Program Owner explicitly authorized this fingerprint-only TypeScript generated output and public-contract snapshot regeneration on 2026-08-19; TypeScript semantics, behavior, API shape, and implementation remain outside scope.
        affected_surfaces:
            - c-public-api
            - typescript-public-api
    schema_change:
        level: additive
        evidence:
            - CP2 adds only a migration-evidence schema for the closed adapter case denominator and legacy baseline; canonical compiler, frontend, target, standard-library, and interop schemas remain unchanged.
            - CP3 extends the architecture-rule schema only with the native-adapter boundary configuration needed to enforce C/C++ delegation and semantic-copy retirement; no language, compiler, frontend, target, or interop payload changes.
        affected_surfaces: []
    diagnostic_change:
        level: intentional-correction
        evidence:
            - Deleting the Rust binding-owned hint engine removes its historical local diagnostic behavior. The facade forwards canonical diagnostics and stable interop error identities unchanged; host exception or result projection does not redefine their meaning.
        affected_surfaces: []
    target_behavior_change:
        level: intentional-correction
        evidence:
            - The Rust facade removes its binding-local PCRE2 emitter and routes target-aware compilation through the exact caller-supplied canonical TargetProfile. No new API infers a host or repository default.
        affected_surfaces: []
    architecture_change:
        level: intentional-correction
        evidence:
            - Rust now depends on the curated public strling-kernel facade and removes its binding-owned core and emitter stages. C and C++ dependency corrections remain bounded later CP3 work.
            - Rust 1.70 correctly rejects a public item that exposes a crate-private stage type; the capability pipeline enum, output, and entrypoint are made explicitly crate-private, matching the existing private module and documented kernel architecture.
            - The C package now delegates all execution and owned-buffer release through strling.c-abi v1, removes its binding-owned parser/IR/hint/emitter sources and third-party regex/JSON dependencies, and is protected by an enforced native-adapter architecture rule.
            - Pull-request profile 1.9.0 and full/release profiles 1.15.0 add the newly enforceable strict C lint/build alias and C adapter tests, preserving profile-superset ordering and making the adapter gate part of canonical certification.
        affected_surfaces: []
    generated_output_change:
        level: intentional-correction
        evidence:
            - CP2 adds one governed deterministic compatibility baseline reproduced from the immutable P17-T02 starting commit and exact public/semantic-copy path sets. No package output or product source is generated.
            - CP3 regenerates the governed Rust Cargo lock after replacing the historical dependency graph with the local canonical kernel facade; package versions remain unchanged and no publication occurs.
            - CP3 updates only the Rust implementation and test references in the canonical standard-library registry and audit, then regenerates their compatibility and binding-support projections. Helper contracts and observations do not change.
        affected_surfaces: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Rust/C/C++ adapter contract and deletion denominator
      command: python tooling/adapter_certification.py --check
      expected_result: Exact API, compatibility, refusal, canonical parity, ownership, RAII, package, architecture, and semantic-copy deletion cases validate with shrinkage resistance.
    - name: Focused package and cross-language conformance
      command: ./strling test rust && ./strling test c && ./strling test cpp && python tooling/adapter_certification.py --certify
      expected_result: Rust, C, and C++ expose identical canonical results and artifacts through their declared surfaces with no binding-owned parser/compiler/emitter execution.
    - name: Public, generated, architecture, security, and repository profiles
      command: python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && python tooling/governance.py && python tooling/security.py integrity --json && python tooling/migration_differential.py --repeat-runs 3 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: API snapshots, generated authority, dependency direction, migration behavior, package graphs, executable profile operations, and exact environmental limitations are recorded with a clean tree and no task-owned failure.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and public-surface starting boundary
            result: passed
            details: Starting anchor b0eecd19b7f4680f6c90f3fecde92df5c11eddf7 was clean on architecture/v4. The migration denominator is 93 Rust/C/C++ source or header files and approximately 22,000 lines; Rust has 23 source files, C has 41, and C++ has 29. Existing public governance is enforced for c-public-api and transitional for cpp-public-api and rust-public-api.
          - check: Dependency and API ownership lock
            result: passed
            details: The Rust package is a curated typed facade over strling-kernel; C uses only strling.c-abi v1 and the generated strling_interop.h; C++ is an RAII layer over the stable C/native contract. Compatibility translation must fail closed and may not execute a binding-local parser, compiler, emitter, or regex fallback.
          - check: Target, ownership, packaging, and exclusion lock
            result: passed
            details: Canonical calls require an exact supplied target profile; only deprecated targetless compatibility calls may use an explicit generated pcre2-10.43 projection; ownership, error, and concurrency rules follow the stable interop contract; builds and installs are local only; no publication, support-tier decision, interop v2, package version bump, or other binding migration is authorized.
          - check: CP1 governance and reproducibility validation
            command: node_modules/.bin/prettier --check <CP1 files> && python tooling/governance.py && python tooling/documentation_integrity.py && python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && git diff --check
            result: passed
            details: Governance contracts, scope, declarations, and enforced architecture rules pass; documentation integrity covers 190 files and 7 executable examples; every enforced public surface is unchanged; every enforced generated family is synchronized; formatting and patch whitespace pass. The public/generated check used a host temporary directory because the Windows workspace sandbox denied extractor temporary-file creation; the host run passed without changing repository outputs.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed authority and adapter case denominator
            command: python tooling/adapter_certification.py --check --json
            result: passed
            details: Seventeen canonical compiler, Simply, interop, standard-library, and pcre2-10.43 inputs have fingerprint sha256:048d75cd03c2cb7ba7a354712714963c1c5ed7f5b763d1f5704c3cee5bb35f4b. The manifest fingerprint is sha256:0b906d0ad9ffd761364c93562b31d86f5fafe23b04493686bc4cb7fed38ff33e. All 58 cases validate across ten exact families, Rust/C/C++, three operations, eleven runner dispositions, and four native platform targets.
          - check: Immutable legacy public and semantic-copy baseline
            command: python tooling/adapter_certification.py --write-baseline && python tooling/generated_artifacts.py --check --artifact adapter-migration-baseline
            result: passed
            details: The enforced generated compatibility baseline reproduces 28 public package/header inputs and 35 binding-owned semantic-copy files byte-for-byte from immutable task base b0eecd19. Its fingerprint is sha256:bde6ddf77502663e13dd1957f9daefba82cda07c033ad029193467d380d17d4c. The generator and checker do not treat current implementation agreement as authority.
          - check: Shrinkage and mutation resistance
            command: python -m unittest tooling.tests.test_adapter_certification -v
            result: passed
            details: Eleven tests pass. They reject authority or evidence fingerprint drift, contract-file reorder, case removal after count edits, duplicate identity, family or runner substitution, per-family binding shrinkage, public-path changes, and legacy blob mutation even after recomputing editable fingerprints.
          - check: CP2 focused quality and integration
            command: python -m unittest tooling.tests.test_adapter_certification tooling.tests.test_generated_artifacts tooling.tests.test_governance tooling.tests.test_public_contracts -v && python -m ruff check tooling/adapter_certification.py tooling/tests/test_adapter_certification.py && python -m ruff format --check tooling/adapter_certification.py tooling/tests/test_adapter_certification.py && prettier --check tests/adapters/1.0/evidence.schema.json tests/adapters/1.0/manifest.json tests/adapters/1.0/legacy-baseline.json governance/generated-artifacts.json docs/migration/records/rust-c-cpp-adapter-migration.yaml && python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && python tooling/governance.py && git diff --check
            result: passed
            details: All 76 adapter, generated-artifact, governance, and public-contract tests pass; temporary-directory suites ran in the host environment because the Windows workspace sandbox denies its external temp root. The checker passes Python quality; authored evidence, generated baseline, registry, and task record pass exact formatting; every enforced public surface remains unchanged; all enforced generated outputs synchronize; and task scope, declarations, generated ownership, and enforced architecture rules pass. The 58 cases remain CP3/CP4 obligations rather than claimed adapter execution evidence.
    - name: Minimal implementation and local proof
      status: in_progress
      evidence:
          - check: Canonical Rust facade and semantic-copy retirement
            command: cargo +1.70.0 check/test/clippy/doc/package --manifest-path bindings/rust/Cargo.toml --all-targets --locked --offline
            result: passed
            details: The package now exposes one curated facade over strling-kernel, deletes its binding-owned parser, compiler, IR, validator, hint engine, Simply implementation, PCRE2 emitter, CLI, build-time fixture generator, and legacy tests, and replaces them with six canonical facade tests. Exact Rust 1.70 formatting, all-target check, six-test execution, warnings-denied Clippy, documentation, and package-file listing pass; canonical failed compilations remain typed CompileResult values and exact caller profiles remain mandatory for target-aware requests.
          - check: Rust 1.70 kernel compatibility and full local proof
            command: cargo +1.70.0 check/test --manifest-path core/Cargo.toml --all-targets --locked --offline
            result: passed
            details: The complete kernel all-target check and test corpus pass under the declared Rust 1.70 MSRV after behavior-preserving ErrorKind::Other constructor compatibility and explicit crate-private capability-pipeline visibility corrections. A supplemental core-wide warnings-denied Clippy probe is not a P17-T02 gate and reports pre-existing redundant-clone lints across unrelated core tests; the governed Rust facade Clippy operation passes.
          - check: Rust runtime and release graph confinement
            command: cargo +1.70.0 tree --manifest-path bindings/rust/Cargo.toml --all-features --locked --offline && python tooling/security.py integrity --json
            result: passed
            details: Default and all-feature graphs are identical and contain only the facade, local canonical kernel, serde/serde_json, sha2, and their transitive support packages; no historical binding compiler, regex parser/emitter, CLI, benchmark, fuzz, or libfuzzer package enters the runtime/release graph. All 27 offline repository dependency-integrity and waiver checks pass.
          - check: Authorized generated reference and TypeScript fingerprint projection
            command: python tooling/stdlib_registry.py --check && python -m tooling.stdlib_surfaces --check && ./strling contracts --check
            result: passed
            details: Rust standard-library ownership now references bindings/rust/src/lib.rs and bindings/rust/tests/facade.rs. Registry validation remains 5 helpers, 8 variants, 17 bindings, 40 cases, 8 semantic forms, 17 stress cases, 585 runtime applications, and zero semantic validators at sha256:447edf150d311e27b730976f8a160e1b5249466f80436360ae2244f18df34b64. The Program Owner-authorized TypeScript change is only the generated source-fingerprint literal and its exact public snapshot; no TypeScript declaration shape, helper semantics, or behavior changes.
          - check: Rust-slice governance and focused repository proof
            command: python tooling/adapter_certification.py --check --json && python -m unittest tooling.tests.test_adapter_certification tooling.tests.test_legacy_reference_architecture -v && python tooling/documentation_integrity.py --json && python tooling/governance.py && git diff --check
            result: passed
            details: The closed 58-case adapter denominator, 21 focused shrinkage and architecture regression tests, 191-file documentation link scan with seven executable examples, task scope, change declarations, generated ownership, dependency boundaries, and patch whitespace all pass. The task-owned TypeScript public surface passes its exact declaration check; the repository-wide public-contract aggregate remains a CP4 obligation because this Windows host does not currently provide the enforced Go extractor executable.
          - check: Canonical C adapter and semantic-copy retirement
            command: ./strling lint c && ./strling test c
            result: passed
            details: The C11 package now routes raw canonical requests, Simply builder envelopes, response ownership, and deallocation exclusively through strling.c-abi v1. MSVC 19.44 builds the adapter with /W4 /WX; the adapter suite covers canonical success/failure, exact and refused profiles, Unicode scalar handling, options, registry-backed Essential helpers, unknown-helper refusal, invalid UTF-8, ownership, and double-free safety. Its concurrency test completes 512 calls across eight threads. All ten frozen C semantic-copy files and the historical compatibility compiler are deleted, with no jansson or PCRE2 dependency remaining.
          - check: C install and external consumer boundary
            command: cmake --install bindings/c/build --config Release --prefix bindings/c/build/install && cmake -S bindings/c/tests/consumer -B bindings/c/build/consumer -DCMAKE_PREFIX_PATH=bindings/c/build/install && cmake --build bindings/c/build/consumer --config Release && bindings/c/build/consumer/Release/strling_c_consumer.exe
            result: passed
            details: The package installs the three C facade headers, generated interop header, adapter archive, canonical interop archive, versioned CMake package metadata, and STRling::c target. A separate warnings-denied C11 find_package consumer configures, compiles, links, executes a canonical request, and exits successfully without repository-private include or source paths.
          - check: C public, architecture, documentation, and security proof
            command: python tooling/public_contracts.py --check --surface c-public-api --json && python tooling/governance.py && python tooling/documentation_integrity.py --json && python tooling/security.py integrity --json
            result: passed
            details: The enforced c-public-api snapshot exactly matches the installed four-header declaration closure. The additive native-adapter architecture rule rejects retired semantic paths, third-party regex/JSON markers, or loss of the interop execution/free route; both mutation tests pass. Governance, 191-file documentation integrity with seven examples, patch whitespace, and all 27 dependency-integrity checks pass. Pull-request 1.9.0 and full/release 1.15.0 now include every enforced Rust and C operation; the canonical profile metadata regression test passes.
