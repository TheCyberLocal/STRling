record_version: 2.0.0
title: Canonical Rust facade and C/C++ adapter migration
status: in_progress
objective: Rebuild the Rust package as a curated facade over the public canonical kernel and replace C/C++ semantic copies with thin native adapters while preserving or explicitly retiring compatibility surfaces.
scope:
    diff:
        base: b0eecd19b7f4680f6c90f3fecde92df5c11eddf7
        head: working-tree
    allowed_paths:
        - .github/workflows/ci.yml
        - bindings/c/**
        - bindings/cpp/**
        - bindings/rust/**
        - docs/index.md
        - docs/migration/ledger.md
        - docs/migration/rust-c-cpp-adapter-migration.md
        - docs/migration/records/rust-c-cpp-adapter-migration.yaml
        - governance/architecture-rules.json
        - governance/change-control.json
        - governance/contracts/snapshots/c-public-api.json
        - governance/contracts/snapshots/cpp-public-api.json
        - governance/contracts/snapshots/rust-public-api.json
        - governance/generated-artifacts.json
        - governance/public-surfaces.json
        - governance/security-policy.json
        - tests/adapters/**
        - toolchain.json
        - tooling/adapter_certification.py
        - tooling/governance.py
        - tooling/public_contracts.py
        - tooling/tests/test_adapter_certification.py
        - tooling/tests/test_governance.py
        - tooling/tests/test_public_contracts.py
    forbidden_paths:
        - bindings/interop/src/**
        - bindings/csharp/**
