            result: passed
            details: Seventeen canonical compiler, Simply, interop, standard-library, and pcre2-10.43 inputs have fingerprint sha256:0c6189b30042c50481228314ca35f69e55c9536288aad7299dce5c4816770924. The manifest fingerprint is sha256:d95581ae6bb95b5250fc5ffade82bba932ebb3a01276c406afe8f3db19080b70. The fingerprint-only drift is caused by the authorized Rust/C/C++ standard-library ownership-path corrections; the 58 cases, ten families, three bindings, three operations, eleven runner dispositions, four native platform targets, and all semantic claims remain unchanged.
