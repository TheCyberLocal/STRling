    bounded_exemptions: []
change_classification:
    semantic_change:
        level: none
        evidence:
            - Host facades consume existing canonical compiler, frontend, target, diagnostic, Simply, and standard-library contracts and are forbidden from creating or modifying semantics.
        affected_surfaces: []
    public_api_change:
        level: none
        evidence:
            - CP1 locks the future public-surface dispositions but changes no package or header surface. Later checkpoints must declare each detected Rust, C, or C++ public change when it enters the diff.
        affected_surfaces: []
    schema_change:
        level: none
        evidence:
            - Existing canonical and interop schemas remain unchanged; the task may add only verification manifests subordinate to those contracts.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Canonical diagnostics and stable interop error identities cross adapter boundaries unchanged; host exception or result projection does not redefine their meaning.
        affected_surfaces: []
    target_behavior_change:
        level: none
        evidence:
            - CP1 records the intended correction but changes no executable target behavior. Later checkpoints must declare the correction with the adapter implementation that enforces exact profiles and removes implicit target assumptions.
        affected_surfaces: []
    architecture_change:
        level: none
        evidence:
            - CP1 records the authorized dependency direction but changes no dependency edge or implementation boundary. Later checkpoints must declare the intentional correction with the corresponding adapter and retirement diff.
        affected_surfaces: []
    generated_output_change:
        level: none
        evidence:
            - CP1 changes no generated output. Later checkpoints must update this declaration and expected generated families before changing snapshots, lockfiles, version metadata, or transitional fixture projections.
        affected_surfaces: []
    documentation_only: false
    internal_implementation: false
required_verification:
    - name: Rust/C/C++ adapter contract and deletion denominator
      command: python tooling/adapter_certification.py --check
      expected_result: Exact API, compatibility, refusal, canonical parity, ownership, RAII, package, architecture, and semantic-copy deletion cases validate with shrinkage resistance.
    - name: Focused package and cross-language conformance
      command: ./strling test rust && ./strling test c && ./strling test cpp && python tooling/adapter_certification.py --certify
      expected_result: Rust, C, and C++ expose identical canonical results and artifacts through their declared surfaces with no binding-owned parser/compiler/emitter execution.
    - name: Public, generated, architecture, security, and repository profiles
      command: python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && python tooling/governance.py && python tooling/security.py integrity --json && python tooling/migration_differential.py --repeat-runs 3 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: API snapshots, generated authority, dependency direction, migration behavior, package graphs, executable profile operations, and exact environmental limitations are recorded with a clean tree and no task-owned failure.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and public-surface starting boundary
            result: passed
            details: Starting anchor b0eecd19b7f4680f6c90f3fecde92df5c11eddf7 was clean on architecture/v4. The migration denominator is 93 Rust/C/C++ source or header files and approximately 22,000 lines; Rust has 23 source files, C has 41, and C++ has 29. Existing public governance is enforced for c-public-api and transitional for cpp-public-api and rust-public-api.
          - check: Dependency and API ownership lock
            result: passed
            details: The Rust package is a curated typed facade over strling-kernel; C uses only strling.c-abi v1 and the generated strling_interop.h; C++ is an RAII layer over the stable C/native contract. Compatibility translation must fail closed and may not execute a binding-local parser, compiler, emitter, or regex fallback.
          - check: Target, ownership, packaging, and exclusion lock
            result: passed
            details: Canonical calls require an exact supplied target profile; only deprecated targetless compatibility calls may use an explicit generated pcre2-10.43 projection; ownership, error, and concurrency rules follow the stable interop contract; builds and installs are local only; no publication, support-tier decision, interop v2, package version bump, or other binding migration is authorized.
          - check: CP1 governance and reproducibility validation
            command: node_modules/.bin/prettier --check <CP1 files> && python tooling/governance.py && python tooling/documentation_integrity.py && python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && git diff --check
            result: passed
            details: Governance contracts, scope, declarations, and enforced architecture rules pass; documentation integrity covers 190 files and 7 executable examples; every enforced public surface is unchanged; every enforced generated family is synchronized; formatting and patch whitespace pass. The public/generated check used a host temporary directory because the Windows workspace sandbox denied extractor temporary-file creation; the host run passed without changing repository outputs.
    - name: Verification design and evidence
      status: planned
      evidence: []
    - name: Minimal implementation and local proof
      status: planned
      evidence: []
    - name: Integration and certification
      status: planned
      evidence: []
    - name: Completion and next-task readiness
      status: planned
      evidence: []
