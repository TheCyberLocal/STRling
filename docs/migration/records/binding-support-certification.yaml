change_classification:
    semantic_change:
        level: none
        evidence:
            - The task certifies adapter ownership and support evidence without changing canonical language, compiler, target, diagnostic, or standard-library behavior.
        affected_surfaces: []
    public_api_change:
        level: breaking
        evidence:
            - Rust public extraction snapshots the unchanged curated facade through deterministic source declarations.
            - C# and Go expose the generated standard-library source fingerprint as a public constant; the authorized derived refresh changes only that constant value from db3d1fc6ddd1b0ef83cb7bfb4a9bd84c8bcc547d5a6649a6747cc4b94fb4edff to 36779a57c8016a0ff4a1ba00e9c6cb198246bf8e170edb1e0d627c0ed91f19a0, with no symbol, type, method, or API-shape change.
            - The public-contract detector intentionally classifies a public constant-value change as breaking; the classification is recorded rather than weakened or represented as unchanged.
        affected_surfaces:
            - csharp-public-api
            - go-public-api
    schema_change:
        level: additive
        evidence:
            - A subordinate certification-evidence schema may be added without changing product or protocol schemas.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Canonical diagnostics must cross every adapter unchanged.
        affected_surfaces: []
    target_behavior_change:
        level: none
        evidence:
            - Target selection, planning, lowering, and artifacts remain canonical-core responsibilities.
        affected_surfaces: []
    architecture_change:
        level: intentional-correction
        evidence:
            - Stale global binding transitions are replaced by enforced structural rules after every ordered adapter migration completed.
        affected_surfaces: []
    generated_output_change:
        level: intentional-correction
        evidence:
            - CP2 adds one registered deterministic non-normative evidence artifact derived from the authored seventeen-language manifest and existing package, public, migration, and architecture registries.
            - CP4 renews the guarded migration-differential baseline after a three-run governed Linux and Node.js 22 replay; all 44 observations at the immutable last-baseline commit and current HEAD are byte-identical, while only environment-derived observation and result fingerprints change.
        affected_surfaces:
            - binding-support-certification-evidence
            - public-contract-snapshots
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Seventeen-binding certification evidence
      command: python tooling/binding_support_certification.py --check --json
      expected_result: The exact seventeen-language denominator, evidence dispositions, package/runtime/platform rows, public surfaces, canonical routes, and forbidden-semantic inventory reproduce without shrinkage.
    - name: Public contracts
      command: python tooling/public_contracts.py --check --json
      expected_result: Every language public surface, including Rust, has an enforced reproducible snapshot and no unclassified API change.
    - name: Architecture and generated authority
      command: python tooling/architecture_fitness.py --json && python tooling/generated_artifacts.py --check
      expected_result: All binding boundaries and the repository-wide zero-duplicate-semantics rule pass; registered evidence reproduces.
    - name: Cross-binding canonical behavior
      command: python tooling/binding_support_certification.py --execute --json
      expected_result: Every available retained adapter propagates canonical requests, results, diagnostics, artifacts, options, Simply values, and helpers without reinterpretation.
    - name: Repository profiles
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full
      expected_result: Every applicable P17-T08 operation passes and unrelated failures or unavailable environments are recorded exactly.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and campaign reconciliation
            result: passed
            details: The task starts from clean architecture/v4 anchor a5a0b9cfe65f00f91f3038a7e24ab97aed0624af after all six ordered adapter migration records completed; Notion P17-T08 is In Progress with normalized CP1-CP4 and FINAL children.
          - check: Exact language and transport denominator
            result: passed
            details: The language denominator is exactly C, C++, C#, Dart, F#, Go, Java, Kotlin, Lua, Perl, PHP, Python, R, Ruby, Rust, Swift, and TypeScript. Shared JVM and C/native interop are supporting transports and do not increase the count.
          - check: Public and package starting state
            result: passed
            details: Sixteen language public APIs are enforced and Rust alone is transitional. Thirteen dependency models are repository-managed, Lua and Perl are constrained, and Python and R are deferred; these are evidence inputs, not support claims.
          - check: Zero-duplicate and policy boundary
            result: passed
            details: Parsing, normalization, semantic and safety analysis, portability planning, lowering, emission, and standard-library semantics are canonical-only. Transport and generated projections are narrow exceptions. Any real product duplicate is blocking. T08 records evidence dispositions; P20-T01 retains permanent consumer support-tier authority.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed evidence design
            result: passed
            details: The authored manifest fixes all seventeen language rows, two supporting transports, canonical routes, completed migration records, eighteen public surfaces, executed platforms, limitations, and evidence tiers. The generated artifact joins those declarations to existing machine authority and fingerprints to sha256:d925db404aaac57636887915d2669d6c1a5d26410a61bc03fddcc32d80a9e206.
          - check: Exact support and public denominator
            result: passed
            details: The closed matrix has twelve supported_candidate and five preview_candidate rows, with permanent policy explicitly owned by P20-T01. Seventeen of eighteen language public surfaces are enforced; Rust alone remains accurately transitional and absent rather than falsely promoted.
          - check: Semantic-path inventory and facade exceptions
            result: passed
            details: The tracked-product scan finds zero forbidden parser, AST, IR, validator, hint-engine, or emitter paths. Exactly five compiler-named files are structurally justified canonical request/transport facades and remain covered by their ecosystem rules.
          - check: Mutation-resistant evidence and readiness distinction
            result: passed
            details: >-
                Nine tests reject binding removal or reordering, tier/route/public-state/semantic-path substitution, noncanonical fingerprints, and attempted use of not-ready evidence at the final gate. The artifact reports exactly three blockers for CP3: Rust public enforcement and the two stale global architecture transitions.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: Rust public surface and global binding gates
            result: passed
            details: The deterministic source extractor activates a nineteen-symbol Rust facade snapshot under the declared MSRV and requires the canonical strling-kernel path, seven facade modules, named re-exports, VERSION, version, and check. No binding product code changes.
          - check: Zero-duplicate semantic-path hardgate
            result: passed
            details: The stale filename transition is replaced by an enforced case-insensitive tracked-product rule over parser, compiler, AST, IR, nodes, validator, hint-engine, and emitter identities. Five exact compiler-named canonical facades remain covered exceptions; a controlled new parser path fails.
          - check: Canonical-route coverage hardgate
            result: passed
            details: A new Rust-to-kernel boundary passes, and the former future rule now requires nine enforced adapter-family route rules covering all seventeen languages through only strling-kernel, strling.c-abi v1, or the raw WebAssembly ABI. Missing or demoted route rules fail.
          - check: Focused contracts, mutation tests, governance, and ready evidence
            result: passed
            details: In the exact Linux patch replay, 98 public-contract, binding-evidence, governance, and schema mutation tests pass; governance accepts contracts, scope, declarations, and every enforced rule; documentation validates 198 files and seven examples; targeted formatting and diff integrity pass. The matrix is ready at sha256:eead75932095aa39aa0ddd3bfbfae5bb1de7cd630c5341a13514e5cb375526d3 with 18/18 public surfaces, 13/13 required architecture rules, zero forbidden paths, and zero blockers.
          - check: Complete public-family availability disposition
            result: passed
            details: >-
                The registered public-family wrapper passes every available static/Rust/C/C++/dynamic/schema/CLI surface unchanged and records nine unavailable external extractors in the minimal Linux container: .NET C#/F#, Dart, Go, JVM, Java, Kotlin, Swift, and TypeScript. Rust passes directly; CP4 owns full toolchain replay and no unavailable row is represented as passing.
