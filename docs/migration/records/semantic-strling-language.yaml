status: complete
objective: Ratify a readable, explicit, versioned Semantic STRling 1.0 textual frontend whose complete syntax and source diagnostics map deterministically to canonical Semantic IR, without implementing a parser or formatter or introducing target, runtime, module, portability-policy, or safety-policy authority.
