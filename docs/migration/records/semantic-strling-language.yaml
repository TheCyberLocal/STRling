    expected_generated_outputs: []
    required_verification_levels: [contract, unit, quality, certification]
    bounded_exemptions: []
change_classification:
    semantic_change:
        level: additive
        evidence:
            - A new versioned source language and deterministic mapping are ratified without changing any existing frontend or canonical Semantic IR meaning.
    public_api_change:
        level: none
        evidence:
            - No parser, formatter, CLI route, binding, package, or compiler surface is implemented in this task.
    schema_change:
        level: additive
        evidence:
            - New frontend-local schemas validate the language catalog, Semantic IR mapping table, and authored fixtures without altering canonical schemas.
        affected_surfaces: []
    diagnostic_change:
        level: additive
        evidence:
            - Stable STRL-DSL diagnostic identities and source triggers are specified for future implementations; no current compiler emits them.
        affected_surfaces: []
    target_behavior_change:
        level: none
        evidence:
            - Target selection, capability evaluation, planning, lowering, serialization, and runtimes are unchanged and remain out of source syntax.
    architecture_change:
        level: additive
        evidence:
            - Adds a versioned flagship textual frontend contract and an enforced specification-sovereignty boundary while preserving one canonical semantic authority.
    generated_output_change:
        level: none
        evidence:
            - All new catalogs, schemas, mappings, fixtures, manifests, and documentation are specification-authored inputs.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Semantic language contract and grammar consistency
      command: python3 tooling/semantic_strling_contract.py && python3 -m unittest tooling.tests.test_semantic_strling_contract
      expected_result: Schemas, formal EBNF, production graph, disjoint construct phrases, reserved words, mappings, diagnostics, fixtures, spans, manifests, and fingerprints pass; controlled mutations fail closed.
    - name: Semantic IR mapping completeness
      command: python3 tooling/contract_validation.py
      expected_result: Every canonical node/member/enum variant is mapped, every grammar production has positive and negative authored coverage, and the new suite participates in canonical contract certification.
    - name: Specification sovereignty and documentation integrity
      command: python3 tooling/architecture_fitness.py && python3 tooling/governance.py && python3 tooling/documentation_integrity.py
      expected_result: The frontend owns syntax and mapping only; no implementation or target authority enters the contract; all authoritative language status and links are consistent.
    - name: Repository and Local certification
      command: ./strling format --check repository && ./strling lint repository && ./strling hygiene && ./strling contracts --check --json && ./strling governance --json && python3 -m unittest discover -s tooling/tests && ./strling profile local && git diff --check && git status --short
      expected_result: All task-owned and available checks pass, no parser or formatter implementation exists, and the final tracked tree is clean.
checkpoints:
    - name: Authority, identity, and edition boundary
      status: passed
      evidence:
          - check: Narrow frontend ratification
            result: passed
            details: The versioned identity is strling.semantic dialect 1.0.0 with in-source selector 1.0. The contract owns syntax, lowering mapping, and frontend diagnostics but not canonical semantics, targets, runtimes, or the broader still-draft Semantic Specification.
          - check: Implementation exclusion
            result: passed
            details: Parser, formatter, CLI, binding, compiler, target, runtime, module/import, portability-policy, and safety-policy implementation are forbidden by scope.
    - name: Readable explicit language design
      status: passed
      evidence:
          - check: Ambiguity-free structural surface
            result: passed
            details: Keyword-led leaf statements and explicit brace containers replace regex punctuation, implicit concatenation, postfix operators, grouping, precedence, and associativity.
          - check: Canonical semantic coverage
            result: passed
            details: The design covers all 12 canonical nodes, four set-member forms, global case intent, both wildcard behaviors/domains, all repetitions, positions, and lookaround variants with explicit source-span rules.
          - check: Deliberate deferrals
            result: passed
            details: Exact targets remain in CompileRequest; modules/imports lack a canonical linkage model; portability/safety directives lack source-policy contracts; all are unavailable rather than hidden syntax.
    - name: Formal grammar, mappings, and authored fixtures
      status: passed
      evidence:
          - check: Complete formal language bundle
            command: python3 tooling/semantic_strling_contract.py
            result: passed
            details: Three schemas, 55 reachable grammar productions, 17 complete Semantic IR mappings, deterministic one-based material/capture preorder identities, 27 stable diagnostics, 10 explicit unavailable constructs, 12 positive cases, and 30 negative cases pass at fingerprint sha256:7e31ea7cf5560b6899acc61d6a3526ed5b1a85254f3599859169099385680546.
          - check: Semantic IR and fixture completeness
            command: python3 tooling/contract_validation.py
            result: passed
            details: Every one of 12 canonical node kinds, four set-member kinds, and all governed enum values has exactly one deterministic mapping and positive fixture coverage; every grammar production has positive and negative authored coverage.
    - name: No-parser consistency and sovereignty hardgates
      status: passed
      evidence:
          - check: Controlled contract mutations
            command: python3 -m unittest tooling.tests.test_semantic_strling_contract
            result: passed
            details: All 14 tests pass, rejecting authority promotion, undefined/unreachable grammar, prefix ambiguity, incomplete mappings/production/diagnostic coverage, invalid UTF-8 offsets, stale fingerprints, parser claims, and frontend leakage into canonical semantic authority.
          - check: Enforced architecture boundary
            command: python3 tooling/architecture_fitness.py
            result: passed
            details: The enforced semantic-strling-authority-boundary keeps strling.semantic identity out of canonical semantic/target authority and rejects parser, formatter, runtime, target, or canonical-semantic claims in the contract.
    - name: Repository and Local certification
      status: planned
      evidence: []
commits:
