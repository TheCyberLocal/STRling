record_version: 2.0.0
title: Add source spans, provenance, and canonical diagnostics to the regex-compatible parser
status: complete
objective: Make every accepted construct and rejected input from strling.regex-compat@1.0.0 traceable through canonical half-open UTF-8 source spans, document provenance, and stable structured diagnostics without adding public frontend orchestration.
