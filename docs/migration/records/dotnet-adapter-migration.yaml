          - check: Semantic-copy removal and architecture enforcement
            command: python -m unittest tooling.tests.test_dotnet_adapter_architecture tooling.tests.test_dotnet_adapter_runtime tooling.tests.test_dotnet_stdlib_surfaces
            result: passed
            details: >-
                The 18/18 frozen C#/F# parser, compiler, AST/IR, hint, emitter, and Simply semantic paths are absent. A new enforced architecture rule rejects their return, any host regex/subprocess/socket route, a second F# native route, or loss of the single F# to C# dependency. Six focused architecture/runtime/generation tests pass with host temporary-directory access.
          - check: Intended public replacement surface
            command: python tooling/public_contracts.py --check --surface csharp-public-api --surface fsharp-public-api --json
            result: passed
            details: >-
                Isolated Release extraction regenerates the intentionally breaking canonical facades at 128 C# and 92 F# public symbols. No binding AST, IR, parser, emitter, warning, hint, or local compiler type remains public; host lifecycle errors, canonical JsonElement results, C# Simply recipes, and F# outcome projections are explicit.
          - check: CP3 governance, contracts, formatting, and patch integrity
            command: python tooling/governance.py --json && python tooling/dotnet_adapter_certification.py --check --json && python tooling/formatting.py repository --check && git diff --check
            result: passed
            details: >-
                Governance accepts the complete CP3 replacement diff with scope, contracts, declarations, and every architecture rule passing. The candidate-path scanner now excludes tracked files deleted by the active migration and a regression test prevents deleted semantic copies from being reported as live. The closed 72-case .NET evidence, repository formatting, documentation integrity across 195 files and seven examples, and whitespace integrity all pass.
