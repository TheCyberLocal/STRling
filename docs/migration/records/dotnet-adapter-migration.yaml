change_classification:
    semantic_change:
        level: none
        evidence:
            - C# and F# facades consume existing canonical compiler, frontend, target, diagnostic, Simply, standard-library, and interop contracts and are forbidden from creating or modifying semantics.
        affected_surfaces: []
    public_api_change:
        level: breaking
        evidence:
            - The task introduces one C# NativeClient substrate plus curated C# and F# canonical compile and Simply facades.
            - Binding-owned C# Core/Emit and historical F# AST/IR/parser/compiler/emitter implementation APIs are explicit breaking retirements; preserved ergonomic names delegate through canonical requests or explicitly refuse targetless behavior.
        affected_surfaces:
            - csharp-public-api
            - fsharp-public-api
    schema_change:
        level: additive
        evidence:
            - CP2 may add only subordinate .NET migration evidence and public-extraction configuration; canonical compiler, frontend, standard-library, target, and interop schemas remain unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: intentional-correction
        evidence:
            - Retiring C#/F# hint and diagnostic synthesis removes host-owned meanings; canonical diagnostics and stable interop error identities cross the shared boundary unchanged.
        affected_surfaces:
            - csharp-public-api
            - fsharp-public-api
    target_behavior_change:
        level: intentional-correction
        evidence:
            - Retiring .NET PCRE2 emitters and implicit Pattern compile behavior makes canonical artifacts require an exact target profile; targetless compatibility behavior must explicitly refuse rather than select PCRE2 silently.
        affected_surfaces: []
    architecture_change:
        level: intentional-correction
        evidence:
            - C# becomes the sole built-in NativeLibrary substrate over strling.c-abi v1 and F# depends on that assembly; architecture gates retire eighteen product parser/compiler/AST/IR/hint/emitter/Simply semantic paths plus any second .NET native route.
        affected_surfaces: []
    generated_output_change:
        level: intentional-correction
        evidence:
            - CP2 registers and generates one compatibility baseline from the immutable P17-T05 starting commit; the generated source bundle is hash-checked evidence outside product package graphs.
            - CP2 activates deterministic isolated Release assembly extraction and generates the exact task-start C# and F# public compatibility snapshots without changing product behavior.
            - CP3 regenerates the intended breaking C# and F# public snapshots and registers both lexical-helper surfaces as deterministic views of the canonical standard-library registry.
        affected_surfaces: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: .NET migration evidence contract
      command: python tooling/dotnet_adapter_certification.py --check --json
      expected_result: The closed C#/F# public, lifecycle, runtime/RID, package, conformance, historical, and deletion denominator validates without shrinkage.
    - name: C# and F# focused build and tests
      command: ./strling test csharp && ./strling test fsharp
      expected_result: The shared substrate plus C# and F# API, marshaling, lifecycle, error, Simply, and canonical parity suites pass on the active governed .NET row.
    - name: Exact .NET public contracts
      command: python tooling/public_contracts.py --check --surface csharp-public-api --surface fsharp-public-api --json
      expected_result: Generated C# and F# public snapshots reproduce exactly with every intended compatibility change classified.
    - name: Architecture and generated authority
      command: python tooling/governance.py && python tooling/generated_artifacts.py --check --artifact dotnet-adapter-migration-baseline --artifact public-contract-snapshots
      expected_result: F# depends on the C# shared substrate, no product semantic copy or alternate native route remains, and affected generated families reproduce.
    - name: Cross-binding and migration differential
      command: python tooling/dotnet_adapter_certification.py --certify --json && python tooling/migration_differential.py --repeat-runs 3
      expected_result: C# and F# produce identical canonical results through the shared boundary and the guarded migration differential has no unreviewed blocking replacement.
    - name: Repository profiles
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full
      expected_result: Every applicable T05 operation passes and every unrelated failure or unavailable runtime is recorded exactly.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository, source, public, package, and runtime starting boundary
            result: passed
            details: >-
                Starting anchor 352d7c2547a58f692a709e464b458bf83103b09c is clean on architecture/v4. The exact 50-entry C#/F# tree fingerprints to sha256:82633270ef02d21d267724a90dac9a92134cbd51eb811fffb31c2007a75d947f. Thirty-two production sources contain 4,462 lines; seventeen test sources contain 1,070 lines and 45 static Fact annotations. The 18-path product semantic footprint contains 4,080 lines and fingerprints to sha256:fa3a2ab366719e9e4e93d5f7b0f4ca1fd502bf3521447cfd000d5c7f9fa7f7df.
          - check: Shared .NET boundary, compatibility, lifecycle, RID, and semantic-ownership lock
            result: passed
            details: >-
                The C# STRling assembly is the sole NativeLibrary/load-export substrate over strling.c-abi v1; the STRling.FSharp assembly depends on it and owns only F# projections. Absolute-path loading, exact certified RID assets only, ABI-before-execution, bounded strict UTF-8/JSON transport, same-descriptor release, IDisposable lifecycle, reentrancy, stable host-versus-canonical errors, net9.0, and the four interop certification RID mappings are locked. No deterministic unload, ambient search, download, support-tier, or unexecuted-platform claim is made.
          - check: Starting .NET build, test, and public evidence
            command: dotnet test bindings/csharp/STRling.sln --no-restore && dotnet test bindings/fsharp/STRling.sln --no-restore
            result: passed
            details: >-
                .NET SDK 9.0.302 satisfies the governed >=9.0,<10.0 range. The historical C# suite passes 625 tests and the historical F# compiler suite passes 616 tests on net9.0 with zero failures or skips when run serially with isolated MSBuild workers. The incomplete secondary F# wrapper restores and builds an assembly with zero exported types, but its tests fail to compile because Api.fs is not included; this is recorded as starting debt, not a passing adapter. Current public extraction is transitional with no snapshots; built assemblies expose 48 C# types/564 members and 54 historical F# types/481 members.
          - check: CP1 authority, documentation, governance, formatting, and patch integrity
            command: python tooling/governance.py && python -m unittest tooling.tests.test_governance tooling.tests.test_governance_contracts -q && python tooling/documentation_integrity.py --json && python tooling/formatting.py repository --check && git diff --check
            result: passed
            details: >-
                The task record declares the complete migration scope, exact forbidden semantic authorities, breaking public and intentional architecture dispositions, no current generated-output claim, future permitted generated families, and all five verification levels. Migration documentation records the shared-boundary decision without changing product behavior. Governance, its contract tests, documentation integrity, repository formatting, and patch integrity pass before the CP1 checkpoint commit.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed contract, replacement, and removal denominator
            command: python tooling/dotnet_adapter_certification.py --check --json
            result: passed
            details: >-
                Seventeen canonical compiler, Simply, interop, standard-library, and pcre2-10.43 inputs fingerprint to sha256:0c6189b30042c50481228314ca35f69e55c9536288aad7299dce5c4816770924. The manifest fingerprint is sha256:0cc397456a771e2171594218f78f66086a4fa3bc2913963dab8794337e2906db and freezes 72 cases across twelve families, eleven runners, four closed operations, three adapter components, and the installed SDK 9.0.120/9.0.200/9.0.302 matrix.
          - check: Immutable task-start source and semantic-copy baseline
            command: python tooling/dotnet_adapter_certification.py --write-baseline --check --json && python tooling/generated_artifacts.py --check --artifact dotnet-adapter-migration-baseline
            result: passed
            details: >-
                The registered generated baseline reproduces from immutable 352d7c25 with fingerprint sha256:12034b0723bec7154da0eecf3f93b6e4e608fc488674ec43363a0703367574f2. It embeds all 50 task-start binding files as hash-checked base64, freezes 26 public/build inputs and all 18 semantic-copy paths, and remains certification data outside product package graphs.
          - check: Shrinkage, substitution, and materialization resistance
            command: python -m unittest tooling.tests.test_dotnet_adapter_certification -v
            result: passed
            details: >-
                Nine tests reject case-count editing, required-case and runner substitution, observation reclassification, semantic-path substitution, source mutation after editable hash recomputation, and any bundle materialization mismatch.
          - check: Task-start installed SDK observations
            result: passed
            details: >-
                Installed .NET SDKs 9.0.120, 9.0.200, and 9.0.302 each execute serially against net9.0. The unchanged C# solution passes 625 tests and the unchanged historical F# compiler solution passes 616 tests under every SDK with zero failures or skips. The separate F# wrapper still builds zero exported types and its tests do not compile; this remains explicit task-start debt.
          - check: Exact C# and F# task-start public contracts
            command: python tooling/public_contracts.py --check --surface csharp-public-api --surface fsharp-public-api --json
            result: passed
            details: >-
                The checked-in net9.0 extractor builds product projects to isolated Release outputs and normalizes public constructors, methods, properties, fields, events, generic constraints, defaults, and attribute identities. Exact snapshots reproduce 487 C# symbols across 48 types and one assembly and 479 F# symbols across 54 types and both task-start product assemblies. All 28 public-contract unit tests pass with host temporary-directory access.
          - check: CP2 governance, generated authority, documentation, formatting, and patch integrity
            command: python tooling/governance.py && python tooling/generated_artifacts.py --check --artifact dotnet-adapter-migration-baseline && python tooling/documentation_integrity.py --json && python tooling/formatting.py repository --check && dotnet format tooling/dotnet_public_api/STRling.DotNetPublicApi.csproj --no-restore --verify-no-changes && git diff --check
            result: passed
            details: >-
                Governance accepts the exact 18-entry task diff, generated declarations, public-surface activation, evidence authority, and every enforced architecture rule. The registered baseline reproduces, documentation integrity validates 195 files and seven examples, repository and extractor formatting pass, and the patch is whitespace-clean.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: One C# native substrate and dependent F# projection
            command: dotnet test bindings/csharp/tests/STRling.Tests/STRling.Tests.csproj -c Release -m:1 --no-restore && dotnet test bindings/fsharp/test/STRling.FSharp.Tests/STRling.FSharp.Tests.fsproj -c Release -m:1 --no-restore
            result: passed
            details: >-
                The net9.0 C# package owns the only NativeLibrary load/export route, verifies strling.c-abi v1 before execution, enforces strict UTF-8/JSON and the 10 MiB/32 MiB bounds, frees every descriptor, and exposes stable load/ABI/transport/protocol/lifecycle errors. The final STRling.FSharp assembly has one project reference to STRling and contains only canonical data projections. Focused Release suites pass 9 C# and 4 F# tests.
          - check: Three-run live C#/F# canonical parity
            command: python -m tooling.dotnet_adapter_runtime --json --repeat-runs 3
            result: passed
            details: >-
                The release strling_interop.dll executes describe, source compile, and Simply compile through both facades for three clean runs. C# and F# normalized results are byte-equivalent with fingerprint sha256:d95c5b12a4b50c231be5dccff11454f7b4160f7e5a939c3f532296d2b5da1b31. The report certifies SDK 9.0.302, all 18 retired semantic-copy paths, and only win-x64; Linux, macOS, and alternate architectures remain unclaimed.
          - check: Canonical Simply and generated lexical helpers
            command: python -m tooling.dotnet_stdlib_surfaces --check --json
            result: passed
            details: >-
                C# and F# record Simply 1.1 operations and never render or execute regex locally. Registry fingerprint sha256:3539cc50744c492ee617f9c836c83e040ad3af2f32dd8fe3b1e329c5b14bc719 generates exactly five lexical_shape helper identities and eight variants; no semantic validator or host strengthening exists.
          - check: Semantic-copy removal and architecture enforcement
            command: python -m unittest tooling.tests.test_dotnet_adapter_architecture tooling.tests.test_dotnet_adapter_runtime tooling.tests.test_dotnet_stdlib_surfaces
            result: passed
            details: >-
                The 18/18 frozen C#/F# parser, compiler, AST/IR, hint, emitter, and Simply semantic paths are absent. A new enforced architecture rule rejects their return, any host regex/subprocess/socket route, a second F# native route, or loss of the single F# to C# dependency. Six focused architecture/runtime/generation tests pass with host temporary-directory access.
          - check: Intended public replacement surface
            command: python tooling/public_contracts.py --check --surface csharp-public-api --surface fsharp-public-api --json
            result: passed
            details: >-
                Isolated Release extraction regenerates the intentionally breaking canonical facades at 128 C# and 92 F# public symbols. No binding AST, IR, parser, emitter, warning, hint, or local compiler type remains public; host lifecycle errors, canonical JsonElement results, C# Simply recipes, and F# outcome projections are explicit.
          - check: CP3 governance, contracts, formatting, and patch integrity
            command: python tooling/governance.py --json && python tooling/dotnet_adapter_certification.py --check --json && python tooling/formatting.py repository --check && git diff --check
            result: passed
            details: >-
                Governance accepts the complete CP3 replacement diff with scope, contracts, declarations, and every architecture rule passing. The candidate-path scanner now excludes tracked files deleted by the active migration and a regression test prevents deleted semantic copies from being reported as live. The closed 72-case .NET evidence, repository formatting, documentation integrity across 195 files and seven examples, and whitespace integrity all pass.
