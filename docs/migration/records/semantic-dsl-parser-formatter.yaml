change_classification:
    semantic_change:
        level: additive
        evidence:
            - Implements the already ratified source grammar and mapping without changing canonical Semantic IR meaning or any existing frontend behavior.
    public_api_change:
        level: additive
        evidence:
            - Adds a Rust semantic_frontend module with parse and format functions for embedders; it is a certified frontend domain module outside the governed compile/Simply facade snapshot.
        affected_surfaces: []
    schema_change:
        level: none
        evidence:
            - The implementation consumes unchanged specification and canonical schemas.
        affected_surfaces: []
    diagnostic_change:
        level: additive
        evidence:
            - Implements the 27 stable STRL-DSL diagnostic identities and byte-selection rules frozen by P13-T04 without changing the canonical diagnostic schema.
        affected_surfaces: []
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, planning, lowering, serialization, emission, and runtimes remain downstream and unchanged.
    architecture_change:
        level: additive
        evidence:
            - Adds one pure source-to-Semantic-IR frontend and an explicit kernel dispatch while preserving one canonical normalization, analysis, and compiler pipeline.
    generated_output_change:
        level: none
        evidence:
            - No generated contract, fixture, artifact, or snapshot is renewed from implementation output.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Ratified grammar, fixtures, spans, and diagnostics
      command: cargo test --manifest-path core/Cargo.toml --test semantic_frontend --locked
      expected_result: All 12 positive and 30 negative specification-authored cases pass with deterministic Semantic IR, exact STRL-DSL identities/UTF-8 offsets, exact source spans, complete grammar coverage, and no contract edits.
    - name: Formatter and parser properties
      command: cargo test --manifest-path core/Cargo.toml --test semantic_frontend_properties --locked
      expected_result: Canonical formatting is deterministic and idempotent; parse-format-parse preserves alpha-equivalent semantics, capture names, preorder identities, authored set order, and comment order; governed limits and arbitrary UTF-8 inputs never panic.
    - name: Canonical pipeline integration
      command: cargo test --manifest-path core/Cargo.toml --test frontend_orchestration --locked
      expected_result: Explicit strling.semantic requests reuse the existing normalization, analysis, diagnostics, portability, and target pipeline; malformed source returns one frozen frontend diagnostic and no partial semantics.
    - name: Architecture and contract boundary
      command: python3 tooling/core_contract_validation.py && python3 -m unittest tooling.tests.test_semantic_frontend_architecture tooling.tests.test_core_contracts
      expected_result: Source/Semantic IR mappings include semantic_frontend; the module has no target, emitter, binding, filesystem, network, environment, legacy, or specification-writing dependency; controlled mutations fail closed.
    - name: Rust and repository certification
      command: cargo fmt --manifest-path core/Cargo.toml -- --check && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && RUSTFLAGS=-Dwarnings cargo check --manifest-path core/Cargo.toml --all-targets --locked && cargo test --manifest-path core/Cargo.toml --all-targets --locked && ./strling profile local && ./strling profile pull-request && git diff --check && git status --short
      expected_result: Exact Rust 1.75.0 quality, all kernel/repository hardgates, Local, Pull Request, and the final clean tree pass with only explicitly inherited unavailable tools if any.
checkpoints:
    - name: Contract, API, and authority boundary
      status: passed
      evidence:
          - check: Specification-consumer implementation
            result: passed
            details: The immutable P13-T04 bundle remains syntax/mapping authority. semantic_frontend owns recognition, syntax evidence, diagnostics, formatting, and direct lowering only; existing normalization and kernel compile remain canonical.
          - check: Locked Rust API
            result: passed
            details: parse(&SourceDocument) returns ParsedSemantic with a validated canonical SemanticProgram plus private formatter syntax evidence; format(&ParsedSemantic) returns canonical source without reparsing or inferring semantics.
    - name: Deterministic syntax, provenance, and resource design
      status: passed
      evidence:
          - check: Streaming first-error parser
            result: passed
            details: A dependency-free streaming lexer/parser preserves layout comments, authored set order, token/material spans, and lexical-before-structural error precedence while enforcing all six governed resource families.
          - check: Stable lowering and identities
            result: passed
            details: Material nodes and captures allocate independent one-based preorder identities before existing normalization; references resolve only completed named captures; normalization alone flattens/coalesces/sorts canonical IR while syntax evidence remains formatter-owned.
    - name: Parser, formatter, and diagnostics implementation
      status: passed
      evidence:
          - check: Ratified grammar and first-error parser
            result: passed
            details: The dependency-free demand-driven lexer/parser implements all 55 productions, exact required-layout and delimiter behavior, the contextual reserved-word set, deterministic material/capture identities, exact spans, and all 27 stable STRL-DSL diagnostic routes.
          - check: Syntax-preserving canonical formatter
            result: passed
            details: Private syntax evidence preserves comments and authored set order; formatting emits canonical LF/layout/escapes, aligns nested comments with following constructs or enclosing closures, and reparses idempotently without deriving presentation from normalized IR.
          - check: Bounded canonical lowering
            result: passed
            details: Successful syntax lowers directly into canonical Semantic IR with exact provenance and then calls the existing normalization::normalize; no target, emitter, runtime, binding, filesystem, network, environment, package, or specification-writing dependency was added.
    - name: Fixture, property, robustness, and pipeline certification
      status: passed
      evidence:
          - check: Specification-authored fixtures
            result: passed
            details: All 12 positive and 30 negative cases pass with deterministic Semantic IR, exact diagnostic identity/phase/category/UTF-8 byte location, material spans, canonical formatting, and reparse stability.
          - check: Property and adversarial robustness
            result: passed
            details: 512 generated valid programs preserve canonical semantics, capture names, and preorder identities; 2,048 deterministic arbitrary UTF-8 inputs never panic; nesting, material-node, capture, set-member, identifier, integer, and source limits have exact boundary evidence.
          - check: Kernel and architecture integration
            result: passed
            details: Explicit strling.semantic requests reuse the existing semantic and analysis pipeline; failures return one frozen diagnostic with no partial IR; unresolved references retain the protocol route. Contract mapping, single dispatch ownership, dependency boundaries, and controlled architecture mutations pass.
          - check: Reviewed migration differential renewal
            result: passed
            details: Three repeated full-corpus runs have zero mismatches. Only the canonical-boundary fingerprint moved from sha256:b5c6542a1c43788f7f3f8be256747e0e1789124a42065ff0195968b4d09bbb42 to sha256:71b8adfbab3b965cbd381317b3da9a8192ba5ab3d7f8a12b13b7b5c75058b255 and the baseline self-fingerprint moved to sha256:59c75727d33ad965a65c9ff880cb8e2aab17f495a21d213d675af7cf9cd3a934; contract, full corpus, routes, source observations, historical peers, classifications, and every other reviewed baseline field remain byte-identical.
    - name: Repository, Local, Pull Request, and clean-tree certification
      status: passed
      evidence:
          - check: Complete repository hardgates
            result: passed
            details: At clean reviewed commit ce05ed899507355ede431c545d661dcccfe0fdc0, exact Rust 1.75.0 formatting, warning-denied Clippy/check, all 377 Rust tests, all 528 tooling tests, 11 core schema mappings with 108 fixtures, public/generated contracts, governance, lint, type checks, hygiene, patch integrity, and documentation integrity across 157 files and seven executable examples pass.
          - check: Local and Pull Request profiles
            result: passed
            details: Local passes all 26 operations with zero failures, waivers, unavailable, or incomplete results. Pull Request records 44 passed, zero failed, and zero waived operations; only inherited Ruby Bundler version drift and missing Swift remain explicitly unavailable. The migration differential passes three repeated runs with zero mismatches under its unchanged governed Node-18 observation environment.
          - check: Clean-room reproducibility and clean tree
            result: passed
            details: A git archive of ce05ed899507355ede431c545d661dcccfe0fdc0 in a fresh temporary directory passes all 24 focused fixture/property/pipeline Rust tests, four controlled semantic-frontend architecture tests, and core contract validation. The authoritative repository remains clean with a 19-path task diff from corrected prerequisite 2865ad33472de598f152d919123db22ef2484bb1.
