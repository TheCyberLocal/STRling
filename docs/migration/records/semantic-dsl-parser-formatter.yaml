record_version: 2.0.0
title: Semantic STRling Rust parser and canonical formatter
status: in_progress
objective: Implement the ratified strling.semantic 1.0.0 grammar and canonical formatting contract as a bounded, deterministic Rust frontend that preserves authored syntax evidence, lowers through the existing canonical Semantic IR normalization and compiler pipeline, and introduces no competing semantic, target, runtime, binding, package, or specification authority.
