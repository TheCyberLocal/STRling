change_classification:
    semantic_change:
        level: none
        evidence:
            - No language, parser, semantic IR, analysis, planning, lowering, target, diagnostic, stdlib, or runtime behavior is changed.
    public_api_change:
        level: none
        evidence:
            - Repository-only legacy-reference, migration-differential, and audit maintenance commands are not supported product API; every supported package and binding public API is unchanged.
        affected_surfaces: []
    schema_change:
        level: compatible
        evidence:
            - Governance evidence schemas gain explicit baseline-versus-current fixture retirement accounting; product schemas and serialized contracts are unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - No diagnostic identity, wording contract, or explanation semantics changes.
    target_behavior_change:
        level: none
        evidence:
            - No target profile, capability, rewrite, emission, serialization, or real-engine expectation changes.
    architecture_change:
        level: compatible
        evidence:
            - Transitional implementation-oracle allowances are replaced by an enforced current-authority boundary without performing the complete P19-T05 ratchet.
    generated_output_change:
        level: compatible
        evidence:
            - The registered legacy-removal-inventory producer records the immutable 1,094-path baseline and exact current retained/removed partition; no semantic expected value is regenerated.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Fixture and authority completeness
      command: python -m tooling.legacy_removal_inventory --check --json && python -m tooling.semantic_authority --check --json
      expected_result: The baseline denominator remains 1,094/1,094 with zero missing/overlap, current retained history is exact, removed producer paths are absent, and every current authority route is structured/spec-authored.
    - name: Focused tooling and contract checks
      command: python -m unittest tooling.tests.test_legacy_removal_inventory tooling.tests.test_semantic_authority tooling.tests.test_migration_explanation_certification tooling.tests.test_product_certification tooling.tests.test_quality -v
      expected_result: New authority mutations fail closed, structured certification consumers remain complete, and no retired operation or path can re-enter a profile.
    - name: Governance, generation, contracts, documentation, and security
      command: python tooling/generated_artifacts.py --check && python tooling/public_contracts.py --check && python tooling/governance.py --json && python tooling/documentation_integrity.py --json && python tooling/security.py integrity --json && python tooling/security.py content --json && python tooling/security.py risk --json && git diff --check
      expected_result: All governed outputs reproduce, architecture and docs are closed, the existing waiver scope is unchanged, and no downstream P19-T04/P19-T05 work is pulled forward.
    - name: Canonical closure profiles
      command: ./strling profile local --json && ./strling profile pull-request --json && ./strling profile full --json && ./strling profile release --json
      expected_result: Every required operation passes or retains only the existing governed waiver, with zero failed, unavailable, or incomplete results.
