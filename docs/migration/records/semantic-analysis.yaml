title: Canonical semantic fact analysis
status: complete
objective: Establish the first pure target-neutral semantic-analysis stage over canonical normalized Semantic IR, with deterministic identity-keyed foundational facts for nullability, semantic consumption bounds, zero-width behavior, and logical capture/reference relationships, without changing product execution or beginning later safety, portability, lowering, emission, frontend, binding, or tooling migrations.
