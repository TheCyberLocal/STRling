change_classification:
    semantic_change:
        level: none
        evidence:
            - The model projects existing canonical meaning and certified evidence without changing accepted programs, matching semantics, diagnostics, or target behavior.
    public_api_change:
        level: additive
        evidence:
            - The Rust kernel gains a reusable typed explanation producer; existing compile and Simply APIs remain unchanged.
        affected_surfaces:
            - strling-kernel
    schema_change:
        level: additive
        evidence:
            - A separately versioned explanation schema is added outside the immutable compiler contract suite; CompileResult 1.0 is unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Existing diagnostics and advice are referenced as immutable evidence and are not regenerated or reclassified.
    target_behavior_change:
        level: none
        evidence:
            - Target sections consume completed capability evaluation and portability planning without changing plans, rewrites, lowering, emission, or runtime execution.
    architecture_change:
        level: additive
        evidence:
            - A pure explanation projection follows canonical target-neutral evidence and optional completed target planning while remaining independent of frontends, emitters, bindings, and presentation.
    generated_output_change:
        level: none
        evidence:
            - CP1 locks the future generated-rendering boundary but creates no generated output; CP2 and CP3 will update this declaration with registered generated evidence.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Explanation contract and generated rendering fixtures
      command: python3 -m tooling.explanation_contract && python3 -m tooling.explanation_fixtures --check
      expected_result: Version 1.0.0 schemas, positive and controlled-invalid fixtures, cross-object invariants, and non-normative concise/detailed renderings validate and reproduce exactly.
    - name: Canonical explanation kernel and properties
      command: cargo test --manifest-path core/Cargo.toml --test explanation --test explanation_frontend_convergence --test explanation_properties --locked
      expected_result: Every semantic node and evidence class is projected from certified inputs; source-less, frontend-equivalent, target-sensitive, uncertainty, correspondence, and repeated-byte determinism cases pass.
    - name: Architecture and public contracts
      command: python3 tooling/core_contract_validation.py && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 -m tooling.governance --json
      expected_result: The explanation boundary consumes only certified canonical evidence, existing public surfaces remain compatible except for the declared additive Rust API, generated ownership is complete, and governed scope passes.
    - name: Integration and campaign certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 -m unittest discover -s tooling/tests && ./strling profile local && ./strling profile pull-request && git diff --check && git status --short
      expected_result: Adjacent kernel and frontend convergence, tooling, quality, Local/Pull Request profiles, patch integrity, and clean-tree checks pass or retain only explicitly recorded inherited environment limitations.
