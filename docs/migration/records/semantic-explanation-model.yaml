change_classification:
    semantic_change:
        level: none
        evidence:
            - The model projects existing canonical meaning and certified evidence without changing accepted programs, matching semantics, diagnostics, or target behavior.
    public_api_change:
        level: additive
        evidence:
            - The Rust kernel gains a reusable typed explanation producer; existing compile and Simply APIs remain unchanged.
        affected_surfaces:
            - strling-kernel
    schema_change:
        level: additive
        evidence:
            - A separately versioned explanation schema is added outside the immutable compiler contract suite; CompileResult 1.0 is unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Existing diagnostics and advice are referenced as immutable evidence and are not regenerated or reclassified.
    target_behavior_change:
        level: none
        evidence:
            - Target sections consume completed capability evaluation and portability planning without changing plans, rewrites, lowering, emission, or runtime execution.
    architecture_change:
        level: additive
        evidence:
            - A pure explanation projection follows canonical target-neutral evidence and optional completed target planning while remaining independent of frontends, emitters, bindings, and presentation.
    generated_output_change:
        level: additive
        evidence:
            - Concise and detailed text examples are registered generated non-normative views of the authoritative structured fixture.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Explanation contract and generated rendering fixtures
      command: python3 -m tooling.explanation_contract && python3 -m tooling.explanation_fixtures --check
      expected_result: Version 1.0.0 schemas, positive and controlled-invalid fixtures, cross-object invariants, and non-normative concise/detailed renderings validate and reproduce exactly.
    - name: Canonical explanation kernel and properties
      command: cargo test --manifest-path core/Cargo.toml --test explanation --test explanation_frontend_convergence --test explanation_properties --locked
      expected_result: Every semantic node and evidence class is projected from certified inputs; source-less, frontend-equivalent, target-sensitive, uncertainty, correspondence, and repeated-byte determinism cases pass.
    - name: Architecture and public contracts
      command: python3 tooling/core_contract_validation.py && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 -m tooling.governance --json
      expected_result: The explanation boundary consumes only certified canonical evidence, existing public surfaces remain compatible except for the declared additive Rust API, generated ownership is complete, and governed scope passes.
    - name: Integration and campaign certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 -m unittest discover -s tooling/tests && ./strling profile local && ./strling profile pull-request && git diff --check && git status --short
      expected_result: Adjacent kernel and frontend convergence, tooling, quality, Local/Pull Request profiles, patch integrity, and clean-tree checks pass or retain only explicitly recorded inherited environment limitations.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Ordered task and clean starting boundary
            result: passed
            details: P15-T01 began on architecture/v4 at clean P14 closure 771edac04b776891a2102d0c6d7832393dea23d6. The independently versioned explanation contract, canonical evidence dependencies, forbidden protocol and whyNoMatch scope, rollback boundary, and required acceptance evidence are frozen before product implementation.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed explanation schema and correspondence validator
            result: passed
            details: Model 1.0.0 defines closed concise and detailed program, node, capture/reference, semantic/structural fact, safety, diagnostic/advice, uncertainty, target-plan, constraint, rewrite, target-diagnostic, and provenance entities. The validator enforces canonical order, references, counts, source modes, evidence classes, target status, and local diagnostic occurrences.
          - check: Authored and generated evidence boundary
            result: passed
            details: One authored source-less positive example and three isolated controlled-invalid examples validate the initial contract. Two registered text views are deterministic non-normative projections and cannot override structured JSON.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: Typed target-neutral and target-aware projection
            result: passed
            details: Public model 1.0.0 types and producers project exact normalized Semantic IR, foundational facts, structural facts, safety evidence, diagnostic provenance, completed capability evaluation, and portability planning. DiagnosticGeneration now retains the exact private semantic-program identity so same-ID cross-program evidence reuse is rejected. CompileResult 1.0 remains unchanged and whyNoMatch remains out of scope.
          - check: Complete local semantic evidence
            result: passed
            details: Focused Rust tests cover all 12 Semantic IR node kinds, capture/reference linkage, source-less and source-backed provenance, explicit leading-consumption unknowns, safety-versus-advice evidence classes, deterministic serialization, Simply/Semantic IR convergence, and native/equivalent target projection.
          - check: Contract fixture fingerprint correction
            result: passed
            details: The authored literal fixture placeholder digest was corrected to canonical semantic SHA-256 03a02b576d3128f3f253a86bc98897c9e6d4ff0b8e60ea7786547ce4d483536d. Controlled-invalid copies stayed isolated and both registered non-normative renderings were regenerated through the registered generator.
          - check: Enforced architecture and public surface
            result: passed
            details: Core contract mapping registers the explanation consumer in dependency order; a projection-only fitness rule rejects stage reruns, frontend/target syntax, runtime I/O, emitted-pattern inference, and why-no-match scope. The additive explanation module, types, and functions are included in the enforced strling-kernel public snapshot.
          - check: Renewed migration differential
            result: passed
            details: The canonical-boundary review was renewed for the additive explanation module and private diagnostic identity evidence. Three repeated runs retained 44 historical observations, zero blocking unresolved replacements, zero determinism mismatches, and the unchanged full-corpus fingerprint sha256:feedb6435b8b61ae6a004484feca0f0b23b6e578234f8ffc8daeca9eb0f04300.
          - check: CP3 local proof gate
            result: passed
            details: Rust all-target tests and rustfmt passed; 41 focused core/public-contract tests passed; the explanation contract certified schemas=1, positive=1, negative=3 with fingerprint sha256:6831dc6ae1ddc65cd06016f5e60f4907926e5c4c33d7e6d465e7d3adae3b0d6b; two registered renderings reproduced fingerprint 65def9f16ad8ea677f3a4c3f7176f9c0b4d8705db30978b20074679d5b5a1abc; core mappings=11 and fixtures=116, the selected strling-kernel public snapshot, governance, patch integrity, and migration differential all passed.
    - name: Integration and certification
      status: planned
      evidence: []
