change_classification:
    semantic_change:
        level: compatible
        evidence:
            - Go, Dart, and Swift facades consume existing canonical compiler, frontend, target, diagnostic, Simply, standard-library, and interop contracts and are forbidden from creating or modifying semantics.
            - CP1 changes no product source or semantic contract; later checkpoints may remove local semantic copies without changing canonical helper identities, lexical_shape guarantees, edge cases, or the zero-semantic-validator disposition.
            - The CP3 canonical-registry and audit edits correct obsolete implementation/test references only; registered helpers, parameters, variants, lexical_shape guarantees, canonical forms, edge cases, portability meanings, and the zero-semantic-validator disposition are unchanged.
        affected_surfaces: []
    public_api_change:
        level: breaking
        evidence:
            - The task introduces curated native clients plus Go, Dart, and Swift canonical compile and Simply facades.
            - Binding-owned AST/IR/parser/compiler/emitter/validator/hint/diagnostic implementation APIs and targetless regex conveniences are explicit breaking retirement candidates.
        affected_surfaces:
            - dart-public-api
            - go-public-api
            - swift-public-api
    schema_change:
        level: additive
        evidence:
            - CP2 may add only subordinate migration evidence and public-extraction configuration; canonical compiler, frontend, standard-library, target, and interop schemas remain unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: intentional-correction
        evidence:
            - Retiring host hint and diagnostic synthesis removes binding-owned meanings; canonical diagnostics and stable interop error identities cross each boundary unchanged.
        affected_surfaces:
            - dart-public-api
            - go-public-api
            - swift-public-api
    target_behavior_change:
        level: intentional-correction
        evidence:
            - Retiring local PCRE2 emitters and implicit regex compilation makes target artifacts require an exact canonical target profile and removes silent host target selection.
        affected_surfaces: []
    architecture_change:
        level: intentional-correction
        evidence:
            - Go cgo, Dart FFI, and Swift C interop become semantic-free transports over strling.c-abi v1; architecture gates retire thirty product semantic-copy paths and every fallback execution route.
        affected_surfaces: []
    generated_output_change:
        level: intentional-correction
        evidence:
            - CP2 registers and reproduces one closed Go/Dart/Swift evidence bundle containing the schema, manifest, immutable source baseline, exact public/package inputs, semantic-copy denominator, and unavailable toolchain observations.
            - CP3 derives Go, Dart, and Swift Essential/Simply helper facades from the canonical registry; generated host sources contain helper identities and request recipes but no regex or validator semantics.
            - Later lockfile, public snapshot, release-graph, or compatibility projection changes must remain derived, declared, and verified through their registered generators.
        affected_surfaces:
            - dotnet-stdlib-surface-projections
            - go-dart-swift-adapter-migration-baseline
            - go-dart-swift-stdlib-surface-projections
            - jvm-stdlib-surface-projections
            - public-contract-snapshots
            - stdlib-compatibility-projections
            - stdlib-surface-projections
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Go/Dart/Swift migration evidence contract
      command: python tooling/go_dart_swift_adapter_certification.py --check --json
      expected_result: The closed public, lifecycle, platform/toolchain, package, conformance, historical, and deletion denominator validates without shrinkage.
    - name: Focused ecosystem builds and tests
      command: ./strling test go && ./strling test dart && ./strling test swift
      expected_result: Every available declared toolchain row passes its adapter API, marshaling, lifecycle, error, Simply, and canonical parity suite; unavailable rows are reported exactly.
    - name: Exact public contracts
      command: python tooling/public_contracts.py --check --surface go-public-api --surface dart-public-api --surface swift-public-api --json
      expected_result: Generated Go, Dart, and Swift public snapshots reproduce exactly with every intended compatibility change classified.
    - name: Architecture and generated authority
      command: python tooling/governance.py && python tooling/generated_artifacts.py --check --artifact go-dart-swift-adapter-migration-baseline --artifact public-contract-snapshots
      expected_result: Each product uses only its declared bridge, no semantic copy or fallback route remains, and affected generated families reproduce.
    - name: Cross-binding and migration differential
      command: python tooling/go_dart_swift_adapter_runtime.py --json --repeat-runs 3 && python tooling/migration_differential.py --repeat-runs 3
      expected_result: Executed Go, Dart, and Swift rows preserve canonical result identity and the guarded migration differential has no unreviewed blocking replacement.
    - name: Repository profiles
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full
      expected_result: Every applicable T06 operation passes and every unrelated failure or unavailable runtime is recorded exactly.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository, source, public, package, and toolchain starting boundary
            result: passed
            details: >-
                Starting anchor b6cefe0add189d687f7c2940f4a505621c60c8e4 is clean on architecture/v4. The exact 204-entry Go/Dart/Swift tree fingerprints to sha256:54fa3801fd073a0fb40ea237caed831fa66f414e69ab25ca195f0cf4f5f84b49. Thirty-two production sources contain 10,409 lines and fingerprint to sha256:f0eb3565445bd4d60a404163730fdd7399db5ee153f985c96a118f7732248f04. Thirty-three test sources contain 8,438 lines. The 30-path product semantic footprint contains 10,400 lines and fingerprints to sha256:f29f0f92d66da3ba6ecdc691a43e75ac7452e0f28aa5a608ef454455de81f674.
          - check: Ecosystem bridge, compatibility, lifecycle, platform, and semantic-ownership lock
            result: passed
            details: >-
                Go selects a cgo OS-loader shim with a fail-closed no-cgo path; Dart selects dart:ffi DynamicLibrary on VM/native only; Swift selects a semantic-free C-interop loader target. All consume strling.c-abi v1 through caller-supplied absolute paths, verify ABI before execution, enforce strict bounded UTF-8/JSON transport, free every response through the matching symbol, preserve canonical data, and make no ambient-load, web, package-publication, or unexecuted-platform claim.
          - check: Starting public and execution evidence availability
            result: passed
            details: >-
                Package identities and version/toolchain ranges are frozen as compatibility inputs. The Go snapshot has 135 declarations but cannot reproduce because Go is absent. Dart and Swift extraction remain transitional with no snapshots. Go, Dart, and Swift executables are all absent on this Windows host, so no task-start build, test, analyzer, symbolgraph, native runtime, or platform row is represented as passing or failing.
          - check: CP1 authority, documentation, governance, formatting, and patch integrity
            command: python tooling/governance.py && python -m unittest tooling.tests.test_governance tooling.tests.test_governance_contracts -q && python tooling/documentation_integrity.py --json && python tooling/formatting.py repository --check && git diff --check
            result: passed
            details: >-
                The active task record declares exactly the five CP1 files, zero generated outputs, future permitted generated families, all five verification levels, the full product migration scope, and forbidden semantic authorities. Forty-eight governance contract and architecture unit tests pass with isolated host temporary directories. Documentation integrity validates 195 files and seven examples; repository formatting, whitespace integrity, and the full governance contract, scope, change-declaration, and enforced architecture hardgate pass.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed contract, replacement, and removal denominator
            command: python tooling/go_dart_swift_adapter_certification.py --check --json
            result: passed
            details: >-
                Seventeen canonical compiler, Simply, interop, standard-library, and pcre2-10.43 inputs fingerprint to sha256:dd405b69ec8f763c0a4e275247c59276a237286b92530ae5973ac92d011dc9d1. The manifest fingerprints to sha256:d29c3241e652cbb9cd005dcb5f8643addfcc9d3e7f962b88c36c04e171396c9e and freezes 78 cases across twelve families, eleven runners, four operations, three bindings, and three exact toolchain ranges.
          - check: Immutable task-start source and semantic-copy baseline
            command: python tooling/go_dart_swift_adapter_certification.py --write-evidence --check --json && python tooling/generated_artifacts.py --check --artifact go-dart-swift-adapter-migration-baseline
            result: passed
            details: >-
                The registered generated evidence bundle reproduces from immutable b6cefe0a with baseline fingerprint sha256:3b067e29c645ae61aa86e5c56ca9ea094abd00e7a347dc2ab4dfa0f24aeeae67. It embeds all 204 task-start files as hash-checked base64, freezes 36 public/build/package/lock inputs, and individually authenticates all 30 semantic-copy paths outside every product package graph.
          - check: Shrinkage, substitution, observation, and materialization resistance
            command: python -m unittest tooling.tests.test_go_dart_swift_adapter_certification -v
            result: passed
            details: >-
                Nine tests reject case-count edits, case substitution, unavailable-observation promotion, semantic-path substitution, source mutation after editable hash recomputation, schema shrinkage, and source materialization mismatch while checking canonical manifest and baseline fingerprints.
          - check: Task-start toolchain and public evidence disposition
            result: passed
            details: >-
                Go >=1.22,<1.23, Dart >=3.0,<4.0, and Swift >=5.9,<7.0 are closed platform-matrix inputs. All executables remain unavailable on this Windows host and all test counts remain null. The existing 135-declaration Go snapshot is historical public input; Dart and Swift remain transitional until their governed analyzer and normalized symbol-graph extractors execute in CP3/CP4.
          - check: Post-migration public and generated Essential authority
            result: passed
            details: >-
                Go retains go-doc extraction; Dart requires analyzer-backed export reachability; Swift requires normalized symbol graphs. All snapshots use the governed public-contract envelope and cannot pass without their toolchain. Essential/Simply projections are generated from the canonical registry and may project only names, variants, parameters, documentation, and canonical request recipes; the five lexical_shape helpers, eight variants, 117 edges, and zero semantic validators cannot change.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: Canonical semantic ownership and generated helper authority
            command: python tooling/go_dart_swift_adapter_certification.py --write-evidence --check --json && python tooling/generated_artifacts.py --check --artifact go-dart-swift-adapter-migration-baseline
            result: passed
            details: >-
                All 30 frozen product semantic-copy paths are absent. The 78-case closed migration evidence reproduces with contract fingerprint sha256:fd7b8a81a6d3111e023c65e86690de63658442dd514f9be6906f42e309c8d719, evidence fingerprint sha256:adf3e3cd2809f3b0ac8653917e36555cd6b805f7668fd863a45d982f959fbe35, and unchanged task-start baseline sha256:3b067e29c645ae61aa86e5c56ca9ea094abd00e7a347dc2ab4dfa0f24aeeae67. The five lexical_shape helpers, eight variants, 117 edge records, and zero semantic validators remain canonical-registry facts; host projections contain request recipes but no regex or validator semantics.
          - check: Authorized canonical reference repair and registered regeneration
            command: python tooling/stdlib_registry.py --check && python -m tooling.stdlib_surfaces --check && python -m tooling.jvm_stdlib_surfaces --check && python -m tooling.go_dart_swift_stdlib_surfaces --check && python -m tooling.dotnet_stdlib_surfaces --check
            result: passed
            details: >-
