          - check: Governed public contracts and package facades
            command: python tooling/public_contracts.py --check --surface go-public-api --surface dart-public-api --surface swift-public-api --surface python-public-api --surface typescript-public-api --json
            result: passed
            details: >-
                Go 1.22.12 go-doc, Dart 3.4.4 analyzer export reachability, Swift 6.2.1 product-only symbol graphs, and the authorized Python/TypeScript fingerprint-only snapshots reproduce exactly. Live extraction exposed and fixed analyzer package-config routing and Swift product-only symbol extraction without changing any adapter API beyond the declared intentional migration break.
          - check: Native lifecycle, hostile transport, and clean-consumer execution
            command: python tooling/go_dart_swift_adapter_runtime.py --json --repeat-runs 3 && python tooling/go_dart_swift_adapter_package.py --json
            result: passed
            details: >-
                Linux executes all three adapters, four canonical operations, five hostile ABI/transport probes, and three deterministic repeat runs at result fingerprint sha256:181345f6c2d0623eac75c7b2074defb59b2bfffaeff3de8e2eea39db195086e5. Clean consumers pass. Go and Swift release graphs have no external dependencies; Dart has ffi 2.1.3 and path 1.9.0 as runtime dependencies while analyzer 6.4.1 remains dev-only. Standalone Go, Dart, and Swift tests pass; their intentionally skipped standalone hostile probes are executed by the shared runtime certifier.
          - check: Focused implementation, architecture, generator, public-contract, and routing tests
            command: python -m unittest tooling.tests.test_go_dart_swift_adapter_certification tooling.tests.test_go_dart_swift_adapter_architecture tooling.tests.test_go_dart_swift_adapter_package tooling.tests.test_go_dart_swift_adapter_runtime tooling.tests.test_go_dart_swift_stdlib_surfaces tooling.tests.test_public_contracts tooling.tests.test_quality -q
            result: passed
            details: >-
                The governed Linux environment passes 115 focused tests. They cover evidence mutation resistance, semantic-copy deletion, strict bounds/UTF-8/duplicate-key decoding, symbol allowlists, fail-closed no-cgo behavior, clean-consumer identities, exact toolchain ranges, deterministic helper generation, public-contract classification, and profile routing. Formatting and git diff --check pass. Local/Pull Request/Full aggregate profiles remain CP4 work and are not claimed by this checkpoint.
