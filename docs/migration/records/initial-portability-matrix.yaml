record_version: 2.0.0
title: Initial evidence-backed cross-engine portability matrix
status: in_progress
objective: Derive a deterministic machine-authoritative feature, requirement, vector, and exact-profile portability matrix from the fixed specification-authored shared corpus and preserved exact-engine observations; classify every representation or semantic divergence explicitly; block unresolved differences; generate a human summary; and integrate the matrix gate into Full and Release without changing language, target, product, binding, package, version, or publication behavior.
