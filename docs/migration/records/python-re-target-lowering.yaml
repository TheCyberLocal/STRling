    next_task: Begin P11-T04 by implementing deterministic Python re serialization and exact CPython execution certification from the completed structured lowering plan, without moving capability or rewrite policy into the serializer.
    rationale: P11-T03 is complete with a fully evidenced CPython re 3.11 profile, independent deterministic lowering, explicit str/bytes and unsupported boundaries, exact rewrite/provenance retention, comprehensive test and architecture proof, reviewed migration-baseline renewal, and zero failed profile operations. Only inherited host-tool availability carries forward.
