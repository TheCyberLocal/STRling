required_verification:
    - name: Complete Python profile and structured lowering matrix
      command: cargo test --manifest-path core/Cargo.toml --test target_contracts --test capability_profile_fixtures --test python_re_lowering --locked
      expected_result: The complete capability vocabulary validates with one immutable profile fingerprint and every admitted Semantic IR variant lowers explicitly with exact pattern kind, options, captures, provenance, requirements, and deterministic target structure.
    - name: Generated and negative properties
      command: cargo test --manifest-path core/Cargo.toml --test python_re_lowering_properties --locked
      expected_result: Generated nested and interacting programs are deterministic and immutable; bytes/Unicode conflicts, stale profiles/plans, unsupported or unresolved requirements, malformed rewrites, capture failures, target mismatches, and resource limits fail closed without panic.
    - name: Architecture and complete kernel quality
      command: python3 -m unittest tooling.tests.test_python_re_lowering_architecture; cargo test --manifest-path core/Cargo.toml --all-targets --locked; cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings
      expected_result: Architecture mutations prohibit historical Python authority, peer-target reuse, policy recomputation, serialization/runtime/product dependencies, and target-neutral reverse dependencies; all kernel tests and warning-denied Clippy pass.
    - name: Repository certification
      command: python3 tooling/core_contract_validation.py; python3 tooling/public_contracts.py --check; python3 tooling/generated_artifacts.py --check; python3 tooling/governance.py; python3 tooling/documentation_integrity.py; python3 tooling/migration_differential.py --repeat-runs 3; ./strling profile local; ./strling profile pull-request; git diff --check
      expected_result: Every available hardgate passes, reviewed exact profile and boundary evidence is current, host-only gaps remain unavailable without waiver, and the final committed tree is clean.
checkpoints:
    - name: Python authority, profile, applicability, and architecture inventory
      status: passed
      evidence:
          - check: Official CPython re 3.11 target authority
            result: passed
            details: The official re syntax documents str/bytes separation; greedy, lazy, and 3.11 possessive quantifiers; 3.11 atomic groups; lookahead; fixed/common-width lookbehind; captures and references; absolute and line anchors; built-in character classes; Unicode str behavior; flags; and the absence of Unicode property escape syntax. Historical Python code is non-normative migration evidence only.
          - check: Governed profile completion gap
            result: passed
            details: The current revision 1.1.0 profile has only five capability facts. This task must enumerate the full canonical vocabulary, retain required python.pattern_kind=str, and renew exact authored references before lowering may claim complete coverage.
          - check: Independent target boundary
            result: passed
            details: PCRE2 and ECMAScript prove the neutral input, validation, rewrite, provenance, and fail-closed pattern, but their types, syntax assumptions, serializers, runtimes, and implementations are prohibited dependencies. Python lowering will consume only neutral contracts and retain Python-specific pattern-kind, option, position, class, repetition, capture, and assertion distinctions for P11-T04.
    - name: Complete governed Python profile and structured lowering
      status: passed
      evidence:
          - check: Exact CPython re 3.11 profile
            result: passed
            details: Revision 1.2.0 enumerates all eighteen canonical capabilities, records Python Unicode property escapes and variable-length lookbehind as unavailable, preserves native atomic and possessive support, requires python.pattern_kind=str, and fingerprints as sha256:55e7f0bc93e2192d5f09f6c4ef65b6bff0dc831571059d80edf9b8b661f80a6c. Authored profile references and the conformance manifest were renewed exactly.
          - check: Independent structured lowering
            result: passed
            details: python_re_lowering consumes only canonical Semantic IR, an exact CPython target profile, and the completed portability plan. It emits a closed Python-specific operation tree with pattern kind, typed runtime options, captures, requirements, rewrites, node/source provenance, native possessive and atomic structure, and stable STRL-PYTHON_RE_LOWERING-0001 through 0015 failures; it does not emit regex text, construct artifacts, call Python, or reuse peer target output.
    - name: Deterministic, negative, property, and architecture proof
      status: passed
      evidence:
          - check: Focused and generated lowering proof
            result: passed
            details: Ten focused lowering tests and two property tests pass. They cover every Semantic IR variant, all four lookaround forms and seven positions, captures/references, Unicode and ASCII class domains, greedy/lazy/possessive repetition, atomic groups, exact options, str/bytes applicability, certified rewrite retention, immutable inputs, deterministic output, stale evidence, malformed plans and rewrites, unsupported/unknown requirements, capture corruption, and depth limits across 196 generated valid programs and 64 generated cross-program rejections.
          - check: Complete kernel and architecture regression
            result: passed
            details: All 318 all-target Rust tests pass. The complete canonical profiles now produce zero unknown generated capability requirements; 2,048 generated plan invocations retain 64 certified rewrites, zero unresolved requirements, and 160 genuine profile-differential programs. Eight controlled Python lowering architecture tests and all 83 architecture suites reject policy recomputation, peer-target reuse, serialization/runtime/product dependencies, ambient state, legacy Python authority, reverse dependencies, and direct callers.
          - check: Reviewed migration differential renewal
            result: passed
            details: Under the verified official Node v22.23.2 Linux x64 binary, three repeated runs have zero mismatches. Only the canonical boundary changed, to sha256:7aac6d8221aa03b0b978b1cfe8047ea1a2ccbc344ac05d661e76adba153913a0; corpus, route, source-observation, historical-peer, and contract fingerprints remain unchanged. The reviewed baseline fingerprint is sha256:58358b3edb3bcde30a07eb2bbabe1c35860bffb0f81ebf0bda355f085a9c6461.
