                The checked evidence reproduces at SHA-256 075ee5aebf4a83c0390f53e1b39a6b82409f7ac7b0b8d4384aa958ffc7a84d6e with exactly 117 records: forty audited, sixty compatibility, and seventeen stress. The first exact run exposed PCRE2 depth-limit error -53 on the 10,000-byte oversized email case; the harness now sets the bounded 100,000 certification depth limit and rejects every PCRE runtime error instead of misclassifying it as a nonmatch, with two controlled regression tests.
