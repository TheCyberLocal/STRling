    next_task: Begin P14-T04 by generating all public standard-library binding and adapter surfaces exclusively from the closed five-helper, eight-variant canonical registry without duplicating semantic implementations.
    rationale: P14-T03 is complete with one canonical Rust semantic implementation, a closed zero-validator guarantee boundary, exact two-pass five-profile runtime evidence, deterministic migration certification, and every task-owned hardgate passing. Only explicit inherited Windows host and dependency-risk limitations carry forward.
