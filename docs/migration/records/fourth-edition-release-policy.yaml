record_version: 2.0.0
title: Fourth Edition version, support, and release policy
status: in_progress
objective: Ratify one authoritative STRling 4.0.0 product identity, coordinated implementation-package versions, evidence-bounded support tiers, exact target/runtime/platform claims, immutable release channels, compatibility and deprecation guarantees, an explicit release evidence lifecycle, owner-only publication, and independent post-publication verification without changing package versions or publishing artifacts.
