record_version: 2.0.0
title: Property, fuzz, sanitizer, and mutation certification
status: in_progress
objective: Institutionalize deterministic, bounded, machine-readable deep-quality certification for STRling 4.0 across canonical compiler properties, hostile parser and protocol inputs, target serialization, native and interop memory safety, and focused critical-logic source mutation without creating new semantic authority or weakening explicit profile and environment dispositions.
