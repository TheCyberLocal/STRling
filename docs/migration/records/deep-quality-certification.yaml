change_classification:
    semantic_change:
        level: none
        evidence:
            - Property, fuzz, sanitizer, and mutation runners test behavior delegated by existing specifications and contracts; they cannot define or revise STRling semantics, expected target behavior, or diagnostic meaning.
    public_api_change:
        level: none
        evidence:
            - Product packages, binding APIs, compiler protocols, C and C++ headers, and consumer-visible support promises remain unchanged; new fuzz binaries are publish-false testing infrastructure only.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - CP2 adds one engineering-only Draft 2020-12 schema for the authored deep-quality manifest and structured certification result; no product, compiler, protocol, target, or binding schema changes.
            - CP4 requires every source-mutant record to authenticate its killing test sources, closing an evidence-identity gap without changing any product schema or runtime contract.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Existing diagnostic identities and structured failures are test observations; no diagnostic catalog or projection changes.
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, lowerers, serializers, engine harnesses, and portability expectations remain unchanged and read-only under this task.
    architecture_change:
        level: additive
        evidence:
            - Adds a verification-only boundary that aggregates existing properties and separately exercises bounded core fuzz, native sanitizer, and critical-source mutation obligations while preserving P17 interop certification as its own producer.
    generated_output_change:
        level: compatible
        evidence:
            - The first CP4 integration anchor changed the canonical Full-profile identity. After a clean governed Full execution exists, CP4 captures its minimized registered source bundle and regenerates only the target-adapter-certification-matrices JSON and Markdown projections; no target or adapter claim is manually edited.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Deep-quality schema, manifest, and fail-closed mutations
      command: python3 -m unittest tooling.tests.test_deep_quality_certification -v
      expected_result: Exact property, fuzz, sanitizer, and source-mutation obligations validate with fixed seeds, budgets, criticality-specific thresholds, environment identities, evidence fingerprints, and rejection of missing, duplicate, stale, reordered, shrunk, fabricated, or threshold-bypassing evidence.
    - name: Verification-only architecture and generated ownership
      command: python3 -m unittest tooling.tests.test_deep_quality_certification_architecture tooling.tests.test_quality tooling.tests.test_governance -v && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py
      expected_result: The certifier consumes existing authority, writes only registered evidence, keeps mutation work in isolated temporary copies, preserves the P17 interop denominator, and cannot alter product semantics, public APIs, support policy, packages, release graphs, or external regex-engine evidence.
    - name: Property, fuzz, sanitizer, and critical-logic mutation execution
      command: python3 -m tooling.deep_quality_certification --profile pull-request --json && python3 -m tooling.deep_quality_certification --profile full --json
      expected_result: Deterministic compiler and binding properties pass; bounded libFuzzer targets cover Semantic DSL, legacy regex, protocol decoding, normalization and analysis, target serialization, and hostile host data; governed native/interop sanitizer cases pass; and each criticality class meets its declared mutation kill policy without unexplained survivors.
    - name: Repository profiles and exact dispositions
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: Local retains fast offline contract feedback, Pull Request runs deterministic property and bounded mutation proof, Full and scheduled Linux add bounded fuzz and sanitizer execution, machine-readable results remain complete, and unrelated recorded profile findings are not promoted to passes.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and campaign reconciliation
            result: passed
            details: P18-T03 starts from clean architecture/v4 anchor 8452637281b61f576f4eeaa66eacfbb010bf6770 after P18-T02 closed READY WITH RECORDED CARRY-FORWARD. Notion P18-T03 is In Progress with normalized CP1 through CP4 and FINAL children.
          - check: Existing deterministic property denominator
            result: passed
            details: The canonical Rust kernel already contains 21 dedicated properties.rs integration suites with 58 test entrypoints, and interop adds three property entrypoints. They cover fixed-seed normalization, semantic and structural analysis, capability and portability planning, compiler boundaries, Semantic DSL and Simply frontends, diagnostics, explanation and conversion, and PCRE2, ECMAScript, and Python re lowering and serialization. The ordinary core test operation executes them, but no structured producer currently reports their exact deep-quality obligations.
          - check: Existing adversarial and memory-safety denominator
            result: passed
            details: P17 owns a frozen 77-case interop contract and a separate Full/Release adversarial producer with six cargo-fuzz targets, 10,000 fixed-seed runs per target, Rust ASan and LSan execution, and raw-WASM host-memory lifecycle certification on x86_64 Linux. T03 consumes that evidence without changing its manifest, cases, runtime implementation, or recorded denominator.
          - check: Exact task gaps and profile partition
            result: passed
            details: No governed source-mutation engine or kill score exists, core parser/normalization/analysis/serializer trust boundaries have no dedicated libFuzzer targets, C and C++ integration lacks governed ASan/UBSan execution, and deep-quality evidence is not centrally structured. Local will retain fast offline contract checks; Pull Request will add deterministic property and bounded critical-mutation proof; Full and scheduled Linux will add bounded core fuzz, native sanitizers, and the complete mutation policy.
          - check: Ownership and carry-forward boundary
            result: passed
            details: New fuzz targets remain publish-false testing infrastructure under the existing fuzz-only dependency root. Mutation executes only against isolated temporary source copies. Product semantics, core implementation, binding runtime sources, public APIs, packages, target profiles, support tiers, publication, release, upload, push, and external regex-conformance research are forbidden. P18-T02's F#, Python, and repository dependency-risk dispositions retain their recorded later owners.
          - check: Task-record and checkpoint proof
            result: passed
            details: A clean ephemeral Linux checkout validates the four-file CP1 diff, task-record schema, exact scope, change declarations, and every enforced architecture rule. All eleven governance-contract tests pass; documentation integrity validates seven executable examples and links across 201 files; host repository formatting and patch integrity pass. The complete host generated sweep is not claimed because its unrelated .NET extractor scratch directory is denied by the Windows sandbox; CP1 changes no registered generator input or output.
    - name: Verification design and evidence contract
      status: passed
      evidence:
          - check: Versioned manifest and structured evidence schema
            result: passed
            details: >-
                The Draft 2020-12 schema separately validates an authored deep-quality manifest and certification-result-v1 evidence. The positive evidence file is explicitly synthetic-contract-fixture, uses a zero commit identity, and states that it is not live task evidence; the controller never promotes it to execution proof. Manifest fingerprint is 14690c765704c433d5a4dd023d5b75c0d8eaf9cdea56c0cbb35fcd0dae072cff.
          - check: Property and trust-boundary denominator
            result: passed
            details: >-
                Fourteen ordered property obligations authenticate sixteen unique existing Rust test sources covering Semantic DSL round trips, legacy import, normalization, semantic and structural analysis, source spans, compiler determinism, three target serializers, portability, explanation/migration, Simply host data, and interop serialization. Source fingerprints, commands, invariants, IDs, order, and PR/Full membership fail closed.
          - check: Bounded fuzz corpus and sanitizer design
            result: passed
            details: >-
                Eleven fuzz targets are closed: six active P17 companions remain on certification.interop-adversarial and five planned T03 core targets belong to certification.deep-quality-full. Every target fixes 10,000 runs, one of two stable seeds, 16,384-byte input ceiling, 10-second timeout, and 4,096 MiB RSS ceiling. Regression retention is minimized and capped at 64 files / 1 MiB. Four sanitizer cases preserve inherited Rust ASan/LSan and WASM memory proof while planning separate C and C++ ASan/UBSan runs on x86_64 Linux.
          - check: Criticality-specific source mutation contract
            result: passed
            details: >-
                Fourteen exact source mutants cover normalization, capability evaluation, portability aggregation, safety diagnostics, three target lowerers, equivalence/rewrite authority, and product certification aggregation. Eight are Critical and six High; both classes require 10,000 basis-point kill rates and zero survivors. Pull Request runs seven representative Critical mutants; Full runs all fourteen. Exact source hashes, source tokens, occurrence, killing commands, and profile membership are locked before runner implementation.
          - check: Fail-closed contract and architecture proof
            result: passed
            details: >-
                Ten focused controller/architecture tests pass. Twelve controlled single-delta mutations reject property/fuzz denominator shrinkage, stale source hashes, premature planned-source activation, PR mutation shrinkage, threshold weakening, stale mutation tokens, corpus-budget expansion, fingerprint tampering, false aggregate status, and evidence-summary drift. The controller imports no product implementation or network client, P17 evidence remains a companion, and task scope forbids product source changes.
          - check: Clean evidence-contract integration proof
            result: passed
            details: >-
                A clean ephemeral Linux clone validates the eleven-path task diff from 8452637281b61f576f4eeaa66eacfbb010bf6770, task-record schema, exact scope, change declarations, and every enforced architecture rule. Twenty-one focused deep-quality and governance-contract tests and the broader 93-test quality/governance suite pass. Documentation integrity validates seven executable examples and links across 202 files; repository formatting and patch integrity pass.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: Active bounded fuzz and sanitizer implementation
            result: passed
            details: >-
                Five publish-false fuzz binaries now exercise Semantic DSL parsing and formatting, legacy-regex import, compiler-protocol decoding and compilation, normalization plus semantic and structural analysis, and profile-routed target serialization. Each target authenticates one bounded canonical seed and executes in a fresh temporary corpus. All eleven fuzz binaries build with pinned cargo-fuzz 0.12.0 and Rust nightly-2024-12-20; the five new targets each pass a 100-run smoke execution. The fuzz dependency set remains unchanged at libfuzzer-sys 0.4.13, the governed Cargo lockfile is unchanged, and locked offline Cargo metadata resolves successfully.
          - check: Deterministic deep-quality controller
            result: passed
            details: >-
                The controller implements Local contract proof, Pull Request property and representative mutation execution, and Full property, fuzz, native sanitizer, and complete mutation execution. Mutation work uses a temporary copy of tracked repository files, fuzz uses an isolated temporary corpus, and C/C++ ASan plus UBSan builds use temporary CMake trees. Non-Linux Full execution emits explicit unavailable rows rather than fabricated passes. Fourteen focused contract and architecture tests and twelve controlled fail-closed mutation fixtures pass.
          - check: Property and mutation execution
            result: passed
            details: >-
                A live working-tree Pull Request replay against manifest sha256:2a12456f586915f0de411c6a9eac85311e8af3fc70308783c5d4cf1341e78b0b passes all 22 checks in 197,787 ms: the manifest contract, fourteen property obligations, and seven representative Critical source mutants. There are zero survivors. The deterministic check-status fingerprint is sha256:24d6bd82947df9769207e5ac78305a277179b7c0e733d3eca9e2af3e1f0afa99 and evidence fingerprint is sha256:ed65b1be83d1c421199f49c7244101eb75c6505c5c69bc967493034341220e83.
          - check: Survivor-driven test strengthening
            result: passed
            details: >-
                The first complete Pull Request attempt exposed two real test-denominator gaps rather than being promoted to a pass. Existing private safety-result tests are now included in the safety mutant command, and the PCRE2 property suite explicitly proves that lowerer case-matching preserves global intent. Focused isolated reruns kill both mutants, and the final complete replay has no failed, unavailable, or surviving obligation.
          - check: Clean integration and canonical ownership proof
            result: passed
            details: >-
                A clean ephemeral Linux checkout passes 103 deep-quality, quality, governance-contract, and architecture tests; documentation integrity validates seven executable examples and links across 202 files; all enforced architecture rules pass; Rust formatting, locked metadata, and patch integrity pass. The host repository-format operation also passes. Generated-artifact matching classifies the fuzz Cargo manifest only in the transitional package-manager-lockfiles family, which has no registered generator or verification command. No command is invented: its lockfile remains unchanged and locked offline metadata is the exact local proof. The host governance command is not claimed because an unrelated historical Swift .build/debug symlink is unreadable on Windows; the clean Linux result is authoritative for this diff.
    - name: Integration and certification
      status: in_progress
      evidence:
          - check: Canonical cumulative profile routing
            result: passed
            details: >-
                Local 1.10.0 registers certification.deep-quality-local; Pull Request 1.15.0 preserves Local and adds certification.deep-quality-pull-request; Full and Release 1.21.0 preserve both cheaper tiers and add certification.deep-quality-full. Scheduled Linux already routes through Full. The canonical profile-order validator passes without a workflow-owned implementation.
          - check: Product-certification closure and bootstrap disposition
            result: passed
            details: >-
                Product authority closes exactly 116 Full results and 23 structured producers under Full fingerprint b426ef6fd5eb23fe662f5e3e0a78b871e1134145bfaffd459f581970b51bf7bc, Release fingerprint cb1f7ca00427eb3b93d636b160679fa9d3ca3345ba4780d016f24780ca27d142, and producer-manifest fingerprint 3e4df556c443de0dec57c1b6897411874fe68ea3d3ed243c6b85a95e819e3cbe. Eighty-seven routing, product, and deep-quality tests pass with clean staged-scope governance and all architecture rules. The target-adapter source bundle remains explicitly stale because it cannot truthfully claim the new Full identity until that profile runs from a clean integration commit. Other aggregate generated-check failures in the disposable clone are unchanged missing-tool dispositions for .NET, Dart, Go, Swift, TypeScript, and Prettier; the target-adapter stale-profile result is the sole source-identity bootstrap gap.
          - check: First clean Full execution and exact survivor disposition
            result: failed
            details: >-
                The first governed native-Linux Full execution completed honestly at the clean 7c04d1173af68a47413eea01accaacfc51a0a919 anchor: 85 repository operations passed, 25 failed, and 6 were unavailable. The task-owned deep-quality lane executed all 36 obligations; 32 passed and four Full-only source mutants survived. All five owned libFuzzer targets completed 10,000 fixed-seed runs, and both C/C++ ASan+UBSan cases passed. The exact survivors were capability-unknown (High), safety-uncertainty-dedup (High), ECMAScript case mapping (High), and Python re case mapping (Critical). The failed lane remains recorded under evidence fingerprint d6ac0f8fa5bfbab845ade002024c9b59b3c6ef18b7b0e0b468e0f359d65998c7 and check-status fingerprint d8747aef5287dd069c14054ca245a2e23cff60e3aa812a8223869ea146b8129e.
          - check: Survivor-driven Full test strengthening and evidence identity
            result: passed
            details: >-
                Four existing property suites now explicitly prove unknown capability evidence cannot be promoted, duplicate safety uncertainty is canonicalized before diagnostic projection, and ECMAScript plus Python re lowerers preserve global case intent. Ten focused pinned-Rust tests pass, and isolated execution kills all four former survivors without changing product code, semantics, diagnostics, target behavior, or public API. The manifest now authenticates every mutant's killing test sources as well as its mutated source; sixteen unique mutation-test files are fingerprinted, closing the prior identity gap. The repaired manifest fingerprint is bf1bc3a973f67300305e3a52c79f90055d5f238f73e31cc7a88b0b5252e6974f.
          - check: Clean complete deep-quality Full proof
            result: passed
            details: >-
                At exact clean commit 0f628d7d925a30d4a1c712253376d5c08a39d572, native-Linux Full passes all 36 obligations in 599,611 ms: fourteen property suites, five 10,000-run fixed-seed libFuzzer targets, two C/C++ ASan+UBSan cases, and all fourteen Critical/High mutants. Failed and unavailable counts are zero, all fourteen mutants are killed, and repository dirty is false. Check-status fingerprint is 036c82a2b4ddc547e1aee84c4656eb17ef949880845c34337cbfd6d9b23ad850; evidence fingerprint is b26c677e760046f6bb1ef544a416175dee00f7891714af68aff1f4a3caf1af54.
          - check: Registered target-adapter projection capture
            result: passed
            details: >-
                The first clean Full-profile artifact is minimized through the registered capture path into a 72-result source bundle with fingerprint 4c406d1567f1fc2d647d8aff1615ad901a0992e991b2c1e3f8d45611bd63986a. The registered generator derives and verifies 115 matrix cells under evidence fingerprint da1bc809d96ff030d716db933093f0e3fa420689cafbc18bbc797991ebbb81bf. Its aggregate honestly remains failed with 41 passed, 35 failed, and 39 unavailable cells because the bootstrap clone lacked multiple adapter/runtime prerequisites; no cell is promoted or manually edited. The generated-artifact registry command is corrected to supply the source-evidence mode already required by the controller before --write.
          - check: First clean Local profile and exact remediation
            result: failed
            details: >-
                Clean Local at ca83447ccb6227ad488cdd99dc54799dc34a5258 executed 35 operations: 33 passed and two failed. The LSP package-contract tests correctly rejected a Windows esbuild cache in the Linux clone, and repository hygiene correctly rejected the intentional five-byte target-serialization seed because its leading NUL lacked an exact binary disposition. No operation was unavailable or waived.
          - check: Local environment and fuzz-seed governance repair
            result: passed
            details: >-
                Governed offline npm ci installs the Linux LSP dependency tree from its existing lock and all 24 package-contract tests pass. The target-serialization seed remains byte-identical and is admitted only through its exact sha256 ad65ddf953b9a12e22b32a34080f645df02365f689188cd5b659200904749e2a; hygiene now passes over 2,834 tracked files with zero findings. Ten hygiene unit tests, exact task scope, declarations, all enforced architecture rules, repository formatting, and patch integrity pass.
