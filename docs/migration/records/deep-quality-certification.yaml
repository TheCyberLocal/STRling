change_classification:
    semantic_change:
        level: none
        evidence:
            - Property, fuzz, sanitizer, and mutation runners test behavior delegated by existing specifications and contracts; they cannot define or revise STRling semantics, expected target behavior, or diagnostic meaning.
    public_api_change:
        level: none
        evidence:
            - Product packages, binding APIs, compiler protocols, C and C++ headers, and consumer-visible support promises remain unchanged; new fuzz binaries are publish-false testing infrastructure only.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - CP2 adds one engineering-only Draft 2020-12 schema for the authored deep-quality manifest and structured certification result; no product, compiler, protocol, target, or binding schema changes.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Existing diagnostic identities and structured failures are test observations; no diagnostic catalog or projection changes.
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, lowerers, serializers, engine harnesses, and portability expectations remain unchanged and read-only under this task.
    architecture_change:
        level: additive
        evidence:
            - Adds a verification-only boundary that aggregates existing properties and separately exercises bounded core fuzz, native sanitizer, and critical-source mutation obligations while preserving P17 interop certification as its own producer.
    generated_output_change:
        level: none
        evidence:
            - CP1 changes no registered generated artifact; CP2 or CP3 must update this declaration and permission before registering derived deep-quality or product-certification evidence.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Deep-quality schema, manifest, and fail-closed mutations
      command: python3 -m unittest tooling.tests.test_deep_quality_certification -v
      expected_result: Exact property, fuzz, sanitizer, and source-mutation obligations validate with fixed seeds, budgets, criticality-specific thresholds, environment identities, evidence fingerprints, and rejection of missing, duplicate, stale, reordered, shrunk, fabricated, or threshold-bypassing evidence.
    - name: Verification-only architecture and generated ownership
      command: python3 -m unittest tooling.tests.test_deep_quality_certification_architecture tooling.tests.test_quality tooling.tests.test_governance -v && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py
      expected_result: The certifier consumes existing authority, writes only registered evidence, keeps mutation work in isolated temporary copies, preserves the P17 interop denominator, and cannot alter product semantics, public APIs, support policy, packages, release graphs, or external regex-engine evidence.
    - name: Property, fuzz, sanitizer, and critical-logic mutation execution
      command: python3 -m tooling.deep_quality_certification --profile pull-request --json && python3 -m tooling.deep_quality_certification --profile full --json
      expected_result: Deterministic compiler and binding properties pass; bounded libFuzzer targets cover Semantic DSL, legacy regex, protocol decoding, normalization and analysis, target serialization, and hostile host data; governed native/interop sanitizer cases pass; and each criticality class meets its declared mutation kill policy without unexplained survivors.
    - name: Repository profiles and exact dispositions
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: Local retains fast offline contract feedback, Pull Request runs deterministic property and bounded mutation proof, Full and scheduled Linux add bounded fuzz and sanitizer execution, machine-readable results remain complete, and unrelated recorded profile findings are not promoted to passes.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and campaign reconciliation
            result: passed
            details: P18-T03 starts from clean architecture/v4 anchor 8452637281b61f576f4eeaa66eacfbb010bf6770 after P18-T02 closed READY WITH RECORDED CARRY-FORWARD. Notion P18-T03 is In Progress with normalized CP1 through CP4 and FINAL children.
          - check: Existing deterministic property denominator
            result: passed
            details: The canonical Rust kernel already contains 21 dedicated properties.rs integration suites with 58 test entrypoints, and interop adds three property entrypoints. They cover fixed-seed normalization, semantic and structural analysis, capability and portability planning, compiler boundaries, Semantic DSL and Simply frontends, diagnostics, explanation and conversion, and PCRE2, ECMAScript, and Python re lowering and serialization. The ordinary core test operation executes them, but no structured producer currently reports their exact deep-quality obligations.
          - check: Existing adversarial and memory-safety denominator
            result: passed
            details: P17 owns a frozen 77-case interop contract and a separate Full/Release adversarial producer with six cargo-fuzz targets, 10,000 fixed-seed runs per target, Rust ASan and LSan execution, and raw-WASM host-memory lifecycle certification on x86_64 Linux. T03 consumes that evidence without changing its manifest, cases, runtime implementation, or recorded denominator.
          - check: Exact task gaps and profile partition
            result: passed
            details: No governed source-mutation engine or kill score exists, core parser/normalization/analysis/serializer trust boundaries have no dedicated libFuzzer targets, C and C++ integration lacks governed ASan/UBSan execution, and deep-quality evidence is not centrally structured. Local will retain fast offline contract checks; Pull Request will add deterministic property and bounded critical-mutation proof; Full and scheduled Linux will add bounded core fuzz, native sanitizers, and the complete mutation policy.
          - check: Ownership and carry-forward boundary
            result: passed
            details: New fuzz targets remain publish-false testing infrastructure under the existing fuzz-only dependency root. Mutation executes only against isolated temporary source copies. Product semantics, core implementation, binding runtime sources, public APIs, packages, target profiles, support tiers, publication, release, upload, push, and external regex-conformance research are forbidden. P18-T02's F#, Python, and repository dependency-risk dispositions retain their recorded later owners.
          - check: Task-record and checkpoint proof
            result: passed
            details: A clean ephemeral Linux checkout validates the four-file CP1 diff, task-record schema, exact scope, change declarations, and every enforced architecture rule. All eleven governance-contract tests pass; documentation integrity validates seven executable examples and links across 201 files; host repository formatting and patch integrity pass. The complete host generated sweep is not claimed because its unrelated .NET extractor scratch directory is denied by the Windows sandbox; CP1 changes no registered generator input or output.
    - name: Verification design and evidence contract
      status: passed
      evidence:
          - check: Versioned manifest and structured evidence schema
            result: passed
            details: >-
                The Draft 2020-12 schema separately validates an authored deep-quality manifest and certification-result-v1 evidence. The positive evidence file is explicitly synthetic-contract-fixture, uses a zero commit identity, and states that it is not live task evidence; the controller never promotes it to execution proof. Manifest fingerprint is 14690c765704c433d5a4dd023d5b75c0d8eaf9cdea56c0cbb35fcd0dae072cff.
          - check: Property and trust-boundary denominator
            result: passed
            details: >-
                Fourteen ordered property obligations authenticate sixteen unique existing Rust test sources covering Semantic DSL round trips, legacy import, normalization, semantic and structural analysis, source spans, compiler determinism, three target serializers, portability, explanation/migration, Simply host data, and interop serialization. Source fingerprints, commands, invariants, IDs, order, and PR/Full membership fail closed.
          - check: Bounded fuzz corpus and sanitizer design
            result: passed
            details: >-
                Eleven fuzz targets are closed: six active P17 companions remain on certification.interop-adversarial and five planned T03 core targets belong to certification.deep-quality-full. Every target fixes 10,000 runs, one of two stable seeds, 16,384-byte input ceiling, 10-second timeout, and 4,096 MiB RSS ceiling. Regression retention is minimized and capped at 64 files / 1 MiB. Four sanitizer cases preserve inherited Rust ASan/LSan and WASM memory proof while planning separate C and C++ ASan/UBSan runs on x86_64 Linux.
          - check: Criticality-specific source mutation contract
            result: passed
            details: >-
                Fourteen exact source mutants cover normalization, capability evaluation, portability aggregation, safety diagnostics, three target lowerers, equivalence/rewrite authority, and product certification aggregation. Eight are Critical and six High; both classes require 10,000 basis-point kill rates and zero survivors. Pull Request runs seven representative Critical mutants; Full runs all fourteen. Exact source hashes, source tokens, occurrence, killing commands, and profile membership are locked before runner implementation.
          - check: Fail-closed contract and architecture proof
            result: passed
            details: >-
                Ten focused controller/architecture tests pass. Twelve controlled single-delta mutations reject property/fuzz denominator shrinkage, stale source hashes, premature planned-source activation, PR mutation shrinkage, threshold weakening, stale mutation tokens, corpus-budget expansion, fingerprint tampering, false aggregate status, and evidence-summary drift. The controller imports no product implementation or network client, P17 evidence remains a companion, and task scope forbids product source changes.
          - check: Clean evidence-contract integration proof
            result: passed
            details: >-
                A clean ephemeral Linux clone validates the eleven-path task diff from 8452637281b61f576f4eeaa66eacfbb010bf6770, task-record schema, exact scope, change declarations, and every enforced architecture rule. Twenty-one focused deep-quality and governance-contract tests and the broader 93-test quality/governance suite pass. Documentation integrity validates seven executable examples and links across 202 files; repository formatting and patch integrity pass.
