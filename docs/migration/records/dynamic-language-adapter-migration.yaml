change_classification:
    semantic_change:
        level: intentional-correction
        evidence:
            - Ruby, PHP, Perl, Lua, and R facades consume existing canonical compiler, frontend, target, diagnostic, Simply, standard-library, and interop contracts and cannot create or modify semantics.
            - CP3 corrects only obsolete dynamic-language implementation and test references in the canonical standard-library registry after retiring those semantic-copy paths; helper identities, variants, lexical_shape guarantees, edge cases, and the zero-semantic-validator disposition remain unchanged.
        affected_surfaces: []
    public_api_change:
        level: breaking
        evidence:
            - The task introduces curated native clients plus Ruby, PHP, Perl, Lua, and R canonical compile and Simply facades.
            - Binding-owned AST, IR, parser, compiler, emitter, validator, hint, diagnostic, and targetless regex APIs are explicit retirement candidates.
        affected_surfaces:
            - lua-public-api
            - perl-public-api
            - php-public-api
            - r-public-api
            - ruby-public-api
    schema_change:
        level: additive
        evidence:
            - CP2 may add only subordinate migration evidence and public-extraction configuration; canonical compiler, frontend, standard-library, target, and interop schemas remain unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: intentional-correction
        evidence:
            - Retiring host hint and diagnostic synthesis removes binding-owned meanings; canonical diagnostics and stable interop error identities cross each retained boundary unchanged.
        affected_surfaces:
            - lua-public-api
            - perl-public-api
            - php-public-api
            - r-public-api
            - ruby-public-api
    target_behavior_change:
        level: intentional-correction
        evidence:
            - Retiring local PCRE2 emitters and implicit regex compilation makes target artifacts require an exact canonical target profile and removes silent host target selection.
        affected_surfaces: []
    architecture_change:
        level: intentional-correction
        evidence:
            - Ruby Fiddle, PHP FFI, Perl FFI::Platypus, Lua C module, and R registered native routines become semantic-free transports over strling.c-abi v1; architecture gates retire 83 product semantic-copy sources and every fallback route.
            - T07 records provisional certification dispositions only; permanent consumer-facing support policy remains ordered P20-T01 work.
        affected_surfaces: []
    generated_output_change:
        level: additive
        evidence:
            - CP2 registers one deterministic compatibility-baseline family whose generator owns the exact evidence schema, closed manifest, and authenticated task-start source bundle.
            - CP3 registers five lexical-helper request surfaces derived from the unchanged canonical standard-library registry; helper identities, parameters, variants, guarantees, cases, and zero-semantic-validator disposition do not change.
            - Later lock, public snapshot, and release-graph changes remain derived and verified through registered generators.
        affected_surfaces:
            - dotnet-stdlib-surface-projections
            - dynamic-language-adapter-migration-baseline
            - dynamic-language-adapter-release-graphs
            - dynamic-language-stdlib-surface-projections
            - go-dart-swift-stdlib-surface-projections
            - jvm-stdlib-surface-projections
            - package-manager-lockfiles
            - public-contract-snapshots
            - stdlib-surface-projections
            - version-synchronized-metadata
