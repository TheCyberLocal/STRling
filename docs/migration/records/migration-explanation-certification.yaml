change_classification:
    semantic_change:
        level: none
        evidence:
            - Certification observes existing canonical semantics and must route any difference back to its owning versioned contract or implementation layer.
    public_api_change:
        level: none
        evidence:
            - The task adds only test and repository-certification surfaces; production Rust and binding APIs are read-only.
        affected_surfaces: []
    schema_change:
        level: none
        evidence:
            - CP1 defines a future non-normative certification-manifest schema under tests but adds no formal schema in this checkpoint.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Existing compiler, conversion, explanation, and no-match diagnostic or reason vocabularies are immutable certification inputs.
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, planning, lowering, serialization, and observations are compared but cannot be changed by the certification harness.
    architecture_change:
        level: none
        evidence:
            - CP1 records a future offline repository hardgate without changing toolchain membership or production dependencies.
    generated_output_change:
        level: none
        evidence:
            - The task owns no generated artifact and CP1 changes no generated output.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Certification manifest and mutation contract
      command: python3 -m tooling.migration_explanation_certification --check && python3 -m unittest tooling.tests.test_migration_explanation_certification
      expected_result: The versioned non-normative manifest locks every required source identity, count, fingerprint, coverage class, mutation category, pathological case, and resource expectation and rejects shrinkage, staleness, authority changes, and altered evidence.
    - name: End-to-end canonical round-trip and explanation proof
      command: cargo test --manifest-path core/Cargo.toml --test migration_explanation_certification --locked
      expected_result: Regex-compatible imports produce canonical explanations, exact conversions reconstruct alpha-equivalent Semantic IR through Semantic STRling and Simply, partial/unsupported states retain their evidence, bounded no-match remains conservative, and controlled semantic mutations are detected.
    - name: Owning-layer and target evidence regression
      command: python3 tooling/frontend_convergence.py --check && python3 -m tooling.explanation_contract && python3 -m tooling.semantic_conversion_contract && python3 -m tooling.no_match_explanation_contract && python3 -m tooling.shared_cross_engine_corpus --verify-evidence && cargo test --manifest-path core/Cargo.toml --all-targets --locked
      expected_result: Every locked denominator and all adjacent Rust tests pass without changing an owning contract, accepted runtime observation, target profile, or production implementation.
    - name: Repository and campaign certification
      command: python3 tooling/migration_differential.py --repeat-runs 3 && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: The new hardgate participates in all canonical profiles; migration, architecture, public/generated/docs/security, patch integrity, and clean-tree checks pass or retain only explicitly recorded inherited environment limitations.
checkpoints:
