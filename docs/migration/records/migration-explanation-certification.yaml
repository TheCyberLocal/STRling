change_classification:
    semantic_change:
        level: none
        evidence:
            - Certification observes existing canonical semantics and must route any difference back to its owning versioned contract or implementation layer.
    public_api_change:
        level: none
        evidence:
            - The task adds only test and repository-certification surfaces; production Rust and binding APIs are read-only.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - The versioned schema under tests governs only non-normative campaign certification evidence and cannot define product semantics, public payloads, or generated APIs.
        affected_surfaces:
            - migration-explanation-certification
    diagnostic_change:
        level: none
        evidence:
            - Existing compiler, conversion, explanation, and no-match diagnostic or reason vocabularies are immutable certification inputs.
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, planning, lowering, serialization, and observations are compared but cannot be changed by the certification harness.
    architecture_change:
        level: additive
        evidence:
            - The task adds a versioned test-evidence island and will register one offline repository hardgate without changing production dependencies or semantic authority.
    generated_output_change:
        level: none
        evidence:
            - The task owns no generated artifact and CP1 changes no generated output.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Certification manifest and mutation contract
      command: python3 -m tooling.migration_explanation_certification --check && python3 -m unittest tooling.tests.test_migration_explanation_certification
      expected_result: The versioned non-normative manifest locks every required source identity, count, fingerprint, coverage class, mutation category, pathological case, and resource expectation and rejects shrinkage, staleness, authority changes, and altered evidence.
    - name: End-to-end canonical round-trip and explanation proof
      command: cargo test --manifest-path core/Cargo.toml --test migration_explanation_certification --locked
      expected_result: Regex-compatible imports produce canonical explanations, exact conversions reconstruct alpha-equivalent Semantic IR through Semantic STRling and Simply, partial/unsupported states retain their evidence, bounded no-match remains conservative, and controlled semantic mutations are detected.
    - name: Owning-layer and target evidence regression
      command: python3 tooling/frontend_convergence.py --check && python3 -m tooling.explanation_contract && python3 -m tooling.semantic_conversion_contract && python3 -m tooling.no_match_explanation_contract && python3 -m tooling.shared_cross_engine_corpus --verify-evidence && cargo test --manifest-path core/Cargo.toml --all-targets --locked
      expected_result: Every locked denominator and all adjacent Rust tests pass without changing an owning contract, accepted runtime observation, target profile, or production implementation.
    - name: Repository and campaign certification
      command: python3 tooling/migration_differential.py --repeat-runs 3 && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: The new hardgate participates in all canonical profiles; migration, architecture, public/generated/docs/security, patch integrity, and clean-tree checks pass or retain only explicitly recorded inherited environment limitations.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Clean phase-closing boundary and immutable owning layers
            result: passed
            details: P15-T04 begins on clean architecture/v4 closure 75b8c2b0b2ebe6a311d90ef74cc04c1efd556dbe. Existing regex import, semantic explanation, canonical conversion, bounded no-match, target evidence, and migration-differential identities are frozen as read-only denominators. Production core, bindings, packages, normative contracts, target evidence, and historical runners are prohibited change paths.
          - check: Certification pipeline, mutation inventory, and hardgate scope
            result: passed
            details: The non-normative manifest identity, exact import-to-reconstruction pipeline, alpha-equivalence retention rules, exact/partial/unsupported policy, eight required mutation categories, pathological/resource expectations, offline profile hardgate, allowed paths, rollback boundary, and Local/PR/Full acceptance profile are locked before fixture or harness implementation.
          - check: CP1 governance and documentation gate
            result: passed
            details: Governance validates the exact three-file scope-lock diff and change declarations; focused authority validators reproduce the accepted frontend, explanation, conversion, and no-match denominators; documentation formatting and git diff checks pass. No schema, corpus, test harness, toolchain membership, semantic behavior, public API, generated output, target behavior, binding, package, or product feature is changed.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Versioned certification manifest and schema
            result: passed
            details: The closed Draft 2020-12 schema validates the non-normative strling.migration-explanation-certification 1.0.0 manifest. Its canonical fingerprint is sha256:859e0dc86c01437807aeef16ef99f03244bcddbd2f6ed38661cc3a35e30f5b2e. All referenced authority and evidence paths exist, exact status requires reconstruction plus normalized alpha proof, partial retains loss and manual-decision evidence, and unsupported forbids output.
          - check: Complete joined acceptance denominator
            result: passed
            details: The manifest accounts for all nine regex-import convergence cases and both destinations (18 exact proofs), two source-only convergence cases, four conversion dispositions (exact=2, partial=1, unsupported=1), four semantic-explanation documents, all 24 no-match cases (matched=1, proven=7, likely=6, unknown=9, unavailable=1), all 20 shared target cases and 100 governed observations across five profiles, and the unchanged 44-observation migration baseline. Direct owning validators reproduce every recorded fingerprint and count.
          - check: Mutation, pathological, and target evidence design
            result: passed
            details: Eight unique controlled mutation categories cover capture relationships, branch order, repetition, semantic options, source authority, explanation evidence, conversion disposition, and authority fingerprints with named owning detectors. Nine pathological obligations cover all seven no-match guards, conversion depth 64, and the 119-evaluation no-match determinism grid. Every round-trip case maps only to registered shared target evidence, whose checked corpus contains execute=88, unsupported=5, and not_applicable=7 applications.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: Offline joined-evidence validator and canonical Rust proof
            result: passed
            details: The deterministic offline validator certifies seven owning denominators, 21 authority/evidence paths, nine regex-import cases, 18 exact destination proofs, four conversion cases, four semantic-explanation cases, 24 no-match cases, 20 shared target cases, 100 governed observations, nine pathological obligations, and all eight mutations. It rejects schema expansion, unsigned or re-signed shrinkage, stale owner fingerprints, unregistered target evidence, duplicated mutation coverage, and missing proof hooks. The corrected manifest fingerprint is sha256:5c088c046ab1720276b8582f723278c05bf836c993a0468352b518944eebd4c6.
          - check: End-to-end import, explanation, conversion, and reconstruction proof
            result: passed
            details: Three new Rust integration tests execute all nine registered regex imports, generate byte-stable semantic explanations, convert each program exactly to Semantic STRling and Simply, reconstruct both destinations, and compare relationship-preserving normalized alpha projections. They also require the conversion producer's exact source/reconstruction fingerprints to agree, run repeated bounded no-match explanations without subject disclosure, and require five-profile checked target evidence for every mapped representative case.
          - check: Controlled semantic mutations and explicit non-exact states
            result: passed
            details: Capture retargeting, alternation branch reversal, repetition-bound change, and case-option change are detected by canonical alpha or target-artifact comparison. Source correspondence, UNKNOWN confidence, conversion disposition, and authority-denominator mutations are rejected by their owning contracts or manifest validator. Actual unnamed-capture conversion remains partial with both required issues and no proof fingerprint; forward-reference conversion remains unsupported with no output. The CP2 no-match determinism proof-hook label was corrected to the existing 119-evaluation Rust test without changing the obligation.
          - check: Focused implementation and property verification
            result: passed
            details: All 10 new Python unit tests pass; 50 focused Python tests pass across the joined validator and frontend, semantic-explanation, conversion, no-match, and shared-target owners. Nineteen focused Rust tests pass across the new integration proof, frontend convergence, conversion convergence/properties, and no-match corpus/properties. Ruff format/check, rustfmt, Prettier, the structured hardgate command, governance, and patch integrity pass.
    - name: Integration and certification
      status: passed
      evidence:
          - check: Canonical profile registration and fixture-authority boundary
            result: passed
            details: The structured offline migration_explanation_certification operation is registered exactly once immediately after migration_differential_gate in Local, Pull Request, Full, and Release with certification-result-v1 metadata. Sixty-eight focused profile, quality, and certification tests plus 19 subtests pass. Core contract validation initially detected that the new Rust proof embedded three non-normative evidence files as canonical fixtures; the test was corrected to load them at runtime, after which core contracts pass at mappings=11 and fixtures=122 without changing production or semantic authority.
          - check: Adjacent subsystem, property, and migration proof
            result: passed
            details: All 628 tooling tests plus 701 subtests pass with the declared Cargo executable available. Rust all-target tests pass, including the three joined certification tests. Strict Clippy reports only the four inherited untouched-source findings in kernel.rs, protocol/request.rs, simply.rs, and source/mod.rs; allowing exactly those four yields a warning-denied clean result. TypeScript typecheck passes, and the Rust-backed Simply preview/convergence suite passes; the complete binding run records 19 of 20 suites and 966 of 972 tests because six unrelated CLI-smoke cases invoke the broken Windows Store python3 alias. The three-run migration differential passes with 44 source observations, 24 TypeScript and 20 Python cases, zero determinism mismatches, zero blocking unresolved replacements, and unchanged full-corpus fingerprint sha256:feedb6435b8b61ae6a004484feca0f0b23b6e578234f8ffc8daeca9eb0f04300.
          - check: Contracts, generated artifacts, documentation, architecture, and security
            result: passed
            details: Baseline, canonical contracts, core contracts, documentation integrity across 180 documents with seven executable examples, governance and architecture boundaries, security dependency integrity, security content/workflows, repository Prettier, Ruff, rustfmt, patch integrity, and the structured T04 hardgate pass. Public contracts and the generated aggregate verify every executable surface except the inherited Go public surface because Go is absent; checked cross-engine evidence sha256:9a575b86e8ea43590b24fcc2bda2d3a7b80ed25fa98694f46924b247abd3493c, stdlib runtime evidence sha256:075ee5aebf4a83c0390f53e1b39a6b82409f7ac7b0b8d4384aa958ffc7a84d6e, and portability evidence sha256:11f70923cdc200b132d7f68077fd840f3d38cf9aff63949fae24d703b68ea205 verify independently.
          - check: Canonical profiles and exact environment disposition
            result: failed
            details: From clean implementation checkpoint 1acc2ac97bc2e93a51a39770e08229f92ec45252, Local reports 11 passed, 2 failed, and 14 unavailable; Pull Request reports 11 passed, 2 failed, and 34 unavailable. Both pass the T04 hardgate, migration differential, canonical/core contracts, governance, security integrity/content, documentation, baseline, and legacy checks; both failures are the Go-dependent public/generated aggregate. Full was executed at registration checkpoint 7721e81d with 12 passed, 5 failed, and 68 unavailable, including passing T04 and portability operations. A clean Full rerun was not permitted because its network dependency-risk audit would export repository dependency inventory. Direct structured checks classify PCRE2 10.42/10.43, Node 22.23.2, and CPython 3.11.15 as unavailable because their exact governed binaries/libraries are not configured; fresh shared/stdlib execution inherits that absence. No unavailable or failed operation is represented as passing.
    - name: Completion and next-task readiness
      status: passed
      evidence:
          - check: Durable phase-closing acceptance record
            result: passed
            details: strling.migration-explanation-certification 1.0.0 closes at manifest sha256:5c088c046ab1720276b8582f723278c05bf836c993a0468352b518944eebd4c6 with seven owner denominators, 21 evidence paths, nine regex imports, 18 exact destination proofs, four conversion cases, four semantic-explanation cases, all 24 no-match cases, 20 target cases and 100 checked observations, nine pathological/resource cases, and all eight controlled mutation categories detected. Exact claims require reconstruction and normalized alpha proof; partial and unsupported outcomes remain explicit, and no semantic, target, binding, or public product behavior changes.
          - check: P15 phase-gate readiness
            result: passed
            details: Existing governed regex imports are explained through canonical semantics, exact representable migrations reconstruct through both Semantic STRling and Simply, partial and unsupported domains retain explicit evidence, portability is tied to checked target observations, and whyNoMatch remains bounded and conservative. Zero silent semantic changes and zero unclassified task divergences remain. P15 is ready to close with only the inherited host/toolchain and restricted dependency-risk egress recorded as carry-forward.
