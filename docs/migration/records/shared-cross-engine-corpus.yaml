title: Specification-authored shared cross-engine behavioral corpus
status: in_progress
objective: Build a versioned target-neutral corpus of canonical semantic, diagnostic, match, capture, support, and applicability expectations; project it through the completed PCRE2, ECMAScript, and Python re target stages; and preserve exact raw engine observations without claiming the final portability matrix or adding product execution behavior.
