change_classification:
    semantic_change:
        level: none
        evidence:
            - Cases state already-defined canonical Semantic IR, diagnostic, matching, and portability expectations; they do not change language meaning.
    public_api_change:
        level: none
        evidence:
            - The projection adapter is a repository-only Cargo example and no facade, protocol, binding, package, or published interface changes.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - Adds a corpus-specific execution/applicability and coverage schema outside the versioned compiler contract suite; existing compiler contracts remain unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: additive
        evidence:
            - Adds shared behavioral vectors and preserved exact-engine observations without modifying target profiles, lowering, serializers, or product execution routes.
    architecture_change:
        level: additive
        evidence:
            - Adds one repository-only projection adapter and one isolated exact-runtime orchestration boundary downstream of specification-owned expectations.
    generated_output_change:
        level: additive
        evidence:
            - Registers and checks one deterministic certification-evidence artifact containing the complete five-profile raw and normalized observation denominator.
            - Assigns that checked observation artifact exclusively to its owning serializer so repository formatting cannot make producer --write and verifier --check disagree.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Corpus schema, authority, coverage, and fingerprint certification
      command: python3 -m unittest tooling.tests.test_canonical_contracts tooling.tests.test_shared_cross_engine_corpus && python3 tooling/contract_validation.py
      expected_result: Every and only owned case validates and fingerprints, every profile receives an explicit execute/unsupported/not-applicable disposition, feature/rewrite obligations are complete, and denominator shrinkage or stale identity fails closed.
    - name: Canonical projection and architecture fitness
      command: cargo test --manifest-path core/Cargo.toml --test conformance_contracts --locked && cargo run --manifest-path core/Cargo.toml --example shared_conformance_projection --locked --quiet && python3 -m unittest tooling.tests.test_shared_cross_engine_corpus_architecture tooling.tests.test_core_contracts
      expected_result: Canonical stages project executable cases to deterministic artifacts and logical capture maps without runtime access, target-output authority, peer-majority inference, or product/API expansion.
    - name: Exact shared-corpus execution certification
      command: STRLING_PCRE2_1042_LIBRARY=/exact/libpcre2-10.42.so STRLING_PCRE2_1043_LIBRARY=/exact/libpcre2-10.43.so STRLING_NODE_22_BINARY=/exact/node-v22.23.2/bin/node STRLING_CPYTHON_311_BINARY=/exact/cpython-3.11.15/bin/python3.11 python3 -m tooling.shared_cross_engine_corpus --json --check --repeat-runs 2
      expected_result: Every execute application runs twice against its exact profile runtime, raw observations normalize to authored UTF-8/logical-capture expectations, unsupported and not-applicable entries do not execute, and evidence bytes and fingerprints match the checked artifact.
    - name: Complete repository certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py && python3 tooling/migration_differential.py --repeat-runs 3 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check
      expected_result: Every available hardgate passes, exact shared execution is recorded by Full, inherited host-only gaps remain explicit without waiver, and the final committed tree is clean.
checkpoints:
    - name: Existing conformance authority, target stages, and harness inventory
      status: passed
      evidence:
          - check: Specification-owned seed contract
            result: passed
            details: Existing conformance-case and manifest contracts already separate semantic, diagnostic, match/capture, and target-support expectations from compatibility evidence; the manifest is correctly draft pending specification ratification and pins every case by canonical fingerprint.
          - check: Target and runtime prerequisites
            result: passed
            details: PCRE2 10.42/10.43, ECMAScript 2024, Python re 3.11 str, and Python re 3.11 bytes have immutable profiles, completed lowering and serialization, and independently certified exact runtime adapters. No target contract or implementation change is required.
          - check: Required corpus-specific extension
            result: passed
            details: The compiler case schema intentionally lacks execution applicability and coverage-denominator policy. P11-T05 therefore adds a separate corpus-v1 schema that references unchanged case documents, explicitly covers every governed profile, and records coverage obligations without changing compiler contract version 1.0.0.
    - name: Shared authored vectors and completeness guards
      status: passed
      evidence:
          - check: Corpus implementation
            result: passed
            details: >-
                Twenty specification-owned cases define 100 explicit applications across the five exact profiles: 88 execute, five unsupported, and seven not applicable. The closed denominator, 21 feature tags, 16 requirement tags, certified rewrite coverage, exact case fingerprints, mutation tests, and schema validation prevent silent shrinkage or runtime-authored expectations.
          - check: Authored corpus identity
            result: passed
            details: Case-set SHA-256 is 8ce5b9874312e9527944960f84c722a8293e9030bc6d9d8550aca53012ae849d, vector-set SHA-256 is 8d6fc71842065e7d1e8796e4ee3e210669220c2b129530e70d9e05ff08e17afc, and canonical corpus SHA-256 is e8c069f068b8562518bfcf4f782a0961b53124660e4d40e63e49cbe8c6824fb1.
          - check: Per-profile denominator
            result: passed
            details: ECMAScript 2024 records 18 execute, one unsupported, and one not applicable; PCRE2 10.42 records 17 execute, two unsupported, and one not applicable; PCRE2 10.43 records 19 execute and one not applicable; Python re 3.11 text records 18 execute, one unsupported, and one not applicable; Python re 3.11 bytes records 16 execute, one unsupported, and three not applicable.
    - name: Deterministic target projection and exact engine execution
      status: passed
      evidence:
          - check: Projection and preserved observation proof
            result: passed
            details: The repository-only Rust adapter projects authored Semantic IR through the completed target stages without runtime or product access. Exact PCRE2 10.42/10.43, Node 22.23.2, and CPython 3.11.15 execution ran every declared application twice, preserved raw and normalized observations, and agreed with all 19 semantic, 19 target, 19 match, and one diagnostic expectation.
          - check: Deterministic evidence identity
            result: passed
            details: Projection SHA-256 is 029cf1c0df979774e71acb8f08e2a02bfd99001529a14faf9dcedfe01cda8089 and checked observation SHA-256 is 9a575b86e8ea43590b24fcc2bda2d3a7b80ed25fa98694f46924b247abd3493c. Producer --write and verifier --check agree because the generated evidence serializer exclusively owns its formatting.
          - check: Exact runtime identity
            result: passed
            details: Certification used Node 22.23.2, official-source CPython 3.11.15, PCRE2 10.42 build pcre2-10.42@52c08847921a324c804cabf2814549f50bce1265 with library SHA-256 61acdf1505445bccf8257ca48b6a5b82af651e800f948d45f81ec684e1b129a7, and PCRE2 10.43 build pcre2-10.43@3864abdb713f78831dd12d898ab31bbb0fa630b6 with library SHA-256 9998a4700a45c220c856ee2bf8389084234cdb91b4dfeb4dc0c001b65c537853.
    - name: Complete repository and migration certification
      status: passed
      evidence:
          - check: Full hardgate evidence
            result: passed
            details: All Rust all-target tests, warning-denied Clippy, exact shared-corpus checks, core/public/generated contracts, governance, documentation integrity, formatting, patch integrity, and the reviewed three-run Node 22 migration differential pass. The migration candidate exactly matches the checked baseline fingerprint sha256:8127c22a016013ff9751540ce39615fa780291da675082f2668bae5d63e4da5c, so no renewal is required.
          - check: Clean Local, Pull Request, and Full profiles
            result: passed
            details: At clean commit d12049f3fbdd72fac4897b2cd56fcef1a2abaf2c, Local passes all 26 operations. Pull Request records 44 passed and two unavailable; Full 1.7.0 records 75 passed and seven unavailable. No operation failed, was incomplete, or was waived, and Full passes all four exact runtime certification operations including the new shared cross-engine certification.
          - check: Explicit environment carry-forward
            result: passed
