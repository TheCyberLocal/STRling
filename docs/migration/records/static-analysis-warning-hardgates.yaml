      verification:
          - command: ./strling check
            result: Passed canonical formatting, hygiene, TypeScript strict analysis, and 963 TypeScript tests.
          - command: ./strling lint all --json; ./strling typecheck all --json
            result: Existing configured capabilities passed; 18 targets executed no lint analyzer and remained explicit.
          - command: Strict native analyzer baseline described in governance/static-analysis.json
            result: Clean mature paths and bounded findings were reproduced across all active ecosystems; missing tools were recorded as unavailable or unresolved.
          - command: python3 -m json.tool toolchain.json; python3 -m json.tool governance/static-analysis.json; ./strling check; git diff --check
            result: Policies parsed, the established check remained green with 963 TypeScript tests, and patch integrity passed.
      commit:
          subject: "docs(quality): define static analysis and warning policy"
          sha: pending
