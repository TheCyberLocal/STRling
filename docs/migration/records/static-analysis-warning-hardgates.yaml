      status: passed
      accomplishment:
          - Extended capability states with enforced, not_yet_enforceable, and unavailable while preserving explicit legacy formatting transitions.
          - Added canonical Ruff, .NET, Go vet, Java, Kotlin, Perl, PHP, Ruby, and LSP TypeScript commands with component scoping.
          - Added repository-resolved TypeScript version probes for both the binding and LSP lock files.
          - Added structured capability metadata and propagated analyzer exit status without discarding output.
      verification:
          - command: python3 -m unittest tooling.tests.test_quality
            result: 35 tests passed, including lint/typecheck success and failure, unavailable analyzer, transitional capability, scoping, and aggregate propagation cases.
          - command: ./strling lint lsp --json; ./strling typecheck lsp --json; ./strling lint go --json; ./strling lint perl --json; ./strling lint php --json
