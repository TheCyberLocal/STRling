          - command: ./strling lint repository --json; ./strling lint python --json
            result: Both known Ruff baselines returned nonzero structured failures; no diagnostics were discarded.
          - command: ./strling typecheck typescript --json
            result: Strict TypeScript checking passed with the repository-resolved 5.9.3 analyzer probe.
