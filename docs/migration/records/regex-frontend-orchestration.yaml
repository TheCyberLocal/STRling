title: Expose the regex-compatible frontend through canonical compile and CLI boundaries
status: complete
objective: Make strling.regex-compat@1.0.0 an explicit CompileRequest source frontend and deterministic root JSON CLI route without adding another parser, target policy, or implicit source interpretation.
