completion:
    accomplished:
        - Activated the frozen strling.regex-compat@1.0.0 SourceDocument through the canonical CompileRequest facade with explicit frontend selection, unchanged frontend diagnostics, caller/kernel resource enforcement, preserved source provenance, and reuse of the existing semantic and exact-profile portability pipeline.
        - Added a deterministic root JSON compile transport with explicit optional target-profile evidence, stable success/failure/usage/kernel/I/O exits, typed unresolved-reference behavior, and no parser, source guessing, target policy, lowering, or emission in the CLI.
        - Added five executable public request/result exchanges and 22 specification-authored orchestration cases that cover all 34 historical source-bearing cases through the canonical facade before evidence-only legacy runners.
        - Added architecture enforcement for one production frontend-dispatch owner and parser-free transports, renewed only the declared additive public snapshots, and kept the Rust transport outside prohibited build-output paths.
    verified:
        - All canonical-core targets, the 12-test orchestration suite, warnings-denied Clippy, rustfmt, 11 core schema mappings, 73 contract fixtures, public-contract reproduction, generated artifacts, governance, architecture, documentation, formatting, security integrity/content, hygiene, and patch integrity pass.
        - The native three-run migration differential certifies 44 observations with zero mismatches and zero blocking unresolved replacements at result sha256:a8f8288adfda0c74c72fbbdcee5a5e803b8af59cff3d560502002d8dcfeae706.
        - Local, Pull Request, and Full profiles execute from clean commit d928e5ca330b10e23d6440ee23c575a2275d95ac and pass every P08-T04-relevant operation; their only non-passed results are exact inherited repository or host-toolchain carry-forward.
    behavior_changed: CompileRequest and the root CLI now execute an explicitly identified regex-compatible source through the canonical kernel. This is an import/frontend compatibility route, not a flagship-language, binding, target-artifact, package, version, release, or publication change.
    intentional_behavior_changes:
        - A valid inline source document with frontend id strling.regex-compat now produces canonical Semantic IR, diagnostics, analysis, and optional exact-profile portability through kernel::compile.
        - A reference-form source not resolved by the caller now returns STRL-PROTOCOL-0006, and unsupported frontend identities remain structured STRL-PROTOCOL-0002 results.
        - The root compile command now exposes the canonical JSON exchange with deterministic transport behavior and stable exits.
    preserved_behavior:
        - Frontend dialect and parser diagnostics remain frozen; target artifact requests remain unavailable; no filename, media type, content, runtime, or filesystem guessing selects a frontend or target.
        - Historical peer outputs remain evidence-only and machine-classified where canonical Semantic IR or target output is not structurally comparable; zero case is silently treated as equivalent.
        - Bindings, editor integrations, package entrypoints, target lowering/emission, versioning, publishing, and release state remain unchanged.
    transitional_architecture:
        - The canonical route produces Semantic IR and portability evidence but still has no target artifact lowerer or emitter; those remain owned by later target phases.
        - Aggregate profiles retain one pre-existing repository lint/suppression-baseline failure. Pull Request and Full retain the existing Ruby Bundler mismatch and missing Swift executable; Full also retains unavailable dependency-risk scanning. None is waived or attributed to P08-T04.
    deferred_work:
        - Continue with P09-T05 equivalence-proof hooks and compatibility diagnostics over the existing versioned target-profile and portability foundations.
        - Resolve repository lint/suppression debt and host Ruby, Swift, and dependency-risk availability only in their owning tasks.
