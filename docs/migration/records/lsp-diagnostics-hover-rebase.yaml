            result: passed
            details: Local records 11 passed, two failed, and 14 unavailable operations; Pull Request records 11, two, and 34. Both failures are the inherited public/generated wrappers requiring absent Go, while all affected surfaces pass directly. The safer sandboxed Full run records nine passed, eight failed, and 68 unavailable; sandbox/toolchain restrictions add migration/shared/stdlib wrapper failures even though those gates pass directly, and dependency-risk retains its inherited failure. Unsandboxed Full was not run because its dependency audit may send repository dependency metadata to external registries. No unavailable or inherited failure is represented as a product pass.
