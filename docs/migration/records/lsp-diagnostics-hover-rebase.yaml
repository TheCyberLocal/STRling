change_classification:
    semantic_change:
        level: none
        evidence:
            - The LSP consumes canonical CompileResult, Semantic IR, analysis, diagnostic, and optional exact-profile evidence without parsing source or defining language meaning.
    public_api_change:
        level: none
        evidence:
            - CP1 changes no binding, compiler, schema, package, or editor protocol surface; it only locks the internal adapter boundary.
        affected_surfaces: []
    schema_change:
        level: none
        evidence:
            - The task consumes immutable compiler contracts and adds no normative schema.
        affected_surfaces: []
    diagnostic_change:
        level: compatible
        evidence:
            - Editor diagnostics will become exact projections of canonical compiler diagnostics; legacy heuristic or binding-only differences are resolved in favor of canonical code, severity, message, order, and UTF-8 span evidence.
    target_behavior_change:
        level: none
        evidence:
            - Exact-profile evidence may be displayed when supplied, but the LSP cannot infer targets or alter capability, portability, lowering, serialization, or runtime outcomes.
    architecture_change:
        level: additive
        evidence:
            - A bounded process adapter and immutable snapshot cache replace the direct Python-binding semantic dependency for diagnostics and hover while preserving the canonical kernel as the sole semantic authority.
    generated_output_change:
        level: none
        evidence:
            - Generated extension payloads are explicitly excluded from direct edits in P16-T02.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Canonical diagnostic and range parity
      command: python3 -m pytest tooling/lsp-server/tests/test_canonical_core.py tooling/lsp-server/tests/test_diagnostics.py -q
      expected_result: Native and embedded editor diagnostics retain canonical code, severity, message, order, and half-open source spans for identical source/frontend/options/profile, including multibyte Unicode and location-less cases.
    - name: Deterministic hover evidence
      command: python3 -m pytest tooling/lsp-server/tests/test_hover.py -q
      expected_result: Hover selects the narrowest current canonical node, uses its exact projected range, renders only present Semantic IR/analysis/profile evidence in a fixed order, and returns no inferred preview for absent, failed, stale, or unsupported evidence.
    - name: Document lifecycle and recovery
      command: python3 -m pytest tooling/lsp-server/tests/test_lsp_lifecycle.py tooling/lsp-server/tests/test_lsp_server.py -q
      expected_result: Open/change/save/close, debounce, version/profile invalidation, cancellation, timeout, stale completion rejection, bounded work, missing-kernel isolation, and later recovery preserve responsive deterministic publication.
    - name: Architecture, compatibility, and campaign certification
      command: python3 -m pytest tooling/lsp-server/tests -q && python3 -m unittest discover -s tooling/tests && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/migration_differential.py --repeat-runs 3 && python3 -m tooling.governance --json && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: LSP compatibility, canonical dependency direction, public/generated contracts, migration evidence, governance, profiles, patch integrity, and clean-tree checks pass or retain only explicitly recorded inherited environment limitations.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and operational starting boundary
            result: passed
            details: P16-T02 begins on architecture/v4 at clean P16-T01 closure 823bad395b831504bc65dd2a2ebdaae3dd807c40. The authored server, generated payload boundary, direct Python-binding imports, diagnostic clamp, hover preview, debounce/cache behavior, missing close path, and deferred T03-T05 ownership were inventoried before implementation.
          - check: Canonical compiler and adapter boundary
            result: passed
            details: Diagnostics and hover are locked to immutable canonical CLI/library results. Frontend and exact-profile selection are explicit; service failures cannot masquerade as compiler diagnostics; source-tree command discovery cannot fall back to Python semantics; packaging remains P16-T05.
          - check: Position, lifecycle, and evidence contracts
            result: passed
            details: Half-open UTF-8 spans, negotiated LSP projection, native/virtual/host mapping, narrowest-node hover selection, immutable versioned snapshots, cancellation, stale rejection, bounded work, close cleanup, compatibility dispositions, task exclusions, verification profile, and rollback boundary are frozen without claiming implementation evidence.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Canonical diagnostic and profile parity denominator
            result: passed
            details: Twelve authored cases cover regex-compatible and Semantic STRling frontends, successful and failed outcomes, exact error and warning identity/message/severity/order/span evidence, BMP Unicode, multiline EOF, and exact PCRE2 10.42 and Python re 3.11 profile selection. All twelve execute against strling-kernel and match the recorded CompileResult evidence.
          - check: Position and deterministic hover denominator
            result: passed
            details: Six position cases freeze half-open UTF-8 byte conversion across ASCII, BMP, astral, multiline, CRLF, and Unicode EOF inputs for UTF-8, UTF-16, and UTF-32 LSP encodings. Twelve live hover cases cover each Semantic IR node kind exactly once, including narrowest-node selection, canonical source span, deterministic node identity, and foundational nullable/length evidence.
          - check: Lifecycle, mutation, and resource denominator
            result: passed
            details: Sixteen unique mutations cover open/change/save/close publication, debounce, pending and in-flight cancellation, stale rejection, profile/encoding invalidation, cache hits/misses, timeout, missing kernel, malformed output, failed CompileResult-as-data, and recovery. Resource ceilings are frozen at 1,048,576 source bytes, 256 diagnostics, 256 islands, five seconds per compile, and 50 ms debounce. The 46-case manifest fingerprint is sha256:bf99891daf0ee32fec022b54cc29aefec6d083ed05acf01e03c334c3128ce951.
          - check: Executable verification design
            result: passed
            details: Thirty-two focused tests pass, including 24 live canonical-kernel executions. LSP formatting, Ruff, governance, and git diff --check pass; the pytest cache warning is an inherited filesystem permission limitation and does not affect test execution.
