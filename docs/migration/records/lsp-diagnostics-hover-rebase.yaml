completion:
    accomplished:
        - Rebased native and embedded diagnostics onto canonical regex-compatible and Semantic STRling compiler results with exact source-span and diagnostic identity preservation.
        - Rebuilt hover as a deterministic projection of current Semantic IR, analysis, safety, and exact-profile evidence without helper guessing or an independent binding emitter.
        - Added bounded versioned document snapshots, UTF-8/16/32 position projection, cancellation, cache identity, stale-result rejection, close cleanup, failure isolation, and recovery.
        - Removed diagnostics/hover Python-binding semantic dependencies, enforced that boundary architecturally, repaired canonical regex-set member ordering, and renewed only the derived migration evidence.
    verified:
        - The 46-case evidence manifest covers 12 diagnostic/profile, six position, 12 hover, and 16 lifecycle/resource cases; 24 focused cases execute live against strling-kernel.
        - All 467 T02-owned LSP tests, 632 tooling tests, every Rust all-target test, Rust 1.75.0 warnings-denied Clippy, LSP and Rust formatting, repository static analysis, governance, and git diff --check pass.
        - The three-run migration differential has 44 observations, zero repeat mismatches, zero replacement reviews, and unchanged corpus, route, source-observation, and peer identities except the reviewed canonical-boundary-derived fingerprints.
        - All affected public surfaces and registered generated observations reproduce unchanged. Local records 11 passed, two failed, and 14 unavailable; Pull Request records 11, two, and 34; safe sandboxed Full records nine, eight, and 68, with every failure or unavailable operation explicitly classified.
    behavior_changed: Editor diagnostics and hover now reflect canonical compiler semantics and evidence exactly; multiline and Unicode ranges, document lifecycle, cancellation, stale work, service failures, and cache reuse follow bounded deterministic contracts instead of LSP-local heuristics.
    intentional_behavior_changes:
        - Legacy synthetic diagnostic names, range clamps, internal-error diagnostics, registry word guesses, and binding PCRE2 hover previews are removed from diagnostics and hover; canonical output wins wherever legacy behavior differed.
        - Regex imports containing multiple built-in character classes sort by the existing Semantic IR canonical key, restoring contract-valid deterministic programs without adding language semantics.
        - Missing, timed-out, malformed, stale, or unavailable compiler evidence produces no fabricated semantic result and cannot poison a later snapshot.
    preserved_behavior:
        - Regex-compatible and Semantic STRling semantics, diagnostic contracts, target profiles, standard-library guarantees, binding APIs, and generated surfaces remain under their existing authorities.
        - Embedded host projection remains available as a compatibility coordinate adapter, while authoritative island grammar changes remain deferred.
        - Completion, navigation, semantic tokens, formatting, code actions, and packaging remain operational through their bounded transitional paths until their ordered tasks replace them.
    transitional_architecture:
        - Completion, navigation, and semantic tokens still consume the isolated Python-binding intelligence module; P16-T03 owns their canonical rebase.
        - Three code-action tests still require the non-canonical REDOS_RISK alias, and island extraction retains binding support; P16-T04 owns both migrations.
        - The VSIX assembler does not yet copy the canonical bridge/deferred module or distribute strling-kernel; P16-T05 owns packaging and deployment.
        - Go and optional host toolchains are absent, installed Node 24 is outside the governed Node 22 range, and safe sandboxing prevents an unsandboxed Full dependency audit; aggregate wrappers therefore retain exact inherited failures and unavailable operations.
    deferred_work:
        - P16-T03 must derive completion candidates, navigation identities, and semantic tokens from canonical syntax, Semantic IR, source identity, schemas, and registries while reusing T02 snapshot and position machinery.
        - P16-T04 must rebase code actions and embedded STRling islands without restoring legacy diagnostic aliases or creating an independent parser.
        - P16-T05 must assemble and distribute the complete canonical editor runtime, including the bridge modules and kernel, and certify the packaged extension.
