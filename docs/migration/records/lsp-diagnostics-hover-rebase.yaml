            details: The reviewed three-run migration differential passes with 44 observations, zero mismatches, zero replacement reviews, baseline sha256:020560f6148403cd593264ce43d101dbf8a546dd3b291f0708726fd19e32f0b5, and canonical boundary sha256:a25790e1a6bb9a324f826e552b38bfb1766df700fe1389a9160fa8ef87690199. All other corpus, route, source-observation, and peer identities are unchanged. The non-normative migration-explanation denominator passes after renewing those two values and its manifest signature. All affected public surfaces and registered generated observations reproduce unchanged; the repository wrappers exit one only because Go is absent.
