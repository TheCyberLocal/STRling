change_classification:
    semantic_change:
        level: none
        evidence:
            - Conversion projects existing canonical semantics into already-ratified frontend representations and cannot add, remove, or reinterpret a semantic construct.
    public_api_change:
        level: additive
        evidence:
            - CP3 adds the public semantic_conversion module with one pure conversion entrypoint and closed result, evidence, issue, mapping, annotation, and error types; existing compiler, frontend, Simply, and explanation APIs remain unchanged.
        affected_surfaces:
            - strling-kernel
    schema_change:
        level: additive
        evidence:
            - CP2 adds the independently versioned strling.semantic-conversion 1.0 result schema, exhaustive destination-domain taxonomy, four authored positive examples, and three controlled invalid examples without changing Semantic IR or either destination contract.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - CP1 records the future conversion-only diagnostic boundary but adds no diagnostic contract or implementation.
    target_behavior_change:
        level: none
        evidence:
            - Optional target annotations reference completed explanation/plan evidence and do not change conversion output, target planning, lowering, emission, or runtime behavior.
    architecture_change:
        level: additive
        evidence:
            - CP2 establishes a specification-owned, contract-first conversion boundary. CP3 implements it as a pure canonical-IR projection subordinate to existing Semantic STRling and Simply reconstruction frontends, adds enforced source-boundary checks, and does not depend on regex import, target planning/lowering/emission, bindings, filesystems, processes, or product UX.
    generated_output_change:
        level: additive
        evidence:
            - CP1 through CP3 changed no registered generated artifact or public snapshot.
            - CP4 registers semantic_conversion.rs as an authoritative strling-kernel public-contract input, extends the governed Rust source-boundary extractor, and regenerates only governance/contracts/snapshots/strling-kernel.json with the additive conversion API.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Conversion result contract and representable-domain fixtures
      command: python3 -m tooling.semantic_conversion_contract && python3 -m unittest tooling.tests.test_semantic_conversion_contract
      expected_result: The closed 1.0.0 result schema, exact/partial/unsupported examples, controlled negatives, status/evidence invariants, and complete destination-domain taxonomy pass with a stable fingerprint.
    - name: Canonical Rust conversion and properties
      command: cargo test --manifest-path core/Cargo.toml --test semantic_conversion --test semantic_conversion_frontend_convergence --test semantic_conversion_properties --locked
      expected_result: Generated DSL reparses and generated Simply replays; exact cases prove normalized alpha equivalence, partial/unsupported cases remain explicit, provenance and explanation links correspond, and repeated bytes are deterministic.
    - name: Architecture, public contracts, and applicable target execution
      command: python3 tooling/core_contract_validation.py && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py
      expected_result: Conversion consumes only canonical IR and existing destination/explanation contracts, the additive Rust API is snapshotted, generated ownership is complete, and portable reconstructed outputs retain representative real-engine behavior.
    - name: Repository and campaign certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 -m unittest discover -s tooling/tests && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: Adjacent kernel/frontends, tooling, quality, Local/Pull Request/Full profiles, migration differential, patch integrity, and clean-tree checks pass or retain only explicitly recorded inherited environment limitations.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Clean ordered boundary and conversion architecture
            result: passed
            details: P15-T02 begins on clean architecture/v4 closure 5ad4ff67e3fb7ff517c2aec4c16ca6dc40b91408. The permanent result identity, two destinations, exact/partial/unsupported semantics, proof boundary, representable-domain rules, explanation/target links, resource limits, allowed/forbidden paths, rollback boundary, and Local/PR/Full acceptance profile are frozen before schema or product implementation.
          - check: CP1 governance and documentation gate
            result: passed
            details: Governance validates the exact three-file scope-lock diff, change declarations, and architecture rules; documentation integrity validates 174 Markdown files and seven executable examples; Prettier and git diff --check pass. No formal schema, Rust implementation, public API, generated artifact, diagnostic, semantic, target, binding, package, or whyNoMatch behavior is claimed.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed conversion-result contract and destination taxonomy
            result: passed
            details: The independently versioned 1.0.0 schema rejects unknown fields and closes destination identity, exact/partial/unsupported status, proof evidence, comment policy, source summaries, output variants, mappings, structured issues, explanation links, and target annotations. The destination-domain contract exhaustively covers all 12 canonical Semantic IR node kinds and four set-member kinds for both Semantic STRling and Simply, including capture-name/backreference limits and forbidden Simply import/helper operations.
          - check: Authored evidence and mutation gate
            result: passed
            details: Four positive fixtures certify two exact reconstructions, one partial capture-name substitution with a required manual decision, and one unsupported forward reference. Three controlled invalid fixtures fail false exact proof, missing manual decision, and executable output on unsupported status. Seven focused mutation tests additionally reject digest/span drift, target-routed or non-direct Simply output, destination/explanation mismatch, and duplicate mappings. The focused contract, unit suite, aggregate canonical contracts, governance, changed-file formatting, documentation, and patch-integrity checks pass with fingerprint sha256:70f12e19b559af4dab77458cf397694c644b69a18c8de66c4da503511b593ce0. The generated-artifact verifier reports every applicable output unchanged and retains only the inherited repository-wide missing-Go failure for go-public-api.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: Canonical conversion implementation and destination reconstruction
            result: passed
            details: The public pure converter validates canonical Semantic IR, derives full and normalized-alpha identities, renders all 12 node kinds and four set-member kinds to canonical Semantic STRling and direct-operation Simply 1.0 requests, reconstructs through the existing destination frontend, and publishes exact only when normalized alpha fingerprints match. Simply output requests semantic only, is target-neutral, and uses no import or stdlib-helper operation. Semantic DSL output records exact UTF-8 node/capture spans and digest.
          - check: Partial, unsupported, explanation, and bounded property proof
            result: passed
            details: Missing/invalid DSL capture names yield deterministic usable text with paired substitution/manual-decision issues and not_proven status. Forward, self, and recursive references yield unsupported with no output or mappings. Exact explanation identity and node coverage are required before structured links/target annotations are copied; mismatches fail closed and evidence cannot influence output. Eleven focused Rust tests pass, including complete node/member coverage for both destinations, all three unsupported topologies, malformed input, serialized vocabulary, explanation correspondence, 96 programs converted twice to both destinations with byte equality, and nesting depths 1 through 64 without panic.
          - check: Architecture, formatting, and lint disposition
            result: passed
            details: Core contract mapping and 24 focused architecture tests pass; the enforced boundary requires validation, both canonical reconstruction routes, alpha proof, explanation correspondence, and canonical hashing while rejecting regex, target implementation, process/filesystem, raw-source, emitted-pattern, and whyNoMatch dependencies. Rust all-target check and rustfmt pass. Strict Clippy reports only the same four inherited out-of-scope warnings recorded by P15-T01 in kernel.rs, protocol/request.rs, simply.rs, and source/mod.rs; an isolated all-target run suppressing exactly those four inherited lints passes with warnings denied for the new conversion code.
    - name: Integration and certification
      status: passed
      evidence:
          - check: Imported frontend convergence and representative engine execution
            result: passed
            details: The imported regex (?<word>a)\\k<word> parses once to canonical Semantic IR, converts with exact proof to both Semantic STRling and direct-operation Simply, reconstructs through each existing frontend, and lowers all three programs against the governed ECMAScript 2024 profile. Every route produces the same native pattern (?<word>a)(?:\\k<word>), sorted u flag, and engine options; a live Node execution accepts aa and rejects ab. Node and capture identities and source maps remain provenance-specific and are intentionally excluded from semantic artifact comparison.
          - check: Additive public contract and generated ownership
            result: passed
            details: The public-surface registry and generated-artifact registry now name semantic_conversion.rs as authoritative strling-kernel input. The governed extractor and its 19 focused tests cover the new boundary, and generator output adds exactly 30 public symbols (two constants, 14 enums, 12 structs, one function, and one module) to the kernel snapshot. Direct registered-wrapper execution is unavailable because this Windows runner has no /bin/bash; the wrapper's exact Python generator entrypoint regenerates only strling-kernel, whose focused generation and check both pass. Aggregate generated/public checks pass every executable surface except the inherited missing-Go go-public-api check.
          - check: Migration differential and repository certification
            result: passed
            details: The reviewed three-run migration differential passes with zero determinism mismatches. All 44 historical cases, peer corpus/result identities, route coverage, contract fingerprint, and source-observation fingerprint remain unchanged; only the intentionally expanded canonical-boundary fingerprint advances to sha256:9c64b5f5437c63d737d48fccca930ed2d5ec01b9658ff6e4e68f9d0a2e17d848 and derived baseline to sha256:9c60f062dabd3cc4c9c77dfd23f996823753382edf8bee49a7f7552d39a31471. All Rust targets and 600 tooling tests pass. Strict Clippy retains only the four inherited P15-T01 warnings, and an all-target run suppressing exactly those four passes with warnings denied elsewhere. Local and Pull Request each pass 10 executable operations and fail only the two aggregate views of missing Go; Full passes 11 operations and additionally records inherited security-waiver/license drift. After activating the installed MSVC environment, shared-cross-engine and stdlib runtime projection build successfully and report structured unavailable solely because exact PCRE2 10.42/10.43 libraries are not configured; the focused ECMAScript execution required by this task passes.
