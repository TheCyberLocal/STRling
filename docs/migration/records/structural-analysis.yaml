    schema_change:
        level: none
        evidence: []
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
        level: additive
        evidence:
            - The canonical kernel gains a second pure analysis stage after foundational semantic analysis and a separate stable-identity-keyed structural fact store.
            - Canonical fitness will enforce foundational-fact dependency direction, exact program correspondence, target neutrality, purity, and prohibited safety, portability, target, binding, frontend, tooling, and emitter dependencies.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Kernel structural-analysis quality
      command: cargo fmt --manifest-path core/Cargo.toml --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && RUSTFLAGS=-Dwarnings cargo check --manifest-path core/Cargo.toml --all-targets && cargo build --manifest-path core/Cargo.toml --all-targets && cargo test --manifest-path core/Cargo.toml --all-targets
      expected_result: The analyzer builds without warnings and all focused, generated-property, normalization, foundational-analysis, structural-analysis, contract, fixture, and kernel tests pass.
    - name: Canonical contract and architecture certification
      command: python3 tooling/core_contract_validation.py && python3 tooling/contract_validation.py && python3 tooling/governance.py && python3 -m unittest tooling.tests.test_core_contracts tooling.tests.test_governance tooling.tests.test_quality
      expected_result: Contract drift, missing structural-analysis ownership, incorrect stage direction, target/planner/emitter/binding/frontend/tooling dependencies, runtime-state access, and task-scope violations are rejected by controlled hardgate tests.
    - name: Repository quality and certification
      command: ./strling check all --json && ./strling certify all --json
      expected_result: Formatting, hygiene, lint, typecheck, generation, contracts, governance, baseline validation, configured cross-binding checks, and every enforced repository operation pass from committed state.
    - name: TypeScript compatibility baseline
      command: cd bindings/typescript && npm test -- --runInBand && ./node_modules/.bin/tsc -p tsconfig.json --noEmit
      expected_result: All established TypeScript runtime/compiler behavior tests and the binding compiler check pass unchanged.
    - name: Patch and clean-state integrity
      command: git diff --check && git status --short --branch
      expected_result: The final committed repository has no whitespace errors or uncommitted files.
checkpoints:
    - name: Structural analysis contract
      status: passed
      evidence:
          - check: Target-neutral fact and rule inventory
            result: passed
            details: The stage API, typed fact vocabulary, conservative overlap model, length and progress classifications, all-variant composition rules, exact-program identity validation, deterministic resource bounds, and explicit exclusions are documented in docs/migration/structural-analysis.md.
          - check: Foundational reuse and examination separation
            result: passed
            details: The contract consumes certified nullability and consumption bounds without duplicating them, and all 12 variants explicitly preserve lookaround examination versus enclosing consumption.
          - check: Repository hardgates
            command: ./strling check --json && ./strling certify --json
            result: passed
            details: Canonical check and certify passed with repository-certified Ruff 0.15.21, Bundler 2.4.20, system Python, and Swift 6.2.1; governance, formatting, architecture fitness, contracts, generation, baselines, kernel tests, and the 19-suite/963-test TypeScript baseline exited zero.
    - name: Leading-consumption analysis
      status: passed
      evidence:
          - check: Complete symbolic leading analysis
            command: cargo test --manifest-path core/Cargo.toml --test structural_analysis
            result: passed
            details: Nine focused tests cover all 12 reachable variants, equal and distinct literals, multibyte Unicode scalars, nullable prefixes, nested alternation, wildcard, finite literal/range predicates, lookaround separation, nullable and zero-maximum repetition, conservative backreferences, exact-program mismatch rejection, immutable inputs, and deterministic ordering.
          - check: Certified foundational correspondence
            result: passed
            details: Foundational facts now carry a private deterministic exact-program fingerprint; structural analysis validates versions, fingerprint, reachable NodeId equality, and semantic node kinds before deriving facts, returning structured errors without invoking prior stages.
          - check: Warnings-denied kernel regression
            command: cargo fmt --manifest-path core/Cargo.toml --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && RUSTFLAGS=-Dwarnings cargo test --manifest-path core/Cargo.toml --all-targets
            result: passed
            details: Rust formatting, warnings-denied Clippy, and all 85 kernel tests passed, including normalization, foundational semantic analysis, canonical fixtures, and the new structural suite.
    - name: Length and progress classification
      status: passed
      evidence:
          - check: Semantic length classification
            command: cargo test --manifest-path core/Cargo.toml --test structural_length_progress
            result: passed
            details: Seven focused tests prove fixed, finite-variable, unbounded, and indeterminate classification for literals, equal- and unequal-length alternation, assertions, lookarounds, exact and bounded repetitions, unbounded repetitions, and cyclic or unknown backreferences.
          - check: Repetition extent and operand progress
            result: passed
            details: Repeat nodes separately record finite versus unbounded extent and always-consuming, potentially-zero-consuming, or indeterminate operand progress from certified minimum-consumption, nullability, and consumption facts; the structural condition is retained without a safety verdict.
          - check: Foundational arithmetic ownership and kernel regression
            command: cargo fmt --manifest-path core/Cargo.toml --check && cargo clippy --manifest-path core/Cargo.toml --all-targets --all-features -- -D warnings && RUSTFLAGS=-Dwarnings cargo test --manifest-path core/Cargo.toml --all-targets
            result: passed
            details: Checked-arithmetic overflow remains a structured foundational-analysis error. Rust formatting, warnings-denied Clippy, and all 92 kernel tests passed.
    - name: Structural overlap analysis
      status: planned
      evidence: []
    - name: Property and soundness certification
      status: planned
      evidence: []
    - name: Pipeline and hardgate integration
      status: planned
      evidence: []
    - name: Completion and safety-analysis readiness
      status: planned
      evidence: []
