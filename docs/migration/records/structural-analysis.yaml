record_version: 2.0.0
title: Canonical structural semantic analysis
status: in_progress
objective: Establish the next pure target-neutral semantic-analysis layer over canonical normalized Semantic IR and certified foundational facts, with deterministic leading-consumption, semantic length, repetition-progress, and conservative structural-overlap facts, without changing product execution or beginning safety verdicts, portability planning, rewriting, diagnostics, lowering, emission, frontend, binding, or tooling migrations.
