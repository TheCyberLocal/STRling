record_version: 2.0.0
title: Canonical standard-library registry
status: in_progress
objective: Establish one versioned, machine-validated standard-library registry that owns Essential helper identity, exact audited guarantees, construction identity, support metadata, documentation metadata, binding spellings, examples, evidence, and deterministic non-normative compatibility projections without changing helper behavior or implementing future strict validators.
