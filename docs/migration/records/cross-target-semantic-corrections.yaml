      status: passed
      evidence:
          - check: Starting repository state
            result: passed
            details: dev was clean at cf98441e7b65d430d98c501e8086575dc833b3ac and identical to origin/dev before modification.
          - check: Contract and profile revisions
            result: passed
            details: TargetArtifact and target-profile schemas remain 1.0.0; profile revisions are ECMAScript 1.3.0, PCRE2 10.42 1.3.0, PCRE2 10.43 1.3.0, Python str 1.4.0, and Python bytes 1.2.0; groups.capture_iteration_state was added.
    - name: Semantic family reconciliation
      status: passed
      evidence:
          - check: Wildcard and Unicode-scalar consumption
            result: passed
            details: 45 findings resolved by explicit canonical exclusion forms for text targets and precise Python bytes refusal for scalar consumption.
          - check: Line start and line end
            result: passed
            details: 15 findings resolved by exact native selection, CRLF-safe canonical assertions, or bytes refusal.
          - check: Before-final-line-terminator
            result: passed
            details: 8 findings resolved by explicit canonical final-terminator assertions that exclude the CRLF interior.
          - check: Unicode word class
            result: passed
            details: 3 findings resolved with PCRE2 10.43 native behavior, PCRE2 10.42 and ECMAScript L+Mn+N+Pc forms, and Python refusals.
          - check: Word boundary
            result: passed
            details: 16 findings resolved through exact-set native use, explicit word/non-word transitions, or refusal.
          - check: Case folding
            result: passed
            details: 12 findings resolved by reachability analysis that refuses only implicated extra or missing fold equivalence classes.
          - check: Unset backreference
            result: passed
            details: 4 findings resolved by refusing noncanonical engines only when capture nonparticipation is structurally reachable.
          - check: Capture state in repetition
            result: passed
            details: 10 findings resolved by refusing noncanonical reset behavior only when a later iteration can omit an observable capture.
          - check: PCRE2 target acceptance
            result: passed
            details: 4 findings resolved by a conservative 4096 bounded-repetition envelope for the artifact-dependent unknown compiled-size limit, without asserting a universal PCRE2 cutoff.
          - check: Python bytes scalar sets
            result: passed
            details: 4 findings resolved by refusing negated sets and other inherently Unicode-scalar constructs before artifact emission.
    - name: Profile facts and rewrite governance
      status: passed
