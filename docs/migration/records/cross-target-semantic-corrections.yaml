families:
    - name: wildcard and Unicode-scalar consumption
      starting_findings: 45
      resolution: Explicit canonical exclusion forms for text targets; Python bytes refuses wildcard scalar consumption.
    - name: line start and line end
      starting_findings: 15
      resolution: Native only for an exact line set; otherwise explicit CRLF-safe canonical assertions or bytes refusal.
    - name: before final line terminator
      starting_findings: 8
      resolution: Explicit final canonical terminator assertions with no CRLF-interior match.
    - name: Unicode word class
      starting_findings: 3
      resolution: PCRE2 10.43 native, PCRE2 10.42 and ECMAScript explicit L+Mn+N+Pc, Python profiles refused.
    - name: word boundary
      starting_findings: 16
      resolution: Native only for the exact word set; otherwise explicit word/non-word transitions or refusal.
    - name: case folding
      starting_findings: 12
      resolution: Reachability analysis refuses only extra or missing fold equivalence classes implicated by the program.
    - name: unset backreference
      starting_findings: 4
      resolution: Noncanonical engines refuse only when capture nonparticipation is structurally reachable.
    - name: capture state in repetition
      starting_findings: 10
      resolution: Noncanonical reset behavior refuses only when a later iteration may omit an observable capture.
    - name: PCRE2 target acceptance
      starting_findings: 4
      resolution: Structured emitted repetition requirements enforce a conservative 4,096 envelope for the unknown compiled-size limit.
    - name: Python bytes scalar sets
      starting_findings: 4
      resolution: Negated sets and other inherently Unicode-scalar constructs refuse before artifact emission.
