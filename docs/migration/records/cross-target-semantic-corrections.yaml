change_classification:
    semantic_change:
        level: compatible
        evidence:
            - Canonical Semantic STRling meaning is unchanged; target behavior now either implements it or refuses.
            - Native target behavior is selected only after comparing governed set, algorithm, matching-unit, and limit facts.
    public_api_change:
        level: none
        evidence:
            - No public request, result, or TargetArtifact field changed.
    schema_change:
        level: none
        evidence:
            - Existing profile and artifact schemas already express all required evidence.
    diagnostic_change:
        level: additive
        evidence:
            - Reachable semantic mismatches now produce ordinary exact-profile unsupported decisions or structured post-lowering target-capability failures.
            - The two known public failed-result delivery defects remain assigned to V4-H05.
    target_behavior_change:
        level: corrective
        evidence:
            - Wildcard, line, final-terminator, Unicode-word, word-boundary, folding, backreference, capture-state, compiled-size, and bytes/scalar divergences no longer emit silently different artifacts.
    architecture_change:
        level: compatible
        evidence:
            - One target-neutral semantic-compatibility module feeds existing capability evaluation and current target lowerers; no parallel profile or rewrite system exists.
    generated_output_change:
        level: compatible
        evidence:
            - Registered conformance, portability, stdlib, adapter, contract, and LSP projections were regenerated through their producers.
