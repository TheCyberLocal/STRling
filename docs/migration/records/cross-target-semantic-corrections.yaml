          - check: Governed profile facts consumed
            result: passed
            details: Lowering and capability evaluation consume wildcard_exclusions, line_terminators, word_characters, matching_unit, case_folding, backreference_unset, capture_reset_on_iteration, quantifier_value, and compiled_pattern_size.
          - check: Rewrite architecture
            result: passed
            details: No registry rewrite was added because corrected wildcard, anchor, and word spellings are canonical direct serialization of Semantic IR constructs rather than optional semantic rewrites.
          - check: Source evidence
            result: passed
            details: All semantic decisions use the primary-source evidence links already embedded in the five governed V4-H02 profiles.
    - name: Strict audit and real-engine evidence
      status: passed
      evidence:
