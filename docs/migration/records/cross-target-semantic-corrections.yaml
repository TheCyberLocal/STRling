            command: python3 -m tooling.adversarial_semantic_audit --strict --verify-evidence
            result: passed
            details: The starting 121 V4-H04 findings are absent; strict mode reports two known V4-H05 findings, zero unexpected findings, 121 unreproduced historical findings, two observed findings, and zero unaccounted results.
          - check: Disposition accounting
            result: passed
            details: Every historical V4-H04 finding ID spans at least one profile now precisely refused, so 121 IDs are classified with precise constraint or refusal; other target cells use exact native or canonical direct forms; no equivalence-registry rewrite was needed.
          - check: Shared and focused engine certification
            result: passed
            details: Pinned Node 22.23.2, PCRE2 10.42, PCRE2 10.43, and CPython 3.11.15 checks pass; shared evidence has 84 execute, 9 unsupported, and 7 not-applicable applications, and standard-library evidence has 580 executed operations.
    - name: Performance and behavior preservation
      status: passed
      evidence:
          - check: Baseline policy
            result: passed
            details: No performance baseline, threshold, or sampling policy changed and no Full or Release sampling was run.
          - check: Recorded carry-forward
            result: passed
            details: Explicit canonical assertions and property unions are longer than prior incorrect shortcuts; post-4.0 compaction may optimize spelling without changing semantics.
          - check: Unaffected behavior
            result: passed
