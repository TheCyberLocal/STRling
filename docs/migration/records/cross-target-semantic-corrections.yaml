change_classification:
    semantic_change:
        level: compatible
        evidence:
            - Canonical Semantic STRling meaning is unchanged; target behavior now either implements it exactly or refuses.
    public_api_change:
        level: breaking
        evidence:
            - The registered standard-library projections expose their source fingerprints as literal public constants, so governance classifies the value drift as breaking even though callable names and behavior remain stable.
        affected_surfaces:
            - python-public-api
            - typescript-public-api
    schema_change:
        level: none
        evidence: []
    diagnostic_change:
        level: additive
        evidence:
            - Reachable semantic mismatches now produce exact-profile unsupported decisions or structured post-lowering target-capability failures.
            - The two known public failed-result delivery defects remain assigned to V4-H05.
    target_behavior_change:
        level: intentional-correction
        evidence:
            - Wildcard, line, final-terminator, Unicode-word, word-boundary, folding, backreference, capture-state, compiled-size, and bytes/scalar divergences no longer emit silently different artifacts.
    architecture_change:
        level: compatible
        evidence:
            - One target-neutral semantic-compatibility module feeds existing capability evaluation and current target lowerers; no parallel profile or rewrite system exists.
    generated_output_change:
        level: compatible
        evidence:
            - Registered conformance, portability, standard-library, adapter, contract, and LSP projections are regenerated through their producers.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Strict adversarial semantic reconciliation
      command: python3 -m tooling.adversarial_semantic_audit --strict --verify-evidence
      expected_result: Two known V4-H05 findings, zero V4-H04 findings, zero unexpected findings, and zero unaccounted observations.
    - name: Target-profile and requirement soundness regression
      command: cargo test --manifest-path core/internal/Cargo.toml
      expected_result: All semantic compatibility, target lowering, serialization, profile, and post-lowering requirement tests pass.
    - name: Exact-engine differential certification
      command: Run the governed shared corpus, target runtime certifiers, and standard-library runtime evidence checks with pinned engines.
      expected_result: All executable cases agree with canonical results and every unsupported case is explicitly classified.
    - name: Architecture and governance
      command: python3 tooling/governance.py --json
      expected_result: Governance passes and all 33 architecture rules pass.
    - name: Generated artifact integrity
      command: python3 tooling/generated_artifacts.py --check --json
      expected_result: Every affected generated family is synchronized with its authoritative inputs.
    - name: Local profile
      command: ./strling profile local
      expected_result: All 36 Local operations pass.
    - name: Pull Request profile
      command: ./strling profile pull-request
      expected_result: All 76 Pull Request operations pass.
invariant_inventory:
    - invariant_id: target-semantic-equivalence-or-refusal
      architectural_claim: Every governed target artifact is semantically equivalent to the canonical program or artifact emission is explicitly refused.
      authoritative_source: docs/portability-planning.md and the governed target-profile semantic facts
      positive_allowed_form: Exact native semantics, canonical direct target serialization, certified equivalence rewrite, or a precise unsupported decision.
      forbidden_form: Native classification or artifact success when a reachable profile set, algorithm, matching-unit, or deterministic limit fact differs.
      mechanical_detection_method: Capability evaluation plus structured post-lowering requirement evaluation and the strict real-engine adversarial audit.
      current_observed_state: All 121 V4-H04 findings are absent; only the two V4-H05 diagnostic-delivery findings remain.
      expected_ratchet: Any restored silent divergence, native target rejection, or unexpected strict-audit finding fails certification.
checkpoints:
