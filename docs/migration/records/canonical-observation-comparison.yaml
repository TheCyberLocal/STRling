    diff:
        base: "52d1649003fb29ceab6cb277c0f99d0ad31e2c75"
        head: working-tree
    allowed_paths:
        - docs/migration/**
        - governance/architecture-rules.json
        - governance/change-control.json
        - governance/schemas/architecture-rules.schema.json
        - governance/quality.json
        - tooling/architecture_fitness.py
