        - spec/**
    expected_files:
        - docs/migration/observation-comparison.md
        - docs/migration/records/canonical-observation-comparison.yaml
        - tooling/migration_comparison_contract.json
        - tooling/tests/fixtures/migration_comparison/certification.json
        - tooling/migration_classification.py
        - tooling/migration_comparison_certification.py
        - tooling/migration_comparison_cli.py
        - tooling/migration_comparison.py
        - tooling/migration_comparison_engine.py
        - tooling/tests/test_migration_classification.py
        - tooling/tests/test_migration_comparison_cli.py
        - tooling/tests/test_migration_comparison_certification.py
        - tooling/tests/test_migration_comparison.py
        - tooling/tests/test_migration_comparison_engine.py
    permitted_generated_changes: []
    expected_generated_outputs: []
    required_verification_levels:
        - contract
        - unit
        - integration
        - quality
        - certification
    bounded_exemptions: []
change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: none
        evidence: []
        affected_surfaces: []
    schema_change:
        level: compatible
        evidence:
            - Adds independently versioned internal comparison artifacts without changing runner, canonical, or public schemas.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
        level: compatible
        evidence:
            - Adds an isolated non-normative comparison layer and later strengthens authority-boundary hardgates around it.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Comparison contract and focused tests
      command: python3 -m unittest tooling.tests.test_migration_comparison -v
      expected_result: Projection, comparison, classification, certification, mutation, and determinism tests pass.
    - name: Historical reference runners
      command: python3 tooling/legacy_reference/launch.py --check
      expected_result: TypeScript, Python, and cross-runner certification remain backward-compatible and deterministic.
    - name: Repository authority and integrity
      command: python3 tooling/governance.py && python3 tooling/architecture_fitness.py && python3 tooling/documentation_integrity.py && git diff --check
      expected_result: Governance, architecture, documentation, and patch integrity pass without weakening authority boundaries.
    - name: Canonical profiles
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full
      expected_result: Every available operation passes and unavailable host-dependent operations remain explicitly recorded.
checkpoints:
    - name: Comparison contract and taxonomy lock
      status: passed
      evidence:
          - check: Contract and taxonomy versions
            command: python3 -m json.tool tooling/migration_comparison_contract.json
            result: passed
            details: Locked comparison, projection, normalization, comparator, and taxonomy version 1.0.0 independently of runner protocol 1.0.0 and observation schema 1.1.0.
          - check: Faithful comparability and normalization scope
            result: passed
            details: Locked exact shared identity and surface pairing, explicit not-comparable states, one envelope-only normalization rule, complete outcome preservation, and explicit rejection of semantic-field normalization.
          - check: Affected repository verification
            command: python3 tooling/formatting.py repository --check; python3 tooling/governance.py; python3 tooling/architecture_fitness.py; python3 tooling/documentation_integrity.py; python3 tooling/security.py integrity --json; python3 tooling/security.py content --json; git diff --check
            result: passed
            details: Formatting, governance scope and declarations, architecture authority boundaries, 125-document link integrity, dependency integrity, content/workflow security, JSON parsing, and patch integrity passed.
    - name: Canonical observation projection and normalization
      status: passed
      evidence:
          - check: Projection and normalization unit contract
            command: python3 -m unittest tooling.tests.test_migration_comparison -v
            result: passed
            details: Ten focused tests cover the authorized normalization, zero normalization, stable rule ordering and rejection, repeat idempotence, provenance and semantic fingerprint sensitivity, malformed schemas and identities, semantic-field non-loss, unsupported and failure preservation, raw immutability, and source/projection matching.
          - check: Python formatting and lint
            command: ruff format --check tooling/migration_comparison.py tooling/tests/test_migration_comparison.py; ruff check tooling/migration_comparison.py tooling/tests/test_migration_comparison.py
            result: passed
            details: The new projection implementation and tests satisfy the governed Ruff format and lint policies.
          - check: Governance and patch integrity
            command: python3 tooling/governance.py; git diff --check
            result: passed
            details: Scope, change declarations, architecture boundaries, and patch integrity passed with raw runner files unchanged.
    - name: Deterministic observation pairing and comparison
      status: passed
      evidence:
          - check: Deterministic pairing and comparison tests
            command: python3 -m unittest tooling.tests.test_migration_comparison tooling.tests.test_migration_comparison_engine -v
            result: passed
            details: Twenty-three focused tests include 13 pairing/comparison cases covering normalized exact equality, single and multiple nested differences, deterministic ordering, success/failure, equal failures, success/unsupported, unsupported/unsupported, missing counterparts, incompatible surfaces, pairing rejection, mutation rejection, immutability, and repeated stability.
          - check: Pairing and difference contract
            result: passed
            details: Pairing requires the exact shared comparison case identity, request semantic tuple, projection and normalization versions, rule IDs, conceptual operation, and registered cross-runner surfaces. Differences retain stable JSON-Pointer paths, presence, values, and typed mismatch kinds without collapsing evidence.
          - check: Python quality and patch integrity
            command: ruff format --check tooling/migration_comparison_engine.py tooling/tests/test_migration_comparison_engine.py; ruff check tooling/migration_comparison_engine.py tooling/tests/test_migration_comparison_engine.py; git diff --check
            result: passed
            details: The comparison engine and tests satisfy governed Python formatting, lint, and patch-integrity requirements.
    - name: Governed discrepancy classification
      status: passed
      evidence:
          - check: Governed classification tests
            command: python3 -m unittest tooling.tests.test_migration_comparison tooling.tests.test_migration_comparison_engine tooling.tests.test_migration_classification -v
            result: passed
            details: Thirty-three focused tests include 10 classification cases covering historical-peer non-applicability, controlled unresolved migration review, every substantive disposition, correction authority and exceptional justification, supported-scope authority, replacement-adapter rejection, invalid disposition and altered-path rejection, deterministic immutability, and traceable supersession.
          - check: Disposition authority invariants
            result: passed
            details: Preservation requires equivalent replacement evidence and scope; corrections require a meaningful difference or exceptional justification plus governing authority and a corrected rule; unsupported legacy behavior requires historical evidence, a scope boundary, and scope authority; uncertainty defaults to unresolved and cannot accept equivalent observations.
          - check: Python quality and comparison immutability
            command: ruff format --check tooling/migration_classification.py tooling/tests/test_migration_classification.py; ruff check tooling/migration_classification.py tooling/tests/test_migration_classification.py; git diff --check
            result: passed
            details: Classification is independently content-addressed, never mutates comparison evidence, and satisfies governed Python formatting, lint, and patch integrity.
    - name: Comparison corpus and taxonomy certification
      status: passed
      evidence:
          - check: Certification corpus and quantitative report
            command: python3 -m unittest tooling.tests.test_migration_comparison_certification -v
            result: passed
            details: Three identical runs produced zero mismatches across 16 source observations, 16 projections, eight comparisons, four comparable and four not-comparable results, two equivalent and two differing results, four substantive classifications with one of each disposition, one peer non-applicable classification, 15 normalization applications, four malformed cases, nine detected mutations, and zero unexplained failures.
          - check: Determinism, non-loss, provenance, and conservative uncertainty
            result: passed
            details: The fixture certifies equivalent raw copies, authorized normalized equality, meaningful differences, failures, unsupported and not-exposed operations, incompatible surfaces, missing counterparts, full projection provenance, all dispositions, peer non-applicability, insufficient authority rejection, and stable content fingerprints.
          - check: Controlled property and mutation certification
            command: python3 -m unittest tooling.tests.test_migration_comparison tooling.tests.test_migration_comparison_engine tooling.tests.test_migration_classification tooling.tests.test_migration_comparison_certification -v
            result: passed
            details: All 37 focused tests pass, including detection of observation values, runner fingerprints, normalization version, deleted authority, invalid disposition, altered path, unsupported-to-success, raw mutation, and invalid unresolved promotion mutations.
    - name: Tooling integration and authority hardgates
      status: passed
      evidence:
          - check: Explicit machine-readable tooling
            command: python3 tooling/migration_comparison_cli.py certify; python3 tooling/legacy_reference/launch.py --comparison-certify
            result: passed
            details: The comparison CLI exposes project, compare, classify, and certify modes; the existing reference launcher exposes an aggregate comparison-certify mode; migration_comparison_check runs once in every versioned canonical profile.
          - check: Live shared historical evidence certification
            command: python3 tooling/legacy_reference/launch.py --comparison-certify
            result: passed
            details: Three repeated runs over all 44 source observations selected 24 observations across 12 stable shared cases, produced 24 projections and 12 comparable results with six equivalent and six differing relationships, applied 24 authorized normalizations, left 20 runner-specific observations unpaired, classified six historical divergences as unresolved, emitted six peer non-applicable results, and reported zero mismatches and zero unexplained failures.
          - check: Authority architecture hardgates
            command: python3 -m unittest tooling.tests.test_legacy_reference_architecture tooling.tests.test_quality -v; python3 tooling/architecture_fitness.py
            result: passed
            details: Product, binding, kernel, target, and specification sources cannot reference comparison artifacts, taxonomy dispositions, unresolved state, or historical consensus; comparison tooling cannot carry source-rewrite tokens or acceptance mappings; historical majority and consensus remain non-authoritative; the contract and normalization rules remain tooling-owned.
          - check: Historical runners and comparison stack
            command: python3 tooling/legacy_reference/launch.py --check; python3 -m unittest tooling.tests.test_migration_comparison tooling.tests.test_migration_comparison_engine tooling.tests.test_migration_classification tooling.tests.test_migration_comparison_certification tooling.tests.test_migration_comparison_cli tooling.tests.test_legacy_reference_architecture tooling.tests.test_quality tooling.legacy_reference.tests.test_launch -v
            result: passed
            details: Both independently versioned runners, cross-runner certification, and all 104 affected comparison, classification, certification, CLI, launcher, architecture, and profile tests pass.
          - check: Product, contract, and repository verification
            result: passed
            details: TypeScript direct typecheck/build and 963 tests pass; Python package build and 789 tests pass; Rust fmt, Clippy, check, build, and tests pass; canonical, core, public, baseline, generated-artifact, security, governance, documentation, TypeScript/documentation formatting, affected Python formatting/lint, and patch-integrity checks pass.
          - check: Canonical profiles
            command: ./strling profile local; ./strling profile pull-request; ./strling profile full
            result: not_run
            details: Comparison certification passed in every profile and no operation failed. Local reported 19 passed and six unavailable; pull-request 38 passed and seven unavailable; full 67 passed and ten unavailable. The common host constraint is installed Ruff 0.16.2 versus pinned 0.15.21; pull-request/full also report the pre-existing Bundler version mismatch, and full reports network dependency risk unavailable. Requirements were not weakened. WSL, TypeScript, Python, Rust, and all platform-dependent full-profile build/test operations otherwise executed.
    - name: Comparison readiness and corpus-gate handoff
      status: passed
      evidence:
          - check: Versioned comparison architecture
            result: passed
            details: Comparison schema 1.0.0, projection schema 1.0.0, normalization rules 1.0.0, comparator implementation 1.0.0, and discrepancy taxonomy 1.0.0 are independently identified; the comparator source identity is sha256:7602cea37c4cc6a58737bc4403e706bca11f67b1412360d20a205e985efecc71.
          - check: Normalization non-loss record
            result: passed
            details: select-semantic-outcome@1.0.0 removes only the validated runner-owned envelope by selecting the complete outcome subtree; it preserves status, success evidence, legacy failures, unsupported outcomes, ordering, text, diagnostics, positions, options, and semantic shapes. Focused projection, fingerprint-sensitivity, immutability, and mutation tests provide semantic non-loss evidence.
          - check: Certified quantitative evidence
            result: passed
            details: The fixture certifies 16 observations, 16 projections, eight comparisons, four comparable and four not-comparable results, two equivalent and two differing results, one of each substantive disposition, 15 normalization applications, three repeat runs, four malformed cases, nine detected mutations, zero mismatches, and zero unexplained failures. Live historical certification covers 44 observations, 24 projections, 12 comparable comparisons, six equivalent and six differing results, six unresolved discrepancies, 24 normalization applications, three repeats, zero mismatches, and zero unexplained failures.
          - check: Product behavior preservation
            result: passed
            details: No existing STRling runtime/compiler behavior intentionally changed. TypeScript, Python, other legacy bindings, the Rust kernel, Semantic IR, diagnostics, safety analysis, portability planning, target behavior, package APIs, package versions, and publication state remain unchanged.
          - check: Ordered carry-forward
            result: passed
            details: The complete migration-corpus execution and unresolved-difference gate remain intentionally out of scope and are handed to P07-T04, Run the complete migration corpus and gate unresolved differences, the next ordered incomplete task in the Notion source of truth.
