change_classification:
    semantic_change:
        level: none
        evidence:
            - The matrices consume versioned profiles, authored corpus authority, canonical support evidence, and structured certification results; they cannot create language semantics, expectations, target capabilities, adapter behavior, or support promises.
    public_api_change:
        level: none
        evidence:
            - Binding APIs, package entrypoints, compiler protocols, and consumer-facing compatibility promises remain unchanged; the new surfaces are engineering certification evidence only.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - CP2 adds one engineering-only evidence schema for the matrix manifest and generated certification artifact without modifying any product, compiler, target-profile, or adapter contract.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Diagnostic expectations and runtime results remain producer-owned evidence and cannot be reinterpreted by matrix aggregation.
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, lowering, serialization, real-engine harnesses, corpus cases, and checked target observations are read-only inputs.
    architecture_change:
        level: additive
        evidence:
            - Adds one evidence-only aggregation and completeness boundary downstream of existing target, adapter, package, public-contract, and structured-profile certifiers.
    generated_output_change:
        level: additive
        evidence:
            - CP4 registers one deterministic evidence family containing the machine-readable target/adapter matrix and its documentation-ready Markdown projection; both derive from the same checked Full-profile source bundle and controller.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Matrix schema, evidence contract, and mutation corpus
      command: python3 -m unittest tooling.tests.test_target_adapter_certification_matrix -v
      expected_result: Exact target and adapter coordinates validate; missing, duplicate, stale, mismatched-version, unexecuted-supported, status-tampered, tier-invalid, fingerprint-invalid, and nondeterministic evidence fails closed.
    - name: Evidence-only architecture and generated ownership
      command: python3 -m unittest tooling.tests.test_target_adapter_certification_matrix_architecture tooling.tests.test_quality tooling.tests.test_governance -v && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py
      expected_result: The controller consumes only governed machine-readable authority and certification evidence, owns one registered generated family, and has no semantic, target-runtime, adapter implementation, package-manager, publication, support-policy, or external regex-conformance authority.
    - name: Exact target and adapter matrix certification
      command: python3 -m tooling.target_adapter_certification_matrix --check --json
      expected_result: All five exact target profiles and all seventeen retained adapter rows have complete tier-appropriate cells, exact engine/runtime/platform and package coordinates, structured evidence links and fingerprints, one explicit status, and a reproducible last-certified commit.
    - name: Real execution and repository profiles
      command: python3 -m tooling.pcre2_runtime_certification --json --repeat-runs 2 && python3 -m tooling.ecmascript_runtime_certification --json --repeat-runs 2 && python3 -m tooling.python_re_runtime_certification --json --repeat-runs 2 && python3 -m tooling.shared_cross_engine_corpus --json --check --repeat-runs 2 && python3 -m tooling.stdlib_runtime_certification --json --check --repeat-runs 2 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check
      expected_result: Governed exact-engine, shared-corpus, standard-library, adapter/runtime/package, structured certification, documentation, architecture, governance, and profile evidence executes; every failed, unavailable, waived, unsupported, or not-applicable cell remains exact rather than being promoted to supported.
