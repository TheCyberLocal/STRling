change_classification:
    semantic_change:
        level: none
        evidence:
            - The matrices consume versioned profiles, authored corpus authority, canonical support evidence, and structured certification results; they cannot create language semantics, expectations, target capabilities, adapter behavior, or support promises.
    public_api_change:
        level: none
        evidence:
            - Binding APIs, package entrypoints, compiler protocols, and consumer-facing compatibility promises remain unchanged; the new surfaces are engineering certification evidence only.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - CP2 adds one engineering-only evidence schema for the matrix manifest and generated certification artifact without modifying any product, compiler, target-profile, or adapter contract.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Diagnostic expectations and runtime results remain producer-owned evidence and cannot be reinterpreted by matrix aggregation.
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, lowering, serialization, real-engine harnesses, corpus cases, and checked target observations are read-only inputs.
    architecture_change:
        level: additive
        evidence:
            - Adds one evidence-only aggregation and completeness boundary downstream of existing target, adapter, package, public-contract, and structured-profile certifiers.
    generated_output_change:
        level: none
        evidence:
            - CP1 changes no registered generated output; CP2 must update the declaration and permission before registering the future matrix family.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Matrix schema, evidence contract, and mutation corpus
      command: python3 -m unittest tooling.tests.test_target_adapter_certification_matrix -v
      expected_result: Exact target and adapter coordinates validate; missing, duplicate, stale, mismatched-version, unexecuted-supported, status-tampered, tier-invalid, fingerprint-invalid, and nondeterministic evidence fails closed.
    - name: Evidence-only architecture and generated ownership
      command: python3 -m unittest tooling.tests.test_target_adapter_certification_matrix_architecture tooling.tests.test_quality tooling.tests.test_governance -v && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py
      expected_result: The controller consumes only governed machine-readable authority and certification evidence, owns one registered generated family, and has no semantic, target-runtime, adapter implementation, package-manager, publication, support-policy, or external regex-conformance authority.
    - name: Exact target and adapter matrix certification
      command: python3 -m tooling.target_adapter_certification_matrix --check --json
      expected_result: All five exact target profiles and all seventeen retained adapter rows have complete tier-appropriate cells, exact engine/runtime/platform and package coordinates, structured evidence links and fingerprints, one explicit status, and a reproducible last-certified commit.
    - name: Real execution and repository profiles
      command: python3 -m tooling.pcre2_runtime_certification --json --repeat-runs 2 && python3 -m tooling.ecmascript_runtime_certification --json --repeat-runs 2 && python3 -m tooling.python_re_runtime_certification --json --repeat-runs 2 && python3 -m tooling.shared_cross_engine_corpus --json --check --repeat-runs 2 && python3 -m tooling.stdlib_runtime_certification --json --check --repeat-runs 2 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check
      expected_result: Governed exact-engine, shared-corpus, standard-library, adapter/runtime/package, structured certification, documentation, architecture, governance, and profile evidence executes; every failed, unavailable, waived, unsupported, or not-applicable cell remains exact rather than being promoted to supported.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and campaign reconciliation
            result: passed
            details: P18-T02 starts from clean architecture/v4 anchor fc62600d5de03212db332fa6a466d132306fca45 after P18-T01 closed READY WITH RECORDED CARRY-FORWARD. Notion P18-T02 is In Progress with normalized CP1 through CP4 and FINAL children.
          - check: Governed target denominator
            result: passed
            details: >-
                The repository owns exactly five immutable target-profile coordinates: PCRE2 10.42 and 10.43, ECMAScript 2024, and Python re 3.11 text and bytes. Shared corpus v1 owns 20 vectors and 100 explicit vector/profile applications; the existing portability matrix records 87 native, one equivalent rewrite, five unsupported or constrained, seven not applicable, and zero unresolved applications.
          - check: Governed adapter denominator and tier boundary
            result: passed
            details: Binding-support evidence fingerprints seventeen retained language adapters, eighteen enforced public surfaces, twelve supported-candidate rows, five preview-candidate rows, and zero legacy-candidate rows. P18-T02 certifies tier-appropriate evidence dispositions; P20-T01 retains permanent consumer-facing support-tier authority.
          - check: Carry-forward and ownership boundary
            result: passed
            details: Exact PCRE2, Node, and CPython provisioning; shared and standard-library execution; F# clean-build findings; and Python package failure are T02 matrix inputs. Python source-distribution repair remains P20-T02, dependency-risk remediation remains P18-T05, and global engine research remains external regex-conformance authority. No binding, package, profile, corpus, semantic, API, support-tier, publication, release, upload, push, or workflow change is authorized.
          - check: Task-record and checkpoint proof
            result: passed
            details: Clean Linux governance validates the four-file CP1 diff, task-record schema, exact scope, change declarations, and every enforced architecture rule. All 39 governance mutation tests pass; documentation integrity validates seven executable examples and links across 199 files; repository formatting and patch integrity pass.
    - name: Verification design and evidence contract
      status: passed
      evidence:
          - check: Versioned matrix and manifest schema
            result: passed
            details: The Draft 2020-12 governance schema separately validates an authored source manifest and a deterministic evidence artifact. It fixes exact repository/authority identities, target and adapter coordinates, six matrix statuses, source-result and structured-check provenance, evidence links, waiver discipline, last-certified commit, coverage parity, aggregate counts, and the rule that only a passed cell may be certified.
          - check: Closed target and adapter denominator
            result: passed
            details: Five registered target profiles each require seven obligations, yielding 35 target cells. Twelve Supported-candidate adapters each require five obligations and five Preview-candidate adapters each require four reduced obligations, yielding 80 adapter cells and 115 total. A three-obligation Legacy policy is explicit even though the current registry contains zero Legacy rows.
          - check: Governed evidence-source mapping
            result: passed
            details: The manifest pins Full profile 1.20.0 at definition fingerprint 05c94ef43ac06ee5932d654850f3112a3e28cc382928a6356dc1e6fb039f05e7. Every target maps to its exact runtime check plus shared-corpus and stdlib producers; all seventeen adapters map runtime, package, public-contract, environment, and quality evidence to existing Full-profile result IDs. PCRE2 10.42 and 10.43 retain distinct check identities.
          - check: Positive, boundary, and mutation proof
            result: passed
            details: Eight focused contract tests validate the positive artifact, current target and binding-support registries, exact Full-profile membership, five-profile and seventeen-adapter closure, 35/80/115 counts, required source coverage, external regex-conformance exclusion, and eleven single-delta fail-closed mutations for missing/duplicate/stale/tampered/false-claim/waiver/status defects.
          - check: Real producer-shape reconnaissance
            result: passed
            details: Governed Linux samples passed exact PCRE2 10.42/10.43 and Node 22.23.2 producers and the TypeScript/Python, JVM, .NET, Go/Dart/Swift, dynamic-language, and Go/Dart/Swift package producers. Exact CPython 3.11.15 remained explicitly unavailable. The sampled payload fields and check IDs are represented directly; family evidence is never promoted beyond its authored adapter mapping.
          - check: Clean evidence-contract integration proof
            result: passed
            details: Clean Linux passes all eight focused tests, task schema and nine-path scope, change declarations, every enforced architecture rule, documentation integrity across 199 files, and patch integrity. Host repository formatting passes.
