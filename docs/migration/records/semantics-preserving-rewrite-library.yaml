title: Semantics-preserving rewrite library
status: complete
objective: Extend the governed equivalence registry into a deliberately closed rewrite library with complete proof, counterexample, provenance, capability, target-applicability, and exact-runtime evidence; retain atomic-literal portability rewriting, add only request-driven non-possessive exact-once repetition elision, and prevent diagnostics or incomplete evidence from authorizing mutation.
