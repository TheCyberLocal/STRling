commits:
    - sha: 5067cc8050269370a99bf711c01b9c424f736a12
      subject: "spec(frontend): freeze regex compatibility dialect"
completion:
    accomplished:
        - Froze the compatibility/import frontend identity as strling.regex-compat@1.0.0 with explicit UTF-8 SourceDocument metadata, syntax-only authority, no target inference, and Semantic IR as its sole future lowering destination.
        - Published a versioned EBNF, two schemas, 51 feature decisions, 45 stable diagnostic identities, 30 positive fixtures, 45 negative fixtures, and a signed specification-authored manifest.
        - Added deterministic contract certification, canonical contract-suite integration, a frontend authority architecture hardgate, mutation coverage, operator documentation, and supersession notices on the transitional grammar evidence.
    verified:
        - Standalone certification passes with fingerprint sha256:0cb32dd3ed534d13ce6d4278a2723898ac40bc374fa6d40c5ac43c553a2265ad; canonical integration passes with 11 compiler schemas and the separate two-schema frontend domain.
        - All 16 focused frontend tests, 46 architecture tests, and 34 governance tests pass, including manifest tampering, malformed diagnostic offsets, missing coverage, forbidden semantic/target authority, and real-repository boundary checks.
        - Documentation integrity passes across 130 files; pinned Prettier 3.3.3 and Ruff 0.15.21 checks pass; Git whitespace validation is clean.
        - P07-T04 corpus, contract, route, and canonical-boundary fingerprints remain unchanged. The Linux-certified live observation replay could not run because the host WSL service was unavailable, and no environment-specific Windows result was promoted into the baseline.
    behavior_changed: No parser, compiler, emitter, semantic IR, target, runtime, binding, package, or public API behavior changed; this task adds a versioned compatibility source specification and its engineering enforcement only.
    intentional_behavior_changes:
        - The normative specification hub now recognizes strling.regex-compat@1.0.0 as a bounded compatibility/import frontend rather than treating the transitional unversioned grammar as authority.
        - Canonical contract validation now certifies the independently versioned frontend contract, and architecture fitness blocks compatibility syntax from self-promoting into semantic or target authority.
    preserved_behavior:
        - Existing Python and TypeScript parser behavior, the 177 historical pattern fixtures, the 44 governed differential observations, canonical compiler contracts, Semantic IR, target profiles, and generated behavior remain unchanged.
        - The former unversioned grammar and semantics files remain in place as explicitly superseded historical evidence; no legacy file was rewritten into a parser implementation.
    transitional_architecture:
        - The frontend contract deliberately has no parser implementation in P08-T01; P08-T02 owns porting the parser against this frozen authority.
        - Native Linux aggregate governance/profile and live baseline replay remain a recorded host carry-forward because the WSL service cannot create new sessions (Wsl/Service/0x80072747). Equivalent Windows checks passed where portable, and Windows observation fingerprints were not accepted as a baseline update.
    deferred_work:
        - Implement P08-T02, the canonical parser for strling.regex-compat@1.0.0, without changing this contract silently.
        - Replay the native Linux migration differential and aggregate profiles when WSL host service capacity is restored, before treating any future runtime observation change as reviewed.
readiness:
    status: READY WITH RECORDED CARRY-FORWARD
    next_task: Build P08-T02, the canonical parser port for the frozen strling.regex-compat@1.0.0 dialect, while preserving syntax-only frontend authority.
    rationale: The complete frontend contract is versioned, specification-authored, fingerprinted, mutation-tested, integrated, documented, and architecture-bounded with no runtime change. Only native Linux aggregate/profile replay is carried forward because the WSL host service is unavailable; no baseline or product behavior was weakened to accommodate that environment.
