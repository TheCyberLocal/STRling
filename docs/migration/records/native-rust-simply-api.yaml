record_version: 2.0.0
title: Native Rust Simply API
status: in_progress
objective: Implement an idiomatic, public, host-facing Rust construction layer that mechanically covers the complete strling.simply-builder 1.0.0 protocol by building canonical Semantic IR candidates directly, enforcing deterministic identity/provenance/ownership/error rules, delegating normalization and compilation to the existing kernel, and proving exact equivalence without creating a parallel semantic model, compiler, target path, runtime, or other-language adapter.
