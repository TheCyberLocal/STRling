    rationale: P13-T02 satisfies every task-owned implementation, equivalence, ownership, property, public-contract, architecture, documentation, migration, Local, Pull Request, and clean-tree requirement. The only unavailable Pull Request operation is the inherited missing Swift toolchain; it has no task-owned failure or waiver and does not affect this Rust frontend boundary.
