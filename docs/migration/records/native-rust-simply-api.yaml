change_classification:
    semantic_change:
        level: none
        evidence:
            - Every builder operation maps mechanically to the completed Simply protocol and already-ratified Semantic IR; no construct or meaning changes.
    public_api_change:
        level: additive
        evidence:
            - The non-published strling-kernel crate gains an intentional native Rust Simply construction surface and root re-exports; no published binding/package surface changes.
        affected_surfaces:
            - strling-kernel
    schema_change:
        level: none
        evidence:
            - Protocol 1.0.0 and canonical compiler schemas remain unchanged and are implementation inputs.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Stable STRL-SIMPLY code/path records are construction API errors, not new canonical Diagnostic values or product-visible diagnostics.
    target_behavior_change:
        level: none
        evidence:
            - The API constructs semantic requests only; existing profiles, planning, lowering, serializers, artifacts, and runtimes remain unchanged.
    architecture_change:
        level: additive
        evidence:
            - Adds one Rust host-construction boundary that depends inward on semantic contracts, canonical normalization, CompileRequest, and the existing compile facade while prohibiting reverse dependencies and alternate orchestration.
    generated_output_change:
        level: additive
        evidence:
            - The enforced strling-kernel source snapshot intentionally records the new module, re-exports, public types, and method signatures.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Complete protocol operation and error coverage
      command: cargo test --manifest-path core/Cargo.toml --test simply_api --test simply_properties --locked
      expected_result: All 15 operations, semantic options, identities, imports, ownership/cloning cases, stable errors, determinism, serialization, immutability, and bounded malformed inputs pass without partial mutation or panics.
    - name: Canonical equivalence and compile-through behavior
      command: cargo test --manifest-path core/Cargo.toml --test simply_builder_contract --test simply_compile_through --locked
      expected_result: Native constructors reproduce every authored protocol fixture exactly after canonical normalization and yield the same diagnostics, analysis, portability, and target artifacts as equivalent direct semantic requests through the sole kernel facade.
    - name: Public API and architecture fitness
      command: python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/core_contract_validation.py && python3 -m unittest tooling.tests.test_public_contracts tooling.tests.test_core_contracts && python3 tooling/governance.py
      expected_result: The additive Rust surface is declared and snapshotted; mutations reject second models/compilers, parser/target/runtime/emitter/binding dependencies, hidden target syntax, ambient state, and protocol inventory drift.
    - name: Rust and repository quality
      command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && cargo test --manifest-path core/Cargo.toml --all-targets --locked && python3 -m unittest discover -s tooling/tests && python3 tooling/documentation_integrity.py && ./strling migration-differential --repeat-runs 3 && git diff --check
      expected_result: Every affected and repository hardgate passes with a deliberate reviewed canonical-boundary/public-snapshot baseline renewal only where required.
    - name: Certification profiles and cleanliness
      command: ./strling profile local && ./strling profile pull-request && git status --short
      expected_result: All task-owned and available operations pass, unavailable inherited tools remain explicit without waiver, and the final tree is clean.
checkpoints:
    - name: Protocol, kernel, and Rust surface inventory
      status: passed
      evidence:
          - check: Canonical dependency audit
            result: passed
            details: P13-T01 protocol 1.0.0 closes 15 operations, four semantic options, 12 stable failures, deterministic generated IDs, import-preserving provenance, and immutable single-parent ownership. Canonical Rust Node/SemanticProgram, normalize, CompileRequest, compile, target profiles, and validation already own all later semantics; the native API needs only a construction graph and conversions.
          - check: Public contract and profile audit
            result: passed
            details: strling-kernel is an enforced non-published Rust source surface. Its snapshot extractor currently owns lib.rs and kernel.rs only and must intentionally expand to Simply declarations. Local and Pull Request already execute the complete core suite; no new runner or profile operation is required.
    - name: Locked native API and ownership boundary
      status: passed
      evidence:
          - check: Direct canonical construction
            result: passed
            details: SimplyBuilder will store canonical Node candidates directly behind opaque stable handles. Explicit step/capture keys derive node:simply and capture:simply identities. All methods validate before mutation; cloned handles remain immutable references and a second materializing parent fails as reused_value. Group is transparent provenance, imports retain canonical IDs/origins/sources, and finishing consumes the builder into normalized SemanticProgram or CompileRequest.
          - check: Exclusions and delegation
            result: passed
            details: The surface exposes protocol argument types plus canonical semantic/request types only. It will not parse regex, model targets, emit syntax, execute runtimes, inspect ambient state, call analysis/planning/lowering stages directly, or expose a second compile function. Compile-through tests call the existing crate-root compile facade with the produced request.
    - name: Native implementation, equivalence, and properties
      status: passed
      evidence:
          - check: Complete public API and executable protocol proof
            command: RUSTFLAGS=-Dwarnings cargo test --manifest-path core/Cargo.toml --all-targets --locked
            result: passed
            details: SimplyBuilder and its opaque immutable values implement all 15 protocol operations directly over canonical Node candidates. Nine authored positive fixtures reproduce exact SemanticProgram and CompileRequest values; all 12 error identities, atomic failure, duplicate and foreign identities, ownership/reuse, imports/provenance, resource limits, deterministic JSON, 256 fixed seeds, malformed bounded inputs, and no-panic behavior pass.
    - name: Compile-through and architecture/public-surface certification
      status: passed
      evidence:
          - check: One-kernel behavior and controlled boundary failures
            command: cargo test --manifest-path core/Cargo.toml --test simply_compile_through --locked; python3 tooling/public_contracts.py --check; python3 tooling/generated_artifacts.py --check; python3 -m unittest tooling.tests.test_public_contracts tooling.tests.test_core_contracts
            result: passed
            details: Direct and Simply-built requests yield exact CompileResult JSON equality for target-neutral analysis, native PCRE2 portability, ECMAScript certified rewrite, Python re unsupported behavior, and PCRE2 artifact/unavailable paths through the sole compile facade. The strling-kernel snapshot additively records the module, root re-exports, public types, fields, constants, enum variants, and methods. Controlled mutations reject a second model/compiler, parser or regex authority, target/emitter/runtime stages, ambient state, bindings, process access, and signature drift.
    - name: Complete repository and task certification
      status: passed
      evidence:
          - check: Task-closing hardgates
            command: cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings; cargo test --manifest-path core/Cargo.toml --all-targets --locked; python3 -m unittest discover -s tooling/tests; ./strling format --check all; ./strling generate --check --json; ./strling contracts --check --json; ./strling governance --json; ./strling migration-differential --repeat-runs 3; ./strling profile local; ./strling profile pull-request; git diff --check; git status --short
            result: passed
            details: At clean implementation commit a26a3a1966bd68c2ce25067106dd89465f3b5a68, warning-denied Clippy and every Rust target pass; all 502 tooling tests pass; canonical/core/Simply/public/generated contracts, formatting, linting, governance, security, documentation integrity across 151 files, and patch integrity pass. The reviewed three-run differential certifies 44 observations with zero mismatches or blocking unresolved replacements at baseline sha256:3676dbe20c75ccd159aadd325ad2ada0a1a8736ae65591d956582f6352b3f0f4 and canonical boundary sha256:52abcfd126a02765086e93256cae70af4c1c86763f424136d879f0e52cca3eda. Local passes 26/26. Pull Request passes every available operation, 45/46, with only inherited missing Swift explicitly unavailable and no failures or waivers. The profile-generated untracked Python venv was removed and the final task tree is clean.
