completion:
    accomplished:
        - Preserved every nonempty structured target-lowering or serialization diagnostic through the canonical kernel, CompileResult, JSON CLI, human CLI, and interop boundaries while suppressing failed artifacts.
        - Converted the exact-engine adversarial corpus into an enforced current-source, zero-finding generated-artifact hardgate inherited by Local and Pull Request.
        - Closed the V4-H01 through V4-H05 campaign with all 148 original findings permanently accounted for and P20-T02 reactivated as the next task.
    verified:
        - Focused kernel, protocol, CLI, interop, audit, negative, LSP, target-profile, requirement-soundness, semantic-equivalence, architecture, governance, generated-artifact, contract, documentation, formatting, lint, Local, and Pull Request checks pass.
        - The final exact-engine strict audit contains zero known, unexpected, observed, unreproduced, or unaccounted findings, and both required profiles pass at one clean implementation SHA.
    behavior_changed: Governed target-emission failures that already carried canonical diagnostics now return valid failed CompileResults with public exit code 2 instead of losing their diagnostics in an internal stage failure with exit code 70.
    intentional_behavior_changes:
        - JSON callers receive a parseable failed CompileResult on stdout, human callers receive the actual canonical diagnostic, and interop callers receive the same completed failure result for the two PCRE2 compiled-size refusals.
        - The registered adversarial evidence verifier now rejects any nonzero finding inventory and any stale audit-input identity in mandatory Local and Pull Request profiles.
    preserved_behavior:
        - Canonical semantic meaning, target lowering and regex text, target-profile schemas and identities, diagnostic codes, exit-code categories, successful artifacts, source maps, options, and thin binding semantics remain unchanged.
        - Performance measurements, baselines, ceilings, samples, statistics, conditioning, isolation, certification policy, target-engine scope, package versions, publication state, and release tags remain unchanged.
    transitional_architecture: []
    deferred_work:
