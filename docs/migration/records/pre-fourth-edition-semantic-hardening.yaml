change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: none
        evidence:
            - Existing CompileResult failure semantics become reachable for governed target-emission failures without changing any public protocol, CLI, interop, or schema surface.
        affected_surfaces: []
    schema_change:
        level: none
        evidence: []
    diagnostic_change:
        level: intentional-correction
        evidence:
            - Canonical target-emission diagnostics will survive the kernel boundary and reach JSON, human CLI, and interop callers.
        affected_surfaces:
            - compiler-diagnostics
            - cli
    target_behavior_change:
        level: intentional-correction
        evidence:
            - Generated target-conformance observations change from an unreachable generic kernel failure to the already-governed explicit target refusal; emitted regex semantics and target lowering remain unchanged.
        affected_surfaces:
            - target-emission-result
    architecture_change:
        level: compatible
        evidence:
            - Typed target failures with diagnostics will use the existing CompileResult contract; missing diagnostic payloads remain internal stage failures.
    generated_output_change:
        level: compatible
        evidence:
            - The registered adversarial observation family will be regenerated from the corrected public result path.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Emission diagnostic delivery
      command: cargo test --manifest-path core/internal/Cargo.toml --test emission_diagnostic_delivery
      expected_result: Structured target failures remain failed CompileResults and invalid failure/artifact combinations fail closed.
    - name: CLI and interop delivery
      command: Run focused canonical CLI and bindings/interop protocol tests.
      expected_result: JSON and human output preserve diagnostics with exit code 2, and interop returns a completed failed CompileResult.
    - name: Strict adversarial semantic hardgate
      command: python3 -m tooling.adversarial_semantic_audit --strict
      expected_result: Zero known, unexpected, unreproduced, and unaccounted findings.
    - name: Architecture and governance
      command: python3 tooling/governance.py --json
      expected_result: Governance passes and all 33 architecture rules pass.
    - name: Generated artifact integrity
      command: python3 tooling/generated_artifacts.py --check --json
      expected_result: Every affected generated family is synchronized with authoritative inputs.
    - name: Local profile
      command: ./strling profile local
      expected_result: All 36 Local operations pass.
    - name: Pull Request profile
      command: ./strling profile pull-request
      expected_result: All 76 Pull Request operations pass, including the zero-finding adversarial hardgate.
    - name: Certification decision
      command: Inspect toolchain.json and governance/certification-profiles.md before selecting Full or Release.
      expected_result: Sampling is run only if the registered completion contract requires it for this non-release-candidate checkpoint.
invariant_inventory:
    - invariant_id: governed-emission-failure-delivery
      architectural_claim: Every target failure carrying structured diagnostics becomes a valid failed CompileResult; only genuine internal failures bypass that result contract.
      authoritative_source: spec/contracts/1.0/PROTOCOL.md and core/src/protocol/result.rs
      positive_allowed_form: A failed result with canonical error diagnostics, no publishable artifact, deterministic identity, and public exit code 2.
      forbidden_form: Discarding structured target diagnostics into a generic kernel stage error, or returning a failed/incomplete artifact as successful.
      mechanical_detection_method: Kernel, protocol, CLI, interop, and strict adversarial tests plus CompileResult validation.
      current_observed_state: Two PCRE2 serialization-limit paths lose STRL-PCRE2_LOWERING-0014 at project_target_artifact and exit 70 with empty stdout.
      expected_ratchet: The registered adversarial generated-family check requires current source identity and zero findings in Local and Pull Request.
checkpoints:
    - name: Starting state and reproduction
      status: passed
      evidence:
          - check: Starting repository state
            result: passed
            details: dev was clean at 73cb34e443e605f18033887867958b2048c1b65d and identical to origin/dev before modification.
          - check: Exact strict audit reproduction
            command: python3 -m tooling.adversarial_semantic_audit --strict
            result: passed
            details: Pinned Node 22.23.2, PCRE2 10.42 and 10.43, and CPython 3.11.15 reproduced exactly two known findings with zero unexpected or unaccounted observations.
          - check: First causal boundary
            result: passed
            details: PCRE2 profiles 10.42 and 10.43 produce STRL-PCRE2_LOWERING-0014 with source span and exact-profile identity, but core/src/kernel.rs converts each typed lowering failure to KernelCompileError::StageFailure; the CLI exits 70 with empty stdout and generic stderr, so no CompileResult or artifact emission_diagnostics is reachable.
    - name: Contract implementation and focused tests
      status: passed
      evidence:
          - check: Kernel failure projection
            command: cargo test --manifest-path core/internal/Cargo.toml --lib --test emission_diagnostic_delivery --test canonical_cli --test protocol_contracts
            result: passed
            details: 51 tests pass; all six current lowering/serialization failure paths preserve nonempty diagnostic vectors, empty payloads remain typed stage failures, both PCRE2 profile refusals retain code/message/span/profile evidence, JSON and human CLI return exit 2, and invalid result/artifact mutations fail closed.
          - check: Interop transport
            command: cargo test --manifest-path bindings/interop/Cargo.toml --test protocol
            result: passed
            details: All 11 protocol tests pass; both PCRE2 failures are completed adapter responses containing the canonical failed CompileResult rather than binding-synthesized diagnostics.
          - check: Diagnostic catalog consistency
            result: passed
            details: STRL-PCRE2_LOWERING-0014 remains the closed Pcre2LoweringErrorCode::IntroducedRequirement identity; no ad hoc code, schema, or generated diagnostic catalog change is required.
    - name: Audit hardgate and generated evidence
      status: passed
      evidence:
          - check: Strict current-source audit
            command: python3 -m tooling.adversarial_semantic_audit --strict
            result: passed
            details: The 41-program, 95-subject exact-engine audit reports zero known remaining, zero unexpected, zero unaccounted, and zero observed findings; both prior delivery findings are resolved.
          - check: Registered evidence generation
            command: python3 -m tooling.adversarial_semantic_audit --write
            result: passed
            details: The exact producer ran twice from source checkpoint b936882011fe169c0412d4a1faea783b7bc7f177 on pinned engines and wrote 41 shards with run identity 1d33ff1a60d826a3bd2f309f9b70b98624d0adeceb0786827d2eeef2da10757b and evidence fingerprint 4dfadc2a6770033d63dbea1a1ccaae0195658de09a55b0d15589ccc5014872ca.
          - check: Offline audit ratchet
            command: python3 -m tooling.adversarial_semantic_audit --check && python3 -m unittest tooling.tests.test_adversarial_semantic_audit
            result: passed
            details: The zero-finding current-source evidence check passes and all 29 corpus, transport, identity, negative, and hardgate tests pass.
    - name: Repository verification and campaign closure
      status: in_progress
      evidence:
          - check: Public contract projection
            command: ./strling contracts && ./strling contracts --check
            result: passed
            details: All public surfaces are unchanged, including strling-kernel, root CLI, interop, and target-artifact schema projections.
          - check: Full and Release selection
            result: passed
            details: docs/releasing.md reserves Full and no-reuse Release for the stable candidate prepared/certified by P20-T04; V4-H05 is a non-release-candidate deterministic hardening checkpoint, so no sampled profile is required or run before P20-T02 dry-run work resumes.
