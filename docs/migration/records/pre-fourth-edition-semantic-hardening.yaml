change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: none
        evidence:
            - Existing CompileResult failure semantics become reachable for governed target-emission failures without changing any public protocol, CLI, interop, or schema surface.
        affected_surfaces: []
    schema_change:
