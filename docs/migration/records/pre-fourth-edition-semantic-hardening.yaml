required_verification:
    - name: Emission diagnostic delivery
      command: cargo test --manifest-path core/internal/Cargo.toml --test emission_diagnostic_delivery
      expected_result: Structured target failures remain failed CompileResults and invalid failure/artifact combinations fail closed.
    - name: CLI and interop delivery
      command: Run focused canonical CLI and bindings/interop protocol tests.
      expected_result: JSON and human output preserve diagnostics with exit code 2, and interop returns a completed failed CompileResult.
    - name: Strict adversarial semantic hardgate
      command: python3 -m tooling.adversarial_semantic_audit --strict
      expected_result: Zero known, unexpected, unreproduced, and unaccounted findings.
    - name: Architecture and governance
      command: python3 tooling/governance.py --json
      expected_result: Governance passes and all 33 architecture rules pass.
    - name: Generated artifact integrity
      command: python3 tooling/generated_artifacts.py --check --json
      expected_result: Every affected generated family is synchronized with authoritative inputs.
    - name: Local profile
      command: ./strling profile local
      expected_result: All 36 Local operations pass.
    - name: Pull Request profile
      command: ./strling profile pull-request
      expected_result: All 76 Pull Request operations pass, including the zero-finding adversarial hardgate.
    - name: Certification decision
      command: Inspect toolchain.json and governance/certification-profiles.md before selecting Full or Release.
      expected_result: Sampling is run only if the registered completion contract requires it for this non-release-candidate checkpoint.
invariant_inventory:
    - invariant_id: governed-emission-failure-delivery
      architectural_claim: Every target failure carrying structured diagnostics becomes a valid failed CompileResult; only genuine internal failures bypass that result contract.
      authoritative_source: spec/contracts/1.0/PROTOCOL.md and core/src/protocol/result.rs
      positive_allowed_form: A failed result with canonical error diagnostics, no publishable artifact, deterministic identity, and public exit code 2.
      forbidden_form: Discarding structured target diagnostics into a generic kernel stage error, or returning a failed/incomplete artifact as successful.
      mechanical_detection_method: Kernel, protocol, CLI, interop, and strict adversarial tests plus CompileResult validation.
      current_observed_state: All six typed target-failure paths preserve nonempty structured diagnostics as failed CompileResults; the two PCRE2 serialization-limit cases reach JSON, human CLI, and interop callers with exit 2 and no artifact.
      expected_ratchet: The registered adversarial generated-family check requires current source identity and zero findings in Local and Pull Request, while protocol validation rejects contradictory failure/artifact states.
