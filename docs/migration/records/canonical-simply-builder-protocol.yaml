title: Canonical Simply builder protocol
status: in_progress
objective: Define a specification-owned, host-language-neutral Simply construction protocol that maps deterministic immutable builder operations directly into canonical source-less Semantic IR and CompileRequest values, with complete identity, provenance, validation, error, compatibility, schema, fixture, normalization-equivalence, and architecture evidence, without implementing or changing any host API.
