change_classification:
    semantic_change:
        level: none
        evidence:
            - The protocol can express only already-ratified Semantic IR meaning and cannot add or reinterpret a STRling construct.
    public_api_change:
        level: none
        evidence:
            - No binding, package, exported symbol, compiler facade, or runtime route changes in this task.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - Adds a separately versioned frontend protocol, request, and equivalence-case schema family under spec/frontends/simply without changing canonical contract suite 1.0.0.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Builder validation failures are defined as frontend protocol data but are not yet emitted through the canonical Diagnostic or any product surface.
    target_behavior_change:
        level: none
        evidence:
            - Builder intent maps to Semantic IR before planning and cannot contain target syntax, runtime options, engine names, or emitted pattern fragments.
    architecture_change:
        level: additive
        evidence:
            - Establishes the specification-owned Simply-to-Semantic-IR boundary and certification-only validator while forbidding a host, binding, target, runtime, or product dependency.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Builder protocol, schemas, fixtures, and manifest
      command: python3 tooling/simply_contract.py && python3 -m unittest tooling.tests.test_simply_contract
      expected_result: The exact operation, option, identity, error, provenance, ownership, import, compatibility, and evidence inventories validate; positive and negative coverage is complete; stale files, fingerprints, counts, or weakened rules fail closed.
    - name: Canonical normalization and CompileRequest equivalence
      command: cargo test --manifest-path core/Cargo.toml --test simply_builder_contract --locked
      expected_result: Every successful builder case projects the authored candidate, canonical Rust normalization reproduces the exact expected source-less Semantic IR, and the exact expected CompileRequest validates; negative cases retain their stable ordered builder error identities.
    - name: Canonical contract and architecture boundary
      command: python3 tooling/contract_validation.py && python3 tooling/core_contract_validation.py && python3 -m unittest tooling.tests.test_core_contracts
      expected_result: The builder suite participates in canonical contract certification while mutation tests reject binding, target, runtime, product, process, raw-regex, target-syntax, or second-compiler authority leakage.
    - name: Repository certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 -m unittest discover -s tooling/tests && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py && ./strling migration-differential --repeat-runs 3 && ./strling profile local && git diff --check
      expected_result: Every available affected hardgate passes, product/public behavior remains unchanged, migration evidence remains stable, and the final repository is clean.
checkpoints:
    - name: Canonical boundary and historical Simply inventory
      status: passed
      evidence:
          - check: Authoritative destination
            result: passed
            details: Canonical Semantic IR owns 12 target-neutral node variants, logical capture identities, source-less validity, canonical-v1 normalization, and program-level case matching. CompileRequest already owns outputs, profiles, diagnostic policy, partial-semantics policy, and resource limits. Simply therefore requires a frontend contract, not a new compiler contract or host AST authority.
          - check: Historical evidence disposition
            result: passed
            details: TypeScript and Python expose literal, composition, capture, lookaround, set, repetition, helper, direct-target, callable-pattern, and formatted-exception behavior, while the Rust and other bindings diverge. These surfaces remain compatibility evidence only. The max-equals-zero unbounded sentinel, capture duplication, repeat guards, PCRE2 string conversion, host exceptions, and runtime execution conveniences cannot define canonical semantics.
    - name: Locked protocol, identity, error, and compatibility policy
      status: passed
      evidence:
          - check: Direct construction contract
            result: passed
            details: The protocol will admit exactly empty, literal, wildcard, character-set, sequence, alternation, transparent group, capture, backreference, position, lookaround, atomic, repeat, imported node, and imported program operations. Generated node and capture identities derive from one request namespace plus stable step/capture keys; imports preserve identities and sources. Values are immutable and single-materialization, generated nodes are source-less, imported provenance is preserved, and mixed provenance must remain fully resolvable.
          - check: Options and validation policy
            result: passed
            details: Unicode scalar text is fixed. Case matching, built-in class domain, wildcard line-terminator treatment, repetition mode, and semantic positions are explicit intent. Requested outputs, target-profile references, diagnostic policy, and limits remain compiler routing. Target syntax, engine flags, runtime values, raw regex, host objects, and emitted fragments are forbidden. Decode, graph, projection, canonical normalization, semantic, and CompileRequest validation occur in deterministic order and fail without partial mutation.
    - name: Governed schemas, registry, fixtures, and reference certification
      status: passed
      evidence:
          - check: Machine contract
            result: passed
            details: Protocol 1.0.0 closes exactly 15 operations, four semantic options, 12 stable errors, eight historical dispositions, deterministic identity/provenance/ownership rules, and a Semantic-IR/CompileRequest destination. Three schemas, nine positive cases, 13 negative cases, seven governed manifest inputs, and specification docs certify at sha256:245bd1aa0745db78258f5c5f27e023d4bd07ffbc3814bfd751e577192a034740. The projector reproduces every authored result and rejects stale bytes, weakened inventories, unsupported raw/target fields, incompatible imports, invalid origins, resource overflow, and changed failure identities.
    - name: Canonical Rust equivalence and controlled architecture failures
      status: passed
      evidence:
          - check: Behavioral and boundary evidence
            result: passed
            details: The Rust integration proof binds all seven JSON artifacts, confirms all nine expected Semantic IR programs are canonical-v1 idempotent, validates their exact CompileRequests, and covers all 12 stable failure codes. Python mutation tests pass for closed operations, manifest fingerprints, schema widening, raw/target leakage, compatibility evidence, and executable error identities. The core architecture hardgate rejects process/runtime/binding dependencies and any attempt by the frontend protocol to claim semantic, target, or runtime authority; canonical fixture coverage advances intentionally from 100 to 107.
    - name: Complete repository and task certification
      status: planned
      evidence:
          - check: Task-closing hardgates
            result: not_run
            details: Awaiting all Rust/tooling/contracts/architecture/security/documentation/migration/Local evidence, a clean final commit, and next-task handoff.
