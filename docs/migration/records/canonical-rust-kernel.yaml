required_verification:
    - name: Canonical kernel checks
      command: cd core && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo check --all-targets && cargo test --all-targets
      expected_result: The kernel formats, lints, builds, and passes all structural and fixture-driven tests with warnings denied.
    - name: Schema mapping and fixture certification
      command: python3 tooling/core_contract_validation.py
      expected_result: Every normative schema is mapped, positive fixtures are accepted, controlled invalid fixtures are rejected, and schema fingerprints match the Rust mapping declaration.
    - name: Repository quality and certification
      command: PATH=/tmp/strling-pinned-tools:$PATH BUNDLER_VERSION=2.4.20 ./strling check all; PATH=/tmp/strling-pinned-tools:$PATH BUNDLER_VERSION=2.4.20 ./strling certify all
      expected_result: All enforced repository, kernel, and binding hardgates pass from committed state.
    - name: Governance and patch integrity
      command: python3 tooling/governance.py; python3 -m unittest tooling.tests.test_governance tooling.tests.test_core_contracts; git diff --check
      expected_result: Kernel architecture boundaries, task scope, controlled drift failures, focused governance tests, and patch hygiene pass.
checkpoints:
    - name: Kernel boundary and dependency contract
      status: passed
      evidence:
          - check: Clean committed starting state
            command: git status --short --branch; git rev-parse HEAD
            result: passed
            details: Work began from a clean architecture/v4 tree at 7131db85ee0434795669cc6d6a8032d606588c5a.
          - check: Canonical kernel scaffold and minimal dependency graph
            command: cd core && cargo generate-lockfile --offline && cargo check --all-targets
            result: passed
            details: The standalone strling-kernel library builds on governed Rust 1.75 with only serde and serde_json runtime dependencies; its source, semantic, diagnostic, protocol, target, and validation modules contain no executable compiler phases.
          - check: Enforced kernel quality component
            command: ./strling environment core --json; ./strling check core --json
            result: passed
            details: Cargo, rustc, rustfmt, and Clippy resolve compatibly; kernel formatting, warnings-denied Clippy, warnings-denied typecheck, and tests are enforced in normal repository aggregates.
          - check: Canonical dependency boundary
            command: python3 -m unittest tooling.tests.test_governance; python3 tooling/governance.py
            result: passed
            details: All 28 focused governance tests passed, including controlled rejection of a binding path dependency and tooling source inclusion; the new top-level core island and declared task scope passed architecture fitness.
          - check: Existing repository hardgates
            command: ./strling check all --json; ./strling certify all --json
            result: passed
            details: Both all-component aggregates exited zero with the canonical kernel included; existing certified contracts, generation, public contracts, baseline, governance, bindings, and TypeScript behavior remained green.
    - name: Source identity and Semantic IR domain types
      status: passed
      evidence:
          - check: Schema-backed source and provenance model
            command: core source module; canonical source fixtures
            result: passed
            details: Dedicated source, node, capture, frontend, producer, dialect, specification, and digest types preserve serialized identities; closed source documents distinguish exact inline UTF-8 from digest-pinned references and validate provenance relationships without filesystem assumptions.
          - check: UTF-8 byte coordinate invariants
            command: cargo test --test source_semantic_contracts utf8_spans_use_half_open_byte_boundaries reversed_span_returns_structured_validation_error
            result: passed
            details: Half-open byte spans accept the 2-byte alpha and 4-byte emoji boundaries, reject interior UTF-8 bytes and reversed ranges through structured validation errors, and contain no UTF-16 or LSP coordinate type.
          - check: Complete target-neutral Semantic IR mapping
            command: cargo test --test source_semantic_contracts every_ratified_semantic_variant_fixture_validates source_less_constructed_semantics_validate
            result: passed
            details: The all-node fixture exercises empty, sequence, alternation, literal, wildcard, character sets, repetition, all positions, captures, backreferences, all lookaround combinations, and atomic nodes; source-less construction remains valid and target fragments are structurally rejected.
          - check: Canonical graph and normalization preconditions
            command: cargo test --test source_semantic_contracts all_controlled_invalid_semantics_are_rejected
            result: passed
            details: Duplicate node/capture identities, unresolved backreferences, undeclared sources, invalid UTF-8 attribution, nested sequences, uncoalesced literals, reversed repeat bounds, and target syntax leakage are all rejected without performing normalization.
          - check: Closed-world serialization fidelity
            command: cargo test --test source_semantic_contracts; cargo clippy --all-targets -- -D warnings; cargo check --all-targets
            result: passed
            details: All 10 focused tests passed, including positive and controlled-invalid fixtures, explicit-null rejection for optional fields, required-nullable maximum handling, unknown-field rejection, deterministic JSON round trips, and warnings-denied lint/typecheck.
          - check: Certified contracts and kernel hardgate
            command: python3 tooling/contract_validation.py; ./strling check core --json; python3 tooling/governance.py; git diff --check
            result: passed
            details: All 11 schemas, 29 positive objects, 33 controlled invalid objects, kernel quality operations, architecture boundaries, task scope, and patch integrity passed.
    - name: Diagnostics and compiler protocol domain types
      status: passed
      evidence:
          - check: Structured diagnostic representation and ordering
            command: cargo test --test protocol_contracts canonical_diagnostic_and_analysis_fixtures_validate
            result: passed
            details: Closed diagnostic values preserve stable codes and numeric occurrence identities independently of prose, validate source spans and non-overlapping fixes, and sort by the certified location, phase, severity, code, and occurrence keys.
          - check: Compile request and result contract fixtures
            command: cargo test --test protocol_contracts every_compile_request_fixture_validates every_compile_result_fixture_validates
            result: passed
            details: All five canonical request and five canonical result fixtures deserialize into tagged source or semantic inputs, requested outputs, structured outcomes, semantic states, analysis containers, portability envelopes, and optional artifacts.
          - check: Protocol invariant rejection
            command: cargo test --test protocol_contracts controlled_invalid_protocol_objects_are_rejected diagnostic_location_and_artifact_envelope_negatives_are_rejected
            result: passed
            details: Exactly-one tagged input, canonical output order, target-profile requirements, failure/error consistency, partial-result restrictions, diagnostic attribution, artifact portability, and emitted-span structure reject controlled malformed inputs without exceptions or prose parsing.
          - check: Request/result exchange validation
            command: cargo test --test protocol_contracts canonical_request_result_exchanges_validate undeclared_diagnostic_source_fails_exchange_validation
            result: passed
            details: Cross-envelope validation enforces requested successful outputs, partial-result policy, structured unsupported-frontend diagnostics, target-profile equality, and declared UTF-8-valid diagnostic sources.
          - check: Deterministic round trips and governed quality
            command: cargo fmt --check; cargo clippy --all-targets -- -D warnings; RUSTFLAGS=-Dwarnings cargo check --all-targets; cargo test --all-targets
            result: passed
            details: All 21 kernel tests passed with warnings denied; optional-null behavior and JSON-Rust-JSON structural stability are covered.
          - check: Repository contract and architecture hardgates
            command: python3 tooling/contract_validation.py; python3 tooling/governance.py; ./strling check core --json; git diff --check
            result: passed
            details: Eleven canonical schemas, 29 positive examples, 33 controlled invalid examples, kernel quality operations, governed dependency boundaries, task scope, and patch integrity all passed.
    - name: Target profile and artifact domain types
      status: passed
      evidence:
          - check: Authored target profiles and immutable fingerprints
            command: cargo test --test target_contracts authored_target_profiles_validate_and_fingerprint_exactly immutable_profile_references_resolve_only_exact_fingerprints
            result: passed
            details: PCRE2 10.42 and 10.43, ECMAScript 2024, and Python re 3.11 validate as closed typed profiles; Rust canonical JSON produces all four specification-certified SHA-256 values, and profile resolution rejects an altered fingerprint.
          - check: Version-aware capability and constraint model
            command: cargo test --test target_contracts engine_versions_select_distinct_capability_records constraints_preserve_typed_operators_values_and_units
            result: passed
            details: Tagged semver, dotted-numeric, edition, and opaque version representations prevent scheme guessing; the two PCRE2 releases retain different availability records and constrained capabilities preserve closed operators, scalar/list values, units, and declared-option references.
          - check: TargetArtifact and profile-dependent invariants
            command: cargo test --test target_contracts target_artifact_keeps_pattern_options_and_profile_separate profile_dependent_artifact_mismatches_are_structured
            result: passed
            details: Pattern text, compile/runtime options, profile identity, requirements, source maps, and emission diagnostics remain separate; missing required options, undeclared options, mismatched option values, incompatible specifications, and wrong profiles return structured validation errors.
          - check: Controlled invalid profiles and portability vocabulary
            command: cargo test --test target_contracts malformed_profile_fixtures_are_rejected_structurally portability_vocabulary_has_no_degraded_state
            result: passed
            details: Boolean capabilities, empty constrained entries, duplicate capabilities, malformed engine versions, unknown fields, and explicit-null runtime values are rejected; the only portability values are native, equivalent_rewrite, and unsupported.
          - check: Deterministic dependency and serialization boundary
            command: cargo clippy --all-targets -- -D warnings; RUSTFLAGS=-Dwarnings cargo check --all-targets; cargo test --all-targets; ./strling check core --json
            result: passed
            details: The lockfile pins the sole added deterministic utility, sha2 0.10.9; all 31 kernel tests, warnings-denied lint/typecheck, structural round trips, repository contracts, governance, and patch integrity passed. The canonical target source directory is explicitly unignored so clean checkouts contain it.
    - name: Cross-domain validation and fixture certification
