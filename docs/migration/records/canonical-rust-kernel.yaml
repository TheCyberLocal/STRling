          - check: Cross-phase identity and profile correlation
            command: cargo test --test protocol_contracts target_exchange_resolves_immutable_profile_and_artifact_options cross_phase_node_references_must_resolve_to_semantic_ir
            result: passed
            details: Request, result, Semantic IR, analysis, portability, target profile, source attribution, and artifact references validate as one explicit flow; undeclared analysis/artifact node IDs and unresolved or mismatched profiles return structured errors.
          - check: Complete schema and fixture mapping
            command: python3 tooling/core_contract_validation.py
            result: passed
            details: The kernel mapping pins all 11 authoritative schema files and names their Rust modules; every one of the 62 positive, controlled-invalid, profile, case, and manifest JSON fixtures is referenced by kernel tests, while legacy tests/spec fixtures are forbidden as authority.
          - check: Controlled mapping and architecture drift
            command: python3 -m unittest tooling.tests.test_core_contracts
            result: passed
            details: Six focused tests prove rejection of schema-byte drift without a mapping update, missing or unknown mappings, extra runtime dependencies, filesystem/network/binding dependencies, target syntax in Semantic IR, and derived analysis embedded in the Node union.
          - check: Whole kernel and repository contract verification
            command: cargo fmt --check; cargo clippy --all-targets -- -D warnings; RUSTFLAGS=-Dwarnings cargo check --all-targets; cargo test --all-targets; python3 tooling/contract_validation.py; python3 tooling/governance.py; ./strling check core --json; git diff --check
            result: passed
            details: All 42 Rust tests, warnings-denied quality checks, 11 schemas, 29 positive contract objects, 33 controlled-invalid objects, architecture/task governance, kernel hardgate, and patch integrity passed.
    - name: Repository hardgate integration
      status: passed
      evidence:
          - check: Mandatory schema-to-Rust drift hardgate
            command: python3 tooling/core_contract_validation.py; python3 -m unittest tooling.tests.test_core_contracts
