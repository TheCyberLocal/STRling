      status: in_progress
      evidence: []
    - name: Target profile and artifact domain types
      status: planned
      evidence: []
    - name: Cross-domain validation and fixture certification
      status: planned
      evidence: []
    - name: Repository hardgate integration
      status: planned
      evidence: []
    - name: Completion and compiler-pipeline readiness
      status: planned
      evidence: []
