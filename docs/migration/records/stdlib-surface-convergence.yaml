            result: passed
            details: stdlib-surface-projections reproduces fourteen outputs byte-for-byte with output fingerprint f8f165ccd26970e8b0d2e9e5db907fa8fd9d8806b505011794a4c8e1268ef132 from source fingerprint 11cabc4bf1934beabf89ccec5a40d07c0ac38d7d24257437800151e2b6947267.
          - check: Public and portability denominator
            result: passed
            details: Generated support metadata classifies two canonical Preview adapters and fifteen compatibility-only bindings. The portability view covers all forty eight-variant-by-five-profile cells, 580 executed applications, five explicit not-applicable applications, and zero semantic validators; selected Python, TypeScript, and Rust public snapshots reproduce exactly.
    - name: Complete profiles and phase handoff
      status: passed
      evidence:
          - check: Task-owned integration and deterministic generation
            command: python3 -m unittest discover -s tooling/tests; cargo test --manifest-path core/Cargo.toml --all-targets --locked; cargo +1.75.0 clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings; python3 -m tooling.stdlib_surfaces --check; python3 tooling/governance.py; git diff --check
            result: passed
            details: >-
                All 583 tooling tests pass. Every Rust all-target test and both projection examples pass in the installed Visual Studio developer environment, and Rust 1.75 Clippy passes with warnings denied. Canonical contracts retain five lexical-shape helpers, eight variants, seventeen bindings, 117 edge records, 585 profile applications, 580 executable applications, five explicit not-applicable applications, and zero semantic validators. Fourteen generated outputs reproduce at fingerprint f8f165ccd26970e8b0d2e9e5db907fa8fd9d8806b505011794a4c8e1268ef132; the Rust, TypeScript, and Python affected public snapshots, documentation integrity, governance, affected-file formatting, and patch integrity pass.
          - check: Exact portability evidence and Windows projection execution
            result: passed
            details: >-
                T04 does not change target artifacts or authored expectations, so it reuses T03's checked two-pass evidence: all 580 applicable ECMAScript 2024, PCRE2 10.42/10.43, Python re 3.11 string, and Python re 3.11 bytes applications pass, while five byte-mode applications remain explicitly not applicable. The moved Windows host exposed that deterministic projection subprocesses dropped MSVC linker, SDK-library, and temporary-directory discovery variables. Commit 6d0789af preserves only INCLUDE, LIB, LIBPATH, SYSTEMROOT, TEMP, and TMP on Windows; focused tests pass, both projections now build and execute, and absent exact PCRE2/CPython runtime variables are reported as unavailable rather than false failures.
