change_classification:
    semantic_change:
        level: compatible
        evidence:
            - The sole P14-T03 Rust builders remain the semantic implementation; registry additions under the governed specification path are closed surface metadata, while generated views contain identities, parameters, documentation, support classifications, and evidence only.
            - All five helpers retain lexical_shape guarantees and zero semantic validators; no helper acceptance language is strengthened.
    public_api_change:
        level: additive
        evidence:
            - Rust exposes the canonical standard-library builder API and TypeScript/Python Preview builders gain one generic registry-identified helper operation.
        affected_surfaces:
            - strling-kernel
            - typescript-public-api
            - python-public-api
    schema_change:
        level: additive
        evidence:
            - The immutable Simply 1.0.0 contract remains unchanged; a backward-compatible 1.1.0 protocol adds stdlib_helper, and the registry gains closed canonical-adapter support metadata and surface derivations.
        affected_surfaces: []
    diagnostic_change:
        level: compatible
        evidence:
            - Unknown helper IDs and invalid parameter maps use existing stable STRL-SIMPLY construction identities and exact data paths.
    target_behavior_change:
        level: none
        evidence:
            - All target projections and runtime observations reuse the P14-T03 five-profile evidence without changing artifacts or expectations.
    architecture_change:
        level: additive
        evidence:
            - Supported host adapters record one helper identity and parameters, while Rust imports the selected canonical helper program into the existing Simply graph and sole compiler facade.
            - Fifteen legacy binding implementations remain explicitly compatibility-only and are not mislabeled as canonical adapters.
            - Deterministic Rust projection subprocesses preserve only the Windows build variables required to discover the installed linker, SDK libraries, and writable temporary directory; semantic and runtime inputs remain governed separately.
    generated_output_change:
        level: additive
        evidence:
            - Registry-derived adapter metadata, binding support, Semantic DSL examples, public reference documentation, convergence cases, and an evidence-backed eight-by-five portability matrix become checked generated outputs.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Registry-derived surface generation
      command: python3 -m tooling.stdlib_surfaces --check
      expected_result: All generated outputs reproduce exactly from one registry, canonical forms, and checked runtime evidence with five helpers, eight variants, seventeen bindings, two canonical Preview adapters, fifteen compatibility-only bindings, and forty variant-profile rows.
    - name: Canonical helper adapter convergence
      command: cargo test --manifest-path core/Cargo.toml --test stdlib_surface_convergence --locked && npm test --prefix bindings/typescript -- --runInBand simply_preview.test.ts && PYTHONPATH=bindings/python/src python3 -m pytest bindings/python/tests/unit/test_simply_preview.py
      expected_result: Every helper selector reaches the sole Rust implementation through stdlib_helper, composes in Simply, matches canonical IR/DSL forms, and preserves stable invalid-helper and invalid-parameter failures across both supported host adapters.
    - name: Public, architecture, and generated contracts
      command: python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 -m tooling.governance --json
      expected_result: Additive canonical surfaces and generated views pass public snapshots, one-core architecture rules, governed scope, declarations, deterministic generation, documentation, and patch integrity.
    - name: Complete certification and phase closure
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 -m unittest discover -s tooling/tests && python3 -m tooling.migration_differential --repeat-runs 3 && git diff --check && git status --short
      expected_result: Every task-owned gate passes, inherited host limitations remain explicit without waiver, migration evidence is deterministic, and the closure tree is clean.
