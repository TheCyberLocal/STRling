            result: passed
            details: Clean checkpoint a8165efa240c209efc5b6f4d8c77d7abbe6d396e passed all 37 operations with zero failed, unavailable, incomplete, or waived results. Profile definition 1.12.0 fingerprints to cdff0ee94405d63c05185c7cb7356096c380180340cd0a1d3726581e9cdf93ca and evidence fingerprints to 0f4c38bc1eb0ce5dd43e8beb7fa6c7513d7e5713583231a4067934642bccf7b3.
