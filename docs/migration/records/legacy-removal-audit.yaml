            result: passed
            details: A clean native-WSL checkout at a8165efa240c209efc5b6f4d8c77d7abbe6d396e passed all 77 operations with zero failed, unavailable, incomplete, or waived results. Profile definition 1.17.0 fingerprints to 4d99326ed1569cd87a2a3664b4735457078b10a90a06ca77fcb2b7cc3b03b810 and evidence fingerprints to 4352c873747e1dbdb24a86194fe3dfdd9b935cd20203321d21895e7fa26e90b8.
