required_verification:
    - name: Removal inventory contract and mutation resistance
      command: python -m unittest tooling.tests.test_legacy_removal_inventory -v && python -m tooling.legacy_removal_inventory --check --json
      expected_result: The governed manifest validates, all stable finding and path relationships reproduce, every required replacement proof is complete, and controlled denominator, route, path, disposition, and fingerprint mutations fail closed.
    - name: Generated, architecture, governance, public-contract, security, and documentation integrity
      command: python tooling/generated_artifacts.py --check && python tooling/governance.py --json && python tooling/public_contracts.py --check && python tooling/security.py risk --json && python tooling/documentation_integrity.py --json && git diff --check
      expected_result: Registered evidence reproduces, all enforced architecture and governance rules pass, public surfaces remain unchanged, the existing security waiver retains its exact scope, documentation is intact, and no uncontrolled drift exists.
    - name: Canonical Local, Pull Request, and Full pre-removal baselines
      command: ./strling profile local --json && ./strling profile pull-request --json && ./strling profile full --json
      expected_result: Every required operation in each live profile passes or retains only an already-governed non-blocking disposition; the inventory check is exercised through the registered generation and tooling suites, and no legacy deletion is performed.
