completion:
    accomplished:
        - Added one bounded, test-only exact-PCRE2 runtime harness covering compile and match semantics, complete capture values/names/byte spans, explicit options, three native resource contexts, two atomic-literal rewrite differentials, and 256 deterministic generated cases per supported release.
        - Added a fixed pathological Rust corpus that proves panic-free deterministic handling or fail-closed rejection for empty, escape-heavy UTF-8, dense-class, maximum-quantifier, capture-name, depth, malformed-artifact, and conflicting-option inputs.
        - Established explicit reproducible internal-stage performance budgets and measured analysis/planning, lowering, and serialization independently without claiming universal regex runtime performance.
        - Integrated certification-result-v1 with the existing repository-operation executor and made the exact-engine operation mandatory in Full and Release while retaining structured unavailability when exact libraries are absent.
        - Restored predecessor repository hardgates without expanding scope by removing seven unmanaged late-import suppressions and preserving the governed architecture mutation diagnostic phrase.
    verified:
        - Exact official 10.42 and 10.43 libraries passed ordinary and ASan/UBSan repeated matrices with stable per-version semantic digests and no crash, panic, timeout, address-sanitizer report, or undefined-behavior report.
        - All core and Python tests, warnings-denied Clippy, contract, generation, hygiene, governance, documentation, differential, and patch-integrity gates pass; no migration baseline renewal was required.
        - Local, Pull Request, and exact-engine Full profiles record 20, 39, and 69 passing operations respectively, zero failures, no waivers, and only explicit host tool or scanner unavailability.
    behavior_changed: Internal certification now executes and measures governed PCRE2 artifacts against exact real 10.42 and 10.43 engines and carries that structured proof through Full/Release profiles; no product runtime, public compiler, binding, package, or release behavior changed.
    intentional_behavior_changes:
        - The test-only ABI exposes capture values, names, byte spans, unmatched slots, and match/depth/heap limits so semantic and resource-boundary failures are directly observable.
        - Full and Release require exact-engine runtime certification and report absent exact libraries as unavailable rather than silently using an ambient engine.
        - Internal analysis/planning, lowering, and serialization stages now have fixed-corpus median budgets of 10,000, 5,000, and 5,000 microseconds with 16 warmups and 128 samples.
    preserved_behavior:
        - Semantic IR, language semantics, normalization, capability evaluation, portability planning, lowering, serialization, facade signatures, public schemas, bindings, package versions, and publication state remain unchanged.
        - Unsupported, malformed, over-bound, stale, or option-incompatible artifacts still fail closed; the harness does not introduce product execution, network access, JIT claims, or implicit system-library selection.
        - Sanitizer evidence claims ASan/UBSan cleanliness only. Host-interpreter LeakSanitizer shutdown allocations are recorded and leak-only cleanliness is not claimed.
    transitional_architecture:
        - Exact engine execution remains an engineering certification operation under tooling; the canonical public facade still has no runtime executor and no binding can invoke this harness.
        - Governed profiles remain READY WITH RECORDED CARRY-FORWARD because host Ruff/Bundler versions and the dependency-risk scanner are unavailable; all available operations pass with zero failures.
    deferred_work:
        - P11-T01 owns independent ECMAScript target lowering from common semantics and planner evidence without translating PCRE2 syntax or executing Node.
        - JIT-specific certification, UTF-16/UTF-32 parity, public runtime orchestration, bindings, Simply, editor/LSP integration, package/version changes, publication, tagging, release notes, and artifact upload remain outside this task.
readiness:
    status: READY WITH RECORDED CARRY-FORWARD
    next_task: Begin P11-T01 by implementing ECMAScript-specific structured lowering directly from normalized Semantic IR, the governed target profile, and portability-plan evidence, without reusing PCRE2 syntax or adding serialization/runtime behavior.
    rationale: P10-T04 and the P10 phase are complete with exact ordinary and sanitizer-backed engine execution, adversarial/resource-limit proof, deterministic generated coverage, independent stage budgets, canonical Full-profile integration, comprehensive repository certification, and zero failed profile operations. Only explicit host tool/scanner availability carries forward; P11-T01 is the next ordered contained task.
