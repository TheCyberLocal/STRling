completion:
    accomplished:
        - Replaced Java and Kotlin binding-owned semantic implementations with thin facades over one shared JNA bridge and the canonical C ABI.
        - Removed all 35 frozen Java/Kotlin core and emitter semantic-copy paths from product packages while preserving authenticated task-start evidence outside runtime graphs.
        - Certified 72 frozen cases, exact JDK 11/17/21 execution, actual-native deterministic parity, lifecycle and classloader isolation, three product JARs, two clean consumers, the nine-package graph, and live exact-version OSV risk.
        - Reproduced the 45-symbol JVM, 104-symbol Java, and 221-symbol Kotlin public snapshots plus affected generated standard-library and release-graph artifacts.
        - Preserved five lexical-shape helpers, eight variants, 117 edge records, 17 stress cases, and zero semantic validators without strengthening helper guarantees.
    verified:
        - All 67 focused JVM architecture, evidence, package, and quality assertions; 13 shared-bridge, seven Java, and seven Kotlin tests; and the three-run actual-native parity certifier pass.
        - Exact public snapshots, registered JVM generated artifacts, canonical contracts, live OSV risk, security integrity, migration differential, governance, documentation, formatting, and patch integrity pass.
        - Local, Pull Request, and Full profiles record every repository-wide pass, failure, unavailable operation, and task disposition exactly; every T04-owned operation passes directly.
    behavior_changed: Java and Kotlin public host packages now delegate all language semantics through the shared canonical native boundary; retired binding-owned compiler APIs are intentional breaking removals.
    intentional_behavior_changes:
        - Java and Kotlin parser, compiler, IR, emitter, hint, validator, and helper-semantic implementation islands are retired from product packages.
        - Compatibility parse conveniences return canonical compile data and exact target artifacts require explicit target profiles.
        - Shared bridge ABI, bounded transport, lifecycle, host-error, and canonical-error behavior replaces independent host implementations.
    preserved_behavior:
        - Canonical CompileRequest/CompileResult, diagnostics, target artifacts/options, source spans, Simply protocols, interop error identities, and the Rust standard-library implementation remain authoritative.
        - Lexical standard helpers remain intentionally distinct from semantic validation.
        - No package version, target profile, interop ABI, support tier, publication, release, tag, upload, push, or unrelated binding migration changes.
    transitional_architecture:
        - Windows x86_64 is the only locally executed native platform; Linux, macOS, and alternate architectures remain unclaimed.
        - Native loading is caller-supplied by absolute path and no classifier is shipped until a later release task certifies its platform rows.
        - Remaining non-migrated bindings retain tracked transition implementations until their ordered P17 tasks.
    deferred_work:
        - P17-T05 owns the next ordered binding migration and its own public, package, runtime, and semantic-copy denominator.
        - Later ordered tasks own remaining binding migrations, final zero-duplicate-semantics enforcement, release certification, package versions, release notes, and any publication; none is authorized here.
