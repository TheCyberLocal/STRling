required_verification:
    - name: Validation guarantee contracts
      command: python3 tooling/contract_validation.py and python3 -m unittest tooling.tests.test_canonical_contracts -v
      expected_result: The taxonomy, schema, positive examples, transitional inventory, and every controlled contradictory or overstated definition validate or fail deterministically as declared.
    - name: Repository quality profiles
      command: ./strling profile local and ./strling profile pull-request and ./strling profile full
      expected_result: Canonical profiles execute the same contract operation and preserve established fail-closed unavailable results without a parallel runner.
    - name: Canonical governance and integrity
      command: ./strling format --check and ./strling hygiene and ./strling generate --check and ./strling contracts --check and ./strling governance and git diff --check
      expected_result: Formatting, hygiene, generated state, contracts, governed scope, architecture fitness, and patch integrity pass.
    - name: Product preservation baselines
      command: ./strling typecheck typescript and ./strling build typescript and ./strling test typescript and cargo fmt --manifest-path core/Cargo.toml --all --check and cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings and cargo check --manifest-path core/Cargo.toml --all-targets and cargo test --manifest-path core/Cargo.toml
      expected_result: The relevant TypeScript and canonical Rust kernel baselines remain unchanged and pass.
    - name: Clean committed state
      command: git status --short --branch
      expected_result: Final certification is run from committed state and leaves no tracked or untracked task changes.
