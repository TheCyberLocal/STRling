change_classification:
    semantic_change:
        level: additive
        evidence:
            - Ratifies vocabulary and eligibility rules for future governed helper claims while explicitly withholding ratified guarantee status from existing transitional helpers.
    public_api_change:
        level: none
        evidence: []
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - Adds a versioned standard-library helper guarantee schema and controlled fixtures without modifying compiler protocol or legacy artifact schemas.
        affected_surfaces: []
