change_classification:
    semantic_change:
        level: none
        evidence:
            - Release supply-chain tooling observes existing manifests, build commands, dependency graphs, and artifacts. It cannot define language, compiler, diagnostic, target, or runtime behavior.
    public_api_change:
        level: none
        evidence:
            - Public package names, versions, exports, signatures, and supported surfaces remain unchanged. Manifest or lock changes are permitted only for exact security remediation without API or support-policy changes.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - CP2 may add one engineering-only schema for the authored release graph and structured checksum, SPDX SBOM, provenance, reproducibility, workflow, dependency-risk, and credential-boundary evidence.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Product diagnostic catalogs and projections are outside this task.
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, lowerers, serializers, engines, and runtime behavior remain read-only inputs.
    architecture_change:
        level: additive
        evidence:
            - Adds a verification-only release-supply-chain producer and changes delivery routing so publication-capable jobs consume exact previously certified artifacts under least privilege.
    generated_output_change:
        level: none
        evidence:
            - CP1 changes no generated output. Later checkpoints may declare and register derived supply-chain evidence only after CP2 freezes its authored inputs and verification contract.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Release supply-chain schema, manifest, and controlled negatives
      command: python3 -m unittest tooling.tests.test_release_supply_chain -v
      expected_result: Every retained deliverable, artifact, dependency root, registry, credential mode, build command, checksum, SPDX SBOM, provenance subject, and reproducibility rule validates and rejects missing, duplicate, altered, stale, extra, mismatched, or unauthorized evidence.
    - name: Security, workflow, and waiver hardgates
      command: python3 -m unittest tooling.tests.test_security tooling.tests.test_release_supply_chain_architecture -v && python3 tooling/security.py integrity --json && python3 tooling/security.py content --json && python3 tooling/security.py risk --json
      expected_result: Dependency integrity, live risk/license/scanner coverage, exact waiver state, immutable workflow actions, least privilege, untrusted-context isolation, protected release authorization, and credential boundaries fail closed.
    - name: Deterministic dry-run artifact evidence
      command: python3 -m tooling.release_supply_chain --profile full --json
      expected_result: Governed dry-run builders produce the exact artifact denominator, SHA-256 checksums, SPDX 2.3 SBOMs, in-toto/SLSA provenance, toolchain/source identities, and byte or normalized-equivalence reproducibility without publication credentials.
    - name: Canonical profile and release integration
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full && ./strling profile release
      expected_result: Offline profiles validate contracts and controlled negatives; Full and Release add governed network and build evidence; exact nonpasses remain visible; no profile publishes or receives production credentials.
    - name: Governance, generation, documentation, and clean tree
      command: python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py --json && git diff --check && git status --short
      expected_result: Registered evidence ownership, task scope, change declarations, architecture rules, docs, patch integrity, and checkpoint cleanliness pass.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and campaign reconciliation
            result: passed
            details: P18-T05 starts from clean architecture/v4 commit 9f5e8c42babefac64e910faaf0897cd68de9f3bd after P18-T04 closed READY WITH RECORDED CARRY-FORWARD. Notion records P18-T04, CP3, CP4, and FINAL as Done and P18-T05 as In Progress.
          - check: Dependency and live risk denominator
            result: passed
            details: The existing machine policy inventories 27 dependency roots. A network-backed risk run on 2026-08-24 emitted 55 checks with 13 passed, two failed, and 40 unavailable. Ten VSCE signing packages retain unknown license metadata; the former npm advisory waiver resolves to zero current advisory findings and fails as stale. No finding was waived, suppressed, or reclassified during CP1.
          - check: Release artifact and workflow denominator
            result: passed
            details: The delivery workflow owns 17 compile and 17 publish tracks for C, C++, C#, Dart, F#, Go, Java, Kotlin, Lua, Perl, PHP, Python, R, Ruby, Rust, Swift, and TypeScript. Compile and publish jobs rebuild independently and exchange no exact artifact, checksum, SBOM, or provenance evidence. Only release certification JSON is retained.
          - check: Credential and authorization denominator
            result: passed
            details: The delivery workflow references 14 long-lived registry or signing secrets and gives five publication jobs id-token write. It declares no protected release environment, attestations permission, artifact attestation, or common certified-artifact handoff. Workflow defaults remain contents read and third-party actions remain full-SHA pinned.
          - check: Standards and profile boundary
            result: passed
            details: SPDX 2.3 JSON is selected for artifact SBOMs; provenance will bind SHA-256 subjects through an in-toto Statement and SLSA Provenance v1 predicate. Local and Pull Request remain offline; Full and Release own network-backed scanning, dry-run builds, SBOM/provenance/checksum generation, and reproducibility. Publication remains separately authorized and prohibited in this task.
          - check: Product and rollback boundary
            result: passed
            details: Product semantics, compiler and target behavior, diagnostics, public APIs, package versions, support tiers, performance contracts, registry publication, release creation, upload, tag push, and branch push remain forbidden. The rollback unit is the additive certification producer, schemas, generated evidence, profile routing, and workflow handoff; existing fail-closed security evidence remains.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Authored release artifact denominator
            result: passed
            details: Contract version 1.0.0 freezes exactly seventeen sorted release surfaces and their package names, roots, dependency-root references, compile and publish jobs, working directories, build commands, toolchain references, subject kinds, artifact patterns, registries or tag destinations, credential modes, and reproducibility dispositions. Five source-tag surfaces use source-tree identity; twelve package surfaces require SHA-256 artifact checksums.
          - check: SBOM and provenance contract
            result: passed
            details: Every surface requires SPDX 2.3 JSON and an in-toto Statement v1 with a SLSA Provenance v1 predicate. Artifact subject, checksum digest, provenance subject, source commit, governed build-command fingerprint, SBOM identity, and exact toolchain policy fingerprint are bound. Missing, duplicate, reordered, stale, altered, or extra evidence fails closed.
          - check: Reproducibility and credential contract
            result: passed
            details: Rust and TypeScript require byte-for-byte proof; five tag surfaces require exact source identity; the remaining archive or registry-assembled surfaces permit only their enumerated timestamp, signature, or registry-generated-metadata normalization. Dart, Python, Ruby, Rust, and TypeScript require secretless OIDC. Other secret names are exact, release-environment-bound, and forbidden in untrusted contexts.
          - check: Profile and workflow contract
            result: passed
            details: Local and Pull Request remain offline and do not build release artifacts. Full and Release may use the network and build dry-run artifacts, but publication is false in every profile. The exact workflow contract requires a release environment, default contents read, immutable actions, certified-exact-SHA input, exact artifact handoff, untrusted credential isolation, and the three attestation permissions.
          - check: Synthetic no-authority fixture and controlled negatives
            result: passed
            details: Manifest fingerprint 7f957aa6a5b08d283aa610924d06b7e347874eea7ede2f8604035b2a03b0b5af and synthetic fixture fingerprint 6f73c90a5a6bdc0da23a42ebd75175fe1efc8313b2e8b9e3b4c54f6c11eb408a are exact. The fixture explicitly denies live-artifact and publication authority. Twenty-five focused schema, denominator, checksum, provenance, toolchain, SBOM, reproducibility, credential, status, no-false-pass, determinism, and architecture tests pass.
    - name: Minimal implementation and local proof
      status: in_progress
      evidence: []
    - name: Integration and certification
      status: planned
      evidence: []
    - name: Completion and next-task readiness
      status: planned
      evidence: []
