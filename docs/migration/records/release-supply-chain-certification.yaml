title: Release supply-chain provenance and security certification
status: in_progress
objective: Establish fail-closed, machine-readable artifact identity, SPDX SBOM, checksum, in-toto/SLSA provenance, reproducibility, dependency-risk, workflow-authorization, and credential-boundary certification for every retained STRling 4.0 release deliverable without changing product semantics, public APIs, package versions, support policy, or publication authority.
