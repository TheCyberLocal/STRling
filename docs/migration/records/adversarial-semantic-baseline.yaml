            result: passed
            details: After git fetch --all --prune, architecture/v4 and origin/dev both identify 2ff3bfb9126060f250975cfec0d1d74b4f39b03c. Worktree and index were clean. README, authority, architecture, frontend, profile, and kernel boundaries confirm the current Fourth Edition source. The historical audit SHA was not checked out.
    - name: Adversarial evidence
      status: passed
