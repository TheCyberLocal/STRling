required_verification:
    - name: Corpus, harness, adapter, and evidence tests
      command: python3 -m unittest tooling.tests.test_adversarial_semantic_audit tooling.tests.test_shared_cross_engine_corpus tooling.tests.test_shared_cross_engine_corpus_architecture tooling.tests.test_pcre2_runtime_certification tooling.tests.test_ecmascript_runtime_certification tooling.tests.test_python_re_runtime_certification
      expected_result: Corpus mutations and corrupt evidence fail; unchanged harness and adapter contracts pass.
    - name: Exact empirical differential audit
      command: python3 -m tooling.adversarial_semantic_audit --strict
      expected_result: Exit 1 with all recorded findings reproduced on exact governed engines; this is the red baseline, not a waiver.
    - name: Governance, contracts, formatting, and architecture
      command: python3 tooling/governance.py --json && python3 tooling/generated_artifacts.py --check && python3 tooling/documentation_integrity.py --json && git diff --check
      expected_result: All affected integrity gates pass with no changes to semantic or performance authority.
    - name: Normal deterministic profiles
      command: ./strling profile local --json && ./strling profile pull-request --json
      expected_result: Both profiles pass. Full and Release are not required; no performance samples are authorized or necessary.
