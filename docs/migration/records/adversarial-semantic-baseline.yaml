          - check: Initial independent exact-runtime execution
            result: passed
            details: The initial two-run corpus reproduced 98 findings using hash-verified PCRE2 10.42/10.43, Node 22.23.2, and CPython 3.11.15. Report-specific adjacent probes expanded the final corpus to 41 programs and 95 subjects; every applicable audit family remains reproduced.
          - check: Final strict audit at clean source
            command: python3 -m tooling.adversarial_semantic_audit --strict
            result: passed
            details: At 59b08b49ba9410c7a25ea497a893fb94aae5e823, strict mode exits 1 with 148 known findings, zero unexpected, and zero unreproduced. Both independent executions agree. The result remains a semantic failure; this checkpoint passes because it establishes the required red baseline without accepting any divergence.
          - check: Corpus, harness, adapter, and evidence integrity
            result: passed
            details: 60 focused tests pass, including 26 adversarial mutation, transport, hash-bound shard, and case-insensitive filesystem tests. All eight line forms, required Unicode categories and folding edges, unset and repeated captures, and multibyte bytes inputs are mechanically protected.
