change_classification:
    semantic_change:
        level: none
        evidence:
            - Editor evidence consumes the same canonical frontend syntax, Semantic IR, source identities, and registries as the compiler; it cannot accept syntax, resolve identities, or create meaning independently.
    public_api_change:
        level: compatible
        evidence:
            - LSP completion, definition, references, symbols, and token responses become canonical projections. No binding, normative compiler contract, package, or released extension surface changes in T03; the Rust projection transport is internal implementation data pending P16-T05 packaging.
        affected_surfaces: []
    schema_change:
        level: none
        evidence:
            - The task consumes existing normative contracts and adds no normative schema. Its closed editor evidence is non-normative task implementation data.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - P16-T02 canonical diagnostic identity, severity, message, order, and source-range behavior remain unchanged.
    target_behavior_change:
        level: none
        evidence:
            - Completion may list an explicitly governed profile value but cannot infer, evaluate, lower, serialize, or execute a target.
    architecture_change:
        level: additive
        evidence:
            - Frontend-owned Rust editor projections and one bounded adapter replace four Python-binding intelligence imports while reusing T02 snapshots and the canonical kernel boundary.
    generated_output_change:
        level: none
        evidence:
            - Generated LSP payloads and stdlib surfaces are excluded. Because core/src is an input to registered runtime observations, their registered checks must prove outputs remain unchanged.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Canonical completion contexts and registries
      command: python3 -m pytest tooling/lsp-server/tests/test_canonical_intelligence.py tooling/lsp-server/tests/test_completion.py -q && cargo test --manifest-path core/Cargo.toml --test editor_intelligence --locked
      expected_result: Parser-expected Semantic STRling terminals, completed capture references, conservative regex contexts, Simply operations, canonical helper metadata, deterministic ranking, exact replacement spans, malformed inputs, and bounded no-result cases match the frozen evidence without Python parsing.
    - name: Canonical navigation and source identity
      command: python3 -m pytest tooling/lsp-server/tests/test_navigation.py -q
      expected_result: Symbols, definitions, and references use current canonical node/capture/source identities, survive canonical formatter round trips by recomputation, project Unicode ranges exactly, and return no speculative result for unresolved or stale evidence.
    - name: Canonical semantic tokens and lifecycle
      command: python3 -m pytest tooling/lsp-server/tests/test_semantic_tokens.py tooling/lsp-server/tests/test_lsp_lifecycle.py tooling/lsp-server/tests/test_lsp_server.py -q
      expected_result: The frozen eight-type legend, frontend token classes, UTF-8/16/32 and multiline/host projection, full-response encoding, version invalidation, cancellation, stale rejection, limits, service failure, and recovery are deterministic.
    - name: Architecture, compatibility, and campaign certification
      command: python3 -m pytest tooling/lsp-server/tests --ignore=tooling/lsp-server/tests/test_code_actions.py --ignore=tooling/lsp-server/tests/test_island_extractor.py -q && cargo test --manifest-path core/Cargo.toml --all-targets --locked && python3 -m unittest discover -s tooling/tests && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/migration_differential.py --repeat-runs 3 && python3 -m tooling.governance --json && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: T03-owned LSP behavior, canonical dependency direction, frontend/formatter properties, public/generated contracts, migration evidence, governance, profiles, patch integrity, and clean-tree checks pass or retain only explicitly recorded inherited environment limitations. Code actions and island extraction remain separately bounded P16-T04 evidence.
