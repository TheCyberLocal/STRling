    next_task: P16-T04 — Rebase code actions and embedded STRling islands.
    rationale: Every P16-T03-owned completion, navigation, token, lifecycle, migration, architecture, documentation, and directly executable certification requirement passes. Remaining gaps are explicitly owned by P16-T04/P16-T05 or are inherited host/toolchain/security-profile limitations; none requires reopening canonical editor intelligence.
