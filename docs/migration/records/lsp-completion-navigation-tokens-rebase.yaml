            result: passed
            details: Parser-expected candidates, deterministic ranking, exact replacement ranges, completed capture scope, canonical helper/operation identity, symbol/reference rules, the existing eight-type token legend, current-source recomputation, UTF-8/16/32 projection, immutable snapshot identity, cancellation, stale rejection, resource limits, malformed no-guess behavior, task exclusions, rollback, and verification profile are frozen without implementation claims.
