            details: The harness pins the raw regex dialect/grammar, Semantic language, Simply 1.1, and canonical stdlib registry hashes; cross-checks 55 Semantic keywords, the sole %flags directive and five flags, 16 Simply operations, five lexical_shape helpers, and the stdlib declared fingerprint; and freezes the eight token types with no modifiers and four deterministic completion tiers.
          - check: Executable denominator integrity
            result: passed
            details: Thirty-nine focused tests pass across the new evidence, completion, semantic-token, and navigation modules. Exact section counts, 65 unique case IDs, catalog equality, bounded UTF-8 spans, and an explicit evidence-removal mutation close shrinkage and semantic-drift detection. The manifest fingerprint is sha256:b1d5be9de0b0a9e7664e3ea63e99960e0f810875c4291db213452dd956ec276f. No editor-projection implementation is claimed by CP2.
