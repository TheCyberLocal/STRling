            result: passed
            details: Semantic STRling grammar/language/formatter, regex-compatible frontend, Semantic IR/source contracts, Simply 1.1, and canonical stdlib registry 1.0 are the only syntax, identity, and catalog inputs. One internal Rust projection reuses the actual frontend token/syntax implementations; Python owns only LSP adaptation, registry presentation, coordinate projection, lifecycle, and bounded transport.
