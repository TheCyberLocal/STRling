record_version: 2.0.0
title: Canonical semantic safety analysis
status: complete
objective: Establish a pure deterministic target-neutral safety-analysis stage over normalized Semantic IR, certified foundational semantic facts, and certified structural facts, producing structured proof-backed safety findings and typed uncertainty without changing product execution or beginning diagnostics, target modeling, rewriting, portability, lowering, emission, parser, binding, Simply, or editor migrations.
