required_verification:
    - name: Kernel safety-analysis quality
      command: cargo fmt --manifest-path core/Cargo.toml --all -- --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && RUSTFLAGS=-Dwarnings cargo check --manifest-path core/Cargo.toml --all-targets && cargo build --manifest-path core/Cargo.toml && cargo test --manifest-path core/Cargo.toml --all-targets
      expected_result: The analyzer builds without warnings and all normalization, foundational, structural, safety, property, contract, fixture, and kernel regression tests pass.
    - name: Canonical contract and controlled architecture certification
      command: python3 tooling/core_contract_validation.py && python3 tooling/contract_validation.py && python3 -m pytest -q tooling/tests/test_core_contracts.py tooling/tests/test_governance.py tooling/tests/test_quality.py
      expected_result: Stage registration passes and controlled source-heuristic, parser, target, planner, portability, binding, frontend, diagnostic, emitter, runtime-state, and engine-marker dependencies fail.
    - name: Repository quality and certification
      command: ./strling format --check repository && ./strling hygiene && ./strling lint all && ./strling typecheck all && ./strling generate --check --json && ./strling contracts --check --json && ./strling governance --json && python3 tooling/baseline.py --check && ./strling check --json && ./strling certify --json
      expected_result: Formatting, hygiene, lint, typecheck, generation, contracts, governance, baseline validation, and every enforced repository check and certification operation pass from committed state.
    - name: TypeScript compatibility baseline
      command: ./strling build typescript && ./strling test typescript && ./strling typecheck typescript
      expected_result: Existing TypeScript runtime and compiler behavior remains unchanged with all 19 suites and 963 tests passing.
    - name: Patch and clean-state integrity
      command: git diff --check && git status --short --branch
      expected_result: The final committed repository has no whitespace errors or uncommitted files.
checkpoints:
    - name: Safety contract and threat model
      status: passed
      evidence:
          - check: Proof and non-proof contract
            result: passed
            details: docs/migration/semantic-safety-analysis.md defines the pure three-input API, five stable codes, exact positive proof conditions, evidence identities, typed uncertainty, deterministic bounds, and explicit non-proofs including universal vulnerability, runtime complexity, exploitability, severity, diagnostics, rewrites, portability, and target behavior.
          - check: Contract hardgates
            command: cargo test --manifest-path core/Cargo.toml --all-targets && python3 tooling/core_contract_validation.py && ./strling governance
            result: passed
            details: Every planned positive finding is grounded only in certified semantic or structural facts, unknown cannot satisfy a positive proof, and no raw-source parsing or target dependency was introduced.
    - name: Safety analysis framework
      status: passed
      evidence:
          - check: Pure API and typed model
            command: cargo test --manifest-path core/Cargo.toml --test safety_analysis
            result: passed
            details: The kernel exposes analyze_safety(&SemanticProgram, &SemanticFacts, &StructuralFacts) -> Result<SafetyAnalysis, SafetyAnalysisErrors> with stable codes, categories, primary and contributing NodeIds, typed evidence, proof status, uncertainty, relationship references, deterministic ordering, and no input mutation.
          - check: Correspondence, evidence, and bounds
            result: passed
            details: Structured validation rejects mismatched foundational or structural program identity, incomplete node coverage, malformed structural relationships, malformed evidence references, excessive semantic depth, more than 65536 nodes, more than 4096 findings, or more than 4096 uncertainty records without exposing partial results.
    - name: Repetition progress and nested repetition findings
      status: passed
      evidence:
          - check: Progress and nested detectors
            command: cargo test --manifest-path core/Cargo.toml --test safety_repetition
            result: passed
            details: Eight focused tests cover guaranteed-consuming literals, nullable and indeterminate operands, exact and bounded repetitions, fixed inner counts, overlapping variable nested repetitions, captures, assertions, atomic and possessive barriers, and conservative unknowns.
          - check: False-positive protections
            result: passed
            details: Always-consuming operands receive no zero-progress finding; bounded outer or fixed inner counts, possessive modes, atomic barriers, sequence barriers, potentially-zero-consuming inner operands, and unknown-only leading evidence do not become nested-amplification positives.
    - name: Ambiguity and follower competition findings
      status: passed
      evidence:
          - check: Certified relationship consumption
            command: cargo test --manifest-path core/Cargo.toml --test safety_competition
            result: passed
            details: Nine focused tests cover disjoint, overlapping, identical-prefix, Unicode-property, wildcard, nullable-only, bounded, exact-count, possessive, nullable-follower, direct-follower, and deterministic evidence-order cases using structural relationships without recomputing set overlap.
          - check: Unknown and branch identity preservation
            result: passed
            details: Only certified Overlapping relationships can produce positive competition findings; Disjoint is silent, Unknown remains typed uncertainty, nullable-only branch overlap is not promoted, and branch, operand, follower, sequence, repetition, and relationship identities remain explicit evidence.
    - name: Property soundness and legacy evidence certification
      status: passed
      evidence:
          - check: Fixed-seed generated certification
            command: cargo test --manifest-path core/Cargo.toml --test safety_analysis_properties
            result: passed
            details: Four reproducible seeds (0x5341464554595f31, 0x9e3779b97f4a7c15, 0xd1b54a32d192ed03, 0x94d049bb133111eb) generated 384 normalized programs spanning all 12 Semantic IR variants; six deterministic witnesses cover all five finding codes and unknown preservation.
          - check: Soundness properties
            result: passed
            details: Repeated analysis is identical; all evidence NodeIds and relationship facts resolve; no Disjoint or Unknown relationship produces a positive overlap finding; guaranteed-consuming unbounded repetition receives no zero-progress finding; and Semantic IR plus both prerequisite stores remain unchanged.
          - check: Legacy detector comparison
            result: passed
            details: Six representative cases produce zero unexplained differences across agreement, canonical semantic improvement, legacy false positive, legacy false negative candidate, and unsupported historical heuristic classifications. Canonical behavior was not changed to imitate the source-text detector.
    - name: Pipeline and hardgate integration
      status: passed
      evidence:
          - check: Canonical stage registration
            command: python3 tooling/core_contract_validation.py
            result: passed
            details: Contract mapping registers safety_analysis after semantic_analysis and structural_analysis for analysis and Semantic IR ownership; all 11 schema mappings and 62 canonical fixtures pass.
          - check: Controlled dependency failures
            command: python3 -m pytest -q tooling/tests/test_core_contracts.py
            result: passed
            details: Fifteen controlled tests include rejection of missing safety ownership, API boundary, foundational dependency, or structural dependency and injected normalization, parser, raw-source scan, target, planner, portability, binding, frontend, diagnostics, emitter, environment, clock, process, thread, randomness, severity, ReDoS, and engine-specific markers.
          - check: Committed repository hardgates
            command: ./strling check --json && ./strling certify --json
            result: passed
            details: From committed state the governed check returned 40 passing results and certify returned 42 passing results, including all six integrity hardgates, canonical kernel quality, TypeScript compatibility, and required build coverage.
    - name: Completion and diagnostic-safety readiness
      status: passed
      evidence:
          - check: Capability, uncertainty, evidence, and exclusions
            result: passed
            details: This record and the ledger enumerate the API, all five proof conditions, unknown behavior, stable evidence guarantees, complexity limits, certified soundness properties, legacy heuristic disposition, unchanged product behavior, and every explicitly excluded later compiler concern.
          - check: Structured diagnostic handoff
            result: passed
            details: The next stage can convert certified semantic and safety evidence into structured compiler diagnostics and remediation metadata while target-specific behavior remains outside semantic safety analysis.
