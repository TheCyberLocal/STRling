change_classification:
    semantic_change:
        level: none
        evidence:
            - No-match explanation observes existing canonical semantics and cannot add accepted programs, matching behavior, or target meaning.
    public_api_change:
        level: none
        evidence:
            - CP1 records the intended future additive Rust data and producer surface but changes no public API.
        affected_surfaces: []
    schema_change:
