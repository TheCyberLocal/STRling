title: Bounded no-match explanation
status: in_progress
objective: Define and implement one deterministic, versioned no-match explanation result over canonical Semantic IR, exact structured explanation evidence, an explicit search subject, and optional completed target context, with conservative proven, likely, unknown, and unavailable dispositions under hard resource limits.
