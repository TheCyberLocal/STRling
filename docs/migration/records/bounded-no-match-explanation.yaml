change_classification:
    semantic_change:
        level: none
        evidence:
            - No-match explanation observes existing canonical semantics and cannot add accepted programs, matching behavior, or target meaning.
    public_api_change:
        level: additive
        evidence:
            - The Rust kernel gains one reusable bounded no-match producer plus closed versioned result, limit, evidence, context, and structured-error types; existing compile, explanation, conversion, and Simply APIs remain unchanged.
        affected_surfaces:
            - strling-kernel
    schema_change:
        level: additive
        evidence:
            - An independently versioned no-match result schema, closed reason taxonomy, and authored verification corpus are added without changing compiler protocol, Semantic IR, semantic explanation, conversion, or target-profile schemas.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - No compiler diagnostic or advice taxonomy changes; future no-match reason codes belong only to the independent result.
    target_behavior_change:
        level: none
        evidence:
            - Optional completed target context can make evaluation unavailable or target-dependent but cannot change planning, lowering, emission, or runtime results.
    architecture_change:
        level: additive
        evidence:
            - A pre-implementation fitness rule enforces the future no-match evaluator's canonical inputs, monotonic fail-safe, named ceilings, and prohibited frontend, compiler-stage, runtime-engine, binding, and product dependencies.
    generated_output_change:
        level: additive
        evidence:
            - CP1-CP3 changed no registered generated artifact; CP4 adds the governed no-match module, function, constants, enums, and structs to the generated strling-kernel public-contract snapshot without changing existing symbols.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: No-match result contract and reason corpus
      command: python3 -m tooling.no_match_explanation_contract && python3 -m unittest tooling.tests.test_no_match_explanation_contract
      expected_result: The closed 1.0.0 schema, proven/likely/unknown/unavailable/matched examples, controlled negatives, reason taxonomy, source/subject correspondence, target context, and resource-limit invariants pass with a stable fingerprint.
    - name: Bounded canonical evaluator and properties
      command: cargo test --manifest-path core/Cargo.toml --test no_match_explanation --test no_match_explanation_frontend_convergence --test no_match_explanation_properties --locked
      expected_result: Literals, classes, anchors, alternation, repetition, supported lookaround, captures/backreferences, Unicode scalars, ambiguity, malformed correspondence, logical and elapsed guards, no-panic behavior, frontend convergence, and repeated-byte determinism pass while unsupported semantics return unknown.
    - name: Architecture, public contracts, and representative target cross-check
      command: cargo test --manifest-path core/Cargo.toml --test no_match_explanation_target_crosscheck --locked && python3 tooling/core_contract_validation.py && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py
      expected_result: Representative target executions agree with canonical matched/no-match outcomes, unsupported target plans return unavailable, the additive Rust API is snapshotted, generated ownership is complete, and the evaluator has no frontend, lowering, emitted-pattern, runtime-engine, binding, or UI dependency.
    - name: Repository and campaign certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 -m unittest discover -s tooling/tests && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: Adjacent kernel/tooling, architecture, resource bounds, Local/Pull Request/Full profiles, migration differential, patch integrity, and clean-tree checks pass or retain only explicitly recorded inherited environment limitations.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Clean ordered boundary and bounded evidence architecture
            result: passed
            details: P15-T03 begins on clean architecture/v4 closure 546df5ff5a7fe355a00c5dc245ad6a5eddec6405. The independent result identity, explicit search mode, semantic/explanation/target inputs, outcome and evidence dispositions, source and subject coordinates, hard default ceilings, allowed/forbidden paths, rollback boundary, and Local/PR/Full acceptance profile are frozen before schema or implementation.
          - check: CP1 governance and documentation gate
            result: passed
            details: Governance validates the exact three-file scope-lock diff, change declarations, and architecture rules; all 35 governance unit tests pass; documentation integrity validates 177 Markdown files and seven executable examples; Prettier and git diff --check pass. No formal schema, Rust implementation, public API, generated artifact, diagnostic, semantic, target, binding, package, runtime engine, or product UX behavior is claimed.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed result schema and reason taxonomy
            result: passed
            details: Model 1.0.0 separates matched/no_match/unknown/unavailable outcomes from not_applicable/proven/likely/unknown/unavailable explanation dispositions. Twenty-seven ordered reason codes cover consuming, position, structure, assertion, capture state, target disposition, all seven resource guards, and conservative semantic uncertainty. Findings carry confidence, evidence class, canonical node/source linkage, UTF-8 subject location, and structured branch/repetition/assertion/capture context.
          - check: Authored positive, invalid, and pathological evidence
            result: passed
            details: Seventeen canonical Semantic IR programs and 24 private-subject cases cover literals, wildcard, ASCII classes, input/line/word anchors, alternation, repetition, positive/negative lookaround, captures/backreferences, Unicode scalars/properties, target-native uncertainty, multiple blockers, unsupported target disposition, and isolated subject-byte, subject-scalar, step, depth, branch, finding, and elapsed limits. Five positive documents cover every disposition class; five controlled-invalid documents isolate false proof, span, order, target, and identity failures.
          - check: CP2 contract and architecture gate
            result: passed
            details: The focused contract certifies schemas=1, positive=5, negative=5, reasons=27, programs=17, cases=24, matched=1, proven=7, likely=6, unknown=9, unavailable=1 with fingerprint sha256:62dbff6a46849292eb277a18ecdcdddb3c71dbd0319b90689840515bd1204876. CP3 executable-corpus integration corrected the target-unavailable fixture from a rewriteable atomic literal to an atomic alternation whose canonical ECMAScript rewrite proof fails, and aligned three authored work examples with the locked rule that candidate starts, node visits, and character comparisons each charge logical steps. Counts and intended coverage remain unchanged. Ten focused contract/architecture tests, canonical aggregate contracts, core mappings=11/fixtures=122 after executable-corpus and exact-example registration, Ruff, Prettier, documentation integrity over 178 Markdown files and seven executable examples, governance, and patch integrity pass.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: Canonical bounded evaluator and correspondence
            result: passed
            details: The public no_match_explanation module consumes only validated canonical Semantic IR, the exact linked semantic explanation, optional completed target status, an explicit search subject, and caller limits. It searches UTF-8 scalar boundaries, preserves source identity, never serializes subject text, returns structured errors for invalid limits or explanation mismatch, and returns unknown/unavailable rather than fabricating unsupported semantic or target claims.
          - check: Executable corpus, properties, and frontend convergence
            result: passed
            details: All 24 authored cases across 17 programs match their exact outcome, disposition, and ordered reason codes; all five authored positive documents reproduce exactly. Five focused evaluator tests, one four-surface alpha-convergence test, and two bounded property tests pass. A 119-evaluation corpus grid plus pathological zero-width repetition, alternation, nested capture, Unicode, and line-terminator subjects prove no-panic limits and repeated-byte determinism.
          - check: CP3 local quality and architecture gate
            result: passed
            details: Canonical aggregate contracts pass with no-match fingerprint sha256:62dbff6a46849292eb277a18ecdcdddb3c71dbd0319b90689840515bd1204876; core contracts pass at mappings=11/fixtures=122; 34 focused Python tests with 123 subtests, Rust all-target check, Ruff, Prettier, governance, and git diff --check pass. Clippy is clean for this change with only four pre-existing repository lint classes explicitly exempted; unmodified kernel.rs, protocol/request.rs, simply.rs, and source/mod.rs remain the direct -D warnings baseline findings for CP4/profile disposition.
    - name: Integration and certification
      status: passed
      evidence:
          - check: Governed target execution cross-check
            result: passed
            details: Five representative canonical cases (alternation, ASCII character class, positive lookahead, backreference, and input anchors with word boundaries) agree for 67 subjects with the pinned shared-cross-engine observations across ECMAScript 2024, PCRE2 10.42/10.43, and Python re string/bytes profiles. One completed unsupported target plan returns UNAVAILABLE with target_unsupported rather than fabricating a semantic cause. The governed evidence independently verifies at sha256:9a575b86e8ea43590b24fcc2bda2d3a7b80ed25fa98694f46924b247abd3493c.
          - check: Public and generated canonical-source integration
            result: failed
            details: The strling-kernel registry, extractor, and generated compatibility snapshot now derive the additive no_match_explanation module, function, bounds, enums, and structs from core/src/no_match_explanation.rs. The focused snapshot check and all 19 extractor tests pass; 63 focused CP4 Python tests plus 123 subtests pass. The aggregate generated-artifact registry verifies every task-relevant artifact, including shared-cross-engine, stdlib runtime/surface, explanation rendering, and public kernel evidence, but its unchanged Go public surface cannot execute because Go is absent from this Windows image.
          - check: Migration differential and architecture certification
            result: passed
            details: The reviewed migration baseline changes only its baseline and canonical-boundary fingerprints to include the new module. Three complete runs pass with zero determinism mismatches, 44 unchanged source observations, unchanged corpus/route/historical fingerprints, zero blocking unresolved replacements, and result fingerprint sha256:95a9fd66f04d19d66ee7378cf71b4897a99ea44163be7b33b992aedd7bf2baed. Core contracts remain mappings=11/fixtures=122; governance, generated ownership, architecture boundaries, Ruff, rustfmt, and git diff --check pass.
          - check: Repository profile and inherited-environment disposition
            result: failed
            details: Rust all-target tests pass. Strict Clippy reports only the four inherited untouched-file classes already recorded in kernel.rs, protocol/request.rs, simply.rs, and source/mod.rs; allowing exactly those four yields a clean all-target result. Local and Pull Request each pass 10 repository hardgates and Full passes 11, including canonical/core contracts, governance, legacy comparison, migration differential, and Full portability-matrix certification. Aggregate profile results are Local 10 passed/2 failed/14 unavailable, Pull Request 10/2/34, and Full 11/5/68 because the image lacks Go and multiple optional binding/runtime toolchains, exposes a broken Windows Store python3 alias, and has Node 24 where the repository requires Node 22. Full fresh security/cross-engine/stdlib runtime operations therefore remain environment carry-forward; governed checked-in cross-engine and stdlib evidence verify independently and no task-specific failure is hidden.
    - name: Completion and next-task readiness
      status: passed
      evidence:
          - check: Durable bounded-explanation acceptance record
            result: passed
            details: strling.no-match-explanation 1.0.0 closes with seven hard ceilings (16 KiB subject bytes, 4096 subject scalars, 100000 logical steps, depth 128, 4096 branch expansions, 32 findings, and 250 ms elapsed), 27 ordered reason codes, and a 17-program/24-case corpus containing matched=1, proven=7, likely=6, unknown=9, and unavailable=1. The contract fingerprint is sha256:62dbff6a46849292eb277a18ecdcdddb3c71dbd0319b90689840515bd1204876. Subject text is never serialized, exact semantic/explanation correspondence is mandatory, and every unsupported semantic, budget, or target state remains UNKNOWN or UNAVAILABLE.
          - check: Ordered P15-T04 handoff
            result: passed
            details: P15-T04 may compose the now-complete import, structured explanation, canonical Semantic STRling/Simply conversion, and bounded no-match contracts into a phase-wide certification corpus. It must prove normalized Semantic IR equivalence for every exact migration, retain stable explanation evidence and conservative UNKNOWN behavior, classify every difference in its owning layer, and add no new product semantics or engine-internal trace claims.
