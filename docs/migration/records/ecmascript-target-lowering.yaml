required_verification:
    - name: Complete ECMAScript profile and structured lowering matrix
      command: cargo test --manifest-path core/Cargo.toml --test target_contracts --test capability_profile_fixtures --test ecmascript_lowering --locked
      expected_result: All eighteen capability facts validate with an immutable profile fingerprint; every current Semantic IR variant lowers explicitly with exact options, captures, provenance, requirements, rewrites, and deterministic target structure.
    - name: Generated and negative properties
      command: cargo test --manifest-path core/Cargo.toml --test ecmascript_lowering_properties --locked
      expected_result: Generated nested/interacting programs are deterministic and immutable, while stale profiles/plans, unsupported or unresolved requirements, malformed rewrites, capture failures, target mismatches, and resource limits fail closed without panic.
    - name: Architecture and complete kernel quality
      command: python3 -m unittest tooling.tests.test_ecmascript_lowering_architecture; cargo test --manifest-path core/Cargo.toml --all-targets --locked; cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings
      expected_result: Architecture mutation tests prohibit PCRE2 reuse, policy recomputation, serialization/runtime/product dependencies, and target-neutral reverse dependencies; all kernel tests and warning-denied Clippy pass.
    - name: Repository certification
      command: python3 tooling/core_contract_validation.py; python3 tooling/public_contracts.py --check; python3 tooling/generated_artifacts.py --check; python3 tooling/governance.py; python3 tooling/documentation_integrity.py; python3 tooling/migration_differential.py --repeat-runs 3; ./strling profile local; ./strling profile pull-request; git diff --check
      expected_result: Every available hardgate passes, any exact immutable profile/boundary renewal is reviewed, host-only gaps remain unavailable without waiver, and the final committed tree is clean.
checkpoints:
    - name: ECMAScript authority, profile, and architecture inventory
      status: passed
      evidence:
          - check: Normative ECMAScript 2024 target authority
            result: passed
            details: The official ECMA-262 2024 Pattern, Assertion, Quantifier, AtomEscape, GroupSpecifier, CharacterClassEscape, RegExp initialization, Canonicalize, and WordCharacters clauses were inspected. They provide target facts for arbitrary backward assertions, Unicode modes/properties/scalars, captures/references, lazy quantifiers, anchors/boundaries, and flags while omitting atomic and possessive syntax.
          - check: Governed profile gap
            result: passed
            details: The current revision 1.0.0 profile enumerates only five of eighteen canonical requirement capabilities. P11-T01 must complete exact target facts and renew every authored profile reference before lowering; tests may not fabricate missing support.
          - check: Independent lowering boundary
            result: passed
            details: The PCRE2 lowering proves the required pure input/validation/rewrite/provenance pattern, but its types, syntax assumptions, option identities, and implementation are forbidden dependencies. A separate module will import only neutral contracts and retain ECMAScript-specific position, class, wildcard, flag-intent, capture, and lookaround distinctions for P11-T02.
    - name: Governed ECMAScript profile and rewrite evidence
      status: passed
      evidence:
          - check: Complete immutable ECMAScript 2024 capability profile
            result: passed
            details: Profile revision 1.1.0 now contains all eighteen canonical capability facts, explicitly marks atomic groups and possessive repetition unavailable, requires compile-stage Unicode mode u, and fingerprints as 5117ff6e6c30da54eb31a4621dce5f4807ab0e95f183848e70a01731a4bb4c9f. Every authored profile reference and conformance digest was renewed and revalidated.
          - check: ECMAScript atomic-literal equivalence evidence
            result: passed
            details: The specification-authored ECMAScript atomic-literal case is now certified as equivalent_rewrite. Its conformance evidence fingerprints as ca9a1a3f80e946fad14a231d9c9322756892fc75d84f1f8201d30072dff1b4d2, and the governed strategy fingerprints as d1ac04c04241dff1423c22b5962fc7336c57e664e2510d557edb6e41f885a7d6; no possessive or nonliteral atomic rewrite was added.
    - name: Independent structured lowering and failure boundary
      status: passed
      evidence:
          - check: Closed ECMAScript target representation
            result: passed
            details: The pure lowering module covers empty, sequence, alternation, literal, wildcard, character set, greedy/lazy repetition, every position, deterministic capture slots, named/numbered backreferences, and both lookaround directions. Case intent, exact profile options, requirements, applied rewrite certification, semantic identities, and source spans remain typed data outside regex syntax.
          - check: Certified input correspondence and fail-closed behavior
            result: passed
            details: Lowering validates canonical Semantic IR, 65,536-node and depth-128 limits, contract/specification compatibility, exact program and profile fingerprints, completed planner correspondence, capture resolution, and rewrite shape before returning output. Unknown, unsupported, stale, cross-target, malformed, over-limit, possessive, and nonliteral atomic inputs return stable STRL-ECMASCRIPT_LOWERING diagnostics with no partial plan.
          - check: Deterministic unit, property, corpus, and architecture proof
            result: passed
            details: Eight focused lowering tests and two generated-property tests over 196 valid programs passed. The governed lowering corpus records twelve native operation identities, one certified rewrite, two explicit fail-closed operations, and exact resource ceilings. Eight architecture tests prohibit PCRE2 reuse, policy recomputation, serialization/runtime/product dependencies, ambient inputs, reverse target dependencies, and direct kernel bypass.
    - name: Complete repository and governed-profile certification
      status: passed
      evidence:
          - check: Complete core and repository hardgates
            result: passed
            details: All 293 core tests, warnings-denied all-target Clippy, eight ECMAScript architecture tests, 11 schema mappings and 78 canonical fixtures, public and generated contracts, governance, documentation integrity across 139 files and seven executable examples, and patch integrity passed.
          - check: Reviewed migration differential renewal
            result: passed
            details: Adding the profile and lowering module changed only the canonical boundary projection. The reviewed three-run gate passes with 44 source observations, zero blocking unresolved replacements, zero nondeterministic mismatches, no replacement-review exemptions, canonical-boundary fingerprint sha256:80b90a82bc74a994aebdc74ac93fdd9a1a75bd3549835936f0825983f190d109, and baseline fingerprint sha256:39f309162b403c4f3af21a587e3d88dbc9b55edb471c12498702f6ef57d3286a; all corpus, route, source-observation, and historical-peer fingerprints remained unchanged.
          - check: Local and Pull Request profiles
            result: passed
            details: At clean implementation commit 4a5028cf68ee56fce051c62d28e9364d6e00ee7e, Local recorded 20 passed, zero failed, zero waived, and six unavailable operations with evidence fingerprint 33a0c9edd488c5ddafe594c12bfbf796b37216f8d2d15d4174e72016d58a0cf3. Pull Request recorded 39 passed, zero failed, zero waived, and seven unavailable operations. Aggregates are UNAVAILABLE, never failed, solely because host Ruff 0.16.2 differs from pin 0.15.21 and Pull Request also records the repository-managed Ruby Bundler mismatch.
