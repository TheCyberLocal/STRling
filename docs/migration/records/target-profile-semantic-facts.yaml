change_classification:
    semantic_change:
        level: compatible
        evidence:
            - Profiles describe target behavior and dependent semantic identities are refreshed; STRling language meaning and emitted behavior are unchanged.
    public_api_change:
        level: breaking
        evidence:
            - Generated Python and TypeScript standard-library source identity constants change with the governed profile inputs; callable API shape and behavior are unchanged.
        affected_surfaces:
            - python-public-api
            - typescript-public-api
    schema_change:
        level: breaking
        evidence:
            - Target profiles now require semantic_sets, semantic_algorithms, target_limits, and per-capability semantic_fact_refs.
    diagnostic_change:
        level: none
        evidence:
            - Existing diagnostic delivery findings remain assigned to V4-H05.
    target_behavior_change:
        level: compatible
        evidence:
            - Profile revisions and exact-revision guards change; lowering, regex text, options, and runtime expectations do not.
    architecture_change:
        level: compatible
        evidence:
            - The existing profile system gains typed facts and fail-closed resolution; no parallel profile system is introduced.
    generated_output_change:
        level: compatible
        evidence:
            - Registered evidence is regenerated because immutable profile references changed; observations and expectations remain unchanged.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Profile contracts and semantic model
      command: python3 -m unittest tooling.tests.test_canonical_contracts && cargo test --manifest-path core/internal/Cargo.toml --test target_contracts --test capability_profile_fixtures --test target_semantic_profiles --locked
      expected_result: Schema, loaders, canonicalization, fingerprints, negative cases, profile facts, and capability fact resolution pass.
    - name: V4-H01 corpus integrity and strict audit
      command: python3 -m tooling.adversarial_semantic_audit --verify-evidence && python3 -m tooling.adversarial_semantic_audit --strict
      expected_result: Evidence validates; strict exits nonzero with 148 known findings, zero unexpected, and zero unreproduced.
    - name: Architecture and governance
      command: python3 tooling/core_contract_validation.py && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py
      expected_result: All contract, architecture, generated-artifact, governance, and documentation gates pass.
    - name: Required quality profiles
      command: ./strling profile local --json && ./strling profile pull-request --json
      expected_result: Local passes 36 of 36 and Pull Request passes 76 of 76; Full and Release remain out of scope.
checkpoints:
    - name: Starting state
      status: passed
      evidence:
          - check: Branch, remote, and worktree
            result: passed
            details: dev was clean at 3bf45b30da0b752d5443ab8396ad6063e3a2ede8 and matched origin/dev before modification.
    - name: Profile model
      status: passed
      evidence:
          - check: First-class fact vocabulary
            result: passed
            details: The contract, Rust model, and Python validator define closed semantic sets, algorithms, Unicode identities, matching units, and typed target limits with role-bearing capability references.
          - check: Governed profiles
            result: passed
            details: ECMAScript 2024 and both PCRE2 profiles are revision 1.2.0; Python str is 1.3.0; Python bytes is 1.1.0. Each carries three sets and four algorithms; PCRE2 additionally carries exact syntactic and uncertain compiled-pattern limits.
    - name: Verification
      status: in_progress
      evidence: []
