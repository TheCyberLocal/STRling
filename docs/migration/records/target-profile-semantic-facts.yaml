completion:
    accomplished:
        - Extended the single canonical target-profile contract with first-class semantic sets, semantic algorithms, typed target limits, Unicode identities, evidence, and role-bearing capability references.
        - Migrated all five governed profiles with deterministic word-character, line-terminator, wildcard-exclusion, case-folding, unset-backreference, repeated-capture, and matching-unit facts. PCRE2 profiles separately describe exact syntactic quantifier bounds and uncertain resource-dependent compiled-pattern bounds.
        - Connected capability evaluation to required facts with unknown/error outcomes for absent or malformed facts, invalid values, unsupported schema identities, missing evidence, and dangling references.
        - Extended canonical serialization and fingerprints so every governed semantic set, algorithm, Unicode version, and limit participates in immutable profile identity.
        - Mapped every V4-H01 finding that requires semantic profile vocabulary to a governed fact without resolving, accepting, or waiving the divergence.
    verified:
        - Focused schema, loader, canonicalization, fingerprint, negative, capability-resolution, cross-engine semantic, LSP, and TypeScript tests pass.
        - The complete generated-artifact graph, public contracts, architecture, governance, documentation, formatting, lint, Local, and Pull Request gates pass.
        - Strict adversarial execution remains intentionally non-green with exactly 148 known findings reproduced and no unexpected or unreproduced findings.
    behavior_changed: Target profiles now expose governed semantic facts and exact profile revisions. Compiler lowering, emitted patterns and options, runtime matching behavior, requirements reconciliation, and diagnostic delivery are unchanged.
    intentional_behavior_changes:
        - Profile schema revisions and fingerprints now change when semantic facts change, and consumers fail closed when a required fact is absent or invalid.
    preserved_behavior:
        - The 148 reproduced V4-H01 divergences remain unresolved and unwaived; strict audit remains outside mandatory green profiles until later hardening tasks correct product behavior.
        - No performance measurements or thresholds, certification policy, package publication, release tag, P20 publication, or supported target-engine scope changed.
    transitional_architecture:
        - Capability evaluation can now distinguish native facts, constraints, rewrites, and unavailability, but V4-H03 and V4-H04 still own requirement reconciliation and concrete lowering/runtime corrections.
    deferred_work:
        - V4-H03 owns emitted-artifact requirement completeness and reconciliation.
        - V4-H04 owns concrete semantic and target-acceptance corrections.
        - V4-H05 owns diagnostic integrity and delivery.
        - V4-H06 owns mandatory real-engine equivalence CI after corrections exist.
readiness:
    status: READY
    next_task: V4-H03 — emitted-artifact requirement completeness.
    rationale: All five governed profiles express the semantic differences exposed by V4-H01, capability evaluation resolves them fail-closed, all required green gates pass, and the strict audit preserves the exact known-red baseline. No semantic-profile representation gap blocks requirement reconciliation.
