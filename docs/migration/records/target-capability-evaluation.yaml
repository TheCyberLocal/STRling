required_verification:
    - name: Kernel capability quality
      command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && cargo check --manifest-path core/Cargo.toml --all-targets && cargo test --manifest-path core/Cargo.toml
      expected_result: The kernel formats, checks, and tests without warnings; all capability, profile, property, pipeline, and prior regression tests pass.
    - name: Profiles, properties, contracts, and architecture
      command: cargo test --manifest-path core/Cargo.toml --test target_contracts --test capability_evaluation --test capability_evaluation_properties --test capability_profile_fixtures --test capability_requirements && python3 tooling/core_contract_validation.py && python3 -m unittest tooling.tests.test_capability_architecture tooling.tests.test_diagnostic_architecture
      expected_result: Authored profiles, exact reference resolution, generated properties, cross-profile fixtures, canonical mappings, and controlled architecture failures all pass.
    - name: Repository quality and certification
      command: ./strling format --check && ./strling hygiene && ./strling lint all && ./strling typecheck all && ./strling generate --check && ./strling contracts --check && ./strling governance && python3 tooling/baseline.py --check && ./strling check --json && ./strling certify --json
      expected_result: Every enforced repository quality, contract, governance, and baseline operation passes from committed state; aggregate check and certify complete with only the repository's pre-existing governed incomplete capabilities or unavailable local tools.
    - name: TypeScript compatibility baseline
      command: ./strling build typescript && ./strling test typescript && ./strling typecheck typescript
      expected_result: Existing TypeScript runtime/compiler behavior remains unchanged with all 19 suites and 963 tests passing.
    - name: Patch and clean-state integrity
      command: git diff --check && git status --short --branch
      expected_result: The final committed repository has no whitespace errors or uncommitted files.
checkpoints:
    - name: Capability evaluation contract
      status: passed
      evidence:
          - check: Requirement, outcome, evidence, constraint, and ownership contract
            command: Repository audit plus ./strling format --check and git diff --check
            result: failed
            details: The contract maps every ratified target-sensitive Semantic IR construct, explicitly identifies constructs with no special target requirement, preserves missing profile data as Unknown, separates native factual support from rewrite possibility, and contains no emitted syntax.
    - name: Requirement extraction
      status: passed
