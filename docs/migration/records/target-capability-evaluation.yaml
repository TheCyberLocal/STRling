completion:
    accomplished:
        - Added capability_evaluation::extract_requirements(&SemanticProgram, &SemanticFacts, &StructuralFacts) and capability_evaluation::evaluate_capabilities(&SemanticProgram, &SemanticFacts, &StructuralFacts, &TargetProfile) as pure borrowed-input APIs. Exact-reference evaluation resolves TargetProfileReference through a caller-supplied TargetProfileSet and verifies profile identity, revision, and canonical fingerprint.
        - Requirement occurrences retain stable NodeId identity, canonical CapabilityId, typed semantic kind, certified capture/reference resolution, structural lookbehind length and bounds, Unicode/category data, assertion polarity, repetition mode, position kind, and case semantics. Requirements contain no target syntax, final capture indices, rewrite instructions, or source traversal identity.
        - Supported requirement categories cover lookahead; fixed and variable lookbehind; named logical captures; backreferences; Unicode properties, classes, and non-ASCII scalar semantics; atomic groups; lazy and possessive repetition; anchors and word boundaries; and insensitive matching. Empty/structural composition, ASCII-only base matching, wildcard, greedy repetition, and unnamed capture add no special target requirement by themselves.
        - CapabilityDisposition is exactly Supported, Unsupported, ConstraintViolation, or Unknown. Missing capability records and insufficient or incomparable constraint facts remain Unknown; explicit unavailable records alone become Unsupported; factual native unavailability is not a portability decision and does not preclude a later equivalent rewrite.
        - Typed equals, at-most, at-least, one-of, and requires-option constraints evaluate exact scalars and units. Lookbehind constraints consume certified fixed, finite-variable, unbounded, or indeterminate length evidence without recomputation. Any proved violation wins, otherwise any unknown constraint remains Unknown, and only all-satisfied constraints produce Supported.
        - Every result contains the complete requirement, semantic node, immutable target profile reference, engine/runtime version identity, exact capability record or explicit absence, typed constraint facts/evaluations, and factual disposition in deterministic requirement order.
        - The same semantic requirements evaluated against authored PCRE2 10.42 and 10.43 profiles produce version-sensitive results without engine-name assumptions. PCRE2 10.42 explicitly rejects variable lookbehind; 10.43 evaluates its bound and conservatively retains Unknown when matcher API context is absent. ECMAScript 2024 and Python re 3.11 provide independent native, unavailable, constrained, and unknown evidence.
        - Added a crate-private first target-aware pipeline after normalization, semantic analysis, structural analysis, safety analysis, and target-neutral diagnostics. It returns diagnostics plus factual capability evaluation only; existing CompileResult behavior remains target-neutral with no portability plan or target artifact.
    verified:
        - Four fixed seeds (0x4341504142494c49, 0x9e3779b97f4a7c15, 0xd1b54a32d192ed03, and 0x94d049bb133111eb) generated 256 normalized programs and 2,048 repeated evaluations across four authored profiles. Determinism, completeness, unknown preservation, profile sensitivity, constraint soundness, and input immutability passed; 16 malformed profiles were rejected.
        - All 169 canonical kernel tests passed with rustfmt, warnings-denied Clippy, warnings-denied cargo check, target-profile fixtures, cross-profile capability fixtures, property certification, pipeline tests, and all prior kernel regressions.
        - Canonical validation passed 11 schema mappings and 63 fixtures. Controlled architecture tests reject reverse target dependencies, runtime/filesystem/environment probing, direct prerequisite re-execution, emitters, planners, portability policy, bindings, frontends, editors, and engine-specific assumptions.
        - Repository formatting, hygiene, configured lint and typecheck operations, generation, contracts, governance, architecture fitness, frozen baseline validation, TypeScript build/typecheck and all 19 suites with 963 tests, patch integrity, and committed clean-tree verification passed. Aggregate check and certify executed fully and retained their pre-existing nonzero disposition solely because governed incomplete capabilities and unavailable local Ruby and Swift tools remain; no configured operation relevant to this change failed.
    behavior_changed: No existing STRling runtime/compiler behavior intentionally changed.
    intentional_behavior_changes:
        - Only the internal canonical Rust kernel gains semantic requirement extraction and factual versioned target capability evaluation.
        - Canonical contract mapping and architecture fitness now register the stage and enforce the one-way target-neutral-to-target-aware boundary.
    preserved_behavior:
        - Existing grammar/parser behavior, runtimes, compilers, target selection, portability decisions, target lowering, regex output, diagnostics, public package APIs, package versions, bindings, Simply, LSP/editor behavior, and published artifacts remain unchanged.
        - SemanticProgram, SemanticFacts, StructuralFacts, and TargetProfile remain immutable inputs; the stage neither probes installed engines nor mutates prerequisite analysis.
    transitional_architecture:
        - The integrated capability pipeline remains crate-private because exposing or migrating a product compiler API is separately governed work.
        - Existing authored profiles intentionally enumerate incomplete capability information, so unlisted ratified requirements remain explicit Unknown evidence.
    deferred_work:
        - Equivalent rewrite planning, portability status decisions, target-specific diagnostics, target lowering, regex emission, automatic remediation, runtime engine probing, parser/binding/Simply/LSP migration, package changes, and publication are not implemented.
        - The next task is canonical portability planning that transforms factual capability evaluations into native, equivalent_rewrite, or unsupported decisions without emitting target syntax.
