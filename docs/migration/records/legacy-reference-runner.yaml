    next_task: Build P07-T02, the complementary legacy/reference runners, to expose Python and narrowly necessary runtime/reference divergence without making implementation consensus normative.
    rationale: The TypeScript runner deterministically captures every scoped historical surface with independent versioning, stable implementation identity, structured containment, full operation coverage, zero repeatability mismatches, and enforced non-normative dependency boundaries. All available committed-state checks passed. The only current evidence gap is the recorded WSL host outage affecting native profile and platform-dependent reruns; later complementary runners, comparison semantics, and full-corpus work remain correctly outside this task.
