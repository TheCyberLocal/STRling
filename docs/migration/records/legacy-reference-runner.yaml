            command: python3 tooling/legacy_reference/launch.py --check && python3 -m unittest tooling.tests.test_quality.QualityRoutingTests.test_repository_operations_and_profile_membership_are_canonical -v
            result: passed
            details: The offline legacy_reference_check operation is registered exactly once in every governed profile, the root legacy-reference command routes to the same launcher, and the 41 focused tests certify 24 cases, 72 repeated canonical comparisons, and zero mismatches.
          - check: Architecture authority boundary
