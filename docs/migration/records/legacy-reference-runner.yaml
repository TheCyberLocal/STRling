completion:
    accomplished:
        - Exposed exactly 11 isolated tooling operations over the existing TypeScript parser.parse, parser.parseToArtifact, Compiler.compile, Compiler.compileWithMetadata, PCRE2 emit, PCRE2 emitWithDiagnostics, package-root parse, package-root parseToArtifact, Simply Pattern.toString, Simply compileNode, and Simply toRegExp surfaces.
        - Established protocol and observation schema 1.0.0 with validated exact-surface requests, distinct parser/compiler/emitter/API operations, canonical JSON, request identity, success versus captured legacy-failure outcomes, and nonzero runner/protocol failure exits.
        - Derived the legacy implementation fingerprint from every tracked TypeScript source, package manifest and lock file, tsconfig, and actual Node runtime version without repository state, timestamps, absolute paths, or temporary locations.
        - Certified a source-authored 24-case corpus across all operation classes and relevant grammar, preprocessing, option, target, diagnostic, malformed, package-root, and Simply behavior families while keeping generated observations ephemeral.
        - Integrated the runner into the existing root CLI and every canonical profile and enforced mutation-tested boundaries preventing product, normative, generated-specification, canonical-core, portability, or target-capability authority from flowing through legacy evidence.
    verified:
        - Governed Node 22.23.2 produced implementation fingerprint sha256:520b1a43a8c8aac5c8a4c455017b6dfa6c0112baf8b18cb68606dc5d7ccebb22 and corpus fingerprint sha256:744a4d0e029fbb2890e98e25d20402044f5b551a7642255a57c80f5dec48d30a.
        - Forty-one focused tests and three complete corpus runs produced 17 success and 7 captured legacy-failure observations, including 2 malformed cases, across 72 canonical observation comparisons with zero mismatches or unexplained failures and unchanged corpus and implementation inputs.
        - Five live/controlled architecture tests, 11 governance-contract tests, and the canonical profile-routing contract passed; the hardgate rejects all governed authority-boundary mutations.
        - From committed checkpoint 3ed93f8325d7cddc9f310b5c141fd6b4893729fe, TypeScript typecheck, canonical/core contracts, baseline, documentation integrity for 124 documents, security integrity/content, formatting, lint, JSON and shell syntax, and patch integrity passed.
        - The complete TypeScript baseline passed earlier in the task with 19 suites and 963 tests before the WSL host became unavailable. Final local, pull-request, full, Rust, generated/public-contract, native governance-wrapper, and complete Jest attempts remain truthfully unavailable because Wsl/Service/0x80072747 prevented native operation dispatch.
    behavior_changed: No existing STRling runtime/compiler behavior intentionally changed.
    intentional_behavior_changes:
        - The engineering-only root tooling CLI and canonical profiles now expose the isolated legacy-reference check without adding a package entrypoint or product dependency.
        - Architecture fitness now fails when legacy-runner evidence is imported by product or normative sources, generates normative specification, reaches canonical/target authority, or becomes a target-capability source.
    preserved_behavior:
        - Legacy parser, compiler, emitter, diagnostics, options, preprocessing, directives, public package entrypoints, and Simply semantics remain unchanged; the runner only invokes and projects them.
        - Canonical Rust-kernel semantics, Semantic IR, diagnostics, safety, portability, target capability and lowering authority, and public contracts remain unchanged and do not depend on the runner.
        - Package APIs, package versions, generated product artifacts, runtime behavior, and publication remain unchanged.
    transitional_architecture:
        - Canonical observations are intentionally ephemeral because existing generated-artifact governance has no historical-oracle authority class; deterministic certification regenerates and compares them by explicit implementation and corpus fingerprints.
        - The final native certification environment remained unavailable because WSL failed with service error 0x80072747. No security, profile, governance, or aggregate policy was weakened to report those checks as passing.
    deferred_work:
        - Build P07-T02 complementary Python and narrowly necessary runtime/reference runners without assuming implementation consensus or granting them normative authority.
        - Implement P07-T03 separately versioned canonical comparison normalization and discrepancy taxonomy.
        - Execute the complete cross-implementation migration corpus only in its later governed task.
