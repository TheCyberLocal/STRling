record_version: 2.0.0
title: Controlled legacy TypeScript reference runner
status: in_progress
objective: Build deterministic isolated migration tooling that records the existing TypeScript parser, compiler, emitter, and relevant API behavior as independently versioned historical evidence without changing or governing product semantics.
scope:
    diff:
        base: 1619772f2aabe75182a26c9636ea5e219a7f948f
        head: working-tree
    allowed_paths:
        - docs/migration/legacy-reference-runner.md
        - docs/migration/ledger.md
        - docs/migration/records/legacy-reference-runner.yaml
        - governance/architecture-rules.json
        - governance/change-control.json
        - strling
        - toolchain.json
        - tooling/index.md
        - tooling/legacy_reference/**
        - tooling/tests/test_legacy_reference_architecture.py
    forbidden_paths:
        - bindings/typescript/package.json
        - bindings/typescript/src/**
        - core/**
        - spec/**
    expected_files:
        - docs/migration/legacy-reference-runner.md
        - docs/migration/records/legacy-reference-runner.yaml
        - governance/change-control.json
        - tooling/legacy_reference/**
    permitted_generated_changes: []
    expected_generated_outputs: []
    required_verification_levels:
        - contract
        - unit
        - integration
        - quality
        - certification
    bounded_exemptions: []
change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: none
        evidence: []
    schema_change:
        level: none
        evidence: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
        level: none
        evidence: []
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Legacy reference focused tests
      command: python3 tooling/legacy_reference/launch.py --check
      expected_result: All protocol, operation, corpus, determinism, containment, and immutability tests pass.
    - name: TypeScript baseline
      command: ./strling typecheck typescript && ./strling build typescript && ./strling test typescript
      expected_result: The existing TypeScript implementation typechecks, builds, and retains its complete test baseline.
    - name: Canonical Rust kernel baseline
      command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && cargo test --manifest-path core/Cargo.toml
      expected_result: The canonical kernel remains formatted, warning-free, and fully passing without a legacy-runner dependency.
    - name: Repository contracts and governance
      command: python3 tooling/contract_validation.py && python3 tooling/core_contract_validation.py && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/documentation_integrity.py --json && python3 tooling/governance.py && python3 tooling/architecture_fitness.py
      expected_result: Contracts, generated state, documentation, declared task scope, and architecture boundaries pass.
    - name: Security and profiles
      command: python3 tooling/security.py integrity --json && python3 tooling/security.py content --json && ./strling profile local && ./strling profile pull-request && ./strling profile full
      expected_result: Enforceable security and profile operations pass while governed unavailable results remain explicit.
    - name: Patch and repository integrity
      command: git diff --check && git status --short --branch
      expected_result: The patch is whitespace-clean and final committed state is clean.
checkpoints:
    - name: Reference contract and legacy surface inventory
      status: passed
      evidence:
          - check: Repository and legacy TypeScript inventory
            command: Read package, parser, compiler, emitter, Simply API, tests, fixtures, migration baselines, public snapshots, and tooling governance.
            result: passed
            details: Identified the exact parser, compiler, PCRE2 emitter, diagnostic, directive, package-root, and Simply surfaces plus the existing package-entrypoint defect and TypeScript-oracle transition evidence.
          - check: Evidentiary contract and authority boundary
            command: npx prettier --check docs/migration/legacy-reference-runner.md docs/migration/records/legacy-reference-runner.yaml governance/change-control.json && python3 tooling/documentation_integrity.py --json && python3 tooling/governance.py && git diff --check
            result: passed
            details: Prettier, documentation integrity for 123 documents, task scope, change declarations, all enforced architecture rules, and patch integrity passed.
    - name: Deterministic runner protocol and serialization
      status: passed
      evidence:
          - check: Protocol validation, serialization, and identity
            command: node --test tooling/legacy_reference/tests/protocol.test.mjs
            result: passed
            details: Nine tests passed for valid and malformed requests, unknown operations, exact surface routing, recursive canonical JSON, stable and sensitive implementation identity, byte-identical repeat observation, and structured stack-free legacy failure.
          - check: Checkpoint quality gates
            command: npx prettier --check tooling/legacy_reference docs/migration/records/legacy-reference-runner.yaml && ./strling typecheck typescript && python3 tooling/governance.py && python3 tooling/architecture_fitness.py && git diff --check
            result: passed
            details: Focused tests, Prettier, TypeScript typecheck, canonical/core/public contracts, generated state, documentation integrity for 124 documents, governance, architecture fitness, and patch integrity passed.
    - name: Parser and public API observation
      status: passed
      evidence:
          - check: Direct legacy parser and public API observation
            command: python3 tooling/legacy_reference/launch.py --check
            result: passed
            details: Twenty-two total focused tests passed, including 13 parser/API tests for literals, escapes, character classes, named captures, alternation, repetition, lookaround, directives, malformed syntax, package-root shapes, Simply exact text, unsupported target failure, request immutability, repeatability, and CLI containment.
          - check: Parser/API checkpoint quality gates
            command: npx prettier --check tooling/legacy_reference && ruff format --check tooling/legacy_reference/launch.py && ./strling typecheck typescript && ./strling build typescript && ./strling test typescript && python3 tooling/governance.py && python3 tooling/architecture_fitness.py && git diff --check
            result: passed
            details: Focused tests, Prettier, Ruff format, TypeScript typecheck/build and all 19 suites with 963 tests, canonical/core/public contracts, generated state, documentation, governance, architecture fitness, source/fixture immutability, and patch integrity passed.
    - name: Compiler and emitter observation
      status: passed
      evidence:
          - check: Direct legacy compiler and emitter observation
            command: python3 tooling/legacy_reference/launch.py --check
            result: passed
            details: Thirty-two focused tests passed, including ten compiler/emitter tests for normalized IR, sorted metadata, exact PCRE2 and flag text, parser-stage containment, diagnostic warnings, variable-length lookbehind failure, depth failure, distinct surface routing, and CLI containment.
          - check: Compiler/emitter checkpoint quality gates
            command: npx prettier --check tooling/legacy_reference docs/migration/legacy-reference-runner.md docs/migration/records/legacy-reference-runner.yaml && ruff format --check tooling/legacy_reference/launch.py && ./strling typecheck typescript && python3 tooling/core_contract_validation.py && python3 tooling/documentation_integrity.py --json && python3 tooling/architecture_fitness.py && git diff --check
            result: passed
            details: Focused tests, Prettier, Ruff format, isolated TypeScript build, TypeScript typecheck, core contracts, documentation integrity for 124 documents, architecture fitness, and patch integrity passed. The observed metadata projection was retained exactly, including the historical feature set returned for the combined case. WSL-only wrapper checks remained unavailable after the host service reported Wsl/Service/0x80072747; their last committed-state results were green at the parser/API checkpoint and the complete required profiles remain scheduled for checkpoint 6.
    - name: Determinism and reference corpus certification
      status: passed
      evidence:
          - check: Focused reference corpus certification
            command: python3 tooling/legacy_reference/launch.py --check
            result: passed
            details: Forty-one focused tests passed. The 24-case corpus covers all 11 operation classes and produced 17 success plus 7 legacy-failure observations, including 2 malformed-input cases. Three complete runs compared 72 canonical observations with zero mismatches or unexplained failures.
          - check: Governed Node certification identity
            command: python3 tooling/legacy_reference/launch.py --certify
            result: passed
            details: Node 22.23.2 produced corpus fingerprint sha256:744a4d0e029fbb2890e98e25d20402044f5b551a7642255a57c80f5dec48d30a and implementation fingerprint sha256:520b1a43a8c8aac5c8a4c455017b6dfa6c0112baf8b18cb68606dc5d7ccebb22. The corpus and governed TypeScript implementation inputs remained byte-identical.
          - check: Independent versioning, sensitivity, and non-interpretation
            command: node --test tooling/legacy_reference/tests/protocol.test.mjs tooling/legacy_reference/tests/corpus.test.mjs
            result: passed
            details: Tests prove separate protocol, observation, corpus, batch, and certification version fields; implementation-fingerprint sensitivity to governed input mutation; stable unique case identities; structured malformed containment; and absence of comparison disposition fields or labels.
    - name: Tooling integration and architecture hardgates
      status: planned
      evidence: []
    - name: Reference runner readiness
      status: planned
      evidence: []
