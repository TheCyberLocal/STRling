            result: passed
            details: Five live and controlled-mutation hardgate tests and 11 governance-schema contract tests passed. The rule rejects core or binding dependency on the harness, normative specification dependency on legacy evidence, normative generated outputs sourced from legacy evidence, runner residency under core or spec, and legacy target-capability authority tokens.
          - check: Affected certification and environment-preserved unavailable gates
            command: ./strling typecheck typescript; python3 tooling/contract_validation.py; python3 tooling/core_contract_validation.py; python3 tooling/documentation_integrity.py --json; python3 tooling/baseline.py --check; python3 tooling/security.py integrity --json; python3 tooling/security.py content --json
