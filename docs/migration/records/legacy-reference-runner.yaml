change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: additive
        evidence:
            - Adds the engineering-only legacy-reference command to the root tooling CLI without changing package APIs.
        affected_surfaces:
            - root-cli
    schema_change:
        level: additive
        evidence:
            - Adds the legacy-reference-boundary architecture-rule kind and required configuration without changing product schemas.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
