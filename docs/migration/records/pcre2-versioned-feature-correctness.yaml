required_verification:
    - name: Versioned PCRE2 capability and artifact matrix
      command: cargo test --manifest-path core/Cargo.toml --test capability_requirements --test capability_evaluation --test portability_planning --test pcre2_lowering --test pcre2_serialization --test pcre2_versioned_features --locked
      expected_result: Exact authored 10.42 and 10.43 profiles resolve every advanced requirement, preserve true unknowns, reject unsupported or over-bound constructs, and create deterministic artifacts only for proven support.
    - name: Exact PCRE2 10.42 and 10.43 direct feature proof
      command: python3 tooling/pcre2_feature_probe.py --fixture tests/target/pcre2/versioned-features.json --profile spec/targets/profiles/pcre2-10.42.json --library <exact-10.42-lib>; python3 tooling/pcre2_feature_probe.py --fixture tests/target/pcre2/versioned-features.json --profile spec/targets/profiles/pcre2-10.43.json --library <exact-10.43-lib>
      expected_result: Both exact 8-bit libraries report their selected version; every applicable compile and pcre2_match observation, boundary rejection, Unicode delta, artifact option, and deterministic result digest matches the shared corpus.
    - name: Generated properties, architecture, and complete kernel quality
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked; cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings; python3 -m unittest tooling.tests.test_pcre2_feature_probe tooling.tests.test_pcre2_serialization_architecture tooling.tests.test_pcre2_lowering_architecture tooling.tests.test_capability_architecture tooling.tests.test_core_contracts
      expected_result: Generated nested/interacting programs remain deterministic and immutable, test-only profile fabrication is absent, controlled architecture mutations pass, all kernel tests pass, and Clippy is warning-free.
    - name: Repository certification
      command: python3 tooling/public_contracts.py --check; python3 tooling/generated_artifacts.py --check; python3 tooling/governance.py; python3 tooling/documentation_integrity.py; python3 tooling/migration_differential.py --repeat-runs 3; ./strling profile local; ./strling profile pull-request; ./strling profile full --when-available; git diff --check
      expected_result: Every available hardgate passes, exact profile and direct-engine evidence is recorded, migration evidence is reviewed, unavailable operations remain explicit without waiver, and the final committed tree is clean.
checkpoints:
    - name: Exact documentation, profile, capability, serialization, and runtime inventory
      status: passed
      evidence:
          - check: Exact upstream version authority
            result: passed
            details: Exact PCRE2 10.42 and 10.43 tag documentation and source were inspected. PCRE2 10.42 supports fixed-length top-level lookbehind alternatives, while 10.43 adds bounded variable branches for pcre2_match with a default configurable maximum of 255. Both document capture names of at most 32 code units, UTF and UCP as API options, and the advanced syntax forms in scope.
          - check: Direct ABI exploration
            result: passed
            details: Host PCRE2 10.42 and an isolated exact-tag 10.43 build were loaded through the 8-bit ABI. Fixed-alternative lookbehind, named capture/reference, atomic and possessive behavior, Unicode property matching, caseless Kelvin-sign matching, the 10.43 variable-lookbehind boundary, and the documented 10.42-to-10.43 UCP word-character delta were observed without using a moving system tool.
          - check: Governed gap inventory
            result: passed
            details: Current profiles enumerate only five of eighteen canonical requirement capabilities; tests fabricate complete support by replacing profile capabilities; matcher API is not an evaluable 10.43 fact; differing fixed branch lengths are misclassified as variable; serializer capture-name length is 128 instead of 32; and anchor/Unicode word obligations are implicit. The implementation must close these gaps without inferring runtime or broadening P10-T04.
