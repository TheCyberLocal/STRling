completion:
    accomplished:
        - Completed exact immutable PCRE2 10.42 and 10.43 capability profiles for the full advanced-feature vocabulary, including explicit matcher API, UTF/UCP, multiline/newline, Unicode-word, and bounded variable-lookbehind claims.
        - Corrected target-neutral lookbehind classification so fixed alternatives remain PCRE2-compatible without erasing Python's common-width constraint, and corrected capture-name facts plus the final serializer maximum to 32 code units.
        - Corrected fixed-alternative serialization to preserve top-level assertion branches and proved deterministic artifacts, structured pre-emission failures, exact options, version boundaries, and Unicode deltas through one shared 16-case corpus.
        - Added a bounded test-only exact 8-bit PCRE2 ABI probe with deterministic library/corpus/result evidence and no runtime, binding, package, facade, or release authority.
        - Renewed all immutable profile, conformance, equivalence, public diagnostic, property-count, and migration-boundary evidence affected by the exact profile corrections.
    verified:
        - Both exact official PCRE2 release tags pass every expected corpus compilation, rejection, and match observation with recorded source commits, library hashes, and result hashes.
        - All 281 Rust tests, warning-free Clippy, 37 focused Python architecture/probe tests, canonical/core/public/generated contracts, hygiene, governance, documentation, patch integrity, and the three-run migration differential pass.
        - Local, Pull Request, and Full profiles record 20, 39, and 68 passing operations respectively, zero failures, no waivers, and only explicit host tool or scanner unavailability.
    behavior_changed: Internal target planning and serialization now follow exact PCRE2 10.42 versus 10.43 feature semantics, constraints, artifact options, and syntax boundaries; no public compiler, binding, package, runtime, or release surface changed.
    intentional_behavior_changes:
        - PCRE2 10.42 accepts fixed top-level lookbehind alternatives but rejects genuine variable-length lookbehind; PCRE2 10.43 accepts bounded variable lookbehind only through pcre2_match at the governed maximum of 255.
        - PCRE2 10.42 no longer overclaims canonical Unicode word and boundary semantics, while 10.43 claims the exact documented UCP category expansion.
        - Named captures over 32 code units and invalid identifiers fail as exact profile/serializer constraints; fixed-alternative lookbehind retains direct assertion-level alternation in emitted text.
        - Complete authored profiles replace synthetic test-only capability fabrication and turn previously unknown supported features into exact native evidence.
    preserved_behavior:
        - Semantic IR, language semantics, safety analysis, normalization, public request/result schemas, kernel facade signatures, bindings, package APIs and versions, and publication state remain unchanged.
        - Unsupported, unknown, stale, incompatible, over-bound, or option-incompatible requirements still fail closed before artifact emission; no current-version behavior, silent fallback, DFA substitution, JIT, or ambient engine setting is inferred.
        - Exact direct execution remains a bounded certification tool and is not callable from product or kernel code.
    transitional_architecture:
        - Advanced PCRE2 profiles, lowering, and serialization remain standalone internal stages; the public facade still has no canonical source-to-artifact runtime route.
        - Local, Pull Request, and Full remain READY WITH RECORDED CARRY-FORWARD because host Ruff/Bundler versions and the dependency-risk scanner are unavailable; every available operation passes with zero failures.
    deferred_work:
        - P10-T04 owns exhaustive real-engine execution, adversarial and pathological patterns, match/depth/heap limits, sanitizer/JIT considerations, resource budgets, and performance certification.
        - UTF-16/UTF-32 parity, public runtime orchestration, bindings, editor/LSP integration, package/version changes, publication, tagging, release notes, and artifact upload remain outside this task.
readiness:
    status: READY WITH RECORDED CARRY-FORWARD
    next_task: Begin P10-T04 by proving real PCRE2 runtime safety, adversarial behavior, resource limits, and performance boundaries without moving runtime policy into canonical semantics or publishing a release.
    rationale: P10-T03 is complete with exact 10.42/10.43 profiles, deterministic advanced-feature artifacts, bounded direct engine proof, structured version and option failures, cross-target width preservation, full quality and differential certification, and zero failed profile operations. Only explicit host tool/scanner availability carries forward; P10-T04 is the next ordered contained task.
