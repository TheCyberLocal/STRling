required_verification:
    - name: Versioned PCRE2 capability and artifact matrix
      command: cargo test --manifest-path core/Cargo.toml --test capability_requirements --test capability_evaluation --test portability_planning --test pcre2_lowering --test pcre2_serialization --test pcre2_versioned_features --locked
      expected_result: Exact authored 10.42 and 10.43 profiles resolve every advanced requirement, preserve true unknowns, reject unsupported or over-bound constructs, and create deterministic artifacts only for proven support.
    - name: Exact PCRE2 10.42 and 10.43 direct feature proof
      command: python3 tooling/pcre2_feature_probe.py --fixture tests/conformance/pcre2-versioned-features.json --profile spec/targets/profiles/pcre2-10.42.json --library <exact-10.42-lib>; python3 tooling/pcre2_feature_probe.py --fixture tests/conformance/pcre2-versioned-features.json --profile spec/targets/profiles/pcre2-10.43.json --library <exact-10.43-lib>
      expected_result: Both exact 8-bit libraries report their selected version; every applicable compile and pcre2_match observation, boundary rejection, Unicode delta, artifact option, and deterministic result digest matches the shared corpus.
    - name: Generated properties, architecture, and complete kernel quality
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked; cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings; python3 -m unittest tooling.tests.test_pcre2_feature_probe tooling.tests.test_pcre2_serialization_architecture tooling.tests.test_pcre2_lowering_architecture tooling.tests.test_capability_architecture tooling.tests.test_core_contracts
      expected_result: Generated nested/interacting programs remain deterministic and immutable, test-only profile fabrication is absent, controlled architecture mutations pass, all kernel tests pass, and Clippy is warning-free.
    - name: Repository certification
      command: python3 tooling/public_contracts.py --check; python3 tooling/generated_artifacts.py --check; python3 tooling/governance.py; python3 tooling/documentation_integrity.py; python3 tooling/migration_differential.py --repeat-runs 3; ./strling profile local; ./strling profile pull-request; ./strling profile full --when-available; git diff --check
      expected_result: Every available hardgate passes, exact profile and direct-engine evidence is recorded, migration evidence is reviewed, unavailable operations remain explicit without waiver, and the final committed tree is clean.
checkpoints:
    - name: Exact documentation, profile, capability, serialization, and runtime inventory
      status: passed
      evidence:
          - check: Exact upstream version authority
            result: passed
            details: Exact PCRE2 10.42 and 10.43 tag documentation and source were inspected. PCRE2 10.42 supports fixed-length top-level lookbehind alternatives, while 10.43 adds bounded variable branches for pcre2_match with a default configurable maximum of 255. Both document capture names of at most 32 code units, UTF and UCP as API options, and the advanced syntax forms in scope.
          - check: Direct ABI exploration
            result: passed
            details: Host PCRE2 10.42 and an isolated exact-tag 10.43 build were loaded through the 8-bit ABI. Fixed-alternative lookbehind, named capture/reference, atomic and possessive behavior, Unicode property matching, caseless Kelvin-sign matching, the 10.43 variable-lookbehind boundary, and the documented 10.42-to-10.43 UCP word-character delta were observed without using a moving system tool.
          - check: Governed gap inventory
            result: passed
            details: Current profiles enumerate only five of eighteen canonical requirement capabilities; tests fabricate complete support by replacing profile capabilities; matcher API is not an evaluable 10.43 fact; differing fixed branch lengths are misclassified as variable; serializer capture-name length is 128 instead of 32; and anchor/Unicode word obligations are implicit. The implementation must close these gaps without inferring runtime or broadening P10-T04.
    - name: Complete exact PCRE2 profiles and capability facts
      status: passed
      evidence:
          - check: Complete immutable capability profiles
            result: passed
            details: PCRE2 10.42 and 10.43 profile revisions 1.1.0 enumerate all eighteen canonical requirement capabilities with exact release-tag evidence. Their canonical fingerprints are 0204c9b8ac96ac04a73497ec9ef9f07a2b21728c9cf5f1ff580fa154b4c53a6d and 0a40fef0e89ab341a031f335438d42203d21fa438358ab9a4aa1177fb8b9bbb4. Both explicitly require pcre2_match, multiline, newline ANY, UCP, and UTF; 10.43 alone records the 255-character variable-lookbehind maximum.
          - check: Exact version and cross-target feature classification
            result: passed
            details: Fixed top-level alternatives now remain fixed capability requirements for both PCRE2 releases, while genuine bounded repeats require variable lookbehind and are unsupported on 10.42. A target-neutral common_fixed_width fact preserves Python re's equal-width rule; python-re/3.11 revision 1.1.0 fingerprint d5cf41327257b97a68df551f5971c1e0e3b95bca810e8ac7b11b23020f23879d rejects differing fixed alternatives instead of inheriting PCRE2 behavior.
          - check: Capture, Unicode, boundary, and option constraints
            result: passed
            details: Named-capture requirements retain the semantic name and expose ASCII identifier shape plus exact code-unit length; both profiles and final serialization enforce PCRE2's 32-code-unit maximum. PCRE2 10.42 does not claim canonical Unicode word or boundary semantics, while 10.43 records the exact UCP Mn/Pc expansion. Unsupported, missing, incompatible, over-bound, and option-dependent cases remain structured capability evidence and fail before artifact emission.
    - name: Shared canonical artifact and direct-engine feature matrix
      status: passed
      evidence:
          - check: Canonical pipeline and artifact matrix
            result: passed
            details: One shared 16-case corpus executes foundational and structural analysis, capability evaluation, portability planning, lowering, and serialization. It covers positive and negative lookahead, fixed and fixed-alternative lookbehind, bounded variable lookbehind at 255 and over 256, named captures/references and the 32/33-name boundary, multiline anchors, atomic groups, possessive and lazy repetition, Unicode properties, versioned word/boundary behavior, and scoped caseless Kelvin matching. Governed profiles produce 11 native and five unsupported cases on 10.42 and 14 native and two unsupported cases on 10.43, deterministically and without test-only fabricated support.
          - check: Exact 10.42 direct ABI evidence
            result: passed
            details: Official tag pcre2-10.42 at commit 52c08847921a324c804cabf2814549f50bce1265 was built as an isolated 8-bit shared library. The probe verified engine 10.42 2022-12-11, library sha256 fdb00bcb3dd68707ed155927738b454a4281bb664e830d60dd205b10d1a2edd1, corpus sha256 071765762cebf462d0768a7c58e88ec2058dd7340f9d5e316bfa526acf604a36, 13 expected successful compilations, three expected compile rejections, 19 match observations, and result sha256 d4129048228a2136e884d90017ba0d080699d6685c78faf2756c4cf18d3623cc.
          - check: Exact 10.43 direct ABI evidence
            result: passed
            details: Official tag pcre2-10.43 at commit 3864abdb713f78831dd12d898ab31bbb0fa630b6 was built as an isolated 8-bit shared library. The probe verified engine 10.43 2024-02-16, library sha256 c1426544954ea17aa2d006dca0b0c31d641d8fa3a22eeb5e591e2d51bc721b5c, the same corpus digest, 14 expected successful compilations, two expected compile rejections, 21 match observations, and result sha256 ebd3355cda411fb6ca25422349b0f374f937a3cab8fd03d6147656699508eb61.
          - check: Serializer and probe boundary corrections
            result: passed
            details: Lookbehind alternatives serialize directly at assertion top level, for example (?<=a|bc), because a wrapping noncapturing group makes PCRE2 10.42 reject the otherwise valid fixed alternatives. The standalone ctypes probe consumes only artifact pattern/options, validates the loaded exact engine version, calls only pcre2_match, records deterministic digests, and remains isolated under tooling with four passing probe tests and no product/kernel dependency.
    - name: Complete kernel, repository, and migration certification
      status: passed
      evidence:
          - check: Complete Rust and focused architecture quality
            result: passed
            details: All 281 core tests pass across every target, warnings-denied Clippy is clean, and 37 focused Python probe/serialization/lowering/capability/core-contract architecture tests pass. Canonical validation reports 11 schema mappings and 78 fixtures; public contracts, generated artifacts, repository hygiene, governance, architecture, seven executable documentation examples, 137-file link validation, and patch integrity pass.
          - check: Reviewed migration boundary renewal
            result: passed
            details: The three-run migration differential has zero determinism mismatches after baseline-only renewal. The canonical boundary fingerprint is sha256:566a2fa7623493db7957353ff1e2ed6d20725f1c1971979c71916301a917bb94 and baseline fingerprint is sha256:8a6c16b059dc4fd6a4854259ec90406fc82c557840e0a53eee4e0894307a5eeb; contract, corpora, case sets, route coverage sha256:96f519848f9a4ef3d3fe926c17ffcee81b98ba1fce33f216511ca7749044699e, historical-peer evidence, and source observations remain unchanged.
          - check: Local, Pull Request, and Full profiles
            result: passed
            details: At clean commit 7ad3fbef68037b749e118e536a7dfd64edabe90f, Local recorded 20 passed, zero failed, and six unavailable operations; Pull Request recorded 39 passed, zero failed, and seven unavailable; Full recorded 68 passed, zero failed, and ten unavailable. Every available security, contract, generation, documentation, governance, differential, format, lint, typecheck, build, and test operation passed with no waiver.
          - check: Explicit environment carry-forward
            result: passed
            details: All three profile aggregates were UNAVAILABLE, never failed. Host Ruff 0.16.2 does not satisfy repository pin 0.15.21 for six repository/LSP/Python format and lint operations; Pull Request and Full additionally report the inherited repository-managed Ruby Bundler mismatch; Full also reports dependency-risk scanning unavailable. No requirement was weakened or unavailable operation represented as passing.
