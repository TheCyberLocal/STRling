record_version: 2.0.0
title: Baseline repository security hardgates
status: in_progress
objective: Establish deterministic repository security and supply-chain hardgates for dependency integrity, dependency risk, tracked secrets, workflow least privilege, and bounded security exceptions without changing STRling product behavior.
scope:
    diff:
        base: cb5c92c975d1820c50234babecbe0b3e08a7fee0
        head: working-tree
    allowed_paths:
        - .github/workflows/**
        - docs/migration/**
        - docs/security.md
        - governance/README.md
        - governance/architecture-rules.json
        - governance/change-control.json
        - governance/security-policy.json
        - governance/security.md
        - governance/schemas/**
        - governance/templates/**
        - governance/waivers/**
        - strling
        - tooling/lsp-server/package-lock.json
        - strling.ps1
        - toolchain.json
        - tooling/quality.py
        - tooling/security.py
        - tooling/tests/**
    forbidden_paths:
        - bindings/**
        - core/src/**
        - core/tests/**
        - package.json
        - package-lock.json
        - spec/**
        - tests/**
    expected_files:
        - docs/migration/records/baseline-repository-security.yaml
        - governance/security-policy.json
        - governance/security.md
        - governance/schemas/security-policy.schema.json
        - governance/schemas/security-result.schema.json
    permitted_generated_changes:
        - package-manager-lockfiles
    expected_generated_outputs:
        - package-manager-lockfiles
    required_verification_levels:
        - contract
        - unit
        - integration
        - quality
        - certification
    bounded_exemptions: []
change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: none
        evidence: []
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - Adds repository-security policy and operation-result schemas without changing product schemas.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
        level: additive
        evidence:
            - Extends the canonical quality hardgate architecture with repository-security operations and a semantic dependency boundary.
    generated_output_change:
        level: compatible
        evidence:
            - Normalizes existing LSP lock metadata to the unchanged manifest dependency classification without changing any dependency or package version.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Security contract validation
      command: python3 -m json.tool governance/security-policy.json and Draft 2020-12 schema validation
      expected_result: Normative policy and structured-result contracts validate.
    - name: Focused security certification
      command: python3 -m unittest tooling.tests.test_security -v
      expected_result: Positive, controlled-negative, determinism, no-false-pass, waiver, fixture-safety, and immutability properties pass.
    - name: Canonical quality integration
      command: ./strling check --json and ./strling certify --json
      expected_result: Local and CI paths invoke the same security implementations and preserve exact non-pass states.
    - name: Repository governance
      command: python3 tooling/governance.py
      expected_result: Declared scope, schemas, and architecture rules pass.
    - name: Product preservation
      command: git diff cb5c92c975d1820c50234babecbe0b3e08a7fee0...HEAD -- bindings core/src core/tests spec tests package.json package-lock.json
      expected_result: No product implementation, product contract, package-version, or release artifact changed.
    - name: Patch integrity
      command: git diff --check
      expected_result: No whitespace errors are present.
checkpoints:
    - name: Security contract and repository inventory
      status: passed
      evidence:
          - check: Repository security inventory
            command: Tracked manifest, lockfile, workflow, action, permission, secret-use, waiver, toolchain, and quality-contract inspection
            result: passed
            details: Inventoried 22 dependency roots across npm, Cargo, Dart Pub, Composer, Bundler, Go, SwiftPM, NuGet, Maven, Gradle, Python, LuaRocks, CPAN, R, C, and C++; classified runtime and tooling-only use, lock policy, integrity mode, and advisory mode; inspected two workflows and 16 unique action references.
          - check: Security contract validation
            command: Draft 2020-12 validation of governance/security-policy.json and both new security schemas
            result: passed
            details: The normative inventory, pinned repository security engine identity, five result states, blocking semantics, dependency risk policy, license classifications, workflow rules, and structured-result contract validated.
          - check: Canonical architecture fit
            command: python3 tooling/governance.py --json; ./strling contracts --check --json
            result: passed
            details: Task scope, change declarations, existing architecture rules, and public contracts passed; the design delegates through existing root hardgates and has no product-semantic dependency.
          - check: Formatting and patch integrity
            command: ./strling format --check repository --json; git diff --check
            result: passed
            details: Prettier 3.3.3 and Ruff 0.15.21 passed through the governed virtual environment, and no whitespace errors remained. An initial shell lacking Ruff correctly reported unavailable and was not represented as a pass.
          - check: Coverage boundaries
            result: passed
            details: Lock-complete roots, transitional unlocked ecosystems, network-dependent advisory evidence, missing local cargo-audit, and non-goals for SBOM, provenance, signing, publication credentials, and release delivery are explicit rather than certified.
    - name: Dependency and lock integrity
      status: passed
      evidence:
          - check: Actual repository dependency integrity
            command: python3 tooling/security.py integrity --json
            result: passed
            details: The deterministic local operation returned security.dependency-integrity with 24 passed checks, zero findings, an exact 1.0.0 engine identity, and explicit ecosystem, manifest, lock, and finding fields.
          - check: Controlled dependency mutations
            command: python3 -m unittest tooling.tests.test_security -v
            result: passed
            details: Seven tests passed, including valid npm state and rejection of a missing lock, manifest/lock mismatch, unmanaged manifest, malformed lock, and security-engine version drift, plus structural determinism.
          - check: Existing lock inconsistency remediation
            command: npm install --package-lock-only --ignore-scripts --offline in bounded temporary LSP state
            result: passed
            details: Native npm verification exposed stale LSP dependency classification; the lock now classifies vscode-languageclient and its transitive packages as development-only without changing any dependency or package version. Package identity metadata is outside dependency-integrity comparison and remained unchanged as required.
          - check: Integrity contract and repository hardgates
            command: Security-result schema validation; generated-artifact check; governance; contracts; formatting; static analysis; git diff --check
            result: passed
            details: The 24-check result validated against the structured schema; transitional lockfile generation remained visible; governance, contracts, Prettier, Ruff, suppression policy, and patch integrity passed.
    - name: Secret and workflow security
      status: passed
      evidence:
          - check: Tracked-content secret scan
            command: python3 tooling/security.py content --json
            result: passed
            details: Every Git-tracked regular file was scanned for private keys, high-confidence service tokens, embedded repository credentials, and obvious credential assignments; the only literal private-key strings are the exact, rationale-bearing marker-policy entries already governed by repository hygiene.
          - check: Workflow least privilege
            command: python3 tooling/security.py content --json
            result: passed
            details: Both workflows declare contents read by default; only four tag-push jobs receive contents write and five trusted-publisher jobs receive id-token write; checkout credentials persist only in the exact tag-push jobs that require git push.
          - check: Third-party action integrity
            command: Workflow action inventory and upstream git ref resolution
            result: passed
            details: All 16 unique GitHub Action references are pinned to verified full 40-character commits while retaining their prior human-readable ref in comments.
          - check: Credential exposure remediation
            command: Structured workflow inspection
            result: passed
            details: Two NuGet publication steps now receive the key through step environment scope and quoted shell expansion; ordinary CI jobs reference no repository secrets.
          - check: Controlled workflow and secret mutations
            command: python3 -m unittest tooling.tests.test_security -v
            result: passed
            details: Four focused content tests reject synthetic nonfunctional private-key/token markers, mutable actions, absent checkout persistence controls, missing default permissions, ungoverned writes, validation secrets, and direct shell secret interpolation; the positive fixture passes.
    - name: Vulnerability and license policy
      status: failed
      evidence:
          - check: Authoritative advisory retrieval
            command: python3 tooling/security.py risk --json
            result: failed
            details: npm audit completed for all three npm locks and returned blocking high or critical findings in development/tooling dependency chains. The operation preserved package, version, advisory URL, and supplied severity and did not modify dependency state.
          - check: Cargo advisory availability
            command: cargo audit --version; security dependency-risk operation
            result: failed
            details: cargo-audit is pinned to 0.22.2 but is not installed in the local environment. Both Cargo vulnerability checks returned UNAVAILABLE rather than PASS.
          - check: License classification
            command: npm lockfile v3 classification and cargo metadata --locked --offline
            result: failed
            details: 1,148 npm package entries and 98 Cargo package entries were classified by exact policy expressions. Ten VSCE signing packages report SEE LICENSE IN LICENSE.txt and remain unknown/blocking; all other evaluated entries were permitted, with one exact legacy metadata correction for exit@0.1.2.
          - check: Legacy ecosystem coverage
            command: Structured risk coverage inventory
            result: failed
            details: Fifteen configured ecosystem roots without authoritative repository scanners emit 30 explicit UNAVAILABLE vulnerability/license checks. Go and Swift emit passed checks only because integrity proves no external dependencies.
          - check: Controlled dependency-risk fixtures
            command: python3 -m unittest tooling.tests.test_security -v
            result: passed
            details: Fifteen focused tests pass, including synthetic blocking advisory identity, unavailable advisory retrieval, unknown-license blocking, and cargo-audit version drift. Production results use live authoritative advisory data, never fixture advisories.
    - name: Security waivers and certification properties
      status: planned
      evidence: []
    - name: Root command CI and hardgate integration
      status: planned
      evidence: []
    - name: Security baseline readiness
      status: planned
      evidence: []
commits:
    - sha: 11fc5c737183b3ed25799c6fccf89360f48ac74a
      subject: "docs(security): define baseline repository security policy"
    - sha: 1c305bd9f41579f2a7e0d1f2011c0dd316168622
      subject: "feat(security): enforce dependency and lock integrity"
    - sha: 2068c731b721da8915ba03a8bb62dc6920fead47
      subject: "feat(security): enforce secret and workflow safeguards"
