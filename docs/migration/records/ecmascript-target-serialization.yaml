change_classification:
    semantic_change:
        level: none
        evidence:
            - Canonical language meaning and normalized Semantic IR remain unchanged; this task consumes the completed ECMAScript target plan mechanically.
    public_api_change:
        level: none
        evidence:
            - No kernel facade, compiler protocol, binding, package, or published interface changes.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - Adds optional canonical pattern flags to EmittedPattern because ES2024 global case intent cannot be represented in pattern source or immutable profile options; existing PCRE2 artifacts remain byte-compatible by omitting empty flags.
        affected_surfaces: []
    diagnostic_change:
        level: additive
        evidence:
            - Adds stable internal ECMAScript emission failures for malformed plans, syntax data, flags, bounds, resource limits, and invalid artifacts.
    target_behavior_change:
        level: additive
        evidence:
            - Adds standalone ECMAScript RegExp artifact production and exact bounded Node/V8 observations without changing an existing product execution route.
    architecture_change:
        level: additive
        evidence:
            - Adds one pure ECMAScript serializer after structured lowering and one isolated exact-runtime certification operation outside the Rust kernel.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: ECMAScript serializer and artifact unit/property certification
      command: cargo test --manifest-path core/Cargo.toml --test ecmascript_serialization --test ecmascript_serialization_properties --locked
      expected_result: Every operation, precedence rule, literal/class escape, capture/reference, anchor, lookaround, wildcard, canonical flag, option/requirement projection, source-map span, failure category, deterministic JSON/fingerprint, input immutability, and generated mutation passes.
    - name: TargetArtifact compatibility and architecture fitness
      command: cargo test --manifest-path core/Cargo.toml --test target_contracts --locked && python3 -m unittest tooling.tests.test_ecmascript_serialization_architecture tooling.tests.test_core_contracts && python3 tooling/core_contract_validation.py
      expected_result: Optional pattern flags preserve existing artifact bytes, ECMAScript artifacts validate canonically, and controlled mutations reject policy recomputation, PCRE2 reuse, runtime/ambient/product dependencies, target-neutral reverse dependencies, and direct bypass.
    - name: Exact Node/V8 runtime certification
      command: STRLING_NODE_22_BINARY=/exact/node-v22.23.2/bin/node python3 -m tooling.ecmascript_runtime_certification --json --repeat-runs 2
      expected_result: The official-sha256 Node v22.23.2 Linux x64 binary reports process V8 identity 12.4.254.21-node.56 and all bounded source/flags, UTF-16 span, capture, assertion, anchor/newline, case, Unicode u/v, error, zero-length, rewrite, negative, and determinism cases pass twice with one stable certification-result-v1 digest.
    - name: Complete kernel and repository certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py && python3 tooling/migration_differential.py --repeat-runs 3 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check
      expected_result: Every available hardgate passes, exact runtime evidence is recorded by Full, reviewed canonical-boundary evidence is current, host-only gaps remain unavailable without waiver, and the final committed tree is clean.
checkpoints:
    - name: ECMAScript artifact, flag, syntax, runtime, and profile inventory
      status: passed
      evidence:
          - check: Read-first contract and stage inventory
            result: passed
            details: EcmascriptLoweringPlan supplies a validated closed operation tree, deterministic captures, global case intent, the required Unicode option, requirements, certified rewrites, and provenance. TargetArtifact supplies pattern text, immutable profile reference, engine options, requirements, UTF-8 source mapping, and diagnostics, but cannot currently represent per-program ECMAScript flags; an optional canonical EmittedPattern flags field is the smallest backward-compatible contract addition. The existing PCRE2 constructor receives only an explicit empty flags vector so its serialized bytes and fingerprint remain unchanged.
          - check: Normative ECMAScript syntax and execution authority
            result: passed
            details: ECMA-262 2024 RegExp grammar, initialization, execution, match-index, canonicalization, and word-character clauses govern serializer spelling and runtime observations. ES2024 has global u/i flags but no PCRE2-style scoped modifier authority, requiring structural wildcard/line-anchor spellings and explicit artifact flags.
          - check: Exact maintained runtime selection
            result: passed
            details: The official Node 22 archive identifies v22.23.2 as the current maintained Jod release, with upstream V8 12.4.254.21 and Linux x64 distribution, satisfying the repository's governed Node >=22,<23 constraint. Official Node v22.23.2 reports the exact V8 build identity 12.4.254.21-node.56 through process.versions.v8. The official Linux x64 archive SHA-256 is d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307; the extracted bin/node derived from that verified archive is 3517c2df0b2f8cd7f422b4b8450ef81c6889f08eb03e281d6de9079b15e6a327. The gate will never substitute the transitional host Node 18 or unrelated Windows Node 24.
    - name: Deterministic ECMAScript serializer and additive flag contract
      status: passed
      evidence:
          - check: Implementation and focused proof
            result: passed
            details: The pure serializer now validates and immutably consumes only EcmascriptLoweringPlan, emits canonical source and u/iu flags, projects exact options, requirements, rewrites, profile identity, diagnostics, and UTF-8 source maps, and validates the final artifact. Optional sorted unique lowercase flags preserve existing PCRE2 JSON by omitting the empty vector. Eleven schema mappings, 78 fixtures, 15 existing contract architecture tests, ten controlled ECMAScript serializer/runtime architecture tests, and eight runtime-orchestrator unit tests pass in the available Windows-side fallback.
          - check: Runtime-discovered final-anchor correction
            result: passed
            details: A non-certifying Node 24 harness diagnostic demonstrated that ECMAScript dollar without m is strict end only. The serializer now uses an explicit CRLF-aware lookahead for end_before_final_line_terminator; the governed corpus proves strict end, LF, CRLF, and a non-final newline without enabling global m.
          - check: Canonical Rust formatter, compiler, and unit proof
            result: passed
            details: An isolated official rustup installation outside the repository supplied project-era Rust and Cargo 1.75.0 with rustfmt 1.7.0. Cargo fmt --check, warning-denied all-target Clippy, and all 306 all-target tests pass with Cargo.lock enforced. The same full core test matrix also passes on current Rust 1.97.1, while the governed 1.75.0 result remains authoritative for compatibility.
    - name: Controlled Node/V8 harness, corpus, and quality-profile integration
      status: passed
      evidence:
          - check: Runtime protocol and exact execution evidence
            result: passed
            details: The fixed module-free harness enforces byte, case, subject, and match limits; independently confirms d-index instrumentation parity; handles zero-length Unicode iteration; and reports runtime identity. The Python orchestrator checks the exact extracted executable SHA, Node, V8, Linux x64 identity, corpus/profile/harness fingerprints, and two-run semantic determinism. Its eight unit tests pass, host-specific I/O errors are excluded from deterministic evidence, missing or mismatched binaries produce structured unavailable evidence, Full and Release 1.6.0 register the operation immediately after PCRE2 certification, and Local/Pull Request omit it.
          - check: Non-certifying protocol diagnostic
            result: passed
            details: Host Node v24.4.1/V8 13.6 on Windows accepts the deliberately out-of-profile (?i:a) scoped-modifier extension, proving the negative case distinguishes a newer runtime from the selected V8 12.4 surface. The remaining 144 detailed, error, rewrite, and generated requests pass with semantic digest ceaf02f53bf7ef2cfc4dbdeae50efe899e221358965bcd8eb63b433bc28b707c. This proves the protocol and negative discrimination only and is not accepted as exact runtime certification.
          - check: Exact Node 22 engine proof on the noncanonical Windows distribution
            result: passed
            details: The official Node v22.23.2 Windows x64 archive SHA-256 1177b4137ba5adaa56354ae40f1080c7450e8ae09cecb47da459d1c52ac99f97 and node.exe SHA-256 0d0f5e39f9f3d9587bc19f73eab3c2c9c4903fd02d6dbf9c853dd81b3d95fad4 were verified against upstream SHASUMS256.txt. The exact process identities v22.23.2 and V8 12.4.254.21-node.56 executed all 145 requests twice on win32/x64 with stable semantic digest 06d0cfdcc13324335464f795d8b6b9a6fc2fb778df4a22b7a0d3e8830e9ec23. This independently proves the selected engine behavior and corpus determinism but does not satisfy the separate canonical Linux x64 executable-identity gate.
          - check: Exact Node 22 Linux x64 certification
            result: passed
            details: The official Node v22.23.2 Linux x64 archive SHA-256 d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307 and extracted executable SHA-256 3517c2df0b2f8cd7f422b4b8450ef81c6889f08eb03e281d6de9079b15e6a327 were verified before execution. Exact Node v22.23.2/V8 12.4.254.21-node.56 on linux/x64 executed 12 detailed, three compile-error, 128 generated, and one rewrite case twice with corpus SHA-256 bc11fba576380ea0e976127e4db6cd22713f1ce1673ca0ba3418b1289439d34c, formatted harness SHA-256 93a26189d074e19ecb003692c724c4ba23ea52b0c811231c99ab4989d63b01a1, semantic result SHA-256 06d0cfdcc13324335464f795d8b6b9a6fc2fb778df4a22b7a0d3e8830e9ec23b, and deterministic operation SHA-256 36b5f94e75bf8d19f96f525542723fdec4220a6f5a3ea1282a944d5e150f5d9f. All 145 requests passed with no runtime substitution.
    - name: Complete repository and migration certification
      status: passed
      evidence:
          - check: Available platform-neutral hardgate evidence
            result: passed
            details: Project-era Rust formatting, warning-denied Clippy, all 306 core tests, focused serializer/runtime and architecture suites, 11 contract mappings with 78 fixtures, 15 existing core-contract tests, all enforced public-contract surfaces, all three enforced generated-artifact families including 126 Swift fixtures, seven documentation examples with 140-file link validation, full governance and architecture evaluation, scope/change declarations, and patch integrity pass. The public/generated proof used verified official Go 1.22.12, the repository-managed TypeScript compiler, UTF-8 decoding, and command-name-only Windows adapters in a disposable committed-SHA clone; every enforced surface and generated output is unchanged. Windows cannot authoritatively run the Linux shell entrypoint, exact Linux Node executable, or complete profile matrix; those remain pending rather than waived or substituted.
          - check: Non-certifying Windows migration-differential diagnostic
            result: passed
            details: Repeated candidate runs under host Node 24/Python 3.13, exact selected Node 22/Python 3.12, and exact WSL-era Node 18.19.1/Python 3.12 were deterministic and agreed that the intentional Rust public-module addition changes only the directly computed canonical-boundary identity to sha256:c8ee813968a98d410049b7581998a8b549766538380d69194842fc1c7ca2fbf8. Their source-observation and historical-peer fingerprints nevertheless differed from the Linux-authored canonical baseline, proving the evidence is platform-sensitive. Baseline sha256:39f309162b403c4f3af21a587e3d88dbc9b55edb471c12498702f6ef57d3286a was deliberately retained; no Windows candidate was accepted as a review renewal.
          - check: Canonical Linux hardgate evidence
            result: passed
            details: On Linux with project-era Rust/Cargo 1.75.0, rustfmt, all 306 all-target tests, warning-denied Clippy, 33 focused Python tests, core contracts, public contracts, generated artifacts, governance, documentation integrity, migration differential, and patch integrity pass. The exact Node 22 profile changes historical TypeScript observation identities relative to Node 18 without changing case coverage, canonical route coverage, or the reviewed canonical boundary; the renewed exact-tool baseline is sha256:b65732d9f174208a286acbb206222b2170aa022db67021112990fa3e33d0ad9e and the three-repeat result is sha256:4a44fddd19ef7c690994c88c959802d01e999731620de99ead94e68b16cc9bf0 with zero mismatches.
          - check: Pinned analyzer prerequisite repair
            result: passed
            details: Exact Ruff 0.15.21 and Prettier 3.3.3 exposed formatting drift, five path-bootstrap E402 findings, one unused import, and one new unmanaged type suppression. Mechanical formatting, importlib-based bootstrap imports, the unused-import removal, and a typed cast restore 84-file formatter conformance, zero Ruff findings, and the governed 80-directive suppression baseline. Forty-eight focused regressions, governance, documentation, and the exact-Node migration gate pass; no product or semantic behavior changed.
          - check: Clean Local, Pull Request, and Full profiles
            result: passed
            details: At clean commit 3f7ef6ab6903144737b697c6e3a7dd16caca1b71, Local 1.5.0 passed all 26 operations with evidence fingerprint 446ffd738a74c661aa340efc7d1ed2bc9db0b8f37ca47f798281c28a5eda03cb. Pull Request 1.4.0 recorded 44 passed and two unavailable operations with fingerprint dbb62797f1ec281893c50a3361235d24a2af16cae1b9a180789b979297654f95. Full 1.6.0 recorded 73 passed and seven unavailable operations with fingerprint a27d35abe95c4c96e49d6c7352995a883ac5c3ba34f7bb031c816c67089a8f61; exact PCRE2 10.42/10.43 and ECMAScript Node 22 runtime operations passed. There were zero failed, incomplete, not-yet, or newly waived operations.
          - check: Explicit environment carry-forward
            result: passed
            details: Pull Request records only repository-managed Ruby Bundler 2.4.20 versus installed 2.7.2 and missing Swift as unavailable. Full records those same Ruby lint/build/test and Swift typecheck/build/test gaps plus the existing structured dependency-risk scanner unavailability across ecosystems. Existing npm vulnerability/license waivers remain governed; no unavailable evidence was reported as passing and no requirement was weakened.
