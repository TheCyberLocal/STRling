title: Deterministic ECMAScript serialization and exact Node execution certification
status: in_progress
objective: Serialize one validated EcmascriptLoweringPlan into deterministic ECMAScript RegExp source, canonical flags, profile-owned options, resolved requirements, generated provenance, and a canonical TargetArtifact, then certify bounded artifact execution against exact pinned Node/V8 evidence without adding product runtime, binding, package, or publication behavior.
