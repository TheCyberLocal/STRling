required_verification:
    - name: ECMAScript serializer and artifact unit/property certification
      command: cargo test --manifest-path core/Cargo.toml --test ecmascript_serialization --test ecmascript_serialization_properties --locked
      expected_result: Every operation, precedence rule, literal/class escape, capture/reference, anchor, lookaround, wildcard, canonical flag, option/requirement projection, source-map span, failure category, deterministic JSON/fingerprint, input immutability, and generated mutation passes.
    - name: TargetArtifact compatibility and architecture fitness
      command: cargo test --manifest-path core/Cargo.toml --test target_contracts --locked && python3 -m unittest tooling.tests.test_ecmascript_serialization_architecture tooling.tests.test_core_contracts && python3 tooling/core_contract_validation.py
      expected_result: Optional pattern flags preserve existing artifact bytes, ECMAScript artifacts validate canonically, and controlled mutations reject policy recomputation, PCRE2 reuse, runtime/ambient/product dependencies, target-neutral reverse dependencies, and direct bypass.
    - name: Exact Node/V8 runtime certification
      command: STRLING_NODE_22_BINARY=/exact/node-v22.23.2/bin/node python3 -m tooling.ecmascript_runtime_certification --json --repeat-runs 2
      expected_result: The official-sha256 Node v22.23.2 Linux x64 binary reports V8 12.4.254.21 and all bounded source/flags, UTF-16 span, capture, assertion, anchor/newline, case, Unicode u/v, error, zero-length, rewrite, negative, and determinism cases pass twice with one stable certification-result-v1 digest.
    - name: Complete kernel and repository certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py && python3 tooling/migration_differential.py --repeat-runs 3 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check
      expected_result: Every available hardgate passes, exact runtime evidence is recorded by Full, reviewed canonical-boundary evidence is current, host-only gaps remain unavailable without waiver, and the final committed tree is clean.
checkpoints:
    - name: ECMAScript artifact, flag, syntax, runtime, and profile inventory
      status: passed
      evidence:
          - check: Read-first contract and stage inventory
            result: passed
            details: EcmascriptLoweringPlan supplies a validated closed operation tree, deterministic captures, global case intent, the required Unicode option, requirements, certified rewrites, and provenance. TargetArtifact supplies pattern text, immutable profile reference, engine options, requirements, UTF-8 source mapping, and diagnostics, but cannot currently represent per-program ECMAScript flags; an optional canonical EmittedPattern flags field is the smallest backward-compatible contract addition.
          - check: Normative ECMAScript syntax and execution authority
            result: passed
            details: ECMA-262 2024 RegExp grammar, initialization, execution, match-index, canonicalization, and word-character clauses govern serializer spelling and runtime observations. ES2024 has global u/i flags but no PCRE2-style scoped modifier authority, requiring structural wildcard/line-anchor spellings and explicit artifact flags.
          - check: Exact maintained runtime selection
            result: passed
            details: The official Node 22 archive identifies v22.23.2 as the current maintained Jod release, with V8 12.4.254.21 and Linux x64 distribution, satisfying the repository's governed Node >=22,<23 constraint. The certification operation will require its official release SHA-256 and will never substitute the transitional host Node 18 or unrelated Windows Node 24.
