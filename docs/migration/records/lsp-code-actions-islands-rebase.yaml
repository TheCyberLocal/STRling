    next_task: P16-T05 — Assemble, package, and certify the canonical language-server runtime.
    rationale: Every P16-T04-owned action, formatting, island, source-mapping, lifecycle, migration, architecture, documentation, and directly executable certification requirement passes. Remaining gaps are explicitly owned by P16-T05 or are inherited host/toolchain/security-profile limitations; none requires reopening canonical editor semantics.
