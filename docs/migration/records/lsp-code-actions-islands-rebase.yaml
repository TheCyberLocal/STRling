change_classification:
    semantic_change:
        level: none
        evidence:
            - Optional actions call the existing certified rewrite request boundary and formatting calls the existing Semantic STRling formatter; island extraction creates only source documents and cannot define STRling meaning.
    public_api_change:
        level: intentional-correction
        evidence:
            - LSP formatting and code-action results intentionally shrink to canonically supported evidence; no binding, kernel product command, package, or normative compiler API changes.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - The tooling-owned island registry gains a closed 1.0.0 schema for host boundaries, literal forms, source mapping, refusal, resource limits, and fingerprinting without changing a normative language or compiler schema.
        affected_surfaces: []
    diagnostic_change:
        level: intentional-correction
        evidence:
            - The removed REDOS_RISK alias and heuristic replacements are not restored; canonical STRL-SAFETY-0003 remains non-actionable and only existing STRL-QUALITY-0002 may correlate with the existing certified exact-once strategy.
    target_behavior_change:
        level: none
        evidence:
            - Island metadata records that profile and target inference are forbidden, and actions cannot request or select target lowering.
    architecture_change:
        level: additive
        evidence:
            - The final four LSP Python-binding semantic dependencies are replaced by canonical Rust editor evidence and one registry-driven LSP source-coordinate adapter; the transitional architecture rule becomes enforceable.
    generated_output_change:
        level: none
        evidence:
            - The generated VSIX payload is excluded. Registered checks must prove that implementation inputs do not change checked-in generated observations or public surfaces.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Certified actions and canonical formatting
      command: python3 -m pytest tooling/lsp-server/tests/test_code_actions.py tooling/lsp-server/tests/test_formatting.py tooling/lsp-server/tests/test_canonical_intelligence.py -q && cargo test --manifest-path core/Cargo.toml --test editor_intelligence --test semantic_frontend --test semantic_frontend_properties --locked
      expected_result: Only current source-backed Semantic STRling exact-once wrappers produce strategy-certified edits associated with STRL-QUALITY-0002; safety, regex, host, stale, ambiguous, malformed, and source-loss cases return no action, while formatting exactly matches the canonical formatter or returns no edit.
    - name: Governed island registry and source mapping
      command: python3 -m pytest tooling/lsp-server/tests/test_island_extractor.py -q
      expected_result: Every declared host, suffix, boundary, supported literal form, Unicode/multiline map, inverse map, escape/interpolation refusal, overlap, registry mutation, and resource limit matches the closed evidence with no binding import or fallback authority.
    - name: LSP lifecycle and consumer integration
      command: python3 -m pytest tooling/lsp-server/tests/test_lsp_lifecycle.py tooling/lsp-server/tests/test_lsp_server.py -q
      expected_result: Actions, formatting, and islands reuse immutable current snapshots, negotiated position encoding, cancellation, stale rejection, cache invalidation, limits, service failure, and recovery; the Node registry consumer fails closed rather than widening extraction.
    - name: Architecture, migration, and campaign certification
      command: python3 -m pytest tooling/lsp-server/tests -q && cargo test --manifest-path core/Cargo.toml --all-targets --locked && python3 -m unittest discover -s tooling/tests && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/migration_differential.py --repeat-runs 3 && python3 -m tooling.governance --json && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: Complete LSP, Rust, tooling, public/generated, migration, architecture, static-analysis, formatting, governance, and profile evidence passes or retains only exact inherited environment limitations; no unavailable operation is represented as passing.
