change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: additive
        evidence:
            - The non-published canonical Rust kernel crate gains its first stable public executable facade; no published language package changes.
        affected_surfaces:
            - strling-kernel
    schema_change:
        level: additive
        evidence:
            - The governance-only public-surface registry schema admits the deterministic rust-source-boundary extractor mechanism; canonical compiler protocol schemas are unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: additive
        evidence:
            - The facade returns structured protocol/resource/portability diagnostics for valid requests that cannot complete; canonical diagnostic shape and ordering are unchanged.
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
        level: additive
        evidence:
            - Future adapters gain one inward dependency boundary over the existing certified kernel stages.
            - Mechanical fitness rejects filesystem, environment, network, runtime probing, frontend, emitter, binding, CLI, LSP, editor, and adapter dependencies from the facade.
    generated_output_change:
        level: additive
        evidence:
            - The authoritative public-contract generator adds the enforced strling-kernel facade snapshot.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Kernel facade quality and tests
      command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && cargo check --manifest-path core/Cargo.toml --all-targets && cargo build --manifest-path core/Cargo.toml --all-targets && cargo test --manifest-path core/Cargo.toml
      expected_result: The public facade and every prior kernel suite format, lint, build, and pass with warnings denied.
    - name: Boundary properties and architecture
      command: cargo test --manifest-path core/Cargo.toml --test compiler_boundary --test compiler_boundary_properties && python3 tooling/core_contract_validation.py && python3 -m unittest tooling.tests.test_compiler_boundary_architecture tooling.tests.test_portability_architecture tooling.tests.test_diagnostic_architecture && python3 tooling/architecture_fitness.py
      expected_result: Determinism, purity, immutability, result validity, malformed-input containment, resource containment, profile sensitivity, source independence, panic smoke, exact stage order, and controlled dependency mutations pass.
    - name: Repository certification profiles
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full
      expected_result: Every available operation passes and every unavailable or incomplete operation remains explicit without weakened aggregation.
    - name: Product compatibility baselines
      command: ./strling typecheck typescript && ./strling build typescript && ./strling test typescript && ./strling typecheck rust && ./strling build rust && ./strling test rust
      expected_result: TypeScript and Rust-binding behavior baselines remain unchanged and pass where applicable.
    - name: Patch and clean-state integrity
      command: git diff --check && git status --short --branch
      expected_result: The final committed repository has no whitespace errors or uncommitted files.
