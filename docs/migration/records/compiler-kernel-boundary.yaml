record_version: 2.0.0
title: Embeddable canonical compiler-kernel boundary
status: in_progress
objective: Expose one deterministic, contract-validating, resource-bounded, panic-resistant Rust facade from CompileRequest plus explicit immutable target-profile evidence to CompileResult by reusing the certified canonical orchestration and projection stages without adding a frontend, lowering, emission, binding, or product integration.
