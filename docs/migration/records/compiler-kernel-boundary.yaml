            command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo check --manifest-path core/Cargo.toml --all-targets && cargo test --manifest-path core/Cargo.toml --test compiler_boundary && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && python3 tooling/core_contract_validation.py && git diff --check
            result: passed
            details: Public compile(&CompileRequest, Option<&TargetProfile>) returns CompileResult or typed KernelCompileError without mutating inputs. Thirteen tests cover minimal and representative canonical semantics, source-less analysis, malformed typed input, unsupported contract/specification/future modes, exact profile requirements and mismatch, unsupported source and artifact modes, repeat equality, request immutability, compiler identity, and result validation.
    - name: Canonical orchestration and result projection
