record_version: 2.0.0
title: Canonical semantic normalization
status: in_progress
objective: Implement deterministic, identity-preserving, source-faithful semantic normalization as the first executable transformation in the canonical Rust kernel without migrating frontends, analyses, targets, emitters, bindings, or tooling consumers.
scope:
    diff:
        base: 350a1ab7bb76b4cd4546f4a8f129199eec4c31a9
        head: working-tree
    allowed_paths:
        - core/**
        - docs/migration/**
        - governance/change-control.json
        - tooling/core_contract_validation.py
        - tooling/tests/test_core_contracts.py
    forbidden_paths:
        - bindings/**
        - package.json
        - package-lock.json
        - spec/**
        - strling
        - strling.ps1
        - tests/spec/**
    expected_files:
        - core/src/lib.rs
        - core/src/normalization.rs
        - core/tests/normalization.rs
        - core/tests/normalization_properties.rs
        - docs/migration/semantic-normalization.md
        - docs/migration/records/semantic-normalization.yaml
        - governance/change-control.json
    permitted_generated_changes: []
    expected_generated_outputs: []
    required_verification_levels:
        - contract
        - unit
        - integration
        - quality
        - certification
    bounded_exemptions: []
