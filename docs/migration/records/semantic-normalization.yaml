    next_task: Implement canonical semantic fact analysis over normalized Semantic IR, beginning with foundational facts required by later safety and portability reasoning.
    rationale: The canonical kernel now has a pure, deterministic, idempotent, schema-certified normalization stage with complete variant coverage, stable identities, faithful provenance, structured invalid-input handling, property evidence, focused legacy compatibility evidence, and repository hardgate enforcement. No known blocker remains for contained target-neutral semantic analysis.
