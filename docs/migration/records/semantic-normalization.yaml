required_verification:
    - name: Kernel normalization quality
      command: cd core && cargo fmt --check && cargo clippy --all-targets -- -D warnings && RUSTFLAGS=-Dwarnings cargo check --all-targets && cargo test --all-targets
      expected_result: The pure normalization API builds without warnings and all focused, generated, contract, and kernel tests pass.
    - name: Canonical contract and architecture certification
      command: python3 tooling/contract_validation.py && python3 tooling/core_contract_validation.py && python3 tooling/governance.py && python3 -m unittest tooling.tests.test_core_contracts tooling.tests.test_governance tooling.tests.test_quality
      expected_result: Contract drift, target-specific normalization dependencies, prohibited kernel dependencies, and task-scope violations are rejected by controlled hardgate tests.
    - name: Repository quality and certification
      command: ./strling check all --json && ./strling certify all --json
      expected_result: Formatting, hygiene, lint, typecheck, generation, contracts, governance, baseline validation, the TypeScript baseline, and every enforced repository component pass from committed state.
    - name: Patch and clean-state integrity
      command: git diff --check && git status --short --branch
      expected_result: The final committed repository has no whitespace errors or uncommitted files.
checkpoints:
    - name: Normalization contract and rule inventory
      status: passed
      evidence:
          - check: Clean committed starting state
            command: git status --short --branch; git rev-parse HEAD; ./strling check core --json
            result: passed
            details: Work began from a clean architecture/v4 tree at 350a1ab7bb76b4cd4546f4a8f129199eec4c31a9, and the governed kernel baseline passed.
          - check: Normative rule inventory
            result: passed
            details: Certified contracts, canonical fixtures and Rust types, and legacy TypeScript/Python evidence were separated; transformations, preserved structures, invalid states, identity, provenance, failure, and stage boundaries are recorded in docs/migration/semantic-normalization.md.
          - check: Existing repository hardgates
            command: PATH=/tmp/strling-pinned-tools:/root/.local/share/swiftly/bin:/snap/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin BUNDLER_VERSION=2.4.20 ./strling check all --json
            result: passed
            details: Canonical contracts, kernel contracts, governance, formatting, hygiene, lint, typecheck, generation, baseline validation, architecture fitness, all configured binding tests, and the TypeScript baseline passed with exit code zero.
    - name: Recursive structural normalization
      status: passed
      evidence:
          - check: Pure normalization API and structured failure model
            command: cargo test --manifest-path core/Cargo.toml --test normalization invalid_normalization_input_returns_stable_structured_categories
            result: passed
            details: normalize borrows a SemanticProgram, returns a new canonical program, and classifies empty wrappers/literals, duplicate identities, missing references, reversed repetition bounds, malformed sets, provenance, postcondition failures, and unsupported contract state without panics.
          - check: Recursive structural coverage
            command: cargo test --manifest-path core/Cargo.toml --test normalization
            result: passed
            details: Six focused tests cover already canonical input, deeply nested sequences and alternations, adjacent literal coalescing, single-child removal, ordered duplicate alternatives, explicit empty nodes, character-set sorting/deduplication, repetition, positions, captures, backreferences, lookarounds, atomic nodes, and semantic-boundary preservation.
          - check: Kernel quality and canonical postconditions
            command: cargo fmt --manifest-path core/Cargo.toml -- --check; cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings; RUSTFLAGS=-Dwarnings cargo check --manifest-path core/Cargo.toml --all-targets; cargo test --manifest-path core/Cargo.toml --all-targets; python3 tooling/core_contract_validation.py; python3 tooling/governance.py; git diff --check
            result: passed
            details: All 48 kernel tests passed; normalized outputs validate through the existing canonical SemanticProgram invariants, warnings were denied, contract mapping and governed scope passed, and the patch has no whitespace errors.
    - name: Identity and provenance preservation
      status: passed
      evidence:
          - check: Stable node and logical capture identities
            command: cargo test --manifest-path core/Cargo.toml --test normalization
            result: passed
            details: Surviving containers, captures, backreferences, and first literals retain their IDs; removed wrappers and absorbed literals are absent from the graph but recorded as derived origins; every removed input ID is accounted for, retained IDs remain a unique input subset, and no IDs are synthesized or renumbered.
          - check: Exact provenance accumulation and UTF-8 integrity
            command: cargo test --manifest-path core/Cargo.toml --test normalization
            result: passed
            details: Two-byte alpha and four-byte emoji spans remain exact half-open ranges, discontiguous/overlapping contributions are not widened, origin collections sort and deduplicate, repeated normalization preserves the same identity and provenance, and interior UTF-8 offsets fail with InvalidProvenance.
          - check: Source-less construction and full kernel regression
            command: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings; RUSTFLAGS=-Dwarnings cargo check --manifest-path core/Cargo.toml --all-targets; cargo test --manifest-path core/Cargo.toml --all-targets; python3 tooling/core_contract_validation.py; python3 tooling/governance.py; git diff --check
            result: passed
            details: Source-less Simply-style input remains source-less while retaining derivation evidence; all 49 kernel tests, warnings-denied checks, canonical mapping, governance, and patch integrity passed.
    - name: Idempotence, determinism, and property certification
      status: passed
      evidence:
          - check: Generated valid Semantic IR properties
            command: cargo test --manifest-path core/Cargo.toml --test normalization_properties generated_valid_programs_certify_normalization_properties
            result: passed
            details: Four explicit 64-bit seeds generated 128 depth-bounded valid programs each (512 total) across all 12 node variants. Every case proved N(N(x)) == N(x), repeated structural and serialized determinism, canonical SemanticProgram validation, unchanged capture declarations/backreference order, and absence of target/analysis fields.
          - check: Separate generated malformed corpus
            command: cargo test --manifest-path core/Cargo.toml --test normalization_properties generated_malformed_programs_fail_with_stable_categories
            result: passed
            details: 256 deterministic malformed candidates independently exercised empty collections/literals, reversed repetition and set bounds, unresolved references, duplicate node IDs, and duplicate capture IDs; every case failed safely under the expected stable category.
          - check: Property integration and regression
            command: cargo fmt --manifest-path core/Cargo.toml -- --check; cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings; RUSTFLAGS=-Dwarnings cargo check --manifest-path core/Cargo.toml --all-targets; cargo test --manifest-path core/Cargo.toml --all-targets; python3 tooling/core_contract_validation.py; python3 tooling/governance.py; git diff --check
            result: passed
            details: The generated suite requires no new runtime or development dependency, completes in under one second locally, all 51 kernel tests pass, and no semantic normalization defect was discovered by the first certified corpus.
    - name: Legacy compatibility evidence comparison
      status: passed
      evidence:
          - check: Parser-free shared structural corpus
            command: cargo test --manifest-path core/Cargo.toml --test normalization_compatibility selected_legacy_structural_corpus_has_zero_unexplained_differences
            result: passed
            details: Nine representative cases compare the historical TypeScript/Python flatten, unwrap, coalesce, and recursive child behavior through a shared legacy-shape projection. Sequence, alternation, repetition, capture, lookaround, atomic, explicit empty, and capture/backreference outcomes have structural parity after erasing canonical-only IDs/origins.
          - check: Bounded intentional differences
            command: cargo test --manifest-path core/Cargo.toml --test normalization_compatibility canonical_contract_corrections_are_explicit_and_bounded
            result: passed
            details: Empty sequence/alternation wrappers and empty literals are intentional canonical-contract rejections; character-set sorting/deduplication is an intentional contract correction; stable IDs/origins and separated capture/atomic nodes are representational-only differences. No unresolved or unexplained difference remains.
          - check: Compatibility regression integration
            command: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings; RUSTFLAGS=-Dwarnings cargo check --manifest-path core/Cargo.toml --all-targets; cargo test --manifest-path core/Cargo.toml --all-targets; python3 tooling/core_contract_validation.py; python3 tooling/governance.py; git diff --check
            result: passed
