change_classification:
    semantic_change:
        level: none
        evidence:
            - The corpus compares already ratified frontend mappings and canonical compiler results; it cannot add or alter semantic constructs.
    public_api_change:
        level: none
        evidence:
            - Only tests, validation tooling, and documentation change; binding and kernel source plus public snapshots are forbidden.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - A test-evidence schema governs the convergence corpus without changing normative compiler contracts.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Comparison retains existing canonical diagnostic identity and content after representation-only source-location normalization.
    target_behavior_change:
        level: none
        evidence:
            - Exact existing profiles and target pipelines are exercised without changing profile, planning, lowering, serialization, or runtime behavior.
    architecture_change:
        level: none
        evidence:
            - Certification proves all frontends use the existing one-core boundary and adds no production dependency.
    generated_output_change:
        level: none
        evidence:
            - No generated artifact or public snapshot is renewed.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Corpus contract and completeness
      command: python3 tooling/frontend_convergence.py --check && python3 -m unittest tooling.tests.test_frontend_convergence
      expected_result: Eleven cases cover 15 Simply operations, 17 Semantic mappings, all 38 supported legacy features across ten families, all 13 rejected features have governed unsupported dispositions, no unresolved item exists, and controlled shrinkage or classification mutations fail closed.
    - name: Canonical Rust convergence
      command: cargo test --manifest-path core/Cargo.toml --test frontend_convergence --locked
      expected_result: Semantic source, native Simply replay, source-less Semantic IR, and applicable regex-compatible imports produce identical normalized semantics, facts, diagnostics, portability, and target artifacts/results under exact profiles with deterministic repeat runs.
    - name: Host Preview convergence
      command: npm test --prefix bindings/typescript -- --runInBand simply_preview.test.ts && PYTHONPATH=bindings/python/src python3 -m pytest bindings/python/tests/unit/test_simply_preview.py
      expected_result: TypeScript and Python rebuild every convergence Simply request exactly and receive the same canonical projected result through the Rust transport.
    - name: Documentation and architecture integrity
      command: python3 tooling/documentation_integrity.py && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/architecture_fitness.py && python3 tooling/governance.py
      expected_result: Public links and executable examples pass, the hierarchy is Semantic first/Simply second/regex import third, stale canonical regex teaching is removed, and production/public boundaries remain unchanged.
    - name: Repository and phase certification
      command: cargo fmt --manifest-path core/Cargo.toml -- --check && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings && cargo test --manifest-path core/Cargo.toml --all-targets --locked && python3 -m unittest discover -s tooling/tests && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: All affected and repository hardgates, Local, Pull Request, Full-as-available, reproducibility, and clean-tree checks pass with only explicitly inherited environment unavailability if any.
checkpoints:
    - name: Convergence denominator and representation policy
      status: passed
      evidence:
          - check: Complete frontend denominator
            result: passed
            details: The locked corpus has eleven cases and fail-closed coverage for 15 Simply operations, 17 Semantic mappings, 38 supported legacy features across ten families, and all 13 rejected legacy features.
          - check: Representation-only comparison boundary
            result: passed
            details: Alpha-renamed identities and removed provenance/location metadata are the only exclusions; semantic values, facts, diagnostics, portability decisions, rewrites, target options, artifacts, and outcomes remain compared.
    - name: Executable convergence corpus and host adapters
      status: passed
      evidence:
          - check: Fail-closed authored denominator
            result: passed
            details: The content-addressed eleven-case corpus certifies all 15 Simply operations, all 17 Semantic mappings, all 38 accepted or compatibility-only legacy features across ten families, all 13 rejected legacy dispositions, three exact profiles, three host routes, and zero unresolved entry; ten controlled mutations fail closed.
          - check: Canonical multi-route equality
            result: passed
            details: Semantic source, native Rust Simply, independently re-identified source-less Semantic IR, and nine regex-compatible imports compare across all three exact profiles. The harness executes 132 route/profile comparisons with deterministic repeat compiles and retains semantic values, facts, diagnostics, portability, and target results.
          - check: TypeScript and Python Preview reuse
            result: passed
            details: Both Preview adapters reconstruct every one of the eleven shared builder requests exactly and compile them through the Rust transport; the focused TypeScript and Python suites pass seven tests each.
    - name: Canonical documentation hierarchy
      status: passed
      evidence:
          - check: Public authoring hierarchy
            result: passed
            details: Fourteen public documentation surfaces now present Semantic STRling first for textual authoring, Simply second for programmatic construction, and regex-compatible source third as an explicit import/compatibility surface; the canonical tutorial uses strling.semantic and the root compile transport.
          - check: Fail-closed documentation denominator
            result: passed
            details: The convergence checker requires all fourteen surfaces, rejects stale transition-era claims and binding-as-oracle guidance, and proves denominator shrinkage, stale claims, missing markers, and tutorial reordering fail closed; all fourteen checker tests pass.
          - check: Documentation and boundary integrity
            result: passed
            details: Exact repository formatting passes; documentation integrity validates 158 Markdown files and seven executable parser examples; public-contract, generated-artifact, architecture-fitness, patch-integrity, and convergence checks pass without a production or public API change. The Semantic contract manifest renews only the changed README content hash and preserves every grammar, mapping, diagnostic, fixture, and case count.
    - name: Full repository and phase certification
      status: passed
      evidence:
          - check: Complete repository suites
            result: passed
            details: Exact Rust 1.75.0 formatting and clippy pass with warnings denied; all 379 Rust tests and all 542 tooling tests pass. The complete TypeScript suite passes 970 tests and the complete Python suite passes 796 tests after governed Prettier 3.3.3 and Ruff 0.15.21 formatting. Public contracts, generated artifacts, documentation integrity over 158 Markdown files and seven executable examples, architecture fitness, core contracts, and governance all pass.
          - check: Exact runtime and portability certification
            result: passed
            details: Official PCRE2 10.42 and 10.43 libraries, Node.js 22.23.2, and CPython 3.11.15 pass exact two-run certification. The shared five-profile corpus passes all 20 cases with 88 executed, seven not-applicable, and five unsupported applications; the 100-entry portability matrix has 87 native, one planner-certified rewrite, seven not applicable, five explicitly unsupported, zero semantic divergences, and zero unresolved entries.
          - check: Migration and profile certification
            result: passed
            details: The migration differential passes three repeated Node-18 observations with zero determinism mismatches, baseline fingerprint sha256:59c75727d33ad965a65c9ff880cb8e2aab17f495a21d213d675af7cf9cd3a934, and canonical-boundary fingerprint sha256:71b8adfbab3b965cbd381317b3da9a8192ba5ab3d7f8a12b13b7b5c75058b255. Local passes 26/26. Pull Request records 44 passed and only inherited Ruby Bundler drift plus missing Swift availability. Full records 76 passed, zero failed, zero incomplete, zero waived, and seven explicit unavailable results comprising dependency-risk scanning plus Ruby lint/build/test and Swift typecheck/build/test.
          - check: Clean-room reproducibility and clean tree
            result: passed
            details: A fresh no-hardlink clone of 7fe029c9b233e29974a95537def20b051cc6355a, using ignored hard-linked dependency directories, remains Git-clean and reproduces all 379 Rust tests, all 542 tooling tests, seven TypeScript and seven Python focused Preview convergence tests, the complete convergence/documentation/public/generated/architecture/core/governance checks, exact shared cross-engine certification, and the checked portability matrix.
