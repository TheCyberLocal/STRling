    next_task: Implement and certify the locked convergence corpus before changing canonical tutorials.
    rationale: The complete denominator, comparison exclusions, legacy dispositions, and documentation surface are locked, but executable convergence evidence, canonical tutorial migration, aggregate profiles, and clean-tree closure remain incomplete.
