            details: Profile aggregates were UNAVAILABLE, never failed. Host Ruff 0.16.2 does not satisfy repository pin 0.15.21 for six Python/repository format and lint operations, and Pull Request additionally found inherited Ruby Bundler version drift. No waiver or weakened requirement was introduced; every available operation passed.
