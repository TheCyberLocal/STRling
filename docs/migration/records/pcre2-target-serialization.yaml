    next_task: Begin P10-T03 by verifying advanced and version-sensitive PCRE2 serialization and artifact options against the exact authored 10.42 and 10.43 profiles, without moving capability or runtime policy into the serializer.
    rationale: P10-T02 is complete with exhaustive deterministic serialization, fail-closed artifact construction, exact option and provenance projection, architecture hardgates, reviewed compatibility evidence, full repository certification, and zero failed profile operations. Only recorded host tool-version drift remains; profile-specific correctness verification is the next ordered contained task.
