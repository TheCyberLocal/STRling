change_classification:
    semantic_change:
        level: none
        evidence:
            - Serialization consumes already-certified target operations and cannot redefine matching meaning.
    public_api_change:
        level: none
        evidence:
            - The governed kernel facade and serialized compiler request/result contracts remain unchanged; this is a standalone internal domain-stage entrypoint.
        affected_surfaces: []
    schema_change:
        level: none
        evidence:
            - The existing TargetArtifact, target-profile, portability, diagnostic, and Semantic IR schemas are consumed without modification.
        affected_surfaces: []
    diagnostic_change:
        level: additive
        evidence:
            - Adds stable emission diagnostics for malformed target plans, invalid syntax data, PCRE2 syntax bounds, resource limits, and invalid constructed artifacts.
    target_behavior_change:
        level: additive
        evidence:
            - Adds standalone deterministic PCRE2 pattern and TargetArtifact production without changing any existing public compiler, binding, package, or runtime result.
    architecture_change:
        level: additive
        evidence:
            - Adds one pure serializer after structured PCRE2 lowering with policy, runtime, ambient-state, and product-orchestration exclusions.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: PCRE2 serializer and artifact unit/property certification
      command: cargo test --manifest-path core/Cargo.toml --test pcre2_serialization --test pcre2_serialization_properties --locked
      expected_result: Every PCRE2 operation, precedence/grouping rule, literal/class escape, capture/reference spelling, scoped case/wildcard mode, option/requirement projection, generated span, failure category, deterministic JSON/fingerprint, input immutability, and generated mutation case passes.
    - name: Architecture and contract fitness
      command: python3 -m unittest tooling.tests.test_pcre2_serialization_architecture tooling.tests.test_pcre2_lowering_architecture tooling.tests.test_core_contracts && python3 tooling/core_contract_validation.py
      expected_result: One-way lowering-to-serialization consumption is enforced; policy recomputation, semantic/profile reinterpretation, runtime PCRE2, ambient state, bindings/frontends/editors, target-neutral reverse dependencies, and product callers fail controlled mutations.
    - name: Complete kernel quality
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings
      expected_result: The complete kernel suite passes without warnings and all prior target-neutral, lowering, planner, equivalence, diagnostic, frontend, contract, and resource regressions remain certified.
    - name: Repository certification
      command: python3 tooling/public_contracts.py --check; python3 tooling/generated_artifacts.py --check; python3 tooling/governance.py; python3 tooling/documentation_integrity.py; python3 tooling/migration_differential.py --repeat-runs 3; ./strling profile local; ./strling profile pull-request; git diff --check
      expected_result: Every task-owned operation passes, reviewed canonical-boundary evidence is current, aggregate carry-forward remains explicit, and the final committed tree is clean.
checkpoints:
    - name: TargetArtifact, lowering, profile-option, syntax, compatibility, and architecture inventory
      status: passed
      evidence:
          - check: Read-first authority inventory
            result: passed
            details: The canonical TargetArtifact fixes UTF-8 regex text, exact target reference, sorted compile/runtime options, resolved requirements, generated UTF-8 spans, and emission diagnostics. Pcre2LoweringPlan supplies a closed operation tree, deterministic captures/backreferences, case/wildcard/class/repetition/position/assertion forms, every profile option with stage/value/selection, planner resolutions, rewrites, and source/node provenance. Authored PCRE2 10.42/10.43 profiles require separate UTF/UCP compile options and 10.43 additionally carries a profile-default variable-lookbehind limit. PCRE2 primary documentation confirms pattern metacharacters, class metacharacters, scoped i/s options, named-capture and backreference forms, quantifier limits, UTF/UCP API options, and 8/16/32 code-unit library distinction. Historical Python, TypeScript, and Rust emitters remain non-normative compatibility evidence and disagree in escaping, grouping, shorthand, guard, and warning details.
          - check: Ownership and known-profile boundary
            result: passed
            details: Case insensitivity and dot-all wildcard behavior have exact scoped PCRE2 pattern constructs; UTF/UCP stay engine options and must never leak as invented inline Unicode flags. Current profiles do not declare code-unit width, newline/BSR overrides, JIT, or match-context settings, so this task will preserve all declared options without fabricating missing consumer obligations. UTF-16/32 and version-sensitive feature execution remain later profile/runtime work.
    - name: Deterministic serializer, artifact projection, and failures
      status: passed
      evidence:
          - check: Exact input and output contract
            result: passed
            details: serialize_pcre2 borrows one Pcre2LoweringPlan, validates its complete canonical structure, serializes without mutating it, constructs one TargetArtifact with contract/specification versions, exact immutable profile reference, portability status, UTF-8 regex text, all selected options, requirement records, generated source map, and empty successful emission diagnostics, then validates the artifact before returning all-or-nothing.
          - check: Closed deterministic PCRE2 spelling
            result: passed
            details: Every target operation has one branch. Alternations and repetition operands use explicit noncapturing groups; quantifiers use canonical short/general forms plus lazy/possessive suffixes; captures use named/unnamed PCRE2 syntax; backreferences use absolute slot syntax; all position and lookaround forms and atomic groups use exact PCRE2 constructs. Global insensitive mode and include-line-terminators wildcard use genuine scoped i/s PCRE2 syntax without changing profile option ownership.
          - check: Stable fail-closed boundary
            result: passed
            details: STRL-PCRE2_EMIT-0001 through -0006 cover invalid lowering plans, capture correspondence/names, Unicode property syntax data, PCRE2 capture/quantifier limits, 16 MiB pattern growth, and invalid constructed artifacts. Failures are emission-phase target-profile diagnostics tied to the smallest available source span and affected semantic node.
    - name: Escaping, precedence, options, source maps, and property evidence
      status: passed
      evidence:
          - check: Escaping and precedence matrix
            result: passed
            details: Pattern metacharacters, backslash, whitespace, hash, NUL, controls, printable non-ASCII scalars, class metacharacters, range endpoints, ASCII/Unicode built-ins, Unicode properties, mixed positive/negative sets, nested alternation, and repeated operations are covered. ASCII built-ins use explicit scoped case-sensitive atoms; Unicode built-ins retain UCP-dependent PCRE2 shorthands. Invalid capture/property identifier data fails instead of entering syntax.
          - check: Option and requirement projection
            result: passed
            details: Every lowering option is copied with exact ID, compile/runtime stage, and scalar value in canonical profile order, including profile defaults. Required pcre2.utf and pcre2.ucp are present as options, and tests prohibit (*UTF) and (*UCP) leakage. Requirement IDs use zero-padded canonical ordinals; native resolution is profile_capability_resolved and certified rewrites retain the exact strategy ID.
          - check: Deterministic provenance and property corpus
            result: passed
            details: Every operation records a half-open generated UTF-8 byte span; identical empty/rewrite spans coalesce sorted unique node/source evidence. Tests serialize 196 generated programs twice with equal typed artifacts, compact JSON, and canonical fingerprints; exercise 128 deterministic 48-scalar escape mutations; and reject 64 shuffled-option plans before emission. Inputs remain byte-equivalent typed values.
    - name: Architecture, contracts, migration evidence, and repository certification
      status: in_progress
      evidence:
          - check: Focused Rust, architecture, and contract checks
            result: passed
            details: Nine focused integration tests plus the serializer module unit test pass. Twenty-nine serializer/lowering/core-contract controlled tests pass, enforcing entrypoint and validation, mandatory authorities, no lowering/policy recomputation, no profile reinterpretation, no runtime/ambient/product dependency, no invalid Unicode inline leakage, no target-neutral reverse dependency, and no direct caller. Core validation passes 11 schema mappings and 78 fixtures.
          - check: Complete Rust quality
            result: passed
            details: All 278 Rust tests pass and warnings-denied Clippy is clean. Final repository, reviewed migration differential, Local, and Pull Request certification remain pending the implementation commit.
