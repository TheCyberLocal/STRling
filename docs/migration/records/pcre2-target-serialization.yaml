record_version: 2.0.0
title: Deterministic PCRE2 serialization and TargetArtifact construction
status: in_progress
objective: Serialize one validated Pcre2LoweringPlan into deterministic PCRE2 pattern text, profile-owned options, resolved requirements, generated provenance, and a canonical TargetArtifact without reimplementing semantic, capability, planning, lowering, runtime, binding, or package behavior.
