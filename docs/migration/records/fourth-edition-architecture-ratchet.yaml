status: complete
objective: Convert the completed Fourth Edition migration into permanent, property-oriented architecture fitness rules that enforce one canonical semantic implementation and route, semantic-free registered adapters, retired implementation-derived authority, zero prohibited transitional dependencies, data-only retained history, and retirement of the stale Perl parser-case waiver.
