          - check: Next ordered Notion task
            result: passed
            details: P07-T03, separately versioned canonical observation comparison, demonstrably irrelevant representation normalization, and discrepancy taxonomy, is the next ordered incomplete task. It owns discrepancy classification, migration dispositions, and later full migration-corpus gating.
