change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: additive
        evidence:
            - Extends the engineering-only legacy-reference command with runner selection and multi-runner machine-readable evidence; package APIs are unchanged.
        affected_surfaces:
            - root-cli
    schema_change:
        level: additive
        evidence:
            - Adds explicit runner provenance and multi-runner certification fields to migration-only observation records.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
        level: additive
        evidence:
            - Generalizes the isolated historical-evidence tooling boundary from TypeScript to independently fingerprinted runners.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Complementary reference checks
      command: python3 tooling/legacy_reference/launch.py --check
      expected_result: Shared protocol, TypeScript, Python, corpus, determinism, containment, and immutability checks pass.
    - name: Binding baselines
      command: ./strling typecheck typescript && ./strling build typescript && ./strling test typescript && ./strling format --check python && ./strling lint python && ./strling test python
      expected_result: Existing TypeScript and Python implementations retain their governed quality and test baselines.
    - name: Canonical kernel and contracts
      command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && cargo test --manifest-path core/Cargo.toml && python3 tooling/contract_validation.py && python3 tooling/core_contract_validation.py && python3 tooling/public_contracts.py --check
      expected_result: Canonical Rust and public contracts remain unchanged and passing.
    - name: Governance and architecture
      command: python3 tooling/generated_artifacts.py --check && python3 tooling/documentation_integrity.py --json && python3 tooling/governance.py && python3 tooling/architecture_fitness.py
      expected_result: Generated state, documentation, declared scope, and authority boundaries pass.
    - name: Security and profiles
      command: python3 tooling/security.py integrity --json && python3 tooling/security.py content --json && ./strling profile local && ./strling profile pull-request && ./strling profile full
      expected_result: Enforceable security and profile operations pass, with unavailable platform results recorded rather than weakened.
    - name: Patch and repository integrity
      command: git diff --check && git status --short --branch
      expected_result: Every checkpoint patch is whitespace-clean and final committed state is clean.
checkpoints:
    - name: Complementary reference strategy and evidence inventory
      status: passed
      evidence:
          - check: Candidate implementation and dependency inventory
            command: Inspect all binding parser/compiler/emitter trees, Python package/tests/history, migration donor evidence, generated markers, and toolchain requirements.
            result: passed
            details: Selected the completed TypeScript runner and independent Python implementation; classified other binding compilers as partially independent but currently duplicative, wrappers/generated artifacts as non-independent, and the retired TypeScript oracle as a redundant runtime-only path.
          - check: Strategy documentation and available integrity checks
            command: Prettier check; documentation_integrity.py --json; architecture_fitness.py; contract_validation.py; git diff --check.
            result: passed
            details: Host Node 24 formatting, documentation integrity across 124 files, architecture fitness, 11 canonical schemas with 30 positive and 33 negative fixtures, and patch integrity passed. Native governance and the WSL command aggregate were unavailable because WSL returned Wsl/Service/0x80072747; the Windows governance attempt reached a known POSIX-path assumption and did not weaken the requirement.
    - name: Shared multi-runner evidence contract
      status: passed
      evidence:
          - check: Runner-parameterized protocol and schema compatibility
            command: node --test tooling/legacy_reference/tests/protocol.test.mjs
            result: passed
            details: Eleven protocol tests passed for the existing request contract, canonical serialization, independent implementation identity, structured failures, explicit TypeScript/Python runner identities, runner-owned operation maps, equal shared observation fields, malformed identity rejection, and unsupported/not-exposed outcomes. Nine isolated TypeScript corpus tests also passed all 24 unchanged cases with three-run determinism under the 1.1.0 envelopes.
          - check: Contract versioning and available quality gates
            command: Prettier check; node --check shared modules; architecture_fitness.py; contract_validation.py; git diff --check.
            result: passed
            details: Request protocol and TypeScript corpus remain 1.0.0; observation, batch, and certification schemas advance to 1.1.0 for runner provenance. Host formatting, syntax, architecture, canonical contracts, and patch integrity passed; WSL-native aggregation remains unavailable with Wsl/Service/0x80072747.
    - name: Python legacy reference runner
      status: passed
      evidence:
          - check: Python implementation fidelity and focused runner tests
            command: python -m ruff check --no-cache tooling/legacy_reference/python_reference.py tooling/legacy_reference/tests/test_python_reference.py; python -m unittest tooling.legacy_reference.tests.test_python_reference; python -m pytest -q bindings/python/tests
            result: passed
            details: Ruff passed, all 15 runner tests passed, and all 789 unchanged historical Python package tests passed. The runner directly invoked parser, artifact, compiler, metadata, emitter, diagnostics, and Simply surfaces while retaining four explicit not-exposed outcomes.
          - check: Python corpus repeatability, immutability, and containment
            command: python tooling/legacy_reference/python_reference.py --certify
            result: passed
            details: >-
                Python 3.13.5 certified 20 cases across 11 mapped operations over
                three repetitions: 12 successes, four contained legacy failures,
                four unsupported outcomes, 60 canonical comparisons, two malformed
                requests, zero repeat mismatches, zero unexplained failures, and
                unchanged corpus and implementation snapshots. Implementation
                fingerprint sha256:0748ef7994a2bf143cb71efc149f0e8929905533d05b4fa1c2365f596ba88bc5;
                corpus fingerprint sha256:f3114a423da9928ab12ff7afe5c2ce0eba97c2f57c3599cdc98b2105a5ef914d.
    - name: Additional runtime or binding reference paths
      status: planned
      evidence: []
    - name: Cross-runner corpus and determinism certification
      status: planned
      evidence: []
    - name: Tooling integration and authority hardgates
      status: planned
      evidence: []
    - name: Complementary reference readiness
      status: planned
