required_verification:
    - name: Complementary reference checks
      command: python3 tooling/legacy_reference/launch.py --check
      expected_result: Shared protocol, TypeScript, Python, corpus, determinism, containment, and immutability checks pass.
    - name: Binding baselines
      command: ./strling typecheck typescript && ./strling build typescript && ./strling test typescript && ./strling format --check python && ./strling lint python && ./strling test python
      expected_result: Existing TypeScript and Python implementations retain their governed quality and test baselines.
    - name: Canonical kernel and contracts
      command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && cargo test --manifest-path core/Cargo.toml && python3 tooling/contract_validation.py && python3 tooling/core_contract_validation.py && python3 tooling/public_contracts.py --check
      expected_result: Canonical Rust and public contracts remain unchanged and passing.
    - name: Governance and architecture
      command: python3 tooling/generated_artifacts.py --check && python3 tooling/documentation_integrity.py --json && python3 tooling/governance.py && python3 tooling/architecture_fitness.py
      expected_result: Generated state, documentation, declared scope, and authority boundaries pass.
    - name: Security and profiles
      command: python3 tooling/security.py integrity --json && python3 tooling/security.py content --json && ./strling profile local && ./strling profile pull-request && ./strling profile full
      expected_result: Enforceable security and profile operations pass, with unavailable platform results recorded rather than weakened.
    - name: Patch and repository integrity
      command: git diff --check && git status --short --branch
      expected_result: Every checkpoint patch is whitespace-clean and final committed state is clean.
