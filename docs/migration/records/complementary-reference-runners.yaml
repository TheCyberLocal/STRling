            command: WSL Rust/governance/generation/profile batch; direct local, pull-request, and full profile attempts; direct Windows governance, generation, and full public-contract checks.
            result: not_run
            details: >-
                WSL failed before dispatch with Wsl/Service/0x80072747, so Rust
