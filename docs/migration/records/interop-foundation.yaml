change_classification:
    semantic_change:
        level: none
        evidence:
            - The interop layer dispatches existing canonical compiler and Simply contracts without adding syntax, validation guarantees, target decisions, lowering, or emission.
    public_api_change:
        level: additive
        evidence:
            - New versioned native and WebAssembly ABI surfaces are introduced alongside unchanged historical C and Rust packages.
        affected_surfaces:
            - strling-interop
    schema_change:
        level: additive
        evidence:
            - The independently versioned interop envelope and ABI descriptor schemas wrap existing canonical values without changing them.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Canonical diagnostics cross the boundary unchanged; stable STRL-INTEROP codes describe only transport and dispatch failures.
    target_behavior_change:
        level: none
        evidence:
            - Exact supplied target profiles remain authoritative, and the boundary neither selects nor modifies a target.
    architecture_change:
        level: intentional-correction
        evidence:
            - The previously deferred host boundary is selected as a versioned serialized protocol with contained native/WASM adapters outside the unsafe-free kernel.
        affected_surfaces: []
    generated_output_change:
        level: additive
        evidence:
            - CP3 derives the installed C header from the canonical ABI descriptor, snapshots that enforced declaration surface, and resolves the isolated interop crate through its Cargo lockfile.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Interop contract and hostile boundary corpus
      command: python -m unittest tooling.tests.test_interop_contract
      expected_result: Exact protocol, ABI, operation, error, memory, threading, platform, and shrinkage-resistant hostile-input contracts validate.
    - name: Native and WebAssembly boundary certification
      command: cargo test --manifest-path bindings/interop/Cargo.toml --all-targets --locked && python tooling/interop_contract.py --certify
      expected_result: Native lifecycle/concurrency and raw WebAssembly memory/serialization/import-export evidence pass against one shared canonical protocol implementation.
    - name: Complete integration and repository profiles
      command: python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && python tooling/governance.py && python tooling/migration_differential.py --repeat-runs 3 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: Public ABI, generated header, architecture, security, migration, platform, and repository evidence passes, with exact environmental limitations recorded and no unavailable target called certified.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and operational starting boundary
            result: passed
            details: P17-T01 begins on clean architecture/v4 at P16 closure d4189e039810532c8447aeeffb18a8fc7a165e29 with five normalized Notion checkpoints. Historical C and Rust package snapshots are preservation evidence and remain outside this task.
          - check: Canonical boundary inventory
            result: passed
            details: The typed kernel compile facade, CompileRequest/CompileResult 1.0 contracts, target-profile validation/reference logic, Simply 1.0/1.1 replay, root JSON transport, kernel unsafe prohibition, public surfaces, generated artifacts, toolchains, native runners, and absence of a WASM crate were inspected.
          - check: Protocol, ABI, ownership, and exclusion lock
            result: passed
            details: strling.interop, strling.c-abi, and strling.wasm-abi 1.0.0 fix four operations, exact UTF-8 JSON envelopes, 10 MiB request and 32 MiB response limits, stable transport errors, stateless native ownership and unwind containment, raw wasm32 memory rules, thread/cancellation dispositions, certification targets, generated-header authority, and no host migration or semantic implementation.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed interop evidence denominator
            command: python tooling/interop_contract.py --json
            result: passed
            details: The contract fingerprint is sha256:1dc0797483c2b87a4653411c5d8abc0e4f2681fd3c82aa70ed8da3f72db585c5. The evidence fingerprint is sha256:5419a7a3f29525cfa6c4c7ddf2227d7c6700bf8cd73c5b27e48b8ef006964e90. All 77 unique cases validate across ten exact families, four operations, ten error codes, ten runner dispositions, four native targets, and wasm32-unknown-unknown.
          - check: Shrinkage and mutation resistance
            command: python -m unittest tooling.tests.test_interop_contract -v
            result: passed
            details: Ten integrity tests pass. They reject governed-input or evidence fingerprint drift, case removal after count edits, duplicate identity, family substitution, operation or platform shrinkage, error-code mutation, and any WASM host import/shared-memory claim.
          - check: Focused quality and patch integrity
            command: python -m ruff check tooling/interop_contract.py tooling/tests/test_interop_contract.py && python -m ruff format --check tooling/interop_contract.py tooling/tests/test_interop_contract.py && prettier --check tests/interop/1.0/evidence.schema.json tests/interop/1.0/manifest.json && git diff --check
            result: passed
            details: The validator and tests pass Ruff check/format; the evidence schema and manifest pass Prettier; patch whitespace is valid. Platform, native lifecycle, fuzz, sanitizer, and WASM-host case claims remain planned evidence rather than implementation passes.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: Shared canonical dispatcher and native boundary
            command: cargo +1.75.0 clippy --manifest-path bindings/interop/Cargo.toml --all-targets --locked --offline -- -D warnings && cargo +1.75.0 test --manifest-path bindings/interop/Cargo.toml --all-targets --locked --offline
            result: passed
            details: One safe dispatcher implements describe, compile, target_profile.inspect, and simply.compile through public kernel types. Nineteen Rust tests pass across internal serialization/panic containment, native lifecycle, protocol success/failure/profile/Simply behavior, 32-thread determinism, 517 bounded arbitrary-byte lengths, five structured mutations, and 256 execute/free sequences. Rustfmt and Clippy pass at the declared 1.75 floor.
          - check: Raw WebAssembly build, closure, and host lifecycle
            command: cargo +1.75.0 build --manifest-path bindings/interop/Cargo.toml --target wasm32-unknown-unknown --release --locked --offline && python tooling/interop_contract.py --certify --json
            result: passed
            details: The raw module builds at wasm32-unknown-unknown. Deterministic sealing removes only the Rust linker metadata globals and rejects every other extra export. The resulting module exposes exactly memory plus five governed functions, imports zero capabilities, and passes Node execution with two isolated instances through alloc/write/execute/read/free/dealloc, hostile UTF-8, alignment, range, and descriptor-state cases.
          - check: Generated C surface and dependency isolation
            command: python tooling/interop_contract.py --check-header && python tooling/public_contracts.py --surface strling-interop --check && python tooling/governance.py
            result: passed
            details: The installed header exactly reproduces from abi.json, the enforced strling-interop declaration snapshot is current, the interop Cargo lock resolves offline, and the new crate boundary forbids dependencies on historical C/C++/Rust bindings or repository tooling.
          - check: Focused tooling and artifact quality
            command: python -m unittest tooling.tests.test_interop_contract tooling.tests.test_interop_wasm -v && python -m ruff check tooling/interop_contract.py tooling/interop_wasm.py tooling/tests/test_interop_contract.py tooling/tests/test_interop_wasm.py && git diff --check
            result: passed
            details: Seventeen tooling tests pass, including evidence shrinkage, generated-header derivation, WASM section encoding/sealing, import closure, and unexpected-export rejection. The focused public surface passes. The repository-wide public-contract command reaches all other enforced surfaces but cannot execute the unchanged Go surface because Go is absent locally; that broader environment requirement remains CP4, not a CP3 pass.
    - name: Integration and certification
      status: blocked
      evidence:
          - check: Current-lock Linux adversarial execution
            command: python -m tooling.interop_adversarial --json --output <evidence>/interop-adversarial-linux-lockfinal.json
            result: passed
            details: On x86_64 Linux, all eight governed checks pass against the current Cargo lock. Six cargo-fuzz targets each complete 10,000 fixed-seed bounded runs (60,000 total); the full native test suite passes separately under AddressSanitizer and LeakSanitizer; and the raw-WASM host verifies six exports, zero imports, two isolated instances, and alloc-execute-read-free-dealloc. The evidence file SHA-256 is 352110d0d802c1359f08a6c4cd54265616b4f423fea7bb12aadcd882ad595b21.
          - check: Pinned-toolchain lock compatibility
            command: cargo +1.75.0 fetch --locked --manifest-path bindings/interop/fuzz/Cargo.toml
            result: passed
            details: The Cargo-generated lock pins cc 1.2.55 and jobserver 0.1.32, both MSRV 1.63, so the fuzz graph remains readable by the declared Rust/Cargo 1.75 floor. This removes the accidental Cargo-2024 getrandom 0.4.3 and r-efi 6.0.0 resolution while retaining libfuzzer-sys 0.4.13.
          - check: Live dependency-risk certification
            command: python tooling/security.py risk --json
            result: failed
            details: The live result is 14 passed, 28 unavailable, four waived, and three failed checks representing two unique blockers. The shared workspace reports libfuzzer-sys 0.4.13 through both security.license.interop-cargo and security.license.interop-fuzz-cargo; its (MIT OR Apache-2.0) AND NCSA expression remains unclassified by the fail-closed policy. RUSTSEC-2026-0204 remains in bindings/rust crossbeam-epoch 0.9.18, which is explicitly outside T01 scope. No policy expansion, waiver, or out-of-scope lock update is inferred.
          - check: Public contracts and generated-source authority
            command: python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && python tooling/governance.py
            result: passed
            details: The additive strling-interop surface, unchanged enforced public surfaces, generated header, generated-artifact registry, task scope, architecture boundaries, and change declarations pass with the pinned local Go 1.22.12 toolchain. Package-manager lockfiles retain their declared transitional family status.
          - check: Local and Pull Request profiles
            command: ./strling profile local && ./strling profile pull-request
            result: failed
            details: Local reports 32 passed, one failed, and zero unavailable. Pull Request reports 42 passed, one failed, and 11 unavailable historical binding ecosystems. In both profiles, migration_differential_gate is the only failed operation; all interop, contract, generated, governance, formatting, lint, typecheck, and executable local/PR test operations pass.
          - check: Full profile certification
            command: ./strling profile full
            result: failed
            details: The clean Full profile at commit a592268ca7fe4b60f33a654a03a821aab5ffba3f reports 58 passed, two failed, and 37 unavailable across 97 operations. Dependency integrity passes all 27 checks, including the separately governed runtime and fuzz manifests sharing bindings/interop/Cargo.lock. The installed Visual Studio 2022 x64 developer environment resolves the prior link.exe failure; stdlib runtime certification now reports unavailable only because STRLING_PCRE2_1042_LIBRARY is not configured. The only failed operations are the live dependency-risk gate and the governed migration differential. LSP package certification and every executable interop, public-contract, generated-source, governance, format, lint, typecheck, build, and test operation pass. Interop adversarial certification is unavailable on the Windows profile host but is independently certified 8/8 on governed x86_64 Linux above. The profile evidence fingerprint is c04cdbb3fdbdacdf21fa012015731d66b71ca9a36c5da4758e40fbb08f91c612 and the artifact file SHA-256 is d0eb0a77661a7105876bd9a13d9e11ddf3603c423105ce995b18e95174e59c87.
          - check: Migration differential review gate
            command: python tooling/migration_differential.py --repeat-runs 3
            result: passed
            details: The reviewed Node 22.18.0 to 22.23.2 renewal preserves all 44 governed case sets and semantic observations. All 20 Python records are byte-identical. Each of the 24 TypeScript records changes only implementation.runtime.version and the implementation fingerprint derived from that runtime identity; requests, outcomes, classifications, routes, and evidence are unchanged. Three repeated current-toolchain runs deterministically produce baseline sha256:8d25fe6f42e4366b1f80fa3b281b534e0d0fb8f2d3b2ba002ce9d4adefd965b0, source observations sha256:8edb51052416496f813174e6c2a53538757a1bd40f4f1fa0938c36a235fbfc2a, historical peer result sha256:2fa56dc5b76d81e9e3c1e80625a6da0d05ea915d9fee46b446d9b15e309fc72b, and full corpus sha256:f20d028b8cb35399896e60662c77e81cd25e5ddd260f2412ab7ac8d8d8843553. The canonical boundary, contract, corpus case sets, and route coverage fingerprints remain unchanged; the signed migration-explanation manifest and 27 focused regression tests pass.
          - check: Exact runtime environment disposition
            result: not_run
            details: The installed Visual Studio 2022 x64 linker successfully builds the canonical stdlib projection on Windows. Exact-runtime execution remains unavailable because neither the Windows host nor the local Linux image has both fingerprinted PCRE2 10.42 and 10.43 libraries required by the five-profile denominator; the Linux system 10.42 library has a different SHA-256. No substitute library is called certified, and the task does not fetch unapproved PCRE2 dependencies.
