record_version: 2.0.0
title: Canonical portability planning
status: in_progress
objective: Convert certified semantic requirements and factual version-sensitive capability evaluation into deterministic, evidence-backed native, equivalent-rewrite, unsupported, or unresolved planning decisions without mutating Semantic IR, applying rewrites, lowering captures, producing target syntax, or changing product behavior.
scope:
