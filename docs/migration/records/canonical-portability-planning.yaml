record_version: 2.0.0
title: Canonical portability planning
status: in_progress
objective: Convert certified semantic requirements and factual version-sensitive capability evaluation into deterministic, evidence-backed native, equivalent-rewrite, unsupported, or unresolved planning decisions without mutating Semantic IR, applying rewrites, lowering captures, producing target syntax, or changing product behavior.
scope:
    diff:
        base: dd06a5f395bf0f7da5bbf4889325c17e0d9aea92
        head: working-tree
    allowed_paths:
        - core/**
        - docs/architecture.md
        - docs/migration/ledger.md
        - docs/migration/records/canonical-portability-planning.yaml
        - docs/portability-planning.md
        - governance/architecture-rules.json
        - governance/change-control.json
        - tooling/core_contract_validation.py
        - tooling/core_stage_boundaries.py
        - tooling/tests/test_portability_architecture.py
    forbidden_paths:
        - bindings/**
        - package.json
        - package-lock.json
        - spec/features.json
        - spec/grammar/**
        - spec/stdlib/**
        - spec/targets/**
        - strling
        - strling.ps1
        - tests/spec/**
    expected_files:
        - core/src/capability_evaluation.rs
        - core/src/lib.rs
        - core/src/portability_planning.rs
        - core/src/portability_planning/validation.rs
        - core/tests/portability_planning.rs
        - core/tests/portability_planning_properties.rs
        - docs/migration/records/canonical-portability-planning.yaml
        - docs/portability-planning.md
        - governance/change-control.json
    permitted_generated_changes: []
    expected_generated_outputs: []
    required_verification_levels:
        - contract
        - unit
        - integration
        - quality
        - certification
    bounded_exemptions: []
change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: none
        evidence: []
        affected_surfaces: []
    schema_change:
        level: none
        evidence: []
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
        level: additive
        evidence:
            - The canonical kernel gains a pure portability-planning stage after factual capability evaluation with no reverse dependency from target-neutral analysis.
            - Architecture fitness will reject emitters, target syntax serializers, bindings, frontends, editors, and runtime-state dependencies from portability planning.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Kernel portability quality
      command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && cargo check --manifest-path core/Cargo.toml --all-targets && cargo test --manifest-path core/Cargo.toml
      expected_result: The kernel formats, checks, and tests without warnings; all portability, capability, property, pipeline, and prior regression tests pass.
    - name: Portability properties, contracts, and architecture
      command: cargo test --manifest-path core/Cargo.toml --test portability_planning --test portability_planning_properties && python3 tooling/core_contract_validation.py && python3 -m unittest tooling.tests.test_portability_architecture tooling.tests.test_capability_architecture tooling.tests.test_diagnostic_architecture
      expected_result: Determinism, completeness, decision soundness, unknown preservation, profile sensitivity, immutability, canonical mappings, and controlled architecture failures pass.
    - name: Repository quality and certification
      command: ./strling format --check && ./strling hygiene && ./strling lint all && ./strling typecheck all && ./strling generate --check && ./strling contracts --check && ./strling governance && python3 tooling/baseline.py --check && ./strling check --json && ./strling certify --json
      expected_result: Every configured repository quality, contract, governance, baseline, check, and certification operation passes; governed incomplete or locally unavailable tools remain explicit.
    - name: TypeScript compatibility baseline
      command: ./strling build typescript && ./strling test typescript && ./strling typecheck typescript
      expected_result: Existing TypeScript runtime/compiler behavior remains unchanged with all established suites and tests passing.
    - name: Patch and clean-state integrity
      command: git diff --check && git status --short --branch
      expected_result: The final committed repository has no whitespace errors or uncommitted files.
checkpoints:
    - name: Portability planning contract
      status: passed
      evidence:
          - check: Decision, aggregation, rewrite, proof, and ownership contract
            command: npx prettier --check docs/portability-planning.md && python3 tooling/core_contract_validation.py && python3 tooling/architecture_fitness.py && ./strling governance && git diff --check
            result: passed
            details: The contract preserves the three-value final vocabulary, keeps Unknown as unresolved evidence, defines completeness-first aggregation, inventories rewrite candidates, admits only literal atomicity elimination, contains no target syntax, and preserves one-way target-neutral dependencies.
          - check: Repository formatting environment
            command: ./strling format --check
            result: failed
            details: Every configured formatter passed, including Rust and Prettier, but the repository command retained its governed nonzero disposition because local Ruff 0.16.2 does not match the pinned 0.15.21.
    - name: Planning framework and native decisions
      status: passed
      evidence:
          - check: Pure framework, correspondence, native, and unresolved behavior
            command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && cargo check --manifest-path core/Cargo.toml --all-targets && cargo test --manifest-path core/Cargo.toml
            result: passed
            details: Nine focused planning tests and all 178 kernel tests pass; empty, native, multiple-native, unknown, mixed native/unknown, mismatched result, exact program/profile mismatch, determinism, and five-input immutability are certified with complete native capability evidence and Unknown retained outside final status.
    - name: Equivalent rewrite registry and proof evaluation
      status: passed
      evidence:
          - check: Closed registry, structural proof, and stable rewrite evidence
            command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && cargo check --manifest-path core/Cargo.toml --all-targets && cargo test --manifest-path core/Cargo.toml
            result: passed
            details: Twelve focused integration tests, two internal proof tests, and all 183 kernel tests pass. The normative atomic-literal strategy proves exact atomic and literal node kinds plus their child relationship, produces no replacement target syntax, preserves the exact profile, and is rejected on failed or indeterminate proof. Generic replacement support rejects Unsupported, ConstraintViolation, and Unknown; speculative possessive and other unregistered candidates remain unavailable.
    - name: Unsupported and aggregate portability decisions
      status: passed
      evidence:
          - check: Negative evidence, completeness-first aggregation, and rewrite dependency integrity
            command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && cargo check --manifest-path core/Cargo.toml --all-targets && cargo test --manifest-path core/Cargo.toml
            result: passed
            details: Nineteen focused planning tests and all 190 kernel tests pass. Explicit unavailability and constraint violations become unsupported only after the complete registry yields no applicable or indeterminate rewrite; unresolved evidence suppresses aggregate status before unsupported, then unsupported precedes rewrite and native. Same-node requirements remain independent, and plan self-validation rejects missing dependency evidence, malformed endpoints, and cycles.
    - name: Property and profile-differential certification
      status: passed
      evidence:
          - check: Generated decision properties and authored profile differentials
            command: cargo fmt --manifest-path core/Cargo.toml --all --check && cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings && cargo check --manifest-path core/Cargo.toml --all-targets && cargo test --manifest-path core/Cargo.toml && python3 tooling/core_contract_validation.py && git diff --check
            result: passed
            details: Four fixed seeds (0x504f525441424c45, 0x9e3779b97f4a7c15, 0xd1b54a32d192ed03, 0x94d049bb133111eb) generate 256 normalized programs across four authored profiles, 1,024 capability evaluations, and 2,048 repeat planner invocations. All 193 kernel tests pass with exact completeness, determinism, native/rewrite/unsupported soundness, Unknown preservation, input immutability, 64 registered rewrite plans, 695 unresolved decisions, 160 semantic decision differentials caused only by profile changes, 16 rejected malformed cases, and zero unexplained failures. Canonical contracts retain 11 schema mappings and 63 fixtures.
    - name: Pipeline and hardgate integration
      status: planned
      evidence: []
    - name: Completion and target-lowering readiness
      status: planned
      evidence: []
