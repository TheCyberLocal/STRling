record_version: 2.0.0
title: TypeScript and Python Simply Preview adapters
status: in_progress
objective: Bridge TypeScript and Python to the ratified Simply 1.0.0 protocol and sole Rust compiler through thin Preview adapters with stable serialization, canonical error translation, deterministic identities, complete compatibility dispositions, and cross-language equivalence, without binding-private semantic, compiler, target, or runtime authority in the Preview path.
