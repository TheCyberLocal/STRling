change_classification:
    semantic_change:
        level: none
        evidence:
            - The only admitted strategy remains atomic-literal elision with the same structural preconditions and no applied transformation.
    public_api_change:
        level: none
        evidence:
            - The governed strling-kernel facade signatures and canonical compiler schemas are unchanged; certification types remain in the existing internal domain-module boundary while serialized results use the existing Diagnostic and Portability contracts.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - Adds a separately versioned authored equivalence-registry schema; canonical compiler protocol and target-profile schemas remain unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: additive
        evidence:
            - Adds stable portability explanation diagnostics for native, equivalent rewrite, unsupported, and unresolved decisions with node/source and capability/proof evidence.
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, factual capability evaluation, lowering, emission, and runtime behavior remain unchanged.
    architecture_change:
        level: additive
        evidence:
            - Separates authored equivalence certification and target-aware portability explanations from target-neutral diagnostics, emitters, bindings, and frontend code.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Authored equivalence registry and certification binding
      command: cargo test --manifest-path core/Cargo.toml --test rewrite_equivalence_registry --locked
      expected_result: Registry version, strategy definition, conformance bytes, fingerprints, proof obligations, and later-executable hooks reproduce exactly; missing or stale evidence blocks selection and validation.
    - name: Planner proof and property certification
      command: cargo test --manifest-path core/Cargo.toml --test portability_planning --test portability_planning_properties --locked
      expected_result: Atomic-literal elision remains the sole admitted strategy; all positive, negative, profile-differential, completeness, determinism, idempotence, immutability, and malformed-evidence properties pass.
    - name: Portability explanations and public facade
      command: cargo test --manifest-path core/Cargo.toml --test portability_diagnostics --test compiler_boundary_orchestration --locked
      expected_result: Native, rewrite, unsupported, and unresolved decisions receive stable structured explanations with exact node/source and capability, constraint, registry, proof, and profile evidence; diagnostic policy and public projection remain deterministic.
    - name: Repository certification
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked; cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings; python3 tooling/core_contract_validation.py; python3 tooling/public_contracts.py --check; python3 tooling/generated_artifacts.py --check; python3 tooling/governance.py; ./strling profile local; ./strling profile pull-request; git diff --check
      expected_result: Every task-scoped gate passes, public additions reproduce exactly, aggregate carry-forward remains explicit, and the committed tree is clean.
checkpoints:
    - name: Existing planner, proof, diagnostic, and contract inventory
      status: passed
      evidence:
          - check: Read-first authority inventory
            result: passed
            details: P09-T04 already owns a pure planner, one hard-coded rewrite.atomic_literal.elide.v1 strategy, three structural proof conditions, replacement-capability checks, complete attempt evidence, profile correspondence, property tests, and internal validation. The missing P09-T05 boundary is authored/versioned registry authority, reproducible strategy/conformance fingerprints bound into selected plans, stale-evidence rejection, and target-aware explanatory diagnostics. Canonical portability/result schemas already carry stable status, reason code, node IDs, and Diagnostic values, so the compiler protocol schemas need no mutation.
    - name: Versioned registry and proof certification
      status: passed
      evidence:
          - check: Authored registry authority
            command: cargo test --manifest-path core/Cargo.toml --test rewrite_equivalence_registry --locked
            result: passed
            details: Registry 1.0.0 is schema-validated and contains exactly rewrite.atomic_literal.elide.v1. Its canonical strategy fingerprint is sha256:52d1a15ffb3becdde9e33f708539395e395eff752741283d90ff8bb1ccb64cc5 and conformance.atomic_literal_elision.v1 fingerprint is sha256:5fe61a36f43a50b7ce5f6e2b13f0ac36ded8bda0e6255a66027bcf669a1d3532.
          - check: Proof and conformance completeness
            result: passed
            details: Three structural preconditions, two semantic invariants, three unsupported conditions, two required test identities, and runtime.atomic_literal_elision.differential.v1 are authored and fingerprint-bound. Four semantic cases with six profile expectations pass; incomplete Unicode profile evidence remains unresolved rather than being concealed by a rewrite.
          - check: Stale or incomplete authority rejection
            result: passed
            details: Missing strategy tests, missing conformance cases, stale evidence SHA, missing certification, stale strategy fingerprint, and stale conformance fingerprint all fail certification or plan validation before equivalent_rewrite can be reported.
    - name: Compatibility explanations and negative evidence
      status: passed
      evidence:
          - check: Evidence-only explanation stage
            command: cargo test --manifest-path core/Cargo.toml --test portability_diagnostics --test compiler_boundary_orchestration --locked
            result: passed
            details: Native, rewrite, unsupported, and unresolved dispositions emit deterministic canonical diagnostics STRL-PORTABILITY-0101 through STRL-PORTABILITY-0104 with profile/capability evidence, exact Semantic IR node IDs, source origins, proof identities, and certification fingerprints. Cross-program plan reuse is rejected.
          - check: Exact public contract projection
            result: passed
            details: The equivalence-explanation request/result pair validates and matches the canonical kernel exactly for an ECMAScript 2024 atomic literal. It exposes both affected node IDs and primary/related source spans while preserving the existing CompileResult, Diagnostic, and Portability schema shapes and the governed kernel facade snapshot.
          - check: Diagnostic resource-boundary preservation
            command: cargo test --manifest-path core/Cargo.toml --test compiler_boundary_resources --locked
            result: passed
            details: Byte-identical explanations on the same affected nodes coalesce deterministically with their exact canonical occurrence count. The certified 4,096-requirement ceiling succeeds, 4,097 still fails structurally, and advisory diagnostics cannot exhaust the pre-existing diagnostic budget.
          - check: Architecture mutation hardgates
            command: python3 -m unittest tooling.tests.test_portability_diagnostics_architecture tooling.tests.test_portability_architecture tooling.tests.test_core_contracts
            result: passed
            details: All 25 focused tests passed. Controlled mutations prohibit capability extraction/evaluation, planning, rewrite application, lowering, emission, runtime probes, target artifacts, frontend/binding dependencies, and ambient filesystem, environment, clock, process, thread, or randomness inputs.
    - name: Property, contract, architecture, and repository certification
      status: passed
      evidence:
          - check: Complete Rust and contract certification
            command: cargo test --manifest-path core/Cargo.toml --all-targets --locked; cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings; python3 tooling/core_contract_validation.py
            result: passed
            details: All 258 Rust tests passed, including planner/property/profile differential, registry, explanation, public facade, contract, resource, normalization, semantic, structural, safety, frontend, and target suites. Warnings-as-errors passed. Core mapping validates 11 canonical schemas and exact coverage of 78 authoritative JSON fixtures plus the equivalence registry/evidence relationship.
          - check: Repository integrity hardgates
            command: python3 tooling/public_contracts.py --check; python3 tooling/generated_artifacts.py --check; python3 tooling/governance.py; python3 tooling/documentation_integrity.py; git diff --check
            result: passed
            details: Public facade snapshots remained unchanged; generated-artifact integrity, scope/declarations, architecture rules, seven executable documentation examples, 134-file local link validation, and patch hygiene all passed.
          - check: Reviewed migration differential renewal
            command: python3 tooling/migration_differential.py --repeat-runs 3
            result: passed
            details: The canonical-boundary fingerprint moved from sha256:c6afd58a149f7fb0241847be2ad33bffefaf0c41397fc31efc0dab262e42d3e8 to sha256:868e23157f9e7c31a7e813b8ceaad0dd88cd89c515e32a795f6f71749f63e9d7 and baseline fingerprint to sha256:7c25f46f5611d65f77216c074c94183076cab6addfb08cbf31cc07dae699779b. Full corpus sha256:e6307c75de2a7af8a0e6958bca7a6a318fca6ba8ca232f9b17a4c46316306386, route coverage sha256:96f519848f9a4ef3d3fe926c17ffcee81b98ba1fce33f216511ca7749044699e, source observations, corpora, and historical-peer fingerprints remained unchanged across three runs with zero mismatches.
          - check: Local and Pull Request profiles
            command: ./strling profile local --artifact /tmp/p09-t05-local.json; ./strling profile pull-request --artifact /tmp/p09-t05-pull-request.json
            result: passed
            details: At clean commit 4b998d5c7cbd3c4478cfd20b200b3a59f22d6081, Local recorded 20 passed, zero failed, and six unavailable operations with evidence fingerprint 4c13d84c7f8c1ed64ed81c9e8c4e9131207119b4980b98146cb4b4cd1e62a716. Pull Request recorded 39 passed, zero failed, and seven unavailable operations with evidence fingerprint fbf1679117712a82f3438c3cfcb5d2f41f99fc5a0970cb409f0946dd9ecc8c9c.
          - check: Explicit environment carry-forward
            result: passed
            details: The profile aggregates were UNAVAILABLE, never failed. Host Ruff 0.16.2 does not satisfy repository pin 0.15.21 for six Python/repository format/lint operations, and Pull Request additionally found inherited Ruby Bundler version drift. No waiver was added, no requirement was weakened, and every available operation passed.
