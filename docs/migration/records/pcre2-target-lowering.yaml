            result: passed
            details: At clean commit a5989c9955c0a7dd0567963cdd96c88c0f31d1ae, Local recorded 20 passed, zero failed, and six unavailable operations with evidence fingerprint 3415dcaa18e9ae260d4a7a00950cf7b42703cfe397f91ffbd1ab473cd35ab7f2. Pull Request recorded 39 passed, zero failed, and seven unavailable operations with evidence fingerprint 7f32e15953fc4287cc3c28516a3125e32989b910ae2cda8a150f08d5c0a57c0d.
