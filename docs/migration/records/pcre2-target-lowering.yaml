completion:
    accomplished:
        - Added lower_pcre2 as a pure borrowed-input stage from normalized Semantic IR, exact PCRE2 profile, and completed certified PortabilityPlan to an all-or-nothing pre-serialization Pcre2LoweringPlan.
        - Defined a closed PCRE2 operation tree for every current Semantic IR variant, target-specific character/wildcard/repetition/position/assertion choices, deterministic one-based capture/reference slots, global case intent, compile/runtime profile options with required/profile-default selection, requirement resolutions, and canonical source/node provenance.
        - Applied only rewrite.atomic_literal.elide.v1 when selected by the certified planner, retaining exact registry, strategy, conformance, proof, affected-node, planner-identity, target-reference, and merged source provenance evidence.
        - Added stable STRL-PCRE2_LOWERING-0001 through -0014 failures for invalid/stale/mismatched/incomplete/unsupported/malformed/resource/capture states, all owned by target_lowering and tied to the affected semantic node and source origin when present.
        - Registered exact Semantic IR, profile, portability, and diagnostic contract consumption; added controlled architecture fitness that prohibits capability/planner recomputation, serialization, runtime PCRE2, artifacts, ambient state, product dependencies, target-neutral reverse dependencies, and direct stage bypass.
    verified:
        - Ten focused lowering tests cover every Semantic IR and target operation variant, native and certified-rewrite paths, captures/backreferences, option stages/selections, stale/malformed/unsupported/unresolved/resource cases, 196 generated valid programs lowered twice, and 64 rejected cross-program evidence cases.
        - All 268 Rust tests, warnings-as-errors Clippy, 29 focused architecture/contract tests, 16 migration-differential mutation tests, 11-schema/78-fixture core validation, public/generated contracts, governance, documentation, and diff hygiene passed.
        - The reviewed three-run migration differential passed with zero mismatches and unchanged legacy corpora, case sets, route coverage, and historical-peer results after renewing only the canonical boundary and truthful target-route review evidence.
        - Local and Pull Request profiles recorded 20 and 39 passed operations respectively, zero failures, no waivers, and only explicit inherited Ruff/Bundler version unavailability.
    behavior_changed: The internal canonical Rust kernel can now deterministically lower certified semantic/planner evidence into a structured PCRE2 target plan; no existing public compiler, binding, emitted regex, runtime, artifact, package, or release behavior changed.
    intentional_behavior_changes:
        - A completed native or equivalent-rewrite plan for one exact PCRE2 profile can now produce a validated target-specific structure without serializing pattern text.
        - Unsupported, unresolved, stale, non-PCRE2, or malformed evidence now fails through stable structured target-lowering diagnostics instead of allowing an implicit target assumption.
        - The certified atomic-literal rewrite is now applied at its owned lowering boundary while retaining exact proof and provenance evidence.
    preserved_behavior:
        - Semantic IR, target profiles, capability results, portability plans, canonical protocol schemas, kernel facade signatures, bindings, historical emitters, package APIs/versions, and published artifacts remain unchanged and immutable.
        - No PCRE2 syntax, escaping, generated pattern spans, TargetArtifact, engine invocation, safety remediation, runtime probe, or product orchestration was added.
        - Unknown profile capability evidence remains unresolved and cannot be inferred as supported from the PCRE2 engine name or historical emitter behavior.
    transitional_architecture:
        - Structured PCRE2 lowering is a standalone canonical domain stage and is intentionally not yet called by the public kernel facade; canonical orchestration must be added only with its separately governed artifact/output contract.
        - Current authored PCRE2 profiles enumerate a deliberately bounded capability set; unlisted constructs remain truthful unresolved failures until profile authority is expanded.
        - Local and Pull Request remain READY WITH RECORDED CARRY-FORWARD because host Ruff and Bundler versions do not match repository pins; all available operations passed with zero failures.
    deferred_work:
        - P10-T02 owns deterministic PCRE2 regex serialization and escaping, generated spans/source maps, and TargetArtifact construction from this exact lowering plan without moving policy into the emitter.
        - Runtime PCRE2 execution and the deferred atomic-literal differential hook remain owned by the later runtime integration task; no runtime observation was fabricated here.
        - Canonical facade/product orchestration, bindings, Simply, editor/LSP integration, package changes, version changes, publication, and release actions remain outside this task.
readiness:
    status: READY WITH RECORDED CARRY-FORWARD
    next_task: Begin P10-T02 by serializing the certified PCRE2 lowering plan into deterministic regex text, generated provenance, and a TargetArtifact without reintroducing semantic or portability policy.
    rationale: P10-T01 is complete with exhaustive typed lowering, exact correspondence and rewrite evidence, fail-closed diagnostics, deterministic/property coverage, architecture hardgates, reviewed compatibility evidence, full repository certification, and zero failed profile operations. Only recorded host tool-version drift remains; PCRE2 serialization is the next ordered contained task.
