record_version: 2.0.0
title: Structured Semantic IR to PCRE2 target lowering
status: in_progress
objective: Lower one exact normalized Semantic IR program and completed certified portability plan into a deterministic PCRE2-specific target representation without serializing pattern text, executing PCRE2, constructing a TargetArtifact, or reimplementing capability/planning policy.
scope:
