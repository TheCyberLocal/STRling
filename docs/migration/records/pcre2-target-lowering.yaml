required_verification:
    - name: PCRE2 lowering unit and property certification
      command: cargo test --manifest-path core/Cargo.toml --test pcre2_lowering --test pcre2_lowering_properties --locked
      expected_result: Every Semantic IR variant, capture/reference mapping, option, native decision, certified rewrite, unsupported/unresolved state, malformed correspondence, deterministic ordering, idempotence, and input immutability case passes.
    - name: Architecture and contract fitness
      command: python3 -m unittest tooling.tests.test_pcre2_lowering_architecture tooling.tests.test_portability_architecture tooling.tests.test_core_contracts && python3 tooling/core_contract_validation.py
      expected_result: One-way Semantic IR and planner consumption is enforced; capability/planner recomputation, serialization, runtime, artifacts, bindings, frontends, ambient state, and bypass paths fail controlled mutations.
    - name: Complete kernel quality
      command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings
      expected_result: The complete kernel suite passes without warnings and all prior target-neutral, capability, planner, equivalence, diagnostic, frontend, contract, and resource regressions remain certified.
    - name: Repository certification
      command: python3 tooling/public_contracts.py --check; python3 tooling/generated_artifacts.py --check; python3 tooling/governance.py; python3 tooling/documentation_integrity.py; python3 tooling/migration_differential.py --repeat-runs 3; ./strling profile local; ./strling profile pull-request; git diff --check
      expected_result: Every task-owned operation passes, canonical boundary review is current, aggregate carry-forward remains explicit, and the final committed tree is clean.
checkpoints:
    - name: Target, planner, Semantic IR, compatibility, and architecture inventory
      status: passed
      evidence:
          - check: Read-first authority inventory
            result: passed
            details: The canonical TargetArtifact already separates emitted pattern, options, requirements, source map, and diagnostics, but no pre-serialization target plan exists. Semantic IR has 12 node variants plus typed character-set members, repetition, positions, logical captures/references, lookaround, atomicity, case matching, and canonical provenance. The completed planner owns exact native/rewrite/unsupported/unresolved decisions and only rewrite.atomic_literal.elide.v1. PCRE2 10.42/10.43 profiles own exact version-sensitive capabilities and options. Historical emitters are non-normative compatibility evidence and currently conflate lowering, escaping, serialization, runtime guards, and safety warnings.
    - name: Structured PCRE2 plan and correspondence validation
      status: passed
      evidence:
          - check: Exact immutable input and output contract
            result: passed
            details: lower_pcre2 borrows normalized SemanticProgram, exact PCRE2 TargetProfile, and self-validating PortabilityPlan; checks canonical-v1, resource limits, contract/specification compatibility, engine identity, canonical program SHA-256, exact profile identity/revision/fingerprint, final plan status, rewrite/program shape, and constructed output invariants before returning an all-or-nothing Pcre2LoweringPlan.
          - check: Structured pre-serialization representation
            result: passed
            details: The target plan has a closed operation tree, target-specific wildcard/class/repetition/position/assertion enums, deterministic one-based capture slots, logical capture/reference identities, profile options with selection and stage, canonical planner resolution order, source/node provenance, and applied rewrite evidence. It has no pattern text, escaping, generated spans, TargetArtifact, or runtime call.
    - name: Explicit node, capture, option, and rewrite lowering
      status: passed
      evidence:
          - check: Exhaustive Semantic IR fixture
            result: passed
            details: Eight focused Rust unit tests cover all 12 Semantic IR variants; literal and range class members; ASCII/Unicode built-ins and Unicode properties; both wildcard modes; bounded/unbounded and greedy/lazy/possessive repetition; all seven positions; four assertion forms plus fixed/variable lookbehind shapes; named/unnamed captures; backreferences; global case options; compile/runtime and required/profile-default options; native atomic groups; and deterministic provenance.
          - check: Certified rewrite execution
            result: passed
            details: rewrite.atomic_literal.elide.v1 is the sole admitted rewrite. Lowering removes only the certified atomic wrapper over a direct literal and retains registry version, strategy and conformance fingerprints, satisfied proof, affected nodes, planner identity, exact target reference, and merged wrapper/body provenance.
          - check: Deterministic generated cases
            result: passed
            details: Property fixtures lower 196 generated valid programs twice with byte-identity-equivalent typed results, output self-validation, exact planner/profile correspondence, and unchanged Semantic IR, target profile, and portability plan inputs; 64 generated cross-program evidence cases fail closed.
    - name: Negative, property, architecture, and repository certification
      status: passed
      evidence:
          - check: Focused Rust certification
            result: passed
            details: cargo test --manifest-path core/Cargo.toml --test pcre2_lowering --test pcre2_lowering_properties --locked passed 10 tests (8 unit, 2 property) with zero failures.
          - check: Controlled-mutation architecture and contract fitness
            result: passed
            details: python3 -m unittest tooling.tests.test_pcre2_lowering_architecture tooling.tests.test_portability_architecture tooling.tests.test_core_contracts passed 29 tests. Mutations prove required entrypoint/correspondence checks, mandatory authority inputs, no capability/planner recomputation, no serialization/runtime/artifact/ambient/product dependency, no target-neutral reverse dependency, and no direct bypass. core_contract_validation passed 11 schema mappings and 78 canonical fixtures.
          - check: Complete repository certification
            command: cargo test --manifest-path core/Cargo.toml --all-targets --locked && cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings; python3 tooling/public_contracts.py --check; python3 tooling/generated_artifacts.py --check; python3 tooling/governance.py; python3 tooling/documentation_integrity.py; git diff --check
            result: passed
            details: All 268 Rust tests passed and warnings-denied Clippy was clean. Public facade snapshots remained unchanged; generated artifacts, exact governed scope/declarations, architecture rules, seven executable documentation examples, 135-file link validation, canonical contracts, and patch hygiene all passed.
          - check: Reviewed migration differential and route evidence renewal
            command: python3 -m unittest tooling.tests.test_migration_differential && python3 tooling/migration_differential.py --repeat-runs 3
            result: passed
            details: Sixteen controlled migration-gate tests and the three-run differential passed with zero determinism mismatches. The canonical boundary moved from sha256:868e23157f9e7c31a7e813b8ceaad0dd88cd89c515e32a795f6f71749f63e9d7 to sha256:c017abaad43e4656838df1029a486b057dd2262e35e81f9cf0098a84383f3342. The reviewed route rationale now truthfully records standalone structured lowering while keeping emission/product routes not comparable; contract sha256:4a9f76fd184f2660d923c186296a7131292d6c01fe73c24ec89d90ef16d16467, source observations sha256:627adc5d693d13702a53ba1552efbbaa4444f892dabe830ce3d8a7c37a6b4c4d, full corpus sha256:5382302ac5870239fa64b6a360a81bb9336de14ec611e430e0d5566d5173f54c, and baseline sha256:f4d3acc56deb042ba67e4abc96580cde7178666b95468b4ec1209bf06c6c886b were renewed. Both legacy corpora/case sets, route coverage sha256:96f519848f9a4ef3d3fe926c17ffcee81b98ba1fce33f216511ca7749044699e, and historical-peer corpus/result fingerprints remained unchanged.
