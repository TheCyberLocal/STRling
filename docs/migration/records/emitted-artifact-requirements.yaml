change_classification:
    semantic_change:
        level: compatible
        evidence:
            - Source language meaning and cross-engine equivalence rules are unchanged; V4-H04 retains semantic remediation.
            - Registered standard-library semantic projections retain identical rows and behavior while rebasing their source identity on the strengthened artifact contract.
        affected_surfaces:
            - strling-kernel
    public_api_change:
        level: breaking
        evidence:
            - TargetArtifact keeps its existing shape while requirements gains its already-intended authoritative meaning and emitted-only entries.
            - The registered standard-library projection embeds its regenerated source fingerprint as a literal public constant, so governance correctly classifies the value drift as breaking even though the callable API shape is unchanged.
        affected_surfaces:
            - python-public-api
            - typescript-public-api
    schema_change:
        level: compatible
        evidence:
            - The target-artifact schema description ratifies the requirement union without changing fields or accepted value shapes.
    diagnostic_change:
        level: additive
        evidence:
            - New structured target-lowering failures identify unsupported lowering-introduced capabilities; broader delivery remains assigned to V4-H05.
    target_behavior_change:
        level: compatible
        evidence:
            - Emitted regex spelling and execution semantics are unchanged; unsupported introduced capabilities and target constraints now refuse before artifact emission.
    architecture_change:
        level: compatible
        evidence:
            - Existing target ASTs gain exhaustive requirement extraction and share one canonical reconciliation/evaluation path; no parallel profile or lowering system is introduced.
    generated_output_change:
        level: compatible
        evidence:
            - Registered observations are regenerated because artifact requirement contents and identities strengthen while runtime expectations remain unchanged.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Post-lowering requirement model
      command: cargo test --manifest-path core/internal/Cargo.toml --test post_lowering_requirements --locked
      expected_result: Source-only, emitted-only, shared, constrained, unsupported, malformed, deterministic, fingerprint, target-specific, and completeness cases pass.
    - name: Lowering, serialization, profiles, and artifact contracts
      command: cargo test --manifest-path core/internal/Cargo.toml --locked
      expected_result: The complete Rust kernel suite passes with authoritative final artifact requirements.
    - name: V4-H01 corpus integrity and strict audit
      command: python3 -m tooling.adversarial_semantic_audit --verify-evidence && python3 -m tooling.adversarial_semantic_audit --strict
      expected_result: Evidence validates; strict remains non-green with 25 requirement-unsoundness findings removed, 121 V4-H04 findings and two V4-H05 findings retained, and zero unexpected or unaccounted findings.
    - name: Architecture, contracts, governance, and generated outputs
      command: python3 tooling/core_contract_validation.py && python3 tooling/public_contracts.py --check && python3 tooling/generated_artifacts.py --check && python3 tooling/governance.py && python3 tooling/documentation_integrity.py
      expected_result: All contract, architecture, generated-artifact, governance, and documentation gates pass.
    - name: Required quality profiles
      command: ./strling profile local --json && ./strling profile pull-request --json
      expected_result: Local and Pull Request pass completely; Full and Release remain out of scope.
checkpoints:
    - name: Starting state and causal audit
      status: passed
      evidence:
          - check: Branch, remote, and worktree
            result: passed
            details: dev was clean at af2356340c9b572471f36954845b4c996a2b124c and matched origin/dev before modification.
          - check: Finding split and first causal boundary
            result: passed
            details: Repository-owned evidence identifies exactly 25 REQUIREMENT_UNSOUNDNESS findings at the source-plan-to-artifact projection boundary; 121 semantic/target-limit findings remain V4-H04 work and two diagnostic-delivery findings remain V4-H05 work.
    - name: Requirement authority implementation
      status: passed
      evidence:
          - check: Structured extraction and reconciliation
            result: passed
            details: PCRE2, ECMAScript, and Python re exhaustively classify their closed target operation trees, preserve the source requirement prefix, append a deterministic deduplicated introduced suffix, and evaluate that suffix with the common evaluator against the exact profile.
          - check: Fail-closed completeness
            result: passed
            details: Unsupported, constrained-but-unsatisfied, unlisted, malformed, and over-limit introduced requirements prevent plan/artifact construction. Plan validation recomputes classification so target-AST mutation cannot bypass accounting.
    - name: Verification
      status: in_progress
      evidence:
          - check: Focused implementation and architecture tests
            result: passed
            details: Eight dedicated Rust regressions, the affected lowering/serialization/artifact suites, and 27 target-boundary architecture tests pass; full deterministic verification remains in progress.
commits: []
completion:
    accomplished:
        - Added structured post-lowering requirement extraction, canonical reconciliation, exact-profile evaluation, and fail-closed target-plan validation across all three current target families.
    verified:
        - Focused positive, negative, constrained-profile, requirement-identity, target-specific lowering, and architecture mutation tests pass.
    behavior_changed: Emitted regex behavior remains unchanged; final artifact requirement evidence is strengthened and unsupported introduced constructs now refuse before serialization.
    intentional_behavior_changes:
        - TargetArtifact requirements now include lowering-introduced capabilities and use distinct deterministic semantic/lowering identity namespaces.
        - Exact-profile failure for an introduced capability occurs during target lowering before an artifact can be emitted.
    preserved_behavior:
        - Cross-engine semantic divergences remain assigned to V4-H04 and the strict audit remains intentionally non-green.
        - Performance measurements and thresholds, certification policy, target-engine scope, publication, package, release-tag, and P20 state remain unchanged.
    transitional_architecture:
        - The existing public diagnostic-delivery gap remains assigned to V4-H05; V4-H03 tests the structured lowering result directly.
    deferred_work:
        - V4-H04 owns concrete semantic and target-acceptance corrections.
        - V4-H05 owns remaining diagnostic integrity and delivery.
        - V4-H06 owns mandatory real-engine equivalence CI after semantic corrections.
readiness:
    status: READY
    next_task: V4-H04 — concrete semantic and target-acceptance corrections.
    rationale: The architectural representation is complete without a carry-forward gap; deterministic full verification is underway before task closure.
