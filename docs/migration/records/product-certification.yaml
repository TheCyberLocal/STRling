        - unit
        - integration
        - quality
        - certification
    bounded_exemptions: []
change_classification:
    semantic_change:
        level: none
        evidence:
            - Certification aggregates independently authoritative results and cannot create or change STRling language, compiler, target, standard-library, or adapter semantics.
    public_api_change:
        level: none
        evidence:
            - Product package APIs and contract surfaces remain unchanged; only engineering certification commands and artifacts are in scope.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - A new engineering-only product-certification artifact schema will consume existing structured profile and producer evidence without modifying product protocol schemas.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Product diagnostics remain producer-owned inputs and cannot be reinterpreted by certification.
    target_behavior_change:
        level: none
        evidence:
            - T01 records existing target execution evidence but does not change profiles, engines, lowering, serialization, or runtime behavior.
    architecture_change:
        level: intentional-correction
        evidence:
            - Release certification authority moves from prose/name/stdout scanning to deterministic aggregation of versioned structured evidence only after coverage parity is mechanically proved.
    generated_output_change:
        level: none
        evidence:
            - The exact registered binding-support generator and verification command were run after the toolchain profile change; the governed snapshot remained byte-identical, so there is no registered output diff.
            - The transitional Final Audit Report is an archived historical snapshot with no current generator or verification command and is not regenerated by the obsolete Omega scanner.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Product-certification schema and evidence fixtures
      command: python3 -m unittest tooling.tests.test_product_certification tooling.tests.test_certification -v
      expected_result: Positive evidence validates; malformed, duplicate, missing, stale, conflicting, waiver-invalid, aggregate-tampered, and nondeterministic inputs fail mechanically.
    - name: Structured producer and Omega parity
      command: python3 tooling/product_certification.py --check --json
      expected_result: Every required profile result and structured evidence producer is accounted for, the three Omega heuristic claims map to canonical evidence, and no prose output is an authority input.
    - name: Release-authority and generated-output governance
      command: python3 tooling/architecture_fitness.py --json && python3 tooling/generated_artifacts.py --check
      expected_result: CI/CD and release documentation use only structured product certification; the historical report is non-authoritative or replaced by a registered deterministic view.
    - name: Repository profiles
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full
      expected_result: Every T01-owned operation passes and every unrelated failure or unavailable environment is recorded exactly.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and campaign reconciliation
            result: passed
            details: P18-T01 starts from clean architecture/v4 anchor f16a04a3c84cabf9fd5debaeb70133ea6fe11163 after P17-T08 and P17 closed READY WITH RECORDED CARRY-FORWARD. Notion P18 and P18-T01 are In Progress with normalized CP1-CP4 and FINAL children.
          - check: Existing structured certification inventory
            result: passed
            details: >-
                toolchain.json defines four canonical profiles, 39 operations, and 19 structured operations: 15 certification-result-v1, three security-result-v1, and one documentation-result-v1 producer. The existing profile artifact schema 1.0.0 already binds ordered operation results to repository/profile identity, environment evidence, waiver references, aggregate state, and a deterministic fingerprint.
          - check: Omega authority defect inventory
            result: passed
            details: The historical audit uses shell execution and regular expressions over runner prose, test names, filenames, skips, warnings, and test counts. It has no producer/corpus identity, stale-SHA rejection, unavailable/waived/incomplete distinction, governed waiver requirement, or deterministic report. It now iterates 18 toolchain binding entries including shared JVM while its checked-in timestamped report contains the older 17-row denominator. Release docs still call it authoritative although current CI/CD invokes canonical profile artifacts.
          - check: Contained replacement and later-task boundary
            result: passed
            details: T01 owns the product-certification schema, producer/claim manifest, deterministic merge, artifact-derived report, exact coverage parity, and Omega authority retirement. T02 owns target/adapter matrices; T03 deep testing; T04 performance budgets; T05 supply-chain expansion. Product tests, semantic sources, target profiles, bindings, support tiers, publication, and push are forbidden.
          - check: CP1 contract and quality proof
            result: passed
            details: The clean Linux replay passes task-record contracts, exact diff scope, every enforced architecture rule, canonical contracts, documentation integrity over 199 tracked files and seven examples, repository formatting, 11 governance-contract tests, and patch integrity. The initial generated-output declaration was conservatively corrected to none because CP1 changes no registered output.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Versioned machine contracts
            result: passed
            details: Draft 2020-12 artifact and producer-manifest schemas validate. The artifact preserves repository, unversioned-transitional specification, contract-suite, toolchain, Full-profile, producer-manifest, operation/component, optional target/adapter/corpus, evidence-link, waiver, structured-payload, claim, coverage, aggregate, and deterministic fingerprint identities while isolating generated_at from deterministic evidence.
          - check: Exact producer and claim coverage design
            result: passed
            details: The authored manifest fingerprint-pins the governed Full-profile definition and exactly covers its 38 declarations in order, including all 19 structured producers, ten evidence areas, four explicit claims, and the three retired Omega heuristics. Every result is required; target-specific declarations expand mechanically from toolchain.json rather than being copied into an independent matrix.
          - check: Fail-closed aggregate and mutation evidence
            result: passed
            details: Aggregate policy is artifacted as failed greater than incomplete greater than unavailable greater than waived greater than passed. Skipped and explicitly unconfigured or unenforceable required evidence aggregate as incomplete; unavailable remains distinct; waived requires a governed ID. Eleven single-delta vectors cover ten required rejection classes including duplicate, missing, unknown, stale, conflicting, waiver-invalid, producer-tampered, aggregate-tampered, and artifact-tampered evidence.
          - check: CP2 contract and integration proof
            result: passed
            details: On clean governed Linux at 23b1e2f6, 28 focused product/profile/governance tests pass; canonical contracts pass; governance contracts, exact scope, change declarations, and every enforced architecture rule pass; and the registered generated-artifact check passes every public-contract snapshot and registered output without changes. Windows-only public extraction accurately reported unavailable Dart, Go, Maven/Gradle, PHP, Ruby, and Swift before the governed Linux replay supplied them.
    - name: Minimal implementation and local proof
      status: in_progress
      evidence: []
    - name: Integration and certification
      status: planned
      evidence: []
    - name: Completion and next-task readiness
      status: planned
      evidence: []
