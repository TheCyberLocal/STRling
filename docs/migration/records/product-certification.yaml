        - P18-T02 owns exact target-runtime provisioning, shared/stdlib execution, F# adapter nullability/build scheduling, and Python source-distribution assembly gaps recorded by PR/Full.
        - P18-T05 owns live npm advisories, unknown LSP dependency licenses, stale waiver scope, and ecosystems without configured authoritative scanners.
    deferred_work:
