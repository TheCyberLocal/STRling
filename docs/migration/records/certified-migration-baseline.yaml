record_version: 2.0.0
title: Certified migration baseline and donor capability inventory
status: in_progress
objective: Freeze a reproducible engineering and compatibility baseline for the governed architecture branch, classify valuable capabilities on the preserved dev donor line, protect the resulting evidence, and establish readiness for product/specification architecture work without changing STRling semantics.
scope:
    diff:
        base: 95509d581cc47eba04ff38fa403b0c7f59901d51
        head: working-tree
    allowed_paths:
        - docs/migration/**
        - governance/**
        - strling
        - strling.ps1
        - toolchain.json
        - tooling/baseline.py
        - tooling/index.md
        - tooling/tests/**
    forbidden_paths:
        - bindings/**
        - spec/**
        - tests/spec/**
        - tests/conformance/**
        - package.json
        - package-lock.json
    expected_files:
        - docs/migration/baselines/certification.json
        - docs/migration/baselines/certification.md
        - docs/migration/baselines/compatibility-preservation.json
        - docs/migration/baselines/compatibility-preservation.md
        - docs/migration/baselines/donor-inventory.json
        - docs/migration/baselines/donor-inventory.md
        - docs/migration/records/certified-migration-baseline.yaml
        - governance/baseline-contract.md
        - governance/baselines/migration-baseline.json
        - governance/baselines/registry.json
        - governance/change-control.json
        - governance/schemas/certification-evidence.schema.json
        - governance/schemas/compatibility-preservation.schema.json
        - governance/schemas/donor-inventory.schema.json
        - governance/schemas/frozen-baseline-registry.schema.json
        - governance/schemas/migration-baseline.schema.json
        - tooling/baseline.py
        - tooling/tests/test_baseline.py
    permitted_generated_changes: []
    expected_generated_outputs: []
    required_verification_levels:
        - contract
        - unit
        - integration
        - quality
        - certification
    bounded_exemptions: []
change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: none
        evidence: []
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - Governance-only schemas define frozen baseline, certification, donor inventory, registry, and preservation evidence; product schemas are unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
        level: additive
        evidence:
            - Baseline validation adds engineering-evidence integrity without changing target architecture or claiming that transitional semantic duplication is complete.
    generated_output_change:
        level: none
        evidence: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Baseline contract parsing
      command: python3 -m json.tool on every new governance schema and Python YAML parsing for the active task record
      expected_result: All contracts parse and the task record validates under governance/schemas/task-record.schema.json.
    - name: Canonical leaf hardgates
      command: ./strling format --check all; ./strling hygiene; BUNDLER_VERSION=2.4.20 ./strling lint all; ./strling typecheck all; ./strling generate --check; ./strling contracts --check; ./strling governance
      expected_result: Every enforced leaf hardgate passes and all transitions remain explicitly governed.
    - name: Canonical aggregate hardgates
      command: BUNDLER_VERSION=2.4.20 ./strling check all; BUNDLER_VERSION=2.4.20 ./strling certify all
      expected_result: Human aggregate profiles pass for every binding with no failed or unavailable result.
    - name: Structured hardgates
      command: ./strling generate --check --json; ./strling contracts --check --json; ./strling governance --json; BUNDLER_VERSION=2.4.20 ./strling check all --json; BUNDLER_VERSION=2.4.20 ./strling certify all --json
      expected_result: Every JSON report parses, reports passed overall status, and retains explicit transitional and future results.
    - name: Governance and quality suites
      command: python3 -m unittest discover -s tooling/tests -p 'test_*.py'
      expected_result: The complete focused governance, quality, version synchronization, contract, generation, architecture, and baseline test suite passes.
    - name: Frozen baseline validation
      command: ./strling baseline --check; ./strling baseline --check --json
      expected_result: Frozen identities, manifest digest, fingerprints, evidence schemas, inventory totals, and preservation records validate without using mutable branch names.
    - name: Controlled baseline mutation
      command: python3 -m unittest tooling.tests.test_baseline
      expected_result: Controlled manifest identity, fingerprint, evidence, transition, and registry-digest mutations fail closed even when a changed manifest is explicitly re-pinned.
    - name: Repository integrity
      command: git diff --check; git status --short
      expected_result: Patch integrity passes and final committed state is clean.
checkpoints:
    - name: Baseline identity and certification contract
      status: passed
      evidence:
          - check: Starting repository identity
            command: git status --short --branch; git rev-parse HEAD dev main; git merge-base and git rev-list comparisons
            result: passed
            details: architecture/v4 was clean at 95509d581cc47eba04ff38fa403b0c7f59901d51; dev was d41b0b73fea6c62f7bb32473f190cf4c8c9f14bc and main was 664d08de53565929c8f62379b006cd29f93b239f; dev and main were ancestors of the governed branch.
          - check: Pre-change complete certification
            command: BUNDLER_VERSION=2.4.20 ./strling certify all --json
            result: passed
            details: All 63 enforced results passed across the repository and 17 bindings; 39 incomplete capabilities retained their governed non-failing classifications and no result failed or was unavailable.
          - check: Evidence and classification contracts
            command: python3 -m json.tool for five new schemas; task-record JSON Schema validation
            result: passed
            details: Manifest, registry, certification, donor inventory, and preservation schemas parse; the six donor dispositions are exclusive target choices independent of branch representation, and the four compatibility categories distinguish obligations from semantic authority.
          - check: Required command contract
            command: review governance/baseline-contract.md
            result: passed
            details: The contract names leaf, structured, aggregate, complete focused-suite, patch-integrity, and clean-state commands, including explicit repository-locked Bundler selection.
    - name: Full committed-state baseline certification
      status: passed
      evidence:
          - check: Complete committed-state hardgate stack
            command: Leaf format, hygiene, lint, typecheck, generation, contracts, governance; focused tests; human and JSON check all and certify all
            result: passed
            details: SHA 77f6a81e6b0a63cc6052fdadb428c719b16c7c61 passed with 143 focused tests, 49 enforced check results, 63 enforced certify results, all 17 binding test baselines, and no failed or unavailable result.
          - check: Reproduction and clean-state proof
            command: ./strling generate --check --json; ./strling contracts --check --json; git diff --check; git status --short --branch
            result: passed
            details: Three enforced generated families and ten public snapshots reproduced; check modes left no tracked or untracked state and required no hidden files.
          - check: Governed transition and waiver capture
            command: Review governance public-surface, generated-artifact, architecture, static-analysis, and waiver registries
            result: passed
            details: Evidence records twelve public-extractor, eight generated-artifact, and three architecture transitions; one future rule; five active or accepted waiver identifiers; and three known defects excluded from contract status.
    - name: Donor-branch capability inventory
      status: passed
      evidence:
          - check: Git history and representation comparison
            command: git log main..dev; git diff main..dev; git diff dev..HEAD; targeted git show and source/test review
            result: passed
            details: The 16-commit, 259-file main-to-dev delta and the complete dev-to-governed delta were reviewed; dev is the governed branch merge base, so all donor ancestry is present and representation status prevents false future ports.
          - check: Capability coverage and dispositions
            command: Donor inventory JSON Schema validation and recalculated disposition counts
            result: passed
            details: "Twenty-nine unique capabilities validate: six preserve, eight port, seven rewrite, three retire, four evidence, and one discard family. Every item records paths, role, evidence, rationale, destination, prerequisites, and behavior obligation."
          - check: Highlighted subsystem review
            command: Targeted review of diagnostic/result models, hint engines, Python intelligence, island extraction, LSP handlers/tests, Essential data, conformance schema, emitter audits, binding implementations, packaging, and removed artifacts
            result: passed
            details: Diagnostics, hover, semantic tokens, navigation, code actions, VS Code integration, safety fixtures, stdlib work, parser/compiler/emitter expansions, duplication, and temporary artifacts are each represented without treating filenames or binding count as independent capabilities.
    - name: Frozen baseline and preservation matrix
      status: passed
      evidence:
          - check: Frozen manifest and evidence registry
            command: python3 tooling/baseline.py --check; python3 tooling/baseline.py --check --json
            result: passed
            details: The registry pins the manifest bytes; the manifest resolves certified SHA 77f6a81e6b0a63cc6052fdadb428c719b16c7c61, donor SHA d41b0b73fea6c62f7bb32473f190cf4c8c9f14bc, main SHA 664d08de53565929c8f62379b006cd29f93b239f, 27 material fingerprints, 23 transitions, 5 waivers, 29 donor capabilities, and 21 preservation entries.
          - check: Controlled frozen-record validation
            command: python3 -m unittest tooling.tests.test_baseline -v
            result: passed
            details: Seven tests prove deterministic path-set hashing and reject unpinned or explicitly re-pinned identity, fingerprint, transition, and evidence mutations.
          - check: Checkpoint quality and aggregate baseline
            command: Complete 150-test tooling suite; Ruff checks; format --check all; hygiene; governance; BUNDLER_VERSION=2.4.20 ./strling check all --json; git diff --check
            result: passed
            details: All focused tests and enforced hardgates passed; the aggregate retained 49 passing enforced results and 39 explicitly governed incomplete capabilities without failures or unavailable results.
          - check: Authority and portability review
            command: Manifest schema validation and repository-path review
            result: passed
            details: No working-directory path or mutable ref is required to reconstruct identity; the formal specification is explicitly recorded as unversioned-transitional, and all migration evidence remains subordinate to normative specifications and ratified contracts.
    - name: Baseline protection and final certification
      status: planned
      evidence: []
    - name: Completion and product-migration readiness
      status: planned
      evidence: []
