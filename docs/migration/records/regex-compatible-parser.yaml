    next_task: Build P08-T03, attaching canonical source spans, provenance, and diagnostics to the parser output while preserving the pure frontend boundary.
    rationale: The parser is contract-complete, bounded, deterministic, no-panic tested, authority-isolated, fully exercised through the blocking native differential, baseline-renewed, and documented. All task-scoped gates pass; only explicitly pre-existing repository/toolchain findings remain as carry-forward.
