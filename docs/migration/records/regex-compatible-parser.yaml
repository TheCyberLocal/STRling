record_version: 2.0.0
title: Port the regex-compatible parser into the canonical Rust kernel
status: in_progress
objective: Implement the frozen strling.regex-compat@1.0.0 syntax contract as a pure bounded Rust frontend that produces valid canonical Semantic IR without target, binding, public CLI, or diagnostic-presentation behavior.
scope:
    diff:
        base: 95a1d96de43fbfe32cfbb98ab2af0afdf0cdb4e4
        head: working-tree
    allowed_paths:
        - core/contract-mapping.json
        - core/src/lib.rs
        - core/src/regex_frontend.rs
        - core/tests/regex_frontend.rs
        - docs/migration/**
        - governance/architecture-rules.json
        - governance/change-control.json
        - spec/frontends/legacy-regex/1.0/**
        - tooling/core_contract_validation.py
        - tooling/migration_differential.py
        - tooling/migration_differential_baseline.json
        - tooling/migration_differential_contract.json
        - tooling/tests/fixtures/migration_differential/**
        - tooling/tests/test_core_contracts.py
        - tooling/tests/test_migration_differential.py
        - tooling/tests/test_regex_frontend_architecture.py
    forbidden_paths:
        - bindings/**
        - core/src/diagnostic/**
        - core/src/target/**
        - spec/contracts/**
        - spec/targets/**
        - tests/spec/**
    expected_files:
        - core/src/regex_frontend.rs
        - core/tests/regex_frontend.rs
        - docs/migration/regex-compatible-parser.md
        - docs/migration/records/regex-compatible-parser.yaml
