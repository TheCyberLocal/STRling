record_version: 2.0.0
title: Authoritative product and specification architecture
status: in_progress
objective: Establish one durable STRling product definition, authoring and compiler responsibility hierarchy, specification authority and versioning model, and canonical vocabulary without changing language or compiler runtime behavior.
scope:
