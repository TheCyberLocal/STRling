      status: planned
      evidence: []
    - name: Reconcile authoritative documentation
      status: planned
      evidence: []
    - name: Architecture consistency certification
      status: planned
      evidence: []
    - name: Completion and canonical-contract readiness
      status: planned
      evidence: []
