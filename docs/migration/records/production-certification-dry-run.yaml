change_classification:
    semantic_change:
        level: intentional-correction
        evidence:
            - Exact-runtime and production-certification tooling verifies existing language, profile, target, adapter, and standard-library authority; it does not define new semantics.
            - Registered standard-library semantic projections retain identical outcomes while renewing the exact authenticated runtime and source identities on which their certification depends.
    public_api_change:
        level: intentional-correction
        evidence:
            - Python and TypeScript expose generated standard-library source-identity constants whose values mechanically change when the exact runtime evidence graph is renewed; exported helper names, types, signatures, and behavior are unchanged.
        affected_surfaces:
            - python-public-api
            - typescript-public-api
    schema_change:
        level: additive
        evidence:
            - Adds an engineering-only exact-runtime reconstruction manifest consumed by certification tooling; no language, protocol, artifact, or public package schema changes.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Compiler and product diagnostic contracts are unchanged; projection failures now retain structured internal planning details for certification diagnosis.
    target_behavior_change:
        level: intentional-correction
        evidence:
            - PCRE2, ECMAScript, and Python profiles, serializers, runtime expectations, and semantic outcomes remain unchanged; governed target evidence is corrected to use reproducible exact runtime artifacts and current input digests.
    architecture_change:
        level: intentional-correction
        evidence:
            - Replaces unreconstructible copied runtime binary digests with one fail-closed source/build/artifact manifest and a verifier proving exact official sources, byte identities, runtime identities, and repeat-build reproducibility.
            - Adds the canonical Release/all/no-reuse aggregate harness and structured production-candidate artifact without introducing publication authority.
            - Routes the governed Full performance operation from the WSL aggregate controller into the already-authorized native-Windows certification path required by the active baseline; WSL remains ineligible to produce native performance evidence.
            - Binds Cargo and its child compiler to the same fingerprinted Rust 1.75 toolchain and gives the performance runner an explicit production-optimized release profile, eliminating the stale cross-toolchain target reuse exposed by the clean P18-T06 build.
    generated_output_change:
        level: intentional-correction
        evidence:
            - Registered cross-engine, standard-library, portability, surface, public-contract, and Gradle verification outputs are regenerated only through their canonical producers after legitimate exact-runtime identity renewal.
            - Joined migration, deep-quality, and performance/resource identity producers renew only current-source hashes and dependent fingerprints. Current performance artifact rebinding requires native Full comparison against unchanged measurements and budgets.
            - The performance-runner lock is regenerated by Cargo to the Rust-1.75-compatible dependency set already used by the canonical root package; no dependency version or checksum is hand-edited.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Exact runtime reconstruction and semantic certification
      command: python3 -m tooling.exact_runtime_toolchains --check --json && python3 -m tooling.python_re_runtime_certification --json --repeat-runs 2 && python3 -m tooling.shared_cross_engine_corpus --verify-evidence --json && python3 -m tooling.stdlib_runtime_certification --verify-evidence --json
      expected_result: Official-source PCRE2 10.42/10.43 and CPython 3.11.15 artifact hashes, runtime identities, repeated semantics, shared 100-application evidence, and 585 standard-library applications pass exactly.
    - name: Generated, public-contract, architecture, governance, and documentation integrity
      command: ./strling generate --check --json && ./strling contracts --check --json && python3 tooling/core_contract_validation.py && ./strling governance --json && python3 tooling/documentation_integrity.py --json && git diff --check
      expected_result: Every enforced registered artifact and public surface matches, all architecture and governance rules pass, documentation is intact, and no uncontrolled drift remains.
    - name: Authoritative production certification
      command: npm run test:all -- --profile release --all --no-reuse --plain
      expected_result: A clean detached no-reuse Release/all run produces the canonical production-candidate artifact with zero failed, zero unavailable, and zero incomplete required operations and publication_authorized=false.
checkpoints:
    - name: Scope and starting-boundary lock
      status: passed
      evidence:
          - check: Exact repository and environment boundary
            result: passed
            details: P18-T06 started on architecture/v4 at clean SHA 1d1abf871efb60e56cdfc80c4cf7aa0b107acdac with more than 439 GiB free, healthy Docker Desktop 4.88.0/Engine 29.7.2, healthy Ubuntu 24.04 WSL2, no stale certification process, and preserved P18-T05 supply-chain evidence.
    - name: Environment reconstruction and defect isolation
      status: passed
      evidence:
          - check: First clean no-reuse attempt
            result: passed
            details: The first complete clean generator attempt isolated a release-JDK Kotlin verification digest mismatch and unreconstructible exact-runtime binary fingerprints; every other enforced generated family passed.
          - check: Reconstructible exact runtimes
            result: passed
            details: Official PCRE2 tags reconstruct the earlier governed exact 8-bit shared libraries. Official CPython 3.11.15 source archive SHA-256 272179ddd9a2e41a0fc8e42e33dfbdca0b3711aa5abf372d3f2d51543d09b625 now produces two byte-identical fixed-recipe executables at SHA-256 89656b63d58055a8f200f46d52986610f944b5bcff076a7b60521fc6068422cc.
    - name: Minimal corrections and focused proof
      status: passed
      evidence:
          - check: Exact engine and generated-evidence proof
            result: passed
            details: Exact-runtime verification, Python semantic certification, shared 20-case/100-application certification, standard-library 117-record/585-application certification, the zero-unresolved portability matrix, core contracts, all 26 public surfaces, and the complete enforced generated-artifact check pass.
          - check: Release-JDK artifact identity
            result: passed
            details: Gradle's canonical verification-metadata producer records the exact Temurin 11 JVM artifact digest while retaining prior trusted identity; the Kotlin public API surface passes without package or API change.
          - check: Governed dependent identity renewal
            result: passed
            details: The exact-runtime producer renews and verifies both rewrite strategy fingerprints, their current diagnostic, contract, documentation, test, and LSP evidence consumers, and the LSP manifest/catalog identities. The new rewrite-strategy-identity-projections family is enforced in the generated-artifact registry; historical migration records remain immutable.
          - check: Governance scanner liveness
            result: passed
            details: Architecture fitness now evaluates Git-visible repository candidates instead of recursively probing ignored dependency trees. Governance completes deterministically, all enforced architecture rules pass, and the inherited implementation-derived fixture rule remains explicitly transitional.
          - check: Clean Rust performance producer reconstruction
            result: passed
            details: A brand-new target directory proved the P18-T04 runner lock could not compile with its recorded Rust 1.75 and that prior artifact production had reused newer-compiler target state. Cargo regenerated the runner lock to the canonical Rust-1.75-compatible dependency set, Cargo now binds its child rustc to the fingerprinted binary, and the explicit release profile uses one codegen unit with thin LTO. The clean exact-1.75 artifact passed ten of ten focused comparisons for the two previously blocked coordinates without changing any measurement, budget, threshold, operation, support claim, or semantic source. Full certification now authenticates governed quiescence immediately before every randomized measurement coordinate instead of relying on one snapshot for a roughly ten-minute matrix.
