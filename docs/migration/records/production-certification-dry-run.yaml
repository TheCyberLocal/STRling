change_classification:
    semantic_change:
        level: intentional-correction
        evidence:
            - Exact-runtime and production-certification tooling verifies existing language, profile, target, adapter, and standard-library authority; it does not define new semantics.
            - Registered standard-library semantic projections retain identical outcomes while renewing the exact authenticated runtime and source identities on which their certification depends.
            - The normalization preflight correction changes only lookup and path-construction mechanics; focused properties, exact ordered diagnostic paths, the complete Rust all-target suite, and the full target/adapter matrix preserve canonical behavior.
    public_api_change:
        level: intentional-correction
        evidence:
            - Python and TypeScript expose generated standard-library source-identity constants whose values mechanically change when the exact runtime evidence graph is renewed; exported helper names, types, signatures, and behavior are unchanged.
        affected_surfaces:
            - python-public-api
            - typescript-public-api
    schema_change:
        level: additive
        evidence:
            - Adds an engineering-only exact-runtime reconstruction manifest consumed by certification tooling; no language, protocol, artifact, or public package schema changes.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Compiler and product diagnostic contracts are unchanged; projection failures now retain structured internal planning details for certification diagnosis, and the optimized normalization preflight preserves exact ordered diagnostic paths under a dedicated regression test.
    target_behavior_change:
        level: intentional-correction
        evidence:
            - PCRE2, ECMAScript, and Python profiles, serializers, runtime expectations, and semantic outcomes remain unchanged; governed target evidence is corrected to use reproducible exact runtime artifacts and current input digests.
    architecture_change:
        level: intentional-correction
        evidence:
            - Replaces unreconstructible copied runtime binary digests with one fail-closed source/build/artifact manifest and a verifier proving exact official sources, byte identities, runtime identities, and repeat-build reproducibility.
            - Adds the canonical Release/all/no-reuse aggregate harness and structured production-candidate artifact without introducing publication authority.
            - Routes the governed Full performance operation from the WSL aggregate controller into the already-authorized native-Windows certification path required by the active baseline; WSL remains ineligible to produce native performance evidence.
            - Binds Cargo and its child compiler to the same fingerprinted Rust 1.75 toolchain and gives the performance runner an explicit production-optimized release profile, eliminating the stale cross-toolchain target reuse exposed by the clean P18-T06 build.
    generated_output_change:
        level: intentional-correction
        evidence:
            - Registered cross-engine, standard-library, portability, surface, public-contract, and Gradle verification outputs are regenerated only through their canonical producers after legitimate exact-runtime identity renewal.
            - Joined migration, deep-quality, and performance/resource identity producers renew only current-source hashes and dependent fingerprints. Current performance artifact rebinding requires native Full comparison against unchanged measurements and budgets.
            - The performance-runner lock is regenerated by Cargo to the Rust-1.75-compatible dependency set already used by the canonical root package; no dependency version or checksum is hand-edited.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Exact runtime reconstruction and semantic certification
      command: python3 -m tooling.exact_runtime_toolchains --check --json && python3 -m tooling.python_re_runtime_certification --json --repeat-runs 2 && python3 -m tooling.shared_cross_engine_corpus --verify-evidence --json && python3 -m tooling.stdlib_runtime_certification --verify-evidence --json
      expected_result: Official-source PCRE2 10.42/10.43 and CPython 3.11.15 artifact hashes, runtime identities, repeated semantics, shared 100-application evidence, and 585 standard-library applications pass exactly.
    - name: Generated, public-contract, architecture, governance, and documentation integrity
      command: ./strling generate --check --json && ./strling contracts --check --json && python3 tooling/core_contract_validation.py && ./strling governance --json && python3 tooling/documentation_integrity.py --json && git diff --check
      expected_result: Every enforced registered artifact and public surface matches, all architecture and governance rules pass, documentation is intact, and no uncontrolled drift remains.
    - name: Authoritative production certification
      command: npm run test:all -- --profile release --all --no-reuse --plain
      expected_result: A clean detached no-reuse Release/all run produces the canonical production-candidate artifact with zero failed, zero unavailable, and zero incomplete required operations and publication_authorized=false.
