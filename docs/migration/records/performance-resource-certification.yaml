            result: passed
            details: Clean checkpoint b276595b1f8db7f1eb74307ccf09c174fa10dced passed formal native-Windows qualification with unchanged environment fingerprint 8e8df6c473faa50d81d4b70d8d1711b0d00e276e38db415b8ae3c75480d083ce and quiescence rates of 78 selected-busy, 78 selected interrupt/DPC, and 818 system-busy basis points. The single governed calibration then failed closed after five repetitions with batch-duration-minimum for latency:end-to-end / fixture:simply-common; no manifest, evidence, budget, or baseline file was written. The selector accepted one pre-warmup duration against the existing two-millisecond safety target, so a single cold or interrupted probe could freeze a count whose later repetition median fell below the unchanged one-millisecond minimum. A separately conditioned one-process diagnostic selected batch 3 and retained all 64 raw durations at or above 2,222,900 nanoseconds with a 2,353,800-nanosecond median, confirming the operation itself can satisfy the frozen rule. Runner 1.2.0 now requires two consecutive probes at the same candidate count to reach the existing target; a faster confirmation continues the same proportional selection. The exact 16 selected-batch warmups, 64 samples, 4,096 maximum, two-millisecond selection target, one-millisecond accepted median, and all stability/budget ceilings remain unchanged. Future failures include the selected count and all repetition medians. This is batch-selection validation, not partial preconditioning or additional measured work.
          - check: Confirmed-batch calibration and editor-interaction defect investigation
            result: passed
            details: Clean checkpoint 8ec7b8aea57c29a57f7ae137bc8d053f8f506afc qualified the unchanged native-Windows environment fingerprint 8e8df6c473faa50d81d4b70d8d1711b0d00e276e38db415b8ae3c75480d083ce with CPU 20 / CPU-set 276 and quiescence rates of 155 selected-busy, 78 selected interrupt/DPC, and 754 system-busy basis points. Its single governed calibration failed closed without writing a baseline when latency:editor-interaction / fixture:semantic-large exceeded the unchanged 1,800-second runner safety timeout on a later repetition at the frozen batch count of one. A governed one-warmup/one-sample diagnostic measured one projection at 19,697,291,700 nanoseconds, explaining roughly 26 minutes of intrinsic work for 16 warmups plus 64 samples before ordinary variance. Inspection proved that rewrite-action projection invoked whole-program prerequisite validation and node lookup for all 2,049 AST nodes although this fixture contains no repeat nodes and therefore cannot yield the sole optional rewrite strategy. The semantic-neutral correction rejects non-repeat shapes before entering certified rewrite evaluation; repeat-node certification, every projected result, the 54-coordinate workload, and all thresholds, ceilings, warmups, samples, batching rules, and timeouts remain unchanged. The task scope permits exactly core/src/editor_intelligence.rs and its focused editor test for this correction while rejecting every other undeclared core source path.
