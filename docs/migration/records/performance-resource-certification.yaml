        - tooling/tests/test_performance_resource_certification.py
        - tooling/tests/test_performance_resource_certification_architecture.py
    permitted_generated_changes:
        - binding-support-certification-evidence
        - target-adapter-certification-matrices
    expected_generated_outputs: []
    required_verification_levels:
        - contract
        - unit
        - integration
        - quality
        - certification
    bounded_exemptions: []
change_classification:
    semantic_change:
        level: none
        evidence:
            - Benchmarks and resource checks observe behavior delegated by existing specifications and contracts; they cannot define or revise language meaning, diagnostics, portability, lowering, or serialization.
    public_api_change:
        level: none
        evidence:
            - The proposed Rust benchmark executable is publish-false verification infrastructure and no package, binding, compiler-protocol, or consumer API changes.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - A new engineering-only schema will govern benchmark manifests, environment-bound baselines, comparisons, and certification results; no product or protocol schema changes.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Existing diagnostics and resource-exhaustion results are measured read-only and remain unchanged.
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, lowerers, serializers, engine harnesses, and runtime performance claims remain unchanged and read-only.
    architecture_change:
        level: additive
        evidence:
            - Adds one verification-only producer and profile route for authored fixtures, environment fingerprints, statistical baselines, comparisons, and resource evidence.
    generated_output_change:
        level: none
        evidence:
            - CP3 changes no registered generated source or output. CP4 profile routing will revise this declaration and require exact registry regeneration of binding-support evidence and target-adapter certification matrices only after completed Full-profile evidence exists.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Performance schema, fixture, baseline, and comparison contract
      command: python3 -m unittest tooling.tests.test_performance_resource_certification -v
      expected_result: Authored operations and fixtures, exact environment identity, warmups and samples, robust statistics, hard and informational metrics, regression budgets, absolute ceilings, and explicit baseline updates validate and fail closed under controlled mutation.
    - name: Verification-only architecture and ownership
      command: python3 -m unittest tooling.tests.test_performance_resource_certification_architecture tooling.tests.test_quality -v && python3 tooling/governance.py
      expected_result: The producer imports no product implementation or network client, invokes only authenticated verification entrypoints, cannot change resource limits or product authority, and rejects unsupported environment comparisons.
    - name: Controlled latency, memory, size, overhead, and resource execution
      command: python3 -m tooling.performance_resource_certification --profile pull-request --json && python3 -m tooling.performance_resource_certification --profile full --json
      expected_result: Deterministic bounded fixtures produce complete measurements, robust statistics, environment identities, comparisons, resource-limit results, and truthful unavailable dispositions; governed hard regressions or ceilings fail certification.
    - name: Repository profiles and clean integration
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: Local retains fast contract proof, Pull Request adds deterministic controlled-regression and resource checks, Full and Release add live release-build performance and memory certification on matching fingerprinted environments, and the repository remains clean.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Clean task start and campaign reconciliation
            result: passed
            details: The task starts from clean architecture/v4 commit f4f9cc03cc1277d99a65470ef911e9bfbdee78eb after the previous deep-quality task closed. Notion activates this task with normalized CP1 through CP4 and FINAL children.
          - check: Existing performance denominator
            result: passed
            details: The repository has three duplicated target-runtime certification tests that time analysis/planning, lowering, and serialization in unoptimized Rust test builds with 16 warmups, 128 samples, median-only checks, and broad 10,000/5,000/5,000 microsecond ceilings. It has no central performance producer, environment fingerprint, baseline distribution, comparison contract, memory or artifact-size measurement, or profile-routed performance evidence.
          - check: Existing resource denominator
            result: passed
            details: Sixty-one MAX constants across searched core, interop, editor, and verification paths express source/request/response size, semantic node/depth, analysis, lowering, serialization, editor, explanation, and result bounds. Exact/one-over and property tests cover important kernel limits, but no central evidence inventory authenticates their values and tests.
          - check: Operation and fixture matrix
            result: passed
            details: The task will separately measure semantic and legacy frontends, Simply/kernel request handling, normalization and analysis, capability and portability work, three target lowering and serialization paths, end-to-end compilation, CLI startup and commands, editor interactions, canonical interop request/response, supported-host overhead where governed toolchains are available, peak memory, binary/library size, and bounded pathological/resource cases over tiny, common, large, and pathological fixture classes.
          - check: Measurement and profile boundary
            result: passed
            details: CP2 must freeze robust distribution statistics, exact environment and fixture identities, noise controls, hard versus informational metrics, measured regression budgets and absolute ceilings, and explicit baseline updates. Local is contract-only; Pull Request owns deterministic resource and controlled-regression proof; Full/Release own live optimized measurements on matching fingerprinted environments. Cross-environment numbers may be recorded but never compared as equivalent.
          - check: Ownership and non-goals
            result: passed
            details: Product semantics, core implementation, diagnostics, target behavior, public APIs, packages, dependencies, support tiers, target regex-engine runtime performance, publication, release, upload, push, and external regex-engine research are forbidden. Adapter measurements observe transport and host overhead only and cannot become semantic or support authority.
    - name: Verification design and evidence contract
      status: passed
      evidence:
          - check: Versioned schema and explicit authority states
            result: passed
            details: The engineering-only Draft 2020-12 schema separately governs authored manifests, fixture manifests, resource inventories, environment-bound baselines, and certification evidence. The positive evidence is explicitly synthetic-contract-fixture at zero commit identity and denies live-measurement and baseline authority.
          - check: Closed operation and fixture denominator
            result: passed
            details: Twenty-two ordered operations comprise seventeen planned latency, peak-RSS, and artifact-size metrics plus five active existing resource-check groups. Twelve deterministic recipes cover tiny, common, large, and pathological-but-bounded Semantic, legacy-regex, Simply, and interop inputs. At the CP2 commit, the manifest fingerprint is 22893a9a7a6ddf82bd8ea8585e8993e34ca957b75823a38cd7db0c6c62d48be2 and fixture-manifest fingerprint is 184349861fd4b2370d68b620c9dd3f5dbd1cd8b489f4ea9ee96f2b0d16f88a64.
          - check: Authenticated resource inventory
            result: passed
            details: Nine families inventory 56 existing core, target, editor, interop, and explanation declarations and bind them to nineteen exact test-source fingerprints. Every source expression and test hash validates read-only; inventory fingerprint is e1f5c1a3a1163cab3432b7e63115e09559939f5bc8e4ce41ca3a70a21ee0d5f8.
          - check: Statistical and environment contract
            result: passed
            details: The policy locks 16 warmups, 64 samples, five baseline repetitions, deterministic randomized order seed 1804, one worker, median, nearest-rank p95, and MAD. Relative budgets derive from six MADs with 1000-basis-point floor and 4000-basis-point stability ceiling; relative MAD above 500 basis points is ineligible for a hard baseline. Hard metrics require explicit absolute ceilings. Environment compatibility is exact across OS/version, architecture, CPU/count, memory, Rust/Cargo, target, release profile, and feature set.
          - check: Controlled fail-closed proof
            result: passed
            details: Fourteen focused tests pass. Just-inside and exact-boundary comparisons pass; one-unit relative and absolute regressions fail. Denominator/profile shrinkage, premature activation, stale manifest/fixture/inventory/test/sample/statistic/environment fingerprints, unstable or weakened budgets, duplicate measurements, implicit baseline updates, and synthetic-evidence promotion fail closed.
          - check: Implementation handoff boundary
            result: passed
            details: Performance operations deliberately remain planned and carry no numeric measurement. CP3 owns a release-build producer, five stable calibration repetitions, live environment and source identity, measured budget and ceiling activation, memory/artifact execution, resource commands, and local proof. No live baseline has been fabricated.
    - name: Minimal implementation and local proof
      status: in_progress
      evidence:
          - check: Verification-only release producer
            result: passed
            details: A standalone publish-false Rust 1.75 crate with a governed lockfile executes 50 latency coordinates, three memory workloads, and one fixture-free artifact aggregate through public canonical kernel, interop, and supported Rust-host surfaces. Timed values are black-boxed nanoseconds; product sources and public APIs are unchanged.
          - check: Fixture realization and contract reconciliation
            result: passed
            details: All 48 non-process latency fixture coordinates and both CLI startup coordinates execute successfully. The exact accepted Semantic wrapper boundary is corrected from 128 to 127 because the root occupies depth slot 128; 128 wrappers remain the exact one-over rejection. The reviewed timing correction selects per-coordinate batches against a two-millisecond safety target, requires each repetition median to reach one millisecond, authenticates raw durations and exact counts, and requires Full/Release reuse. The reviewed environment correction selects logical CPU 20, authenticates the single-CPU policy plus effective affinity/cpuset, and makes both controller and runner fail closed before measurement if it differs. Current pre-calibration manifest fingerprint is 10462c638152216c4d641fb56c23877791c714baa2f5e6c1737ea7097eb040c8 and fixture fingerprint is 6a8e4aad41dd1b00c8e4bf441ea929a21259737f7ff7aa96b57f465e741c40c4.
          - check: Five-repetition baseline and activation logic
            result: passed
            details: The controller preserves five explicit repetitions, 64 post-warmup normalized nanosecond samples plus 64 raw batch durations per latency repetition, and one isolated byte sample per memory/size repetition. Calibration selects one batch count per coordinate and reuses it across repetitions; Full/Release reuse the authenticated baseline count. Representative distributions contain five repetition medians. Informational comparisons remain visible trends but cannot independently fail aggregate certification. Complete coordinate, environment, source, sample/batch/statistic, derived-budget, absolute-ceiling, fixture-free, atomic-activation, and explicit-replacement checks fail closed.
          - check: Focused Local and Pull Request proof
            result: passed
            details: Nineteen focused contract/architecture tests cover complete five-repetition orchestration, exact batch reuse and normalization, minimum-duration rejection, informational non-blocking disposition, governed atomic-write confinement, exact affinity compatibility, and unavailable-CPU rejection. The Rust runner parser test passes, unpinned execution with an expected CPU fails before measurement, pinned CPU 20 execution reports effective affinity/cpuset 20, and the performance controller's Local and Pull Request profiles pass. The repository-wide Local profile remains unavailable in this purpose-built image where its unrelated formatter and language toolchains are absent.
          - check: Reviewed Linux affinity control
            result: passed
            details: Investigation reproduced the 6.1-7.8 ms spread across unpinned clean processes, found no deterministic warmup drift or Python-specific product regression, and made fixed-vCPU repetitions stable below the unchanged 500-basis-point limit. The correction applies and verifies logical CPU 20 for the current Ubuntu 24.04 / WSL2 / Intel Core i9-14900HX environment, records it in the authenticated environment, and leaves the Balanced host power plan and every numeric performance contract unchanged.
          - check: Live baseline status
            result: not_run
            details: No Windows timing is promoted. Full returns unavailable while the baseline remains planned. Five stable calibrations, active measured budgets, and exact Linux x86_64 environment/source identity remain required before CP3 can close.
    - name: Integration and certification
      status: planned
      evidence: []
    - name: Completion and next-task readiness
      status: planned
      evidence: []
