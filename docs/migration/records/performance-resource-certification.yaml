record_version: 2.0.0
title: Performance and resource-budget certification
status: in_progress
objective: Establish deterministic, statistically defensible, machine-readable certification for STRling compiler latency and throughput, memory and artifact size, canonical interop and supported-host overhead, and pathological resource ceilings without creating language semantics, target-runtime performance promises, or unsupported cross-environment comparisons.
scope:
    diff:
        base: f4f9cc03cc1277d99a65470ef911e9bfbdee78eb
        head: working-tree
    allowed_paths:
        - .github/workflows/ci.yml
        - core/Cargo.toml
        - core/cli/strling-performance.rs
        - core/tests/*runtime_certification.rs
        - core/tests/performance_resource_certification.rs
        - docs/index.md
        - docs/migration/ledger.md
        - docs/migration/performance-resource-certification.md
        - docs/migration/records/performance-resource-certification.yaml
        - docs/toolchains.md
        - governance/change-control.json
        - governance/generated-artifacts.json
        - governance/schemas/performance-resource-certification.schema.json
        - tests/certification/performance-resource/1.0/**
        - tests/certification/product/1.0/**
        - tests/adapters/binding-support-4.0/evidence.json
        - tests/certification/target-adapter/1.0/evidence.json
        - tests/certification/target-adapter/1.0/evidence.md
        - toolchain.json
