change_classification:
    semantic_change:
        level: none
        evidence:
            - Benchmarks and resource checks observe behavior delegated by existing specifications and contracts; they cannot define or revise language meaning, diagnostics, portability, lowering, or serialization.
            - The editor-interaction correction skips certified optional-rewrite requests only for non-repeat nodes, which cannot satisfy the strategy's first proof condition; eligible-node certification and projected evidence remain unchanged.
            - The semantic-frontend correction transfers its freshly lowered owned tree into the same normalization algorithm; borrowed callers still clone once at the unchanged public boundary and all canonical results and failures remain identical.
            - The evidence-proven normalization correction removes only an immediately discarded duplicate root clone; canonical output and every normalization rule remain unchanged.
    public_api_change:
        level: none
        evidence:
            - The proposed Rust benchmark executable is publish-false verification infrastructure and no package, binding, compiler-protocol, or consumer API changes.
            - The task-scoped editor projection correction changes no signature, type, field, protocol, projected result, or consumer-visible contract.
            - The internal consuming normalization entry point is crate-private; the public borrowed API and every externally visible type and signature remain unchanged.
            - The task-scoped normalization correction changes no signature, type, field, protocol, or consumer-visible contract.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - The engineering-only schema governs benchmark manifests, host reservation attestations, environment-bound baselines, comparisons, and certification results; no product or protocol schema changes.
            - Native Windows execution-resource evidence records successful fail-closed HighQoS execution-speed enforcement for the controller, conditioner, and every timed runner.
            - The current native-Windows path fingerprints Core Reservation query state while requiring the strongest documented controls the exact client platform can provision; legacy soft-affinity and temporary reservation-gate documents remain historical evidence.
            - The structured performance result envelope now repeats its governed profile operation identity, status, and checks so the canonical repository router can authenticate the producer without interpreting producer-private fields.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Existing diagnostics and resource-exhaustion results are measured read-only and remain unchanged.
    target_behavior_change:
        level: none
        evidence:
            - Target profiles, lowerers, serializers, engine harnesses, and runtime performance claims remain unchanged and read-only.
    architecture_change:
        level: additive
        evidence:
            - Adds one verification-only producer and profile route for authored fixtures, environment fingerprints, statistical baselines, comparisons, and resource evidence.
    generated_output_change:
        level: compatible
        evidence:
            - CP3 changed no registered generated source or output. CP4 adds the completed performance producer to toolchain.json, then regenerates exactly the registry-owned binding-support evidence and target-adapter certification matrices from that changed authority.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Performance schema, fixture, baseline, and comparison contract
      command: python -m unittest tooling.tests.test_performance_windows tooling.tests.test_performance_resource_certification -v
      expected_result: Authored operations and fixtures, exact environment identity, warmups and samples, robust statistics, hard and informational metrics, regression budgets, absolute ceilings, and explicit baseline updates validate and fail closed under controlled mutation.
    - name: Verification-only architecture and ownership
      command: python3 -m unittest tooling.tests.test_performance_resource_certification_architecture tooling.tests.test_quality -v && python3 tooling/governance.py
      expected_result: The producer imports no product implementation or network client, invokes only authenticated verification entrypoints, cannot change resource limits or product authority, and rejects unsupported environment comparisons.
    - name: Native host environment qualification
      command: python -m tooling.performance_resource_certification qualify --json
      expected_result: A clean native bare-metal Linux or Windows x86_64 host passes only with exact platform-native CPU-20 placement, unlimited quota, authenticated topology/clock/power state, deterministic pre-measurement quiescence, and fingerprinted toolchains and release artifacts; WSL2 and unauthenticated guest or hypervisor claims fail before timing. Windows additionally requires an authenticated fixed 100-percent min/max processor state with boost disabled, successful HighQoS execution-speed enforcement, a one-bit hard affinity mask plus exact process-default CPU-set assignment, and stable process-targeted allocation-state evidence in the controller, conditioner, and every timed runner.
    - name: Controlled latency, memory, size, overhead, and resource execution
      command: python3 -m tooling.performance_resource_certification --profile pull-request --json && python3 -m tooling.performance_resource_certification --profile full --json
      expected_result: Deterministic bounded fixtures produce complete measurements, robust statistics, environment identities, comparisons, resource-limit results, and truthful unavailable dispositions; governed hard regressions or ceilings fail certification.
    - name: Repository profiles and clean integration
      command: ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: Local retains fast contract proof, Pull Request adds deterministic controlled-regression and resource checks, Full and Release add live release-build performance and memory certification on matching fingerprinted environments, and the repository remains clean.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Clean task start and campaign reconciliation
            result: passed
            details: The task starts from clean architecture/v4 commit f4f9cc03cc1277d99a65470ef911e9bfbdee78eb after the previous deep-quality task closed. Notion activates this task with normalized CP1 through CP4 and FINAL children.
          - check: Existing performance denominator
            result: passed
            details: The repository has three duplicated target-runtime certification tests that time analysis/planning, lowering, and serialization in unoptimized Rust test builds with 16 warmups, 128 samples, median-only checks, and broad 10,000/5,000/5,000 microsecond ceilings. It has no central performance producer, environment fingerprint, baseline distribution, comparison contract, memory or artifact-size measurement, or profile-routed performance evidence.
          - check: Existing resource denominator
            result: passed
            details: Sixty-one MAX constants across searched core, interop, editor, and verification paths express source/request/response size, semantic node/depth, analysis, lowering, serialization, editor, explanation, and result bounds. Exact/one-over and property tests cover important kernel limits, but no central evidence inventory authenticates their values and tests.
          - check: Operation and fixture matrix
            result: passed
            details: The task will separately measure semantic and legacy frontends, Simply/kernel request handling, normalization and analysis, capability and portability work, three target lowering and serialization paths, end-to-end compilation, CLI startup and commands, editor interactions, canonical interop request/response, supported-host overhead where governed toolchains are available, peak memory, binary/library size, and bounded pathological/resource cases over tiny, common, large, and pathological fixture classes.
          - check: Measurement and profile boundary
            result: passed
            details: CP2 must freeze robust distribution statistics, exact environment and fixture identities, noise controls, hard versus informational metrics, measured regression budgets and absolute ceilings, and explicit baseline updates. Local is contract-only; Pull Request owns deterministic resource and controlled-regression proof; Full/Release own live optimized measurements on matching fingerprinted environments. Cross-environment numbers may be recorded but never compared as equivalent.
          - check: Ownership and non-goals
            result: passed
            details: Product semantics, diagnostics, target behavior, public APIs, packages, dependencies, support tiers, target regex-engine runtime performance, publication, release, upload, push, and external regex-engine research are forbidden. Core implementation is read-only except for an evidence-proven, semantic-neutral defect on the exact unstable performance path; this amendment permits only core/src/normalization.rs and still rejects every other undeclared core source path. Adapter measurements observe transport and host overhead only and cannot become semantic or support authority.
    - name: Verification design and evidence contract
      status: passed
      evidence:
          - check: Versioned schema and explicit authority states
            result: passed
            details: The engineering-only Draft 2020-12 schema separately governs authored manifests, fixture manifests, resource inventories, environment-bound baselines, and certification evidence. The positive evidence is explicitly synthetic-contract-fixture at zero commit identity and denies live-measurement and baseline authority.
          - check: Closed operation and fixture denominator
            result: passed
            details: Twenty-two ordered operations comprise seventeen planned latency, peak-RSS, and artifact-size metrics plus five active existing resource-check groups. Twelve deterministic recipes cover tiny, common, large, and pathological-but-bounded Semantic, legacy-regex, Simply, and interop inputs. At the CP2 commit, the manifest fingerprint is 22893a9a7a6ddf82bd8ea8585e8993e34ca957b75823a38cd7db0c6c62d48be2 and fixture-manifest fingerprint is 184349861fd4b2370d68b620c9dd3f5dbd1cd8b489f4ea9ee96f2b0d16f88a64.
          - check: Authenticated resource inventory
            result: passed
            details: Nine families inventory 56 existing core, target, editor, interop, and explanation declarations and bind them to nineteen exact test-source fingerprints. Every source expression and test hash validates read-only; inventory fingerprint is e1f5c1a3a1163cab3432b7e63115e09559939f5bc8e4ce41ca3a70a21ee0d5f8.
          - check: Statistical and environment contract
            result: passed
            details: The policy locks 16 warmups, 64 samples, five baseline repetitions, deterministic randomized order seed 1804, one worker, median, nearest-rank p95, and MAD. Relative budgets derive from six MADs with 1000-basis-point floor and 4000-basis-point stability ceiling; relative MAD above 500 basis points is ineligible for a hard baseline. Hard metrics require explicit absolute ceilings. Environment compatibility is exact across OS/version, architecture, CPU/count, memory, Rust/Cargo, target, release profile, and feature set.
          - check: Controlled fail-closed proof
            result: passed
            details: Fourteen focused tests pass. Just-inside and exact-boundary comparisons pass; one-unit relative and absolute regressions fail. Denominator/profile shrinkage, premature activation, stale manifest/fixture/inventory/test/sample/statistic/environment fingerprints, unstable or weakened budgets, duplicate measurements, implicit baseline updates, and synthetic-evidence promotion fail closed.
          - check: Implementation handoff boundary
            result: passed
            details: Performance operations deliberately remain planned and carry no numeric measurement. CP3 owns a release-build producer, five stable calibration repetitions, live environment and source identity, measured budget and ceiling activation, memory/artifact execution, resource commands, and local proof. No live baseline has been fabricated.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: Verification-only release producer
            result: passed
            details: A standalone publish-false Rust 1.75 crate with a governed lockfile executes 50 latency coordinates, three memory workloads, and one fixture-free artifact aggregate through public canonical kernel, interop, and supported Rust-host surfaces. Timed values are black-boxed nanoseconds; product sources and public APIs are unchanged.
          - check: Fixture realization and contract reconciliation
            result: passed
            details: All 48 non-process latency fixture coordinates and both CLI startup coordinates execute successfully. The exact accepted Semantic wrapper boundary is corrected from 128 to 127 because the root occupies depth slot 128; 128 wrappers remain the exact one-over rejection. The reviewed timing correction selects per-coordinate batches against a two-millisecond safety target, requires each repetition median to reach one millisecond, authenticates raw durations and exact counts, and requires Full/Release reuse. The governed environment contract selects logical CPU 20, authenticates the actual platform-native placement and quota, and makes both controller and runner fail closed before measurement if any identity differs. The native-host prerequisite now includes bare-metal Windows without changing any numeric measurement term. Current pre-calibration manifest fingerprint is 3e3d70b987a3c2e84e0e4f2d6e9b8209fb6b84b1f2e8157bc5941c325a4a0971 and fixture fingerprint is 6a8e4aad41dd1b00c8e4bf441ea929a21259737f7ff7aa96b57f465e741c40c4.
          - check: Five-repetition baseline and activation logic
            result: passed
            details: The controller preserves five explicit repetitions, 64 post-warmup normalized nanosecond samples plus 64 raw batch durations per latency repetition, and one isolated byte sample per memory/size repetition. Calibration selects one batch count per coordinate and reuses it across repetitions; Full/Release reuse the authenticated baseline count. Representative distributions contain five repetition medians. Informational comparisons remain visible trends but cannot independently fail aggregate certification. Complete coordinate, environment, source, sample/batch/statistic, derived-budget, absolute-ceiling, fixture-free, atomic-activation, and explicit-replacement checks fail closed.
          - check: Focused Local and Pull Request proof
            result: passed
            details: Thirty-one focused contract/architecture/Windows tests cover complete five-repetition orchestration, coordinate-specific instability diagnostics, exact batch reuse and normalization, minimum-duration rejection, conditioning-identity drift, raw-observation retention, guest-firmware rejection, fixed-frequency policy mutations, exact quiescence boundaries and one-over failures, informational non-blocking disposition, atomic-write confinement, exact environment compatibility, and unavailable-CPU rejection. The Rust 1.75 runner test and native Windows release build pass; a non-calibration smoke sample independently reports group 0, logical processor 20, CPU-set 276, core 20, efficiency class 0, unlimited CPU quota, QPC at 10 MHz, and actual execution only on processor 20. Local contract evidence fingerprint c0703ede71c493293c33305df8b9e70b5e45209c21af2fa60b9ec713d857ee79 and Pull Request resource/controlled-regression evidence fingerprint 069a50a47d3e3198fb6f4e199a1cd9426724656da2862cdcb5b5c7fbf23f72c9 pass on the native Windows implementation checkpoint worktree.
          - check: Reviewed Linux affinity control
            result: passed
            details: Investigation reproduced the 6.1-7.8 ms spread across unpinned clean processes, found no deterministic warmup drift or Python-specific product regression, and made fixed-guest-vCPU repetitions stable below the unchanged 500-basis-point limit. The correction applies and verifies WSL2 guest logical CPU 20 for the current Ubuntu 24.04 / Intel Core i9-14900HX environment and leaves the Balanced host power plan and every numeric performance contract unchanged. Follow-up differential evidence proves this guest-level control is necessary but not sufficient to authenticate host hardware-thread placement.
          - check: Authoritative environment qualification controls
            result: passed
            details: The dedicated-Linux path retains its existing exclusive cpuset/isolation controls. The initial native-Windows path rejects WSL/guests, 32-bit compatibility, unrecognized CPU-set placement, multiple processor groups in this versioned path, CPU-rate-limited jobs, battery power or saver, unavailable QPC/power identity, and material pre-measurement noise. Both controller and every runner apply and authenticate the hard affinity mask plus CPU set; the runner records actual group/processor observations. This initial control intentionally recorded exclusivity, housekeeping exclusion, and unrelated-workload exclusion as false pending evidence. A two-second one-shot gate rejects selected-CPU busy time above 500 basis points, selected interrupt/DPC time above 100 basis points, or whole-host busy time above 1500 basis points. Raw observations are retained while placement/quota/timer/power/policy identity remains exact. Python/Rust/Cargo and all release artifacts are hashed. The later canonical Full/preemption evidence in CP4 demonstrates that this soft-affinity design is insufficient and supersedes it with process-targeted Core Reservation without changing any benchmark threshold, ceiling, warmup, sample, batching, repetition, or product behavior.
          - check: Native Windows qualification handshake
            result: passed
            details: A focused non-calibration handshake on Windows build 26200.9168 / Intel Core i9-14900HX / 64 GiB authenticates one 32-processor group, 24 physical cores, selected group 0 logical processor 20, CPU-set 276, physical core 20, efficiency class 0, exact affinity [20], no Job Object CPU rate control, AC power under Balanced scheme 381b4222-f694-41f0-9685-ff5bb260df2e, QueryPerformanceCounter at 10 MHz, x86_64-pc-windows-msvc Rust 1.75, and release runner/kernel/interop artifacts. Firmware guest indicators are absent and a single two-second observation passed at 0 selected busy basis points, 0 selected interrupt basis points, and 442 system busy basis points. This handshake is qualification validation only; formal clean-checkout qualification and the single governed calibration remain pending.
          - check: Governed writer and replay differential
            result: failed
            details: The writer and replay use the same five-round loop, seeded ordering, clean child processes, Rust Instant timing, 16 warmups, 64 samples, batch selection/reuse, and guest affinity. The writer alone performed fresh release builds and environment probes before timing; the replay reused artifacts after the failed hour-long run. The original aggregate exception discarded the per-coordinate distributions before atomic output, so its exact failing coordinate is irrecoverable. Read-only host probes found process affinity [20] but actual cgroup cpuset 0-31, no CPU quota, no guest thermal/cpufreq telemetry, no WSL host-vCPU affinity attestation, and material host background exposure. Guest CPU-20 probes did not map to host CPU 20. Evidence fingerprint is 545b3f41e738fbd16da37ad41e619958039174c41ede4081327c465823a4174c.
          - check: Live baseline status
            result: failed
            details: A fresh governed five-repetition calibration from clean commit 078154cb991cef9b1a2183b8e94ad93e03946cc7 recorded environment fingerprint accbe567df0667616b44357c22bf3c3f0fcc6f96c8696f0e8c86ce8a3eeb5c3f and guest affinity [20], then failed closed with unstable-baseline before atomic activation. The fingerprint's effective_cpuset value incorrectly duplicated process affinity; the actual cgroup effective cpuset was 0-31. No baseline, manifest budget, or evidence file was written. The passing non-promoting replay cannot erase the failure or promote evidence. This remains historical non-authoritative WSL evidence. The earlier Linux-only continuation premise is withdrawn; native bare-metal Windows is eligible through the authenticated placement and one-shot quiescence path, while WSL itself remains barred.
          - check: Formal native Windows qualification
            result: passed
            details: Clean checkpoint f0a60799046c6069615c9df0f3fec684e0fb1eb2 qualified environment fingerprint f1cab8ef3a195fd58ec11a37be80bbf33fe801ac573f0c465849b614b423eaeb with group 0 logical processor 20, CPU-set 276, physical core 20, unlimited quota, QPC at 10 MHz, AC/Balanced policy, Rust 1.75, and runner/kernel/interop SHA-256 values 054e2d3c05b3e14e76dc2a6dc03127029ac58fd2a6d58196facf1e7880555fca, 6ed543f0e4e6322e3a78e6d4be634b23ab6cd9e36f72c746bd6b10f78e3fac78, and 1e1cf9570937fab4e67fd836a72fd2b14044a7f4921c1b41bff6cb16924fc19b. Its single quiescence observation passed at 156 selected-busy, 0 interrupt/DPC, and 1309 system-busy basis points.
          - check: Single native Windows calibration
            result: failed
            details: The one clean governed five-repetition calibration from f0a60799046c6069615c9df0f3fec684e0fb1eb2 failed closed without writing a baseline. The exact unstable coordinate was latency:structural-safety / fixture:semantic-pathological at 771 relative-MAD basis points, above the unchanged 500-basis-point limit, with repetition medians [971650, 991200, 1074000, 1127775, 1161025] nanoseconds. Its shuffled positions [50, 13, 22, 35, 44] rule out within-round ordering as the monotonic cause.
          - check: Native Windows frequency-policy defect investigation
            result: passed
            details: The active Balanced policy allowed a 5-percent minimum processor state and Aggressive boost. Under sustained processor-20 load, native counters ranged from 60 to 100 percent maximum frequency and 62.80 to 174.64 percent processor performance. A disposable STRling scheme now fixes min/max state at 100 percent and disables boost without modifying Balanced. Native counters then held 99-100 percent maximum frequency and 99.99-100.01 percent processor performance; ten sustained coordinate segments varied by about 2.9 percent, and a five-fresh-process coordinate-only diagnostic produced medians [1687100, 1896600, 1897200, 1880050, 1843050] nanoseconds with 92 relative-MAD basis points. Qualification fingerprints these settings and selected-processor MHz and rejects drift. A live controlled negative temporarily selected unmodified Balanced, received the required unavailable exit for the 5-percent/Aggressive settings, and restored the certification scheme in a finally block. This is an environment-control defect correction, not preconditioning or a benchmark/threshold change.
          - check: Fixed-frequency calibration and idle-state defect investigation
            result: failed
            details: The one governed five-repetition calibration from clean checkpoint eb4c87b1e34310c03f035be43d0f0f02103c9e0d qualified environment fingerprint 8e8df6c473faa50d81d4b70d8d1711b0d00e276e38db415b8ae3c75480d083ce and then failed closed without writing a baseline. The exact unstable coordinate was latency:semantic-parse / fixture:semantic-pathological at 569 relative-MAD basis points, above the unchanged 500-basis-point limit, with repetition medians [980625, 1298575, 1026925, 1274500, 1228725] nanoseconds and shuffled positions [39, 35, 17, 50, 53]. A predetermined five-process coordinate diagnostic retained the exact environment and batch count and measured [968162, 955787, 932350, 987137, 994100] nanoseconds at 196 basis points, while exposing descending within-process samples and up to 417 basis points of selected-CPU interrupt/DPC time. Native CPU-set evidence showed selected E-core 20 parked between processes, but exact placement probes observed actual execution on processor 20 even while the advisory flag briefly remained parked and later cleared under sustained work. Globally disabling processor idle was rejected because it produced 4531 selected-busy and 2661 system-busy basis points under the unchanged quietness limits, and normal idle was restored. The parked flag therefore is not promoted as hard authority and does not explain away the unstable calibration. No threshold, warmup, sample, batching, fixture, product behavior, baseline, or budget changed.
          - check: Pathological semantic-parse normalization defect correction
            result: passed
            details: One process-local Windows diagnostic retained CPU-20/CPU-set-276 placement, batch count 4, 16 warmups, 64 samples, and the exact pathological source. Syntax parsing remained stable near 98 microseconds while canonical normalization alone fell from a 1,067,775-nanosecond first-quartile median to 767,525 nanoseconds in the last quartile as soft page faults declined. Every batch nevertheless performed the same 11,568 allocations, 11,568 deallocations, 2,072 reallocations, and 2,492,908 allocated/deallocated bytes with the low-fragmentation heap continuously active. Inspection identified a redundant full SemanticProgram root clone that was immediately discarded before normalize_node constructed the canonical root. The semantic-neutral correction constructs the output fields directly, removing exactly 2,048 allocations and deallocations per four-parse batch and reducing batch allocation traffic to 2,382,264 bytes. All 15 Rust-1.75 focused normalization, compatibility, and property tests pass without contract or output changes. A post-fix stage diagnostic retained exact placement and showed stable syntax work plus lower normalization time; it did not change any benchmark definition, threshold, warmup, sampling, or batching rule.
          - check: Post-correction coordinate validation
            result: failed
            details: The predetermined five-fresh-process diagnostic stopped before repetition 2 timing because the unchanged one-shot conditioner observed 1,581 system-busy basis points above the 1,500 limit; selected CPU busy and interrupt/DPC rates were both zero. No retry was attempted and no stability claim was produced. A subsequent read-only three-second process snapshot attributed material concurrent CPU use to the interactive ChatGPT/Codex host plus browser, Teams, audio, and shell processes. The current interactive Windows session therefore is not yet sufficiently quiescent for a clean post-correction calibration even though physical placement remains authenticated. The baseline and every numeric budget remain absent.
          - check: Post-fix qualification and batch-selector defect investigation
