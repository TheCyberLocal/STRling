        - bindings/*/lib/**
        - bindings/*/R/**
        - bindings/c/include/**
        - bindings/cpp/include/**
        - bindings/interop/include/**
        - bindings/interop/src/**
        - core/src/**
        - packages/**
        - spec/conformance/**
        - spec/contracts/**
        - spec/frontends/**
        - spec/interop/**
        - spec/portability/**
