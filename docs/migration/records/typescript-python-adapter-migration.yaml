title: Canonical TypeScript/WASM and Python native adapter migration
status: in_progress
objective: Replace TypeScript and Python semantic implementations with thin canonical WebAssembly and native adapters while preserving supported ergonomic APIs and package behavior or explicitly retiring incompatible surfaces.
