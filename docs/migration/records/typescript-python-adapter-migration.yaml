change_classification:
    semantic_change:
        level: none
        evidence:
            - Host facades consume existing canonical compiler, frontend, target, diagnostic, Simply, standard-library, and interop contracts and are forbidden from creating or modifying semantics.
        affected_surfaces: []
    public_api_change:
        level: breaking
        evidence:
            - CP3 replaces the TypeScript binding-owned compiler surface with an explicit canonical WasmClient/Compiler facade, repairs the Simply entrypoint, adds explicit Node and raw-WASM entrypoints, and retires the broken ./core and ./emitters/pcre2 paths plus local AST/IR/emitter and implicit-regex behavior.
            - CP3 replaces Python binding-owned parsing, validation, diagnostics, target emission, and simulated Pattern.exec behavior with an explicit NativeClient/Compiler facade and canonical Simply request recipes. The platform-tagged wheel embeds only the governed native library and exposes no implicit CLI, PATH, download, or historical fallback.
            - The prior fingerprint-only TypeScript authorization remains limited to mechanically derived standard-library fingerprint and public-snapshot output; it does not authorize a semantic, behavioral, API-shape, or implementation change.
        affected_surfaces:
            - python-public-api
            - typescript-package-entrypoints
            - typescript-public-api
    schema_change:
        level: additive
        evidence:
            - CP2 adds only the subordinate adapter evidence schema and manifest for a closed 72-case verification denominator. Canonical compiler, frontend, standard-library, target, and interop schemas remain unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: intentional-correction
        evidence:
            - CP3 removes the binding-local TypeScript and Python hint engines and their independent diagnostic synthesis. Canonical diagnostic values and stable interop error identities now cross the raw-WASM/native boundaries unchanged; neither host redefines their meaning.
        affected_surfaces:
            - python-public-api
            - typescript-public-api
    target_behavior_change:
        level: intentional-correction
        evidence:
            - CP3 removes the TypeScript- and Python-local PCRE2 emitters and ambient target selection. Canonical artifact projection now requires the exact target-profile document and identity supplied by the caller; no target semantics or profile changes.
        affected_surfaces: []
    architecture_change:
        level: intentional-correction
        evidence:
            - CP2 isolates historical evidence from mutable product sources. CP3 deletes the TypeScript and Python parser/compiler-stage/IR/validator/hint/emitter copies and enforces browser-safe raw-WASM and platform-native dependency boundaries with no CLI, semantic, download, PATH, or regex-execution fallback.
        affected_surfaces: []
    generated_output_change:
        level: intentional-correction
        evidence:
            - CP2 adds one registered deterministic compatibility baseline derived from the exact P17-T03 starting commit. CP3 regenerates the registered TypeScript declaration/package-entrypoint and Python AST-export snapshots from the reviewed adapter sources and refreshes the governed npm lock after removing the runtime Ajv dependency; generated files are not edited manually.
        affected_surfaces: []
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: TypeScript/Python adapter contract and deletion denominator
      command: python tooling/typescript_python_adapter_certification.py --check
      expected_result: Exact public API, entrypoint, compatibility/refusal, canonical parity, lifecycle, concurrency, error, Simply, package, architecture, historical, and semantic-copy deletion cases validate with shrinkage resistance.
    - name: Focused package and cross-language conformance
      command: ./strling test typescript && ./strling test python && python tooling/typescript_python_adapter_runtime.py --json --repeat-runs 3
      expected_result: Governed Node/browser WebAssembly and CPython/native routes expose identical canonical requests, results, artifacts, errors, Simply behavior, and registered helper semantics with no binding-owned compiler execution.
    - name: Public, generated, architecture, security, and repository profiles
      command: python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && python tooling/governance.py && python tooling/security.py risk --json && python tooling/migration_differential.py --repeat-runs 3 && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: API snapshots, package entrypoints, generated authority, dependency direction, frozen historical behavior, clean installs, package graphs, executable profile operations, and exact environmental limitations are recorded with a clean tree and no task-owned failure.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository, source, public, and package starting boundary
            result: passed
            details: >-
                Starting anchor e6c87a1ae2fed088bff7ec22653fccf5d00becde was clean on architecture/v4. The denominator is 40 authored sources and approximately 15,260 lines: 19 TypeScript files/6,658 lines and 21 Python files/8,602 lines. Enforced evidence contains 461 TypeScript declaration symbols, 11 TypeScript package-entrypoint fields, and 95 Python public symbols. Baseline suites pass 972 TypeScript and 798 Python tests; the TypeScript dry-run package contains 38 entries.
          - check: Dependency, semantics, Simply, and standard-library ownership lock
            result: passed
            details: >-
                TypeScript executes only strling.wasm-abi v1 and Python executes only strling.c-abi v1. Hosts own loading, bounded byte transport, lifecycle, JSON projection, package mechanics, and ergonomic Simply request construction. They may not parse language source, validate semantic meaning, plan portability, emit target syntax, implement a helper, infer an ambient target, or fall back to historical code. Lexical-shape helpers remain lexical rather than falsely claiming semantic validation.
          - check: Public, compatibility, target, error, lifecycle, and package disposition lock
            result: passed
            details: >-
                Root namespaces, mechanically representable Simply builders, canonical Preview transport, generated helper identities, and canonical request/result data remain intended surfaces. Local compiler-stage and IR/node exposure plus simulated Python Pattern.exec behavior are explicit retirement decisions. Canonical calls require exact profiles; only an exact deprecated shim may disclose generated pcre2-10.43. Canonical failures remain values distinct from host/transport failures. Governed Node is >=22,<23 and Python retains >=3.8; Node 24 baseline and source-tree imports are not governed package proof.
          - check: Historical evidence, generated authority, and exclusion lock
            result: passed
            details: >-
                CP2 must freeze the 24 TypeScript and 20 Python historical observations against immutable starting source before product changes. A narrow tooling/legacy_reference copy may preserve non-normative evidence but cannot become a product route. Only registered generated families may change from their authoritative inputs. No language semantic, target profile, interop ABI, support-tier, package version, other binding, push, publication, tag, upload, or release action is authorized.
          - check: CP1 governance and reproducibility validation
            command: prettier --check <CP1 files> && python tooling/governance.py && python tooling/documentation_integrity.py && python tooling/public_contracts.py --check --surface typescript-public-api --surface typescript-package-entrypoints --surface python-public-api --json && python tooling/generated_artifacts.py --check && git diff --check
            result: passed
            details: >-
                Governance scope, declarations, architecture rules, formatting, patch whitespace, and documentation integrity across 191 files pass. The focused TypeScript declarations/package-entrypoints and Python public snapshots are unchanged. The host generated-artifact run passes every enforced family except the repository-wide public-contract aggregate, whose sole failed surface is the unchanged Go snapshot because Go is absent; the focused T03 surfaces pass from the same host extraction path. No generated output changed. Host execution was required because the Windows workspace sandbox denies TypeScript extractor temporary-directory writes.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed authority, API, package, adapter, and runtime denominator
            command: python tooling/typescript_python_adapter_certification.py --check --json
            result: passed
            details: >-
                Seventeen canonical compiler, Simply, interop, standard-library, and pcre2-10.43 inputs fingerprint to sha256:0c6189b30042c50481228314ca35f69e55c9536288aad7299dce5c4816770924. The manifest fingerprint is sha256:545d73f3b75199592657c37ae1da83e51f27dd8649a49b22e81f0ad2a7b627cc. It freezes 72 cases across twelve families, thirteen runners, four closed interop operations, both bindings, and Node 22/browser-WASM/CPython 3.8-minimum/CPython 3.11-governed positions.
          - check: Immutable public, semantic-copy, and executable historical baseline
            command: python tooling/typescript_python_adapter_certification.py --write-baseline && python tooling/generated_artifacts.py --check --artifact typescript-python-adapter-migration-baseline
            result: passed
            details: >-
                The enforced generated compatibility baseline reproduces 18 public/package inputs and 31 semantic-copy paths from immutable task base e6c87a1a. Forty-five task-start TypeScript/Python source, manifest, lock, and compiler-config inputs are embedded as hash-checked base64 for isolated replay. Baseline fingerprint sha256:6a1ac87338417c442e0a2abfb3dad289d60e71f68a83f7850fd41e23d43b8191 reproduces exactly.
          - check: Shrinkage and mutation resistance
            command: python -m unittest tooling.tests.test_typescript_python_adapter_certification -v
            result: passed
            details: >-
                Thirteen tests pass. They reject contract fingerprint/order drift, case removal after count edits, duplicate identity, runner/binding/operation/runtime substitution, historical corpus drift, semantic-path substitution, source mutation after editable hash recomputation, and bundle materialization mismatch.
          - check: Controlled historical runner separation and replay
            command: python tooling/legacy_reference/launch.py --runner all --check && python tooling/legacy_reference/launch.py --runner all --comparison-certify
            result: passed
            details: >-
                Historical execution loads only the checked-in task-start bundle through explicit frozen-source environments. Forty-three TypeScript Node tests and 29 Python/launch tests pass. The 24 TypeScript plus 20 Python cases are byte-stable across three runs with zero repeat mismatches; six peer differences remain unresolved historical evidence and do not create semantic authority.
          - check: Migration differential and focused integration
            command: python tooling/migration_differential.py --repeat-runs 3 && python -m unittest tooling.tests.test_typescript_python_adapter_certification tooling.tests.test_migration_differential tooling.tests.test_legacy_reference_architecture tooling.legacy_reference.tests.test_launch tooling.legacy_reference.tests.test_python_reference tooling.legacy_reference.tests.test_cross_reference -v
            result: passed
            details: >-
                The guarded differential passes at baseline sha256:621ef0867c3611e9dc153353002a2ac33d56408e10f8a047552d4d1935c9f791 and result sha256:a625055f60e2eda0b37ee785d68eabcbbc94dab2fca272bd0a4ff54ad87636ab with 44 deterministic observations, zero blocking canonical replacements, and six evidence-only historical peer differences. All 69 focused Python evidence/differential/architecture/runner tests pass. Windows Cargo discovery is made deterministic without changing canonical or historical evidence.
    - name: Minimal implementation and local proof
      status: passed
      evidence:
          - check: TypeScript raw-WASM adapter, canonical Simply facade, and package closure
            command: npm test && npm pack --dry-run --json --ignore-scripts && python tooling/public_contracts.py --surface typescript-public-api --surface typescript-package-entrypoints
            result: passed
            details: >-
                The ESM-only TypeScript package now executes only the sealed six-export strling.wasm-abi v1 module, bounds and copies request/response bytes, releases every request/descriptor/owned response, serializes calls per instance, preserves canonical result values and interop code/path data, and exposes an explicit Node loader without importing Node or fetching from the browser-safe root. Seventeen focused tests pass. The clean dry-run tarball contains 27 entries with the WASM artifact and no retired core/emitter output. Registered TypeScript declaration and entrypoint snapshots reproduce the reviewed breaking surface.
          - check: Python native adapter, canonical Simply facade, and platform-wheel closure
            command: python bindings/python/scripts/assemble_native.py --output bindings/python/target/native && python -m pytest -q -W error -p no:cacheprovider --basetemp=bindings/python/target/pytest-p17-t03 && pip wheel bindings/python --no-deps --no-build-isolation && pip install --target <isolated> --no-deps --no-index <local-wheel>
            result: passed
            details: >-
                The Python package now executes only strling.c-abi v1 through ctypes, bounds and copies every payload, rejects non-finite request data, releases the exact owned descriptor in finally, preserves canonical result values and interop code/path data, and discovers only an explicit path or the exact wheel-bundled library. Twenty-one focused tests pass, including repeated allocation/free, concurrency, malformed response, canonical failure-as-value, exact target-profile, Python 3.8 AST, Simply owner isolation, helper identity, and refusal behavior. The local py3-none-win_amd64 wheel contains 16 files, embeds strling_interop.dll, contains no retired core/emitter output, and imports/calls describe from an isolated no-index install. The registered Python AST-export snapshot reproduces the reviewed breaking surface.
    - name: Integration and certification
      status: passed
      evidence:
          - check: Live TypeScript/WASM and Python/native canonical parity
            command: python tooling/typescript_python_adapter_runtime.py --json --repeat-runs 3
            result: passed
            details: >-
                A locked 44-action corpus passes byte-exact cross-host parity for all four interop operations, five canonical compile fixtures, all 32 Simply 1.0/1.1 positive and negative cases, exact pcre2-10.43 target inspection and artifact compilation, astral and combining Unicode, stable unknown-operation and invalid-UTF-8 errors, and the request-size refusal. Three independent runs are deterministic at action fingerprint sha256:e45138d80f67e016214f2b90f01b161b1b39e2fefd70c1fbd5c10faba74219ed and result fingerprint sha256:34a235670c3df9d8f00e904a0115f7dccbf9b46dadcd4740b54a14de48c5cde2 on Node v24.4.1 and CPython 3.13.5.
          - check: Browser-safe raw-WASM execution
            command: HeadlessChrome --dump-dom http://127.0.0.1:8765/tests/adapters/2.0/browser-runtime.html
            result: passed
            details: >-
                Installed HeadlessChrome 151 loaded only the browser-safe root entrypoint and sealed Wasm artifact over an offline loopback server. The live page passed protocol describe, Simply 1.1 stdlib.date_time semantic compilation, and exact STRL-INTEROP-0001/$ invalid-UTF-8 identity. No Node-only module, network dependency, target inference, or historical fallback entered the route.
          - check: Governed runtime availability
            result: not_run
            details: >-
                This host provides Node v24.4.1 and CPython 3.13.5. The only cached Linux certification image provides CPython 3.12.3 and no Node, npm, Cargo, or rustc. Exact governed Node 22 and CPython 3.8/3.11 executions are therefore unavailable without an unapproved external image or tool download. The package declarations, Python 3.8 AST gate, and cross-host live proof pass, but no exact-version runtime result is claimed.
          - check: Package, immutable-history, and migration integration
            command: npm test; python -m pytest -q; npm pack --dry-run --json --ignore-scripts; isolated local-wheel installs; python tooling/legacy_reference/launch.py --runner all --check; python tooling/migration_differential.py --repeat-runs 3
            result: passed
            details: >-
                TypeScript passes five suites and 18 tests; Python passes 22 tests. The TypeScript dry-run package contains 27 entries including the sealed WASM module and no retired semantic output. Locally assembled CPython 3.12 and existing CPython 3.13 platform wheels install without an index, contain the governed native library, and execute describe through the supported load_native route. The authenticated task-start bundle passes 43 TypeScript and 29 Python/controller historical tests; all 24 TypeScript plus 20 Python observations are deterministic. The three-run differential passes 44 observations with zero blocking replacements and six evidence-only historical peer differences at baseline sha256:621ef0867c3611e9dc153353002a2ac33d56408e10f8a047552d4d1935c9f791 and result sha256:a625055f60e2eda0b37ee785d68eabcbbc94dab2fca272bd0a4ff54ad87636ab.
          - check: Public, generated, architecture, security, and documentation integration
            command: focused public/generated checks; python tooling/contract_validation.py; python tooling/governance.py; python tooling/security.py integrity --json; python tooling/security.py content --json; python tooling/documentation_integrity.py --json
            result: passed
            details: >-
                Exact TypeScript declaration/entrypoint and Python AST public snapshots reproduce unchanged. The T03 evidence baseline and all affected standard-library runtime, compatibility, and surface projections reproduce without canonical registry or generated fingerprint changes. Canonical contracts pass while authenticating the 55-operation TypeScript and 53-operation Python historical compatibility inventories from the immutable task-start bundle rather than migrated product source. Governance passes the 125-entry task scope, contracts, change declarations, and both adapter boundaries. Dependency integrity passes 27 checks; content/workflows pass four; documentation passes executable examples and 192-file local-link validation. The TypeScript lock has no T03 dependency change and its live npm vulnerability/license rows pass; Python has no configured authoritative risk scanner. The repository-wide risk failure is only pre-existing LSP signing-license/waiver scope plus unavailable scanner/tool rows.
          - check: Local, Pull Request, and network-restricted Full profiles with exact carry-forward
            command: .\strling.ps1 profile local; .\strling.ps1 profile pull-request; network-restricted .\strling.ps1 profile full
            result: passed
            details: >-
                Local records 13 passed, two failed, and 18 unavailable; Pull Request records 14 passed, two failed, and 46 unavailable; Full records 11 passed, nine failed, and 82 unavailable. Pull Request and Full both pass the registered T03 cross-host runtime operation. Local/PR failures are solely the repository-wide public/generated wrappers requiring absent Go; every affected public/generated surface passes directly. The safe Full run additionally records dependency-risk policy/tool gaps and sandboxed historical, differential, interop, and LSP wrappers whose T03-owned historical/differential checks pass directly. Node v24.4.1 is outside governed >=22,<23; exact Node 22, CPython 3.8/3.11, Go, Unix aliases, and optional ecosystem toolchains remain unavailable. No failed or unavailable operation is represented as passing, and no push or publication occurred.
