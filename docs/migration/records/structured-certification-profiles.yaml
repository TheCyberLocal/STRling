record_version: 2.0.0
title: Structured certification profiles
status: complete
objective: Establish stable local, pull-request, full, and release execution policies over STRling's canonical quality operations, with deterministic structured certification artifacts and CI routing that preserve fail-closed result semantics without changing product behavior.
scope:
    diff:
        base: 77d9a9b2b54dbbc66369cc16186ea36f0fad78c3
        head: working-tree
    allowed_paths:
        - .github/workflows/**
        - docs/ci_cd_setup.md
        - docs/migration/**
        - docs/toolchains.md
        - governance/README.md
        - governance/architecture-rules.json
        - governance/certification-profiles.md
        - governance/static-analysis.json
        - governance/change-control.json
        - governance/public-surfaces.json
        - governance/contracts/snapshots/root-cli.json
        - governance/schemas/**
        - governance/security.md
        - bindings/*/README.md
        - strling
        - strling.ps1
        - toolchain.json
        - tooling/documentation_integrity.py
        - tooling/architecture_fitness.py
        - tooling/lsp-server/examples/README.md
        - tooling/quality.py
        - tooling/tests/**
        - tooling/certification.py
    forbidden_paths:
        - core/src/**
        - core/tests/**
        - package.json
        - package-lock.json
        - spec/**
        - tests/**
    expected_files:
        - docs/migration/records/structured-certification-profiles.yaml
        - governance/certification-profiles.md
    permitted_generated_changes:
        - public-contract-snapshots
    expected_generated_outputs:
        - public-contract-snapshots
    required_verification_levels:
        - contract
        - unit
        - integration
        - quality
        - certification
    bounded_exemptions:
        - WVR-SEC-NPM-TOOLING-001
        - WVR-SEC-VSCE-LICENSE-001
change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: additive
        evidence:
            - Adds stable engineering-only certification profile selection to the root quality CLI without changing package APIs.
        affected_surfaces:
            - root-cli
    schema_change:
        level: additive
        evidence:
            - Adds a machine-readable certification artifact schema without changing product schemas.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
        level: additive
        evidence:
            - Centralizes canonical operation identity, profile membership, deterministic execution, artifact ownership, and CI routing in the existing root quality architecture.
    generated_output_change:
        level: additive
        evidence:
            - Regenerates the additive root CLI contract snapshot from the canonical profile selection surface.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Profile and artifact contracts
      command: python3 -m unittest tooling.tests.test_quality tooling.tests.test_documentation_integrity -v
      expected_result: Profile selection, ordering, aggregation, artifact fidelity, schemas, fixtures, summaries, documentation integrity, controlled negatives, and immutability pass.
    - name: Canonical repository quality
      command: ./strling profile local and ./strling profile pull-request
      expected_result: Offline developer and merge profiles execute the same canonical operations with truthful structured results.
    - name: Broad certification
      command: ./strling profile full and ./strling profile release
      expected_result: Broad and release envelopes execute completely where supported and retain unavailable or incomplete required evidence as non-passing.
    - name: Existing compatibility commands
      command: ./strling check and ./strling certify
      expected_result: Existing commands resolve through the governed profile executor and preserve fail-closed behavior.
    - name: Product preservation
      command: git diff 77d9a9b2b54dbbc66369cc16186ea36f0fad78c3...HEAD -- bindings core/src core/tests spec tests package.json package-lock.json
      expected_result: No product implementation, language contract, package version, or publication artifact changes.
    - name: Repository integrity
      command: python3 tooling/governance.py and git diff --check
      expected_result: Declared scope, contracts, architecture rules, and patch integrity pass.
checkpoints:
    - name: Profile and certification contract
      status: passed
      evidence:
          - check: Profile architecture contract
            result: passed
            details: Defined canonical operation identity, four stable profile purposes, centralized membership and ordering, component scope with mandatory global gates, offline and network policy, result ownership, deterministic evidence boundaries, and ratchet rules without implementing execution.
          - check: Result aggregation contract
            result: passed
            details: Preserved passed, failed, waived, unavailable, incomplete, not-applicable, not-yet-configured, and not-yet-enforceable evidence; defined failed then incomplete then unavailable then waived then passed precedence and prohibited false success for required unavailable evidence.
          - check: Formatting and patch integrity
            command: ./strling format --check repository --json and git diff --check
            result: passed
            details: Canonical Prettier 3.3.3 and Ruff 0.15.21 checks passed and the patch contains no whitespace errors.
          - check: Governance, contracts, and architecture fitness
            command: python3 tooling/governance.py --json; ./strling contracts --check --json; python3 tooling/architecture_fitness.py
            result: passed
            details: Task scope, declarations, public contracts, and all enforced architecture rules passed; recorded transitional and future architecture findings remain explicit.
          - check: Structured result baseline
            command: python3 -m unittest tooling.tests.test_quality -v
            result: passed
            details: All 42 existing routing, environment, hardgate, unavailable, incomplete, and structured-security result tests passed.
    - name: Canonical profile selection and execution
      status: passed
      evidence:
          - check: Canonical registry and membership
            result: passed
            details: Centralized all component and repository operations in policy.operation_registry and defined ordered, versioned local, pull-request, full, and release profiles; check resolves to pull-request and certify resolves to full.
          - check: Deterministic execution and component scope
            result: passed
            details: The single profile executor preserves declared operation and target order, validates compatibility, scopes component operations only, and always runs mandatory repository operations once.
          - check: Focused profile tests
            command: python3 -m unittest tooling.tests.test_quality -v
            result: passed
            details: All 47 routing, profile identity, membership, ordering, component scope, hardgate, network, security-result, environment, and aggregation tests passed.
          - check: Controlled profile negatives
            result: passed
            details: Unknown profiles, unknown members, offline network membership, unavailable tools, failed repository gates, and failed/incomplete/unavailable precedence all produced truthful non-passing behavior.
          - check: Canonical local profile
            command: ./strling profile local --json
            result: passed
            details: The actual offline local profile completed with 21 passed operations and zero failed, waived, unavailable, or incomplete selected operations.
          - check: Formatting, lint, governance, contracts, and architecture
            command: ./strling format --check repository --json; ./strling lint repository --json; python3 tooling/governance.py --json; ./strling contracts --check --json; python3 tooling/architecture_fitness.py
            result: passed
            details: Canonical formatting and static analysis, contained-change declarations, additive root CLI contract reproduction, and all enforced architecture rules passed.
    - name: Structured certification artifact
      status: passed
      evidence:
          - check: Versioned artifact schema and identity
            result: passed
            details: Added the draft-2020-12 profile-certification-artifact schema version 1.0.0 with repository state, profile definition identity and fingerprint, component scope, ordered operation evidence, aggregate counts, deterministic evidence fingerprint, and isolated execution metadata.
          - check: Result and exit-status fidelity
            result: passed
            details: Artifact construction consumes the exact ordered OperationResult projection, shares canonical status and exit aggregation, rejects aggregate mismatches and duplicate result IDs, preserves tool evidence and structured findings, and extracts exact waiver references.
          - check: Artifact-derived human summary
            result: passed
            details: Human profile output is rendered only from the validated artifact and reports repository/profile scope, aggregate status and counts, passed and failed operations, waived findings, unavailable or incomplete operations, and a status-specific next action.
          - check: Schema fixtures and focused tests
            command: python3 -m unittest tooling.tests.test_quality tooling.tests.test_certification -v
            result: passed
            details: All 56 profile and artifact tests passed, including positive and invalid fixtures, schema validation, deterministic identity, tamper detection, metadata isolation, aggregate mismatch, summary fidelity, and write round-trip coverage.
          - check: Actual artifact output
            command: ./strling profile local --json --artifact /tmp/strling-checkpoint3-local.json
            result: passed
            details: The actual local profile produced semantically identical stdout and file artifacts with 21 passed operations, zero other result states, a valid evidence fingerprint, and dirty repository state accurately recorded for the pre-commit execution.
          - check: Formatting, lint, governance, and patch integrity
            command: ./strling format --check repository --json; ./strling lint repository --json; python3 tooling/governance.py --json; git diff --check
            result: passed
            details: Canonical formatting and static analysis, contained-change declarations, enforced architecture rules, and whitespace integrity passed without new suppression directives.
    - name: Documentation and example integrity
      status: passed
      evidence:
          - check: Canonical structured documentation operation
            command: python3 tooling/documentation_integrity.py --json
            result: passed
            details: The offline documentation.integrity operation validated 118 tracked Markdown files and seven governed parser examples through the shared structured operation-result boundary, with two passed checks and zero other states.
          - check: Documentation and example coverage
            result: passed
            details: Enforced local inline, reference-style, and HTML documentation targets; canonical root-relative example commands; expected parser exit semantics; and delegated existing contract-example and generated-state authority without mutating tracked files.
          - check: Deliberate exclusions and limitations
            result: passed
            details: Destination-relative templates are explicitly excluded; external reachability, Markdown anchors without a pinned GFM slugger, and the transitional non-reproducible final audit remain recorded limitations rather than manufactured passes.
          - check: Controlled documentation negatives
            result: passed
            details: Broken local targets, undefined references, stale example exits, and aggregate tampering each produced deterministic failed evidence; the initial repository run truthfully exposed and then repaired two broken links and two stale documented commands.
          - check: Focused profile, artifact, and documentation tests
            command: python3 -m unittest tooling.tests.test_documentation_integrity tooling.tests.test_quality tooling.tests.test_certification -v
            result: passed
            details: All 65 tests passed, including eight documentation integrity tests and preservation of structured evidence through profile aggregation and artifact generation.
          - check: Actual local profile artifact
            command: ./strling profile local --json --artifact /tmp/strling-checkpoint4-local.json
            result: passed
            details: Profile definition 1.1.0 passed all 22 selected operations, retained the complete documentation result as structured evidence, and produced semantically identical stdout and file artifacts.
          - check: Formatting, lint, governance, contracts, architecture, and patch integrity
            command: ./strling format --check repository --json; ./strling lint repository --json; python3 tooling/governance.py --json; ./strling contracts --check --json; python3 tooling/architecture_fitness.py; git diff --check
            result: passed
            details: All canonical hardgates passed; no new static-analysis suppression directive was introduced.
    - name: CI profile routing
      status: passed
      evidence:
          - check: Deterministic workflow mapping
            result: passed
            details: CI manual dispatch selects an explicit profile and defaults to local; pull requests and branch pushes select pull-request; the weekly schedule selects full; v-prefixed tags and the delivery preflight select release.
          - check: Canonical profile authority
            result: passed
            details: The quality and release-certification jobs invoke only ./strling profile with --artifact. The per-binding matrix remains supplemental on canonical leaf commands; the former split check plus certify-typescript authority was removed.
          - check: Structured artifact retention
            result: passed
            details: Both authoritative jobs retain the profile-produced artifact with the immutable actions/upload-artifact v7.0.1 commit; always-run upload uses warning-only missing-file behavior and cannot redefine the profile process exit.
          - check: Security and least privilege
            command: python3 tooling/security.py content --json
            result: passed
            details: Both workflows retain read-only default permissions, non-persisted credentials in validation jobs, immutable action references, no validation secrets, and no duplicated scanner or waiver logic. Network-backed risk remains selectable only by full and release profile policy.
          - check: Enforced no-substitution architecture rule
            command: python3 tooling/architecture_fitness.py
            result: passed
            details: canonical-ci-profile-routing enforces exact event mapping, canonical profile invocation, structured artifact output, pinned upload behavior, and release-preflight dependency while rejecting direct quality scripts and check or certify aliases.
          - check: Controlled workflow negatives and security regression tests
            command: python3 -m unittest tooling.tests.test_governance tooling.tests.test_governance_contracts tooling.tests.test_security -v
            result: passed
            details: All 68 tests passed, including controlled direct-script, compatibility-alias, mutable-action, authoritative-upload, and wrong-event-mapping failures plus architecture-schema and existing workflow-security coverage.
          - check: Actual local profile
            command: ./strling profile local --json --artifact /tmp/strling-checkpoint5-local.json
            result: passed
            details: All 22 operations passed and stdout exactly matched the retained artifact.
          - check: Actual pull-request profile
            command: ./strling profile pull-request --json --artifact /tmp/strling-checkpoint5-pr.json
            result: passed
            details: 41 operations passed and two were unavailable; the governed local Bundler mismatch blocked ruby lint and missing Swift blocked swift typecheck. Exit status remained nonzero and stdout exactly matched the retained artifact.
    - name: Profile certification and hardgates
      status: passed
      evidence:
          - check: Explicit certification properties
            command: python3 -m unittest tooling.tests.test_profile_certification -v
            result: passed
            details: All eight focused properties passed, proving deterministic ordered execution, canonical-only membership, mandatory repository-gate no-bypass, blocking-state precedence, waiver distinction, exact artifact and summary fidelity, input immutability, and executor/schema-independent profile ratcheting.
          - check: Complete tooling and controlled-negative suite
            command: python3 -m unittest discover -s tooling/tests -t . -v
            result: passed
            details: All 267 tooling tests passed, including artifact schema fixtures, profile selection and compatibility negatives, result tamper and aggregate mismatch rejection, documentation breakage fixtures, CI substitution failures, and security fail-closed regressions.
          - check: Canonical repository hardgates
            command: ./strling format --check repository --json; ./strling hygiene --json; ./strling lint repository --json; ./strling generate --check --json; ./strling contracts --check --json; ./strling governance --json; python3 tooling/architecture_fitness.py; python3 tooling/documentation_integrity.py --json; python3 tooling/security.py integrity --json; python3 tooling/security.py content --json
            result: passed
            details: Formatting, hygiene, static analysis, generation integrity, public contracts and snapshots, scope governance, architecture fitness, documentation and examples, dependency integrity, and content/workflow security all passed.
          - check: TypeScript and Rust/kernel baselines
            command: ./strling environment, typecheck, build, and test for typescript, core, and rust; plus core format and lint
            result: passed
            details: TypeScript typecheck/build and all 19 suites with 963 tests passed; kernel rustfmt, warnings-denied Clippy, typecheck/build and all 194 tests passed; the Rust binding typecheck/build and all 638 tests passed. Node 18 remains transitional and the npm executable version remains deferred evidence.
          - check: Local profile
            command: ./strling profile local --json --artifact /tmp/strling-cp6-pre/profiles-governed/local.json
            result: passed
            details: All 22 operations passed with zero failed, incomplete, unavailable, waived, or transitional capability states; stdout and the retained artifact were semantically identical.
          - check: Pull-request profile and check compatibility alias
            command: ./strling profile pull-request and ./strling check with JSON artifacts
            result: passed
            details: Both executions produced identical profile identity and counts of 41 passed and two unavailable operations. The governed local Bundler mismatch blocked ruby lint and missing Swift blocked swift typecheck; both artifacts and process exits remained non-passing.
          - check: Full, release, and certify compatibility alias
            command: ./strling profile full; ./strling profile release; ./strling certify with JSON artifacts
            result: passed
            details: Full, release, and certify each recorded 68 passed and seven unavailable operations. Required dependency risk, ruby lint/build/test, and swift typecheck/build/test remained unavailable; each artifact exactly preserved the result set and exit status.
          - check: Nested dependency-risk evidence
            result: passed
            details: The full and release security operation retained nine passed, four waived, and 32 unavailable checks, including both exact expiring waiver references and governed ecosystem-scanner gaps; operation aggregation did not convert this evidence to success.
          - check: Governed toolchain drift negative
            result: passed
            details: A controlled ambient Ruff 0.16.2 run produced unavailable format/lint evidence against the exact 0.15.21 declaration; rerunning with the governed PATH passed those operations, demonstrating deterministic version enforcement without installation or silent fallback.
          - check: Artifact and repository integrity
            result: passed
            details: Every governed profile stdout document was semantically equal to its retained artifact, profile and artifact exit status agreed, the certification property proved repository input immutability, and no forbidden product path changed.
    - name: Completion and phase readiness
      status: passed
      evidence:
          - check: Stable profile architecture
            result: passed
            details: Local, pull-request, full, and release retain definition version 1.1.0 as execution policies over the single canonical operation registry. Declared membership and target order are deterministic; component scope affects only component operations; mandatory repository gates always run; local and pull-request are offline, while only full and release permit network operations.
          - check: Aggregate and artifact contract
