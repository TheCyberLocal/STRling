          - check: Clean committed-state profile certification
            command: ./strling profile local; ./strling profile pull-request; ./strling profile full; ./strling profile release; ./strling check; ./strling certify with JSON artifacts from committed 731af34a7a5b394a24d9e7e0fefda4ecc7c4ecee
