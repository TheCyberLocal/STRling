record_version: 2.0.0
title: Canonical VS Code and tooling packaging certification
status: in_progress
objective: Build reproducible platform-targeted VSIX payloads whose only STRling semantic engines are the packaged canonical Rust kernel and editor projection, then certify activation, lifecycle, feature, identity, offline, and platform behavior without publishing.
