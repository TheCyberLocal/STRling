change_classification:
    semantic_change:
        level: none
        evidence:
            - Packaging, launch, transport, resource copying, and editor metadata do not define STRling meaning; the existing canonical Rust processes remain the only semantic authorities.
    public_api_change:
        level: intentional-correction
        evidence:
            - The extension will activate for native STRling, advertise only the language association it owns, cover all 17 governed host selectors, align its settings with its actual runtime, and ship target-specific canonical processes rather than an incomplete generic payload.
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - A closed internal package contract and generated content-manifest schema will define target, layout, hash, and reproducibility evidence without changing a normative language or compiler schema.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Packaged diagnostics must be identical to the existing canonical CompileResult projection; no code, severity, location, or message changes are authorized.
    target_behavior_change:
        level: none
        evidence:
            - Package targets identify editor-runtime operating systems and architectures, not regex target profiles or lowering behavior.
    architecture_change:
        level: intentional-correction
        evidence:
            - The payload will remove the complete legacy Python binding and unpinned downloaded transport as package dependencies, then wire the authored adapters exclusively to packaged canonical Rust processes and governed resources.
        affected_surfaces: []
    generated_output_change:
        level: compatible
        evidence:
            - The LSP package-lock root metadata is normalized to the existing extension identity and license without changing resolved dependency names or versions. Disposable dist and VSIX artifacts remain ignored and uncommitted; the task changes their authoritative inputs, generator, and verification contract rather than checking generated payloads into Git.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Closed package contract and evidence corpus
      command: python -m pytest tooling/lsp-server/tests/test_package_contract.py tooling/lsp-server/tests/test_package_evidence.py -q
      expected_result: Exact supported targets, input and output paths, launch environment, resources, manifest hashes, activation routes, settings, refusal mutations, lifecycle cases, and duplicate-build denominator validate with shrinkage resistance.
    - name: Platform package assembly and packaged-runtime identity
      command: python tooling/lsp-server/package_extension.py certify --target auto
      expected_result: The matching native target builds from locked inputs, contains only declared files, launches both canonical processes and the authored LSP offline, matches CLI/editor evidence, passes isolated install/upgrade/uninstall smoke tests, and reproduces its governed content identity.
    - name: Complete editor, architecture, and repository certification
      command: python -m pytest tooling/lsp-server/tests -q && cargo test --manifest-path core/Cargo.toml --all-targets --locked && python -m unittest discover -s tooling/tests && python tooling/public_contracts.py --check && python tooling/generated_artifacts.py --check && python tooling/migration_differential.py --repeat-runs 3 && python -m tooling.governance --json && ./strling profile local && ./strling profile pull-request && ./strling profile full && git diff --check && git status --short
      expected_result: All task-owned packaging, LSP, Rust, tooling, public/generated, migration, architecture, security, documentation, formatting, and profile evidence passes, with inherited or environment-limited failures recorded exactly and no unavailable platform represented as certified.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Repository and operational starting boundary
            result: passed
            details: P16-T05 begins on clean architecture/v4 at P16-T04 closure 76050f62204544c3ded857bd28080803aeeedc7b with five normalized Notion checkpoints. No tracked VSIX, dist payload, compiled editor binary, or package residue is present.
          - check: Package input, launch, and residue inventory
            result: passed
            details: The TypeScript client, four authored server modules, local protocol subsets, package metadata/assets, two Rust process entrypoints, three governed runtime resources, build/install scripts, lockfiles, generated-artifact registration, CI paths, and 544-test source-tree suite were inspected. The current assembler omits both canonical bridges and both Rust processes, downloads unpinned Python wheels, vendors the entire legacy binding, cannot resolve packaged resources, uses npx and POSIX-only assembly, and produces no target/content/reproducibility evidence.
          - check: Supported targets, payload authority, and task boundary
            result: passed
            details: The contract locks linux-x64, win32-x64, darwin-x64, and darwin-arm64 to matching native CI runners; declares the two Rust processes as the sole semantic engines; packages only authored adapters, local transport subsets, and governed resources; requires an explicit preinstalled Python interpreter; rejects undeclared or host-mismatched targets; keeps all generated artifacts untracked; and forbids marketplace publication, user-home mutation, binding fallback, and language-semantic changes.
    - name: Verification design and evidence
      status: passed
      evidence:
          - check: Closed package and runtime contract
            result: passed
            details: >-
                Package contract 1.0.0 fixes four native target/runner pairs, 17 copied inputs, two generated files, two canonical runtime processes, 21 required and 15 forbidden payload patterns, 21 selectors, ten features, six absolute runtime bindings, Python 3.11 minimum, zero external Python packages, byte-exact payload equivalence, normalized VSIX entry equivalence, and an explicit publication prohibition. CP3 made two evidence-driven container corrections: the normalized epoch moved from 1980-01-01 to DOS-ZIP-safe 1980-01-02 UTC because the former becomes 1979 west of UTC, and logical README/license destinations became VSCE's installed readme.md/LICENSE.txt names. No target, content, case, or semantic contract changed; the current fingerprint is recorded in the CP3 evidence.
          - check: Shrinkage-resistant packaging evidence denominator
            command: python -m pytest tooling/lsp-server/tests/test_package_contract.py tooling/lsp-server/tests/test_package_evidence.py -q -p no:cacheprovider
            result: passed
            details: Eleven integrity tests pass. The manifest contains 72 unique cases across four targets, 21 selectors, ten features, 12 failures, three lifecycle operations, six identity groups, 12 mutations, and four reproducibility properties at sha256:736f77bc8b912e5a3e48b5156cd4544a0c231c7e289164631686b983b1d91929. Exact counts, IDs, governed island-route alignment, canonical-only contents, offline runtime, owned language surface, and one-case removal are enforced.
          - check: Schema, formatting, governance, and patch integrity
            result: passed
            details: JSON Schema 2020-12 validates the closed contract; all three JSON files parse; the two focused Python test files pass Ruff check and format; task schema, scope/declaration governance, and architecture fitness pass; git diff --check passes. Repository formatting retains only the previously recorded four Python and two Markdown files outside P16-T05.
    - name: Minimal implementation and local proof
      status: planned
      evidence: []
    - name: Integration and certification
      status: planned
      evidence: []
    - name: Completion and next-task readiness
      status: planned
      evidence: []
