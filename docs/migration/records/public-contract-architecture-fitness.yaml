record_version: 2.0.0
title: Public contract snapshots and architecture fitness certification
status: in_progress
objective: Establish deterministic, declaration-governed compatibility baselines for externally meaningful APIs and structured contracts, deepen dependency-aware architecture fitness, and integrate both into canonical local and CI hardgates without changing STRling product semantics.
scope:
    diff:
        base: b5ff2f0cec8153388e80eec1aac738f882eb89e1
        head: working-tree
    allowed_paths:
        - .github/workflows/ci.yml
        - docs/migration/**
        - docs/toolchains.md
        - governance/**
        - strling
        - strling.ps1
        - toolchain.json
        - tooling/contract_declarations.py
        - tooling/governance.py
        - tooling/index.md
        - tooling/public_contracts.py
        - tooling/quality.py
        - tooling/tests/**
    forbidden_paths:
        - bindings/**
        - spec/**
        - tests/spec/**
        - tests/conformance/**
        - package.json
        - package-lock.json
    expected_files:
        - docs/migration/records/public-contract-architecture-fitness.yaml
        - governance/architecture-rules.json
        - governance/architecture.md
        - governance/change-control.json
        - governance/formatting.json
        - governance/generated-artifacts.json
        - governance/public-contracts.md
        - governance/public-surfaces.json
        - governance/schemas/architecture-rules.schema.json
        - governance/schemas/change-control.schema.json
        - governance/schemas/generated-artifact-registry.schema.json
        - governance/schemas/public-surface-registry.schema.json
        - governance/schemas/task-record.schema.json
    permitted_generated_changes:
        - public-contract-snapshots
    expected_generated_outputs:
        - public-contract-snapshots
    required_verification_levels:
        - contract
        - unit
        - integration
        - quality
        - certification
    bounded_exemptions: []
change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: none
        evidence: []
        affected_surfaces: []
    schema_change:
        level: additive
        evidence:
            - Governance schemas add public-surface inventory, affected-surface declaration, and dependency-rule configuration without changing product schemas.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence: []
    target_behavior_change:
        level: none
        evidence: []
    architecture_change:
        level: additive
        evidence:
            - Architecture policy adds dependency, structured-reference, semantic-island placement, transition-reporting, and monotonic activation categories without changing product structure.
    generated_output_change:
        level: additive
        evidence:
            - Ten checked-in compatibility snapshots are registered as deterministic, non-normative generated artifacts with exact reproduction checks.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Public surface contract validation
      command: python3 -m unittest tooling.tests.test_governance_contracts tooling.tests.test_public_contracts tooling.tests.test_contract_declarations
      expected_result: Registry, snapshots, classifiers, declarations, and controlled malformed or incompatible cases behave deterministically.
    - name: Public contract reproduction
      command: ./strling contracts --check
      expected_result: Every enforced surface exactly reproduces its committed snapshot and every transition is explicit.
    - name: Architecture fitness
      command: ./strling governance
      expected_result: Active dependency and placement rules pass, transitions report without false failure, and future rules remain non-blocking.
    - name: Canonical quality
      command: BUNDLER_VERSION=2.4.20 ./strling check
      expected_result: Public contracts and architecture fitness run through the canonical aggregate before component checks.
    - name: Certification
      command: BUNDLER_VERSION=2.4.20 ./strling certify
      expected_result: Complete hardgate certification passes without compiler or product behavior changes.
checkpoints:
    - name: Public surface and fitness contract
      status: passed
      evidence:
          - check: Clean committed starting state
            command: git status --short --branch; git rev-parse HEAD; git branch --show-current
            result: passed
            details: The task started from a clean architecture/v4 tree at b5ff2f0cec8153388e80eec1aac738f882eb89e1; the branch was 22 commits ahead of origin.
          - check: Public surface inventory and extraction selection
            command: public manifest, entrypoint, declaration, schema, and CLI inspection
            result: passed
            details: Twenty-two surfaces cover all 17 binding APIs, TypeScript package entrypoints, the root CLI, and three stable specification schemas; ten deterministic strategies are planned and twelve gaps have explicit retirement conditions.
          - check: Contract and classification validation
            command: python3 -m unittest tooling.tests.test_governance_contracts
            result: passed
            details: Ten tests validated all schemas and instances, unique identifiers, every compatibility label, change evidence, safe paths, and required planned/transitional lifecycle conditions.
          - check: Architecture policy and current transitions
            command: ./strling governance
            result: passed
            details: Existing enforced rules passed; dependency, structured-reference, and semantic-island categories validate; the direct LSP-to-Python-binding dependency is recorded as transitional and final canonical-core rules remain future-state.
          - check: Existing quality baseline and patch integrity
            command: BUNDLER_VERSION=2.4.20 ./strling check; ./strling format --check repository; git diff --check
            result: passed
            details: The established Bundler-pinned aggregate passed formatting, hygiene, lint, type analysis, generation, governance, and all 19 TypeScript suites with 963 tests; no product source or semantics changed.
    - name: Deterministic API and contract snapshots
      status: passed
      evidence:
          - check: Deterministic extraction and exact regeneration
            command: ./strling contracts; ./strling contracts --check
            result: passed
            details: Ten enforced snapshots reproduce exactly for C, Go, Python, R, TypeScript declarations, TypeScript entrypoints, the root CLI, and three stable specification schemas; write mode is explicit and check mode does not modify repository state.
          - check: Structured contract status
            command: ./strling contracts --check --json
            result: passed
            details: Structured output identifies every surface, status, compatibility classification, findings, and all twelve bounded transitions without timestamps or environment paths.
          - check: Controlled drift and extraction failures
            command: python3 -m unittest tooling.tests.test_public_contracts
            result: passed
            details: Tests reject removed and added symbols, signature drift, missing or stale snapshots, extractor failures, malformed or duplicate registries, and breaking or tightening schema mutations; compatible metadata and additive optional schema properties classify separately.
          - check: Public-only normalization
            command: Python, Go, TypeScript, C, and R extractor regression tests and snapshot review
            result: passed
            details: Python extraction is AST-only, Go prose is excluded, explicit TypeScript private members are excluded, C implementation-static symbols are excluded, R exports derive from NAMESPACE, and irrelevant ordering is normalized.
          - check: Transition bounds
            command: public-surface registry validation
            result: passed
            details: C++, C#, Dart, F#, Java, Kotlin, Lua, Perl, PHP, Ruby, Rust, and Swift remain non-enforced only with ecosystem-specific rationale and objective retirement conditions.
    - name: Change classification enforcement
      status: passed
      evidence:
          - check: Base-relative detection and approval separation
            command: ./strling contracts --check
            result: passed
            details: Exact source-to-snapshot reproduction runs first; committed snapshots are then compared with the active task Git base and validated separately against task declarations, so regeneration cannot authorize drift.
          - check: Exact classification authorization
            command: python3 -m unittest tooling.tests.test_contract_declarations
            result: passed
            details: Fourteen controlled tests cover Git-base comparison, unchanged and internal-compatible changes, additive and breaking API changes, undeclared drift, incompatible broad levels, mismatched surface identifiers, additive and breaking schemas, intentional corrections, enforcement downgrades, and malformed declarations.
          - check: Component and surface containment
            command: declaration validator unit cases
            result: passed
            details: Every detected surface identifier maps to its registry component and must be named exactly; missing and unrelated identifiers fail, so a broad breaking label cannot authorize unrelated changes.
          - check: Monotonic public coverage
            command: enforcement downgrade controlled case
            result: passed
            details: Removing or downgrading an enforced registry surface is classified as breaking architecture drift and requires a breaking architecture declaration naming that exact surface.
    - name: Dependency architecture fitness
      status: planned
      evidence: []
    - name: Quality and CI integration certification
      status: planned
      evidence: []
    - name: Completion and next-task readiness
      status: planned
      evidence: []
commits:
