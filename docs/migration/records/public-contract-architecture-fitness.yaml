required_verification:
    - name: Public surface contract validation
      command: python3 -m unittest tooling.tests.test_governance_contracts tooling.tests.test_public_contracts tooling.tests.test_contract_declarations
      expected_result: Registry, snapshots, classifiers, declarations, and controlled malformed or incompatible cases behave deterministically.
    - name: Public contract reproduction
      command: ./strling contracts --check
      expected_result: Every enforced surface exactly reproduces its committed snapshot and every transition is explicit.
    - name: Architecture fitness
      command: ./strling governance
      expected_result: Active dependency and placement rules pass, transitions report without false failure, and future rules remain non-blocking.
    - name: Canonical quality
      command: BUNDLER_VERSION=2.4.20 ./strling check
      expected_result: Public contracts and architecture fitness run through the canonical aggregate before component checks.
    - name: Certification
      command: BUNDLER_VERSION=2.4.20 ./strling certify
      expected_result: Complete hardgate certification passes without compiler or product behavior changes.
checkpoints:
    - name: Public surface and fitness contract
      status: passed
      evidence:
          - check: Clean committed starting state
            command: git status --short --branch; git rev-parse HEAD; git branch --show-current
            result: passed
            details: The task started from a clean architecture/v4 tree at b5ff2f0cec8153388e80eec1aac738f882eb89e1; the branch was 22 commits ahead of origin.
          - check: Public surface inventory and extraction selection
            command: public manifest, entrypoint, declaration, schema, and CLI inspection
            result: passed
            details: Twenty-two surfaces cover all 17 binding APIs, TypeScript package entrypoints, the root CLI, and three stable specification schemas; ten deterministic strategies are planned and twelve gaps have explicit retirement conditions.
          - check: Contract and classification validation
            command: python3 -m unittest tooling.tests.test_governance_contracts
            result: passed
            details: Ten tests validated all schemas and instances, unique identifiers, every compatibility label, change evidence, safe paths, and required planned/transitional lifecycle conditions.
          - check: Architecture policy and current transitions
            command: ./strling governance
            result: passed
            details: Existing enforced rules passed; dependency, structured-reference, and semantic-island categories validate; the direct LSP-to-Python-binding dependency is recorded as transitional and final canonical-core rules remain future-state.
          - check: Existing quality baseline and patch integrity
            command: BUNDLER_VERSION=2.4.20 ./strling check; ./strling format --check repository; git diff --check
            result: passed
            details: The established Bundler-pinned aggregate passed formatting, hygiene, lint, type analysis, generation, governance, and all 19 TypeScript suites with 963 tests; no product source or semantics changed.
    - name: Deterministic API and contract snapshots
      status: passed
      evidence:
          - check: Deterministic extraction and exact regeneration
            command: ./strling contracts; ./strling contracts --check
            result: passed
            details: Ten enforced snapshots reproduce exactly for C, Go, Python, R, TypeScript declarations, TypeScript entrypoints, the root CLI, and three stable specification schemas; write mode is explicit and check mode does not modify repository state.
          - check: Structured contract status
            command: ./strling contracts --check --json
            result: passed
            details: Structured output identifies every surface, status, compatibility classification, findings, and all twelve bounded transitions without timestamps or environment paths.
          - check: Controlled drift and extraction failures
            command: python3 -m unittest tooling.tests.test_public_contracts
            result: passed
            details: Tests reject removed and added symbols, signature drift, missing or stale snapshots, extractor failures, malformed or duplicate registries, and breaking or tightening schema mutations; compatible metadata and additive optional schema properties classify separately.
          - check: Public-only normalization
            command: Python, Go, TypeScript, C, and R extractor regression tests and snapshot review
            result: passed
            details: Python extraction is AST-only, Go prose is excluded, explicit TypeScript private members are excluded, C implementation-static symbols are excluded, R exports derive from NAMESPACE, and irrelevant ordering is normalized.
          - check: Transition bounds
            command: public-surface registry validation
            result: passed
            details: C++, C#, Dart, F#, Java, Kotlin, Lua, Perl, PHP, Ruby, Rust, and Swift remain non-enforced only with ecosystem-specific rationale and objective retirement conditions.
    - name: Change classification enforcement
      status: passed
      evidence:
          - check: Base-relative detection and approval separation
            command: ./strling contracts --check
            result: passed
            details: Exact source-to-snapshot reproduction runs first; committed snapshots are then compared with the active task Git base and validated separately against task declarations, so regeneration cannot authorize drift.
          - check: Exact classification authorization
            command: python3 -m unittest tooling.tests.test_contract_declarations
            result: passed
            details: Fourteen controlled tests cover Git-base comparison, unchanged and internal-compatible changes, additive and breaking API changes, undeclared drift, incompatible broad levels, mismatched surface identifiers, additive and breaking schemas, intentional corrections, enforcement downgrades, and malformed declarations.
          - check: Component and surface containment
            command: declaration validator unit cases
            result: passed
            details: Every detected surface identifier maps to its registry component and must be named exactly; missing and unrelated identifiers fail, so a broad breaking label cannot authorize unrelated changes.
          - check: Monotonic public coverage
            command: enforcement downgrade controlled case
            result: passed
            details: Removing or downgrading an enforced registry surface is classified as breaking architecture drift and requires a breaking architecture declaration naming that exact surface.
    - name: Dependency architecture fitness
      status: passed
      evidence:
          - check: Dependency and placement controlled cases
            command: python3 -m unittest tooling.tests.test_governance tooling.tests.test_governance_contracts
            result: passed
            details: Thirty-seven tests prove valid imports pass, forbidden imports fail, transitional violations report without failing, future rules remain non-blocking, new semantic islands require architecture declarations, schema references stay within authority roots, fixture authority stays bounded, and malformed policies or governed source fail closed.
          - check: Repository-wide architecture analysis
            command: ./strling governance --json
            result: passed
            details: Eight current rules pass for governance and quality dependency direction, generated-input acyclicity, fixture authority, task and top-level placement, specification schema references, and new tooling semantic islands.
          - check: Evaluated transitional dependencies
            command: ./strling governance --json
            result: passed
            details: The analyzer reports 34 duplicated binding compiler paths, 1094 implementation-derived fixture or generator paths, and six direct LSP-to-Python-binding imports as transitional evidence with explicit retirement conditions.
          - check: Future-state separation
            command: future-rule controlled case and repository-wide analysis
            result: passed
            details: The binding-to-canonical-core rule remains future and non-blocking until a canonical core exists and each adapter migration, legacy removal, and behavior-preservation certification is complete.
    - name: Quality and CI integration certification
      status: passed
      evidence:
          - check: Canonical hardgate routing
            command: BUNDLER_VERSION=2.4.20 ./strling check; BUNDLER_VERSION=2.4.20 ./strling certify
            result: passed
            details: Both aggregates run contract snapshot verification, generated-artifact verification, and governance with dependency fitness before component operations; CI fetches full history and invokes only ./strling check without duplicated comparison logic, catch-all waivers, reset-on-check behavior, continue-on-error, or ignored extraction failure.
          - check: Human and structured certification
            command: ./strling check; ./strling certify; ./strling check --json; ./strling certify --json; ./strling contracts --check --json; ./strling governance --json
            result: passed
            details: All six committed-state operations passed, both aggregate JSON documents parsed, and the contract and governance reports identified enforced, transitional, and future results without timestamps or environment paths.
          - check: Controlled CI-equivalent failures
            command: python3 -m unittest tooling.tests.test_quality tooling.tests.test_governance tooling.tests.test_governance_contracts tooling.tests.test_contract_declarations tooling.tests.test_public_contracts
            result: passed
            details: All 106 focused tests passed, including removed and added symbols, signature drift, stale snapshots, extraction failure, undeclared and mismatched declarations, additive and breaking schemas, forbidden dependencies, transitional and future rules, malformed policies, and aggregate hardgate failure propagation.
          - check: Affected language baselines
            command: ./strling test c; ./strling test go; ./strling test python; ./strling test r; ./strling test typescript
            result: passed
            details: C passed 596 checks and 20 tests, Go passed, Python passed 789 tests, R passed 725 tests, and the complete TypeScript baseline passed 19 suites and 963 tests.
          - check: Schema, CI, and repository integrity
            command: governance JSON parsing; task and CI YAML parsing; git diff --check; git status --short
            result: passed
            details: Every governance JSON document, task YAML record, and the CI workflow parsed successfully; patch integrity passed and checkpoint-5 commit a943227c05c26e01ea29babe76962452e00a9faa was clean before this records-only update.
    - name: Completion and next-task readiness
      status: passed
      evidence:
          - check: Committed-state leaf hardgates
            command: ./strling format --check; ./strling hygiene; ./strling lint; ./strling typecheck; ./strling generate --check; ./strling contracts --check; ./strling governance
            result: passed
            details: Every enforced formatter, hygiene check, analyzer, static check, generated-artifact verifier, public-contract extractor, declaration validator, and active architecture rule passed; incomplete capabilities remained explicit transitions rather than fabricated successes.
          - check: Committed-state aggregate certification
            command: BUNDLER_VERSION=2.4.20 ./strling check; BUNDLER_VERSION=2.4.20 ./strling check --json; BUNDLER_VERSION=2.4.20 ./strling certify; BUNDLER_VERSION=2.4.20 ./strling certify --json
            result: passed
            details: Canonical developer, CI-equivalent, structured, and certification aggregates passed from checkpoint-5 committed state, including contract, generation, governance, component quality, and all 963 TypeScript tests.
          - check: Public contract certification
            command: ./strling contracts --check; ./strling contracts --check --json
            result: passed
            details: Ten enforceable surfaces reproduced exactly, twelve bounded extraction transitions reported, and base-relative change classification found no undeclared public or product schema drift.
          - check: Architecture fitness certification
            command: ./strling governance; ./strling governance --json
            result: passed
            details: Eight active rules passed repository-wide; three transitional structures reported 34 duplicated compiler paths, 1094 fixture or generator paths, and six direct LSP-to-Python-binding imports; one canonical-core rule remained future and non-blocking.
          - check: Behavior and readiness review
            result: passed
            details: No product files, package versions, public APIs, compiler behavior, language semantics, or legacy implementations changed; all remaining gaps have objective retirement conditions and do not block the certified baseline-freeze task.
