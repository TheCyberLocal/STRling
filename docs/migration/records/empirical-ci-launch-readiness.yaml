required_verification:
    - name: Exact runtime provisioning and identity
      command: python3 -m tooling.exact_runtime_provision --provision
      expected_result: All four runtime artifacts for five profiles match governed source, build, artifact, and reported identities.
    - name: Real-engine semantic equivalence
      command: python3 -m tooling.adversarial_semantic_audit --strict --json --output artifacts/adversarial-semantic-runtime/evidence.json
      expected_result: The complete five-profile matrix has zero findings, runtime mismatches, target rejections, or unaccounted observations.
    - name: Launch-facing focused checks
      command: Run tooling launch-readiness, exact-runtime, LSP package, atomic safety, and binding documentation tests.
      expected_result: Target currency, editor routing, API references, diagnostic authority, dependency review, tooling governance, and atomic safety pass.
    - name: Architecture and generated integrity
      command: Run architecture, governance, generated-artifact, contract, documentation, formatting, and static-analysis gates.
      expected_result: Architecture remains 33/33 and all deterministic integrity checks pass.
    - name: Local profile
      command: ./strling profile local
      expected_result: The canonical Local profile is green.
    - name: Pull Request profile
      command: ./strling profile pull-request
      expected_result: The canonical Pull Request profile is green and executes the exact-engine matrix.
    - name: Final certification selection
      command: Inspect the registered release contract before Full or Release.
      expected_result: V4-H08 retains final release-scale recertification, so this task does not sample Full or Release.
invariant_inventory:
    - invariant_id: governed-real-engine-equivalence
      architectural_claim: Every applicable emitted artifact in the adversarial corpus executes on its exact governed runtime during Pull Request and either agrees cross-profile or is stopped by a governed refusal.
      authoritative_source: toolchain.json, governance/exact-runtime-toolchains.json, and tests/conformance/adversarial/1.0
      positive_allowed_form: Exact runtime hashes and versions validate, two runs agree, all applicable normalized results agree, and structured evidence binds source/profile/runtime/artifact/subject identities.
      forbidden_form: Ambient runtime substitution, missing runtime treated as pass, emitted cross-profile disagreement, unexpected target rejection, stale identity, or unaccounted observation.
      mechanical_detection_method: Exact-runtime validator, strict adversarial certification result, Pull Request profile membership, and focused mutation tests.
      current_observed_state: Pull Request provisions and validates every exact runtime, executes the complete matrix, retains identity-bound evidence, and rejects missing, stale, divergent, or unaccounted observations.
      expected_ratchet: Pull Request, Full, and Release inherit the same fail-closed exact-engine operation; Local retains the current-source offline zero-finding ratchet.
