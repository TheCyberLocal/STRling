[package]
name = "strling-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "Canonical STRling compiler kernel"
publish = false
autotests = false
autoexamples = false

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lib]
name = "strling_kernel"
path = "../src/lib.rs"

[[bin]]
name = "strling-kernel"
path = "../cli/strling-kernel.rs"

[[bin]]
name = "strling-editor-core"
path = "../cli/strling-editor-core.rs"

[[example]]
name = "shared_conformance_projection"
path = "../examples/shared_conformance_projection.rs"

