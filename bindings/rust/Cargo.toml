[package]
name = "strling"
version = "3.0.0"
authors = ["STRling Team"]
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "STRling core library - Next-gen string pattern DSL & compiler for Rust"
homepage = "https://github.com/strling-lang/strling"
repository = "https://github.com/strling-lang/strling"
documentation = "https://github.com/strling-lang/strling/tree/main/docs"
keywords = ["strling", "regex", "regexp", "pattern", "parser"]
categories = ["parsing", "text-processing", "development-tools"]

[dependencies]
strling-kernel = { path = "../../core" }

[dev-dependencies]
serde_json = "1.0"

[lib]
name = "strling"
path = "src/lib.rs"
