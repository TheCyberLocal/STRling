[package]
name = "strling-interop"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Stable native and WebAssembly adapter boundary for the canonical STRling compiler"
publish = false

[workspace]
members = [".", "fuzz"]
default-members = ["."]
resolver = "2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strling-kernel = { path = "../../core" }

[lib]
name = "strling_interop"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]
