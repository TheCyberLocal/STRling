[package]
name = "strling-interop-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "1.0"
strling-interop = { path = ".." }
strling-kernel = { path = "../../../core" }

[[bin]]
name = "fuzz-arbitrary-bytes"
path = "fuzz_targets/fuzz_arbitrary_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-structured-envelope"
path = "fuzz_targets/fuzz_structured_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-length-boundaries"
path = "fuzz_targets/fuzz_length_boundaries.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-simply-graphs"
path = "fuzz_targets/fuzz_simply_graphs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-target-profiles"
path = "fuzz_targets/fuzz_target_profiles.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-ownership-sequences"
path = "fuzz_targets/fuzz_ownership_sequences.rs"
test = false
doc = false
bench = false
