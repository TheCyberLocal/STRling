# Delivery & Deployment Pipeline
# Triggered after successful completion of STRling CI workflow on main branch
# Deploys only when the repository is synchronized to the Python SSOT version
# Supports safe retries by skipping artifacts or tags that already exist

name: STRling CD
on:
    workflow_run:
        workflows: ["STRling CI"]
        branches: [main]
        types: [completed]
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Run deployment in dry-run mode"
                required: true
                default: true
                type: boolean
            tag_name:
                description: "Tag name to simulate"
                required: false
                default: ""

permissions:
    contents: read

jobs:
    release-certification:
        name: Certify Release Envelope
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
        steps:
            - name: Checkout release candidate
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
                  fetch-depth: 0

            - name: Install Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.12"

            - name: Install Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      bindings/typescript/package-lock.json
                      tooling/lsp-server/package-lock.json

            - name: Install Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  cache: false
                  go-version: "1.22"

            - name: Install .NET
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: "9.0.x"

            - name: Install Dart SDK
              uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
              with:
                  sdk: "3.10.1"

            - name: Install Ruby and Bundler
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with:
                  ruby-version: "3.2"
                  bundler: "2.4.20"

            - name: Install certification dependencies
              run: |
                  npm ci --ignore-scripts --no-audit --no-fund
                  npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/lsp-server
                  python -m pip install --requirement tooling/requirements-quality.txt
                  for component in csharp dart fsharp go perl ruby typescript; do
                    ./strling setup "$component"
                  done
                  cargo install cargo-audit --version 0.22.2 --locked
                  mkdir -p artifacts/tools
                  curl --fail --location --output artifacts/tools/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
                  echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  artifacts/tools/osv-scanner" | sha256sum --check
                  chmod 0755 artifacts/tools/osv-scanner
                  echo "STRLING_OSV_SCANNER=${GITHUB_WORKSPACE}/artifacts/tools/osv-scanner" >> "$GITHUB_ENV"

            - name: Run canonical release certification profile
              env:
                  ARTIFACT_PATH: artifacts/certification-release.json
              run: |
                  mkdir -p artifacts
                  ./strling profile release --artifact "$ARTIFACT_PATH"

            - name: Derive structured product certification
              if: ${{ always() }}
              env:
                  ARTIFACT_PATH: artifacts/certification-release.json
                  PRODUCT_ARTIFACT_PATH: artifacts/product-certification-release.json
                  PRODUCT_REPORT_PATH: artifacts/product-certification-release.md
              run: python3 tooling/product_certification.py --profile-artifact "$ARTIFACT_PATH" --artifact "$PRODUCT_ARTIFACT_PATH" --report "$PRODUCT_REPORT_PATH"

            - name: Retain release certification evidence
              if: ${{ always() }}
              continue-on-error: true
              uses: &governed-upload-artifact actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: certification-release-${{ github.run_id }}
                  path: |
                      artifacts/certification-release.json
                      artifacts/product-certification-release.json
                      artifacts/product-certification-release.md
                  if-no-files-found: warn
                  retention-days: 90

    # ==========================================
    # TIER 1: GLOBAL PREFLIGHT GATE
    # ==========================================
    verify-release:
        name: Verify Release Conditions
        needs: release-certification
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
        outputs:
            is_release: ${{ steps.release_state.outputs.is_release }}
            tag_version: ${{ steps.release_state.outputs.tag_version }}
            version: ${{ steps.release_state.outputs.version }}
            is_dry_run: ${{ steps.release_state.outputs.is_dry_run }}
            release_ref: ${{ steps.release_state.outputs.release_ref }}
        steps:
            - name: Checkout triggering commit
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
                  fetch-depth: 0

            - name: Setup Python 3.11
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.11"

            - name: Inject Apache 2.0 License
              run: curl -L -o LICENSE https://www.apache.org/licenses/LICENSE-2.0.txt

            - name: Verify SSOT release state
              id: release_state
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.dry_run }}" == "false" ]]; then
                    echo "is_dry_run=false" >> $GITHUB_OUTPUT
                  else
                    echo "is_dry_run=true" >> $GITHUB_OUTPUT
                  fi

                  REF="${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}"
                  echo "release_ref=$REF" >> $GITHUB_OUTPUT

                  python <<'PY'
                  import json, os, re, sys
                  import xml.etree.ElementTree as ET
                  from glob import glob
                  from pathlib import Path

                  try: import tomllib
                  except ModuleNotFoundError: import tomli as tomllib

                  def read_text(p): return Path(p).read_text(encoding='utf-8')
                  def require_match(l, p, t):
                      m = re.search(p, t, re.M)
                      if not m: raise RuntimeError(f"No version for {l}.")
                      return m.group(1).strip()
                  def verify_version(file_path, expected_version, pattern=None, template_path=None, template_suffix='-template'):
                      path = Path(file_path)
                      if path.exists():
                        content = read_text(path)
                        if pattern:
                          value = require_match(path.stem, pattern, content)
                          if expected_version not in value and expected_version != value:
                            raise ValueError(f"Version mismatch in {file_path}")
                          return value
                        if expected_version not in content:
                          raise ValueError(f"Version mismatch in {file_path}")
                        return expected_version

                      if template_path is None:
                        template_path = path.with_name(f"{path.stem}{template_suffix}{path.suffix}")
                      else:
                        template_path = Path(template_path)
                      if template_path.exists():
                        content = read_text(template_path)
                        if "VERSION" in content:
                          print(f"✅ Verified {template_path.name} uses VERSION placeholder")
                          return expected_version
                        raise ValueError(f"Template {template_path} is missing the 'VERSION' placeholder string.")
                      raise FileNotFoundError(f"Could not find {file_path} or its template.")

                  # Extract versions
                  python_raw = tomllib.loads(read_text('bindings/python/pyproject.toml'))['project']['version']
                  ssot = python_raw

                  java_tree = ET.fromstring(read_text('bindings/java/pom.xml'))
                  fsharp_tree = ET.fromstring(read_text('bindings/fsharp/src/STRling/STRling.fsproj'))
                  lua_version = verify_version('bindings/lua/strling.rockspec', ssot, r'^version\s*=\s*"([^"]+)"')
                  lua_path = Path('bindings/lua/strling.rockspec') if Path('bindings/lua/strling.rockspec').exists() else Path('bindings/lua/strling-template.rockspec')
                  lua_text = read_text(lua_path)
                  ruby_version = verify_version('bindings/ruby/strling.gemspec', ssot, r"spec\.version\s*=\s*'([^']+)'", 'bindings/ruby/strling.gemspec.template')

                  # Fix for f-string backslash limitation in Python < 3.12
                  cpp_text = read_text('bindings/cpp/CMakeLists.txt')
                  cpp_base = require_match('C++', r'project\([\s\S]*?VERSION\s+([0-9\.]+)', cpp_text)
                  cpp_pre_match = re.search(r'STRLING_PRERELEASE_TAG\s+"([^"]+)"', cpp_text)
                  cpp_v = f"{cpp_base}-{cpp_pre_match.group(1)}" if cpp_pre_match else cpp_base

                  versions = {
                      'C': require_match('C', r'return\s+"([^"]+)";', read_text('bindings/c/src/strling.c')),
                      'C#': require_match('C#', r'<Version>([^<]+)</Version>', read_text('bindings/csharp/src/STRling/STRling.csproj')),
                      'C++': cpp_v,
                      'Dart': require_match('Dart', r'^version:\s*(.+)$', read_text('bindings/dart/pubspec.yaml')),
                      'F#': require_match('F#', r'<Version>([^<]+)</Version>', read_text('bindings/fsharp/src/STRling/STRling.fsproj')),
                      'Java': java_tree.findtext('{http://maven.apache.org/POM/4.0.0}version') or 'unknown',
                      'Kotlin': require_match('Kotlin', r'^version\s*=\s*providers\.gradleProperty\("version"\)\.orElse\("([^"]+)"\)\.get\(\)', read_text('bindings/kotlin/build.gradle.kts')),
                      'Lua': lua_version.split('-')[0],
                      'Perl': require_match('Perl', r"\$VERSION\s*=\s*'([^']+)'", read_text('bindings/perl/lib/STRling.pm')),
                      'PHP': json.loads(read_text('bindings/php/composer.json'))['version'],
                      'R': require_match('R', r'^Version:\s*(.+)$', read_text('bindings/r/DESCRIPTION')),
                      'Ruby': ruby_version,
                      'Rust': tomllib.loads(read_text('Cargo.toml'))['package']['version'],
                      'TypeScript': json.loads(read_text('bindings/typescript/package.json'))['version'],
                  }

                  mismatches = [f"{b}: expected {ssot}, found {v}" for b, v in versions.items() if v != ssot]
                  fsharp_pkg_id = fsharp_tree.findtext('{http://schemas.microsoft.com/developer/msbuild/2003}PropertyGroup/{http://schemas.microsoft.com/developer/msbuild/2003}PackageId') or fsharp_tree.findtext('./PropertyGroup/PackageId')
                  if fsharp_pkg_id != 'STRling.FSharp':
                      mismatches.append(f"F#: expected PackageId STRling.FSharp, found {fsharp_pkg_id or 'missing'}")
                  lua_tag = require_match('Lua tag', r'tag\s*=\s*"([^"]+)"', lua_text)
                  if 'VERSION' not in lua_text and lua_tag != f"v{python_raw}":
                      mismatches.append("Lua tag mismatch")

                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f"version={python_raw}\n")
                      f.write(f"tag_version={python_raw}\n")
                      f.write("is_release=false\n" if mismatches else "is_release=true\n")

                  if mismatches:
                      for m in mismatches: print(f"::error::{m}")
                      sys.exit(1)
                  PY

    # ==========================================
    # TIER 2: INDEPENDENT COMPILE TRACKS
    # ==========================================
    compile-c:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Install Dependencies
              run: sudo apt-get update && sudo apt-get install -y libjansson-dev
            - run: make
              working-directory: bindings/c

            - name: Checkout reproducibility source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  persist-credentials: false
                  fetch-depth: 0
                  path: .rebuild
            - name: Isolate disposable build outputs
              run: |
                  printf '/.rebuild/\n/artifacts/\n' >> .git/info/exclude
            - run: make
              working-directory: .rebuild/bindings/c
            - name: Capture authenticated build receipts
              run: |
                  python3 -m pip install --requirement tooling/requirements-quality.txt
                  python3 -m tooling.release_supply_chain capture --artifact-id release:c --version "${{ needs.verify-release.outputs.version }}" --source-root . --output-dir artifacts/build-receipts/c-first.json --json
                  python3 -m tooling.release_supply_chain capture --artifact-id release:c --version "${{ needs.verify-release.outputs.version }}" --source-root .rebuild --output-dir artifacts/build-receipts/c-second.json --json

            - name: Retain exact governed c rebuild
              uses: *governed-upload-artifact
              with:
                  name: rebuild-c-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      .rebuild/bindings/c
                  if-no-files-found: error
                  retention-days: 7

            - name: Retain authenticated c build receipts
              uses: *governed-upload-artifact
              with:
                  name: release-build-receipt-c-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      artifacts/build-receipts/c-first.json
                      artifacts/build-receipts/c-second.json
                  if-no-files-found: error
                  retention-days: 7

            - name: Retain exact governed c artifact
              uses: *governed-upload-artifact
              with:
                  name: release-c-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      bindings/c
                  if-no-files-found: error
                  retention-days: 7

    compile-cpp:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - run: pip install conan && conan create . --version "${{ needs.verify-release.outputs.version }}"
              working-directory: bindings/cpp

            - name: Checkout reproducibility source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  persist-credentials: false
                  fetch-depth: 0
                  path: .rebuild
            - name: Isolate disposable build outputs
              run: |
                  printf '/.rebuild/\n/artifacts/\n' >> .git/info/exclude
            - run: conan create . --version "${{ needs.verify-release.outputs.version }}"
              working-directory: .rebuild/bindings/cpp
            - name: Capture authenticated build receipts
              run: |
                  python3 -m pip install --requirement tooling/requirements-quality.txt
                  python3 -m tooling.release_supply_chain capture --artifact-id release:cpp --version "${{ needs.verify-release.outputs.version }}" --source-root . --output-dir artifacts/build-receipts/cpp-first.json --json
                  python3 -m tooling.release_supply_chain capture --artifact-id release:cpp --version "${{ needs.verify-release.outputs.version }}" --source-root .rebuild --output-dir artifacts/build-receipts/cpp-second.json --json

            - name: Retain exact governed cpp rebuild
              uses: *governed-upload-artifact
              with:
                  name: rebuild-cpp-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      .rebuild/bindings/cpp
                  if-no-files-found: error
                  retention-days: 7

            - name: Retain authenticated cpp build receipts
              uses: *governed-upload-artifact
              with:
                  name: release-build-receipt-cpp-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      artifacts/build-receipts/cpp-first.json
                      artifacts/build-receipts/cpp-second.json
                  if-no-files-found: error
                  retention-days: 7

            - name: Retain exact governed c++ artifact
              uses: *governed-upload-artifact
              with:
                  name: release-cpp-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      bindings/cpp
                  if-no-files-found: error
                  retention-days: 7

    compile-csharp:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with: { dotnet-version: "9.0" }
            - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.75.0
              with:
                  toolchain: 1.75.0
            - shell: pwsh
              run: |
                  cargo +1.75.0 build --manifest-path ../interop/Cargo.toml --release --locked
                  $env:STRlingNativeLibrary = (Resolve-Path ../interop/target/release/strling_interop.dll)
                  $env:STRlingNativeRid = "win-x64"
                  dotnet pack -c Release
              working-directory: bindings/csharp

            - name: Checkout reproducibility source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  persist-credentials: false
                  fetch-depth: 0
                  path: .rebuild
            - name: Isolate disposable build outputs
              shell: pwsh
              run: |
                  $exclude = Join-Path (Resolve-Path .) '.git/info/exclude'
                  Add-Content -Path $exclude -Value "/.rebuild/`n/artifacts/"
            - shell: pwsh
              run: |
                  cargo +1.75.0 build --manifest-path ../interop/Cargo.toml --release --locked
                  $env:STRlingNativeLibrary = (Resolve-Path ../interop/target/release/strling_interop.dll)
                  $env:STRlingNativeRid = "win-x64"
                  dotnet pack -c Release
              working-directory: .rebuild/bindings/csharp
            - name: Capture authenticated build receipts
              shell: pwsh
              run: |
                  python -m pip install --requirement tooling/requirements-quality.txt
                  python -m tooling.release_supply_chain capture --artifact-id release:csharp --version "${{ needs.verify-release.outputs.version }}" --source-root . --output-dir artifacts/build-receipts/csharp-first.json --json
                  python -m tooling.release_supply_chain capture --artifact-id release:csharp --version "${{ needs.verify-release.outputs.version }}" --source-root .rebuild --output-dir artifacts/build-receipts/csharp-second.json --json

            - name: Retain exact governed csharp rebuild
              uses: *governed-upload-artifact
              with:
                  name: rebuild-csharp-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      .rebuild/bindings/csharp/src/STRling/bin/Release/*.nupkg
                  if-no-files-found: error
                  retention-days: 7

            - name: Retain authenticated csharp build receipts
              uses: *governed-upload-artifact
              with:
                  name: release-build-receipt-csharp-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      artifacts/build-receipts/csharp-first.json
                      artifacts/build-receipts/csharp-second.json
                  if-no-files-found: error
                  retention-days: 7

            - name: Retain exact governed c# artifact
              uses: *governed-upload-artifact
              with:
                  name: release-csharp-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      bindings/csharp/src/STRling/bin/Release/*.nupkg
                  if-no-files-found: error
                  retention-days: 7

    compile-dart:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
            - run: dart pub get
              working-directory: bindings/dart
            - run: dart analyze --no-fatal-warnings
              working-directory: bindings/dart
            - run: dart pub publish --dry-run
              working-directory: bindings/dart

            - name: Checkout reproducibility source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  persist-credentials: false
                  fetch-depth: 0
                  path: .rebuild
            - name: Isolate disposable build outputs
              run: |
                  printf '/.rebuild/\n/artifacts/\n' >> .git/info/exclude
            - run: dart pub get
              working-directory: .rebuild/bindings/dart
            - run: dart analyze --no-fatal-warnings
              working-directory: .rebuild/bindings/dart
            - run: dart pub publish --dry-run
              working-directory: .rebuild/bindings/dart
            - name: Capture authenticated build receipts
              run: |
                  python3 -m pip install --requirement tooling/requirements-quality.txt
                  python3 -m tooling.release_supply_chain capture --artifact-id release:dart --version "${{ needs.verify-release.outputs.version }}" --source-root . --output-dir artifacts/build-receipts/dart-first.json --json
                  python3 -m tooling.release_supply_chain capture --artifact-id release:dart --version "${{ needs.verify-release.outputs.version }}" --source-root .rebuild --output-dir artifacts/build-receipts/dart-second.json --json

            - name: Retain exact governed dart rebuild
              uses: *governed-upload-artifact
              with:
                  name: rebuild-dart-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      .rebuild/bindings/dart
                  if-no-files-found: error
                  retention-days: 7

            - name: Retain authenticated dart build receipts
              uses: *governed-upload-artifact
              with:
                  name: release-build-receipt-dart-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      artifacts/build-receipts/dart-first.json
                      artifacts/build-receipts/dart-second.json
                  if-no-files-found: error
                  retention-days: 7

            - name: Retain exact governed dart artifact
              uses: *governed-upload-artifact
              with:
                  name: release-dart-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      bindings/dart
                  if-no-files-found: error
                  retention-days: 7

    compile-fsharp:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with: { dotnet-version: "9.0" }
            - run: dotnet pack src/STRling.FSharp/STRling.FSharp.fsproj -c Release
              working-directory: bindings/fsharp

            - name: Checkout reproducibility source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  persist-credentials: false
                  fetch-depth: 0
                  path: .rebuild
            - name: Isolate disposable build outputs
              run: |
                  printf '/.rebuild/\n/artifacts/\n' >> .git/info/exclude
            - run: dotnet pack src/STRling.FSharp/STRling.FSharp.fsproj -c Release
              working-directory: .rebuild/bindings/fsharp
            - name: Capture authenticated build receipts
              run: |
