        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Restore certified f# artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-fsharp-${{ needs.verify-release.outputs.release_ref }}
                  path: bindings/fsharp
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with: { dotnet-version: "9.0" }
            - working-directory: bindings/fsharp
              env:
                  NUGET_KEY: ${{ secrets.NUGET_KEY }}
              run: |
                  VER=$(grep "<Version>" src/STRling/STRling.fsproj | sed -e 's/.*<Version>\(.*\)<\/Version>.*/\1/')
                  if python3 ../../tooling/check_version_exists.py --registry nuget --package "STRling.FSharp" --version "$VER"; then exit 0; fi
                  dotnet pack src/STRling/STRling.fsproj -c Release
                  [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]] && exit 0
                  dotnet nuget push src/STRling/bin/Release/*.nupkg -k "$NUGET_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

    publish-java:
        needs:
            [
                verify-release,
                compile-java,
                certify-release-supply-chain,
                release-certification,
            ]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false'
        runs-on: ubuntu-latest
        environment: release
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Restore certified java artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-java-${{ needs.verify-release.outputs.release_ref }}
                  path: bindings/java
            - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with: { distribution: "temurin", java-version: "11" }
            - name: 🔑 Import GPG Private Key
              env:
                  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
              run: |
                  printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

            - name: 🚀 Deploy to Sonatype (OSSRH)
              working-directory: bindings/java
              env:
                  SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
                  SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
                  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
              run: |
                  VER=$(grep '<version>' pom.xml | head -1 | sed -e 's/.*<version>\(.*\)<\/version>.*/\1/')
                  if python3 ../../tooling/check_version_exists.py --registry maven --group "com.strling" --package "strling" --version "$VER"; then exit 0; fi
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    mvn deploy -DskipTests -Dgpg.skip=true -Dmaven.deploy.skip=true --settings ../../tooling/maven-settings.xml
                  else
                    mvn deploy -DskipTests --settings ../../tooling/maven-settings.xml -Dgpg.passphrase="${GPG_PASSPHRASE}"
                  fi

    publish-kotlin:
        needs:
            [
                verify-release,
                compile-kotlin,
                certify-release-supply-chain,
                release-certification,
            ]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false'
        runs-on: ubuntu-latest
        environment: release
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Restore certified kotlin artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-kotlin-${{ needs.verify-release.outputs.release_ref }}
                  path: bindings/kotlin
            - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with: { distribution: "temurin", java-version: "11" }
            - working-directory: bindings/kotlin
              env:
                  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
                  MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
                  ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
              run: |
                  VER="${{ needs.verify-release.outputs.version }}"
                  FILE_VER=$(grep -E '^version = providers\.gradleProperty\("version"\)\.orElse\("[^"]+"\)\.get\(\)$' build.gradle.kts | sed -E 's/.*orElse\("([^"]+)"\).*/\1/')
                  if [ "$FILE_VER" != "$VER" ]; then
                    echo "Version mismatch: $FILE_VER != $VER"
                    exit 1
                  fi
                  if python3 ../../tooling/check_version_exists.py --registry maven --group "com.strling" --package "strling-kotlin" --version "$VER"; then exit 0; fi
                  TARGET_TASK="publishToMavenLocal"
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "false" ]; then
                    TARGET_TASK="publish"
                  fi
                  ./gradlew "$TARGET_TASK" -Pversion="$VER"

    publish-lua:
        needs:
            [
                verify-release,
                compile-lua,
                certify-release-supply-chain,
                release-certification,
            ]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false'
        runs-on: ubuntu-latest
        environment: release
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Restore certified lua artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-lua-${{ needs.verify-release.outputs.release_ref }}
                  path: bindings/lua
            - uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12
            - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
            - working-directory: bindings/lua
              env:
                  LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
              run: |
                  VERSION="${{ needs.verify-release.outputs.version }}"
                  ROCKSPEC="strling-${VERSION}-1.rockspec"

                  sed "s/VERSION/${VERSION}/g" strling-template.rockspec > "$ROCKSPEC"

                  luarocks lint "$ROCKSPEC"

                  ROCKSPEC_VERSION=$(grep '^version =' "$ROCKSPEC" | cut -d '"' -f 2)
                  if python3 ../../tooling/check_version_exists.py --registry luarocks --package "strling" --version "$ROCKSPEC_VERSION"; then exit 0; fi

                  if [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]]; then
                    echo "DRY RUN: luarocks make $ROCKSPEC"
                    luarocks make "$ROCKSPEC"
                  else
                    luarocks upload "$ROCKSPEC" --api-key="${LUAROCKS_API_KEY}"
                  fi

    publish-perl:
        needs:
            [
                verify-release,
                compile-perl,
                certify-release-supply-chain,
                release-certification,
            ]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false'
        runs-on: ubuntu-latest
        environment: release
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Restore certified perl artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-perl-${{ needs.verify-release.outputs.release_ref }}
                  path: bindings/perl
            - uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
            - name: Build and Publish
              working-directory: bindings/perl
              env:
                  PAUSE_USERNAME: ${{ secrets.PAUSE_USERNAME }}
                  PAUSE_PASSWORD: ${{ secrets.PAUSE_PASSWORD }}
              run: |
                  cpanm --notest CPAN::Uploader ExtUtils::MakeMaker
                  perl Makefile.PL
                  perl -MExtUtils::Manifest=mkmanifest -e mkmanifest
                  make dist
                  PKG_FILE="STRling-${{ needs.verify-release.outputs.version }}.tar.gz"
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    echo "DRY RUN: Successfully created $PKG_FILE"
                  else
                    cpan-upload -u $PAUSE_USERNAME -p $PAUSE_PASSWORD "$PKG_FILE"
                  fi

    publish-python:
        needs:
            [
                verify-release,
                compile-python,
                certify-release-supply-chain,
                release-certification,
            ]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false'
        runs-on: ubuntu-latest
        environment: release
        permissions: { id-token: write, contents: read }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Restore certified python artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-python-${{ needs.verify-release.outputs.release_ref }}
                  path: bindings/python
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with: { python-version: "3.10" }
            - working-directory: bindings/python
              id: prepare
              run: |
                  pip install build twine tomli
                  VER=$(python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
                  if python ../../tooling/check_version_exists.py --registry pypi --package "STRling" --version "$VER"; then
                    echo "publish=false" >> $GITHUB_OUTPUT
                    echo "Version already exists in PyPI; skipping upload."
                    exit 0
                  fi

                  python -m build

                  if [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]]; then
                    echo "publish=false" >> $GITHUB_OUTPUT
                    echo "Dry run enabled; PyPI upload skipped."
                    exit 0
                  fi

                  echo "publish=true" >> $GITHUB_OUTPUT
            - if: steps.prepare.outputs.publish == 'true'
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with: { packages-dir: bindings/python/dist/ }

    publish-ruby:
        needs:
            [
                verify-release,
                compile-ruby,
                certify-release-supply-chain,
                release-certification,
            ]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false'
        runs-on: ubuntu-latest
        environment: release
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Restore certified ruby artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-ruby-${{ needs.verify-release.outputs.release_ref }}
                  path: bindings/ruby
            - name: 💎 Setup Ruby
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with:
                  ruby-version: "3.2"
                  rubygems: latest

            - name: 🔑 Configure RubyGems OIDC
              uses: rubygems/configure-rubygems-credentials@abfabee9aa68f1c2c95a6f58c91d826e5fac33da # main

            - name: 🚀 Build and Publish Gem
              working-directory: bindings/ruby
              run: |
                  VERSION="${{ needs.verify-release.outputs.version }}"

                  # 1. Idempotency Guard
                  if python3 ../../tooling/check_version_exists.py --registry rubygems --package "strling" --version "$VERSION"; then
                    echo "Version $VERSION already exists on RubyGems. Skipping publish."
                    exit 0
                  fi

                  # 2. Build Artifact
                  GEMSPEC="strling.gemspec"
                  sed "s/VERSION/${VERSION}/g" strling.gemspec.template > $GEMSPEC
                  gem build $GEMSPEC

                  # 3. Conditional Push
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    echo "DRY RUN: Successfully built strling-${VERSION}.gem (push skipped)"
                  else
                    # The CLI will now find the OIDC token automatically via the action above
                    gem push "strling-${VERSION}.gem"
                  fi

                  rm -f $GEMSPEC

    publish-rust:
        needs:
            [
                verify-release,
                compile-rust,
                certify-release-supply-chain,
                release-certification,
            ]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false'
        runs-on: ubuntu-latest
        environment: release
        permissions: { id-token: write, contents: read }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Restore certified rust artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-rust-${{ needs.verify-release.outputs.release_ref }}
                  path: .
            - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.75.0
              with:
                  toolchain: 1.75.0
            - run: |
                  VER=$(grep "^version" Cargo.toml | head -n 1 | cut -d '"' -f 2)
                  if python3 tooling/check_version_exists.py --registry crates --package "strling" --version "$VER"; then exit 0; fi
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    cargo publish --dry-run
                  else
                    cargo publish
                  fi

    publish-typescript:
        needs:
            [
                verify-release,
                compile-typescript,
                certify-release-supply-chain,
                release-certification,
            ]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false'
        runs-on: ubuntu-latest
        environment: release
        permissions: { id-token: write, contents: read }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Restore certified typescript artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-typescript-${{ needs.verify-release.outputs.release_ref }}
                  path: bindings/typescript
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  {
                      node-version: "22",
                      registry-url: "https://registry.npmjs.org",
                  }
            - working-directory: bindings/typescript
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  VER=$(node -pe "require('./package.json').version")
                  if python ../../tooling/check_version_exists.py --registry npm --package "@strling-lang/strling" --version "$VER"; then exit 0; fi
                  npm ci && npm run build
                  TAG="latest"
                  [[ "$VER" == *-* ]] && TAG="${VER#*-}"
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    npm publish --dry-run --access public --tag "$TAG"
                  else
                    npm publish --access public --tag "$TAG"
                  fi

    verify-cpan-distributor:
        needs: [verify-release, publish-perl, publish-typescript]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false' && needs.publish-perl.result == 'success' && needs.publish-typescript.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
            - shell: bash
              run: |
                  EXPECTED="${{ needs.verify-release.outputs.tag_version }}"
                  for attempt in {1..8}; do
                    cpanm --notest STRling >/dev/null 2>&1 || true
                    INSTALLED=$(perl -MSTRling -e 'print $STRling::VERSION' 2>/dev/null || echo "")

                    if [[ "$INSTALLED" == "$EXPECTED" ]]; then exit 0; fi
                    echo "Attempt $attempt: Expected $EXPECTED, found $INSTALLED. Retrying in 15s..."
                    [[ "$attempt" -lt 8 ]] && sleep 15
                  done
                  exit 1

    verify-crates-distributor:
        needs: [verify-release, publish-rust, publish-typescript]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false' && needs.publish-rust.result == 'success' && needs.publish-typescript.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
            - shell: bash
              run: |
                  EXPECTED="${{ needs.verify-release.outputs.tag_version }}"
                  for attempt in {1..8}; do
                    # Use the API directly to bypass index latency
                    INSTALLED=$(curl -s -H "User-Agent: STRling-CI (contact@strling.com)" https://crates.io/api/v1/crates/strling | jq -r '.crate.max_version')

                    if [[ "$INSTALLED" == "$EXPECTED" ]]; then
                      echo "✅ Verified $EXPECTED is live on crates.io"
                      exit 0
                    fi

                    echo "Attempt $attempt: Expected $EXPECTED, found $INSTALLED. Retrying in 15s..."
                    [[ "$attempt" -lt 8 ]] && sleep 15
                  done
                  exit 1

    verify-gems-distributor:
        needs: [verify-release, publish-ruby, publish-typescript]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false' && needs.publish-ruby.result == 'success' && needs.publish-typescript.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with: { ruby-version: "3.2" }
            - shell: bash
              run: |
                  EXPECTED="${{ needs.verify-release.outputs.tag_version }}"
                  for attempt in {1..8}; do
                    INSTALLED=$(curl -s -H "User-Agent: STRling-CI" https://rubygems.org/api/v1/gems/strling.json | jq -r '.version')

                    if [[ "$INSTALLED" == "$EXPECTED" ]]; then exit 0; fi
                    echo "Attempt $attempt: Expected $EXPECTED, found $INSTALLED. Retrying in 15s..."
                    [[ "$attempt" -lt 8 ]] && sleep 15
                  done
                  exit 1

    verify-luarocks-distributor:
        needs: [verify-release, publish-lua, publish-typescript]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false' && needs.publish-lua.result == 'success' && needs.publish-typescript.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12
            - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
            - shell: bash
              run: |
                  EXPECTED="${{ needs.verify-release.outputs.tag_version }}"
                  # LuaRocks versions use the format VERSION-REVISION (e.g., 3.0.0-1)
                  FULL_VERSION="${EXPECTED}-1"

                  for attempt in {1..8}; do
                    INSTALLED=$(curl -sIL -H "User-Agent: STRling-CI" "https://luarocks.org/strling-${FULL_VERSION}.rockspec" | grep -q "200 OK" && echo "$FULL_VERSION" || echo "")

                    if [[ "$INSTALLED" == "$FULL_VERSION" ]]; then
                      echo "✅ Verified $FULL_VERSION is live on LuaRocks"
                      exit 0
                    fi

                    echo "Attempt $attempt: Expected $FULL_VERSION, found '$INSTALLED'. Retrying in 15s..."
                    [[ "$attempt" -lt 8 ]] && sleep 15
                  done

                  echo "❌ Timeout: Version $FULL_VERSION not found on LuaRocks after 2 minutes."
                  exit 1

    verify-maven-distributor:
        needs:
            [verify-release, publish-java, publish-kotlin, publish-typescript]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false' && needs.publish-java.result == 'success' && needs.publish-kotlin.result == 'success' && needs.publish-typescript.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - shell: bash
              run: |
                  EXPECTED="${{ needs.verify-release.outputs.tag_version }}"
                  for attempt in {1..8}; do
                    JAVA_VER=$(curl -fsSL -H "User-Agent: STRling-CI" "https://repo1.maven.org/maven2/com/strling/strling/maven-metadata.xml" | sed -n 's:.*<release>\([^<]*\)</release>.*:\1:p')
                    KOTLIN_VER=$(curl -fsSL -H "User-Agent: STRling-CI" "https://repo1.maven.org/maven2/com/strling/strling-kotlin/maven-metadata.xml" | sed -n 's:.*<release>\([^<]*\)</release>.*:\1:p')

                    if [[ "$JAVA_VER" == "$EXPECTED" && "$KOTLIN_VER" == "$EXPECTED" ]]; then exit 0; fi
                    echo "Attempt $attempt: Expected $EXPECTED, found Java='$JAVA_VER', Kotlin='$KOTLIN_VER'. Retrying in 15s..."
                    [[ "$attempt" -lt 8 ]] && sleep 15
                  done
                  exit 1

