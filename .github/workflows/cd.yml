    certify-release-supply-chain:
        name: Certify exact release artifact handoff
        needs:
            - verify-release
            - compile-c
            - compile-cpp
            - compile-csharp
            - compile-dart
            - compile-fsharp
            - compile-go
            - compile-java
            - compile-kotlin
            - compile-lua
            - compile-perl
            - compile-php
            - compile-python
            - compile-r
            - compile-ruby
            - compile-rust
            - compile-swift
            - compile-typescript
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
            id-token: write
            attestations: write
            artifact-metadata: write
        steps:
            - name: Checkout certified source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  fetch-depth: 0
            - name: Checkout first authenticated build source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  fetch-depth: 0
                  path: .cert/first
            - name: Checkout second authenticated build source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  fetch-depth: 0
                  path: .cert/second
            - name: Restore exact first-build subjects
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  pattern: release-*-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/downloads
            - name: Restore exact rebuild subjects
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  pattern: rebuild-*-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/downloads
            - name: Restore authenticated build receipts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  pattern: release-build-receipt-*-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/receipts
                  merge-multiple: true
            - name: Install governed certification runtime
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.12"
            - name: Install governed Rust security runtime
              uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
              with:
                  toolchain: stable
            - name: Authenticate scanner and exact artifact handoff
              env:
                  STRLING_OSV_SCANNER: ${{ github.workspace }}/.cert/tools/osv-scanner
              run: |
                  python -m pip install --requirement tooling/requirements-quality.txt
                  cargo install cargo-audit --version 0.22.2 --locked
                  mkdir -p .cert/tools
                  curl --fail --location --output "$STRLING_OSV_SCANNER" https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
                  echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  $STRLING_OSV_SCANNER" | sha256sum --check
                  chmod 0755 "$STRLING_OSV_SCANNER"
                  python -m tooling.release_supply_chain check --json
                  python -m tooling.release_supply_chain security --risk-evidence artifacts/release-risk.json --json
                  python -m tooling.release_supply_chain stage --source-root . --download-root .cert/downloads --build-receipt-dir .cert/receipts --first-root .cert/first --second-root .cert/second --release-ref "${{ needs.verify-release.outputs.release_ref }}" --json
                  python -m tooling.release_supply_chain produce --profile release --version "${{ needs.verify-release.outputs.version }}" --source-root .cert/first --second-root .cert/second --output-dir artifacts/release-supply-chain --risk-evidence artifacts/release-risk.json --build-receipt-dir .cert/receipts --json
                  python -m tooling.release_supply_chain verify --source-root .cert/first --evidence artifacts/release-supply-chain/release-supply-chain-evidence.json --json
                  mkdir -p artifacts
                  grep -h -v '^#' artifacts/release-supply-chain/checksums/*.sha256 | LC_ALL=C sort > artifacts/release-subjects.sha256
            - name: Attest exact dry-run subjects
              uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
              with:
                  subject-checksums: artifacts/release-subjects.sha256
            - name: Retain certification subjects
              uses: *governed-upload-artifact
              with:
                  name: release-supply-chain-${{ needs.verify-release.outputs.release_ref }}
                  path: |
                      artifacts/release-subjects.sha256
                      artifacts/release-supply-chain
                      artifacts/release-risk.json
                  if-no-files-found: error
                  retention-days: 90

    # ==========================================
    # TIER 3: INDEPENDENT PUBLISH TRACKS
    # ==========================================

    # --- Tag-Based Pushes ---
    publish-c:
        needs:
            [
                verify-release,
                compile-c,
                certify-release-supply-chain,
                release-certification,
            ]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false'
        runs-on: ubuntu-latest
        environment: release
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Restore certified c artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-c-${{ needs.verify-release.outputs.release_ref }}
                  path: bindings/c
            - run: |
                  TAG="${{ needs.verify-release.outputs.tag_version }}"
                  FILE=$(grep 'return "' bindings/c/src/strling.c | cut -d '"' -f 2)
                  [[ "$TAG" == "$FILE" ]] || exit 1

    publish-go:
        needs:
            [
                verify-release,
                compile-go,
                certify-release-supply-chain,
                release-certification,
            ]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false'
        runs-on: ubuntu-latest
        environment: release
        permissions: { contents: write }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      persist-credentials: true,
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      fetch-depth: 0,
                  }
            - name: Restore certified go artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
              with:
                  name: release-go-${{ needs.verify-release.outputs.release_ref }}
                  path: bindings/go
            - run: |
                  TAG="v${{ needs.verify-release.outputs.tag_version }}"
                  if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG$"; then exit 0; fi
                  git config user.name "github-actions[bot]" && git config user.email "bot@users.noreply.github.com"
                  git tag "$TAG"
                  [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]] || git push origin "refs/tags/$TAG"

