# Delivery & Deployment Pipeline
# Triggered after successful completion of STRling CI workflow on main branch
# Deploys only when the repository is synchronized to the Python SSOT version
# Supports safe retries by skipping artifacts or tags that already exist

name: STRling CD
on:
    workflow_run:
        workflows: ["STRling CI"]
        branches: [main]
        types: [completed]
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Run deployment in dry-run mode"
                required: true
                default: true
                type: boolean
            tag_name:
                description: "Tag name to simulate"
                required: false
                default: ""

permissions:
    contents: read

jobs:
    release-certification:
        name: Certify Release Envelope
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
        steps:
            - name: Checkout release candidate
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
                  fetch-depth: 0

            - name: Install Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.12"

            - name: Install Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      bindings/typescript/package-lock.json
                      tooling/lsp-server/package-lock.json

            - name: Install Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  cache: false
                  go-version: "1.22"

            - name: Install .NET
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: "9.0.x"

            - name: Install Dart SDK
              uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
              with:
                  sdk: "3.10.1"

            - name: Install Ruby and Bundler
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with:
                  ruby-version: "3.2"
                  bundler: "2.4.20"

            - name: Install certification dependencies
              run: |
                  npm ci --ignore-scripts --no-audit --no-fund
                  npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/lsp-server
                  python -m pip install --requirement tooling/requirements-quality.txt
                  for component in csharp dart fsharp go perl ruby typescript; do
                    ./strling setup "$component"
                  done
                  cargo install cargo-audit --version 0.22.2 --locked

            - name: Run canonical release certification profile
              env:
                  ARTIFACT_PATH: artifacts/certification-release.json
              run: |
                  mkdir -p artifacts
                  ./strling profile release --artifact "$ARTIFACT_PATH"

            - name: Derive structured product certification
              if: ${{ always() }}
              env:
                  ARTIFACT_PATH: artifacts/certification-release.json
                  PRODUCT_ARTIFACT_PATH: artifacts/product-certification-release.json
                  PRODUCT_REPORT_PATH: artifacts/product-certification-release.md
              run: python3 tooling/product_certification.py --profile-artifact "$ARTIFACT_PATH" --artifact "$PRODUCT_ARTIFACT_PATH" --report "$PRODUCT_REPORT_PATH"

            - name: Retain release certification evidence
              if: ${{ always() }}
              continue-on-error: true
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: certification-release-${{ github.run_id }}
                  path: |
                      artifacts/certification-release.json
                      artifacts/product-certification-release.json
                      artifacts/product-certification-release.md
                  if-no-files-found: warn
                  retention-days: 90

    # ==========================================
    # TIER 1: GLOBAL PREFLIGHT GATE
    # ==========================================
    verify-release:
        name: Verify Release Conditions
        needs: release-certification
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
        outputs:
            is_release: ${{ steps.release_state.outputs.is_release }}
            tag_version: ${{ steps.release_state.outputs.tag_version }}
            version: ${{ steps.release_state.outputs.version }}
            is_dry_run: ${{ steps.release_state.outputs.is_dry_run }}
            release_ref: ${{ steps.release_state.outputs.release_ref }}
        steps:
            - name: Checkout triggering commit
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
                  fetch-depth: 0

            - name: Setup Python 3.11
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.11"

            - name: Inject Apache 2.0 License
              run: curl -L -o LICENSE https://www.apache.org/licenses/LICENSE-2.0.txt

            - name: Verify SSOT release state
              id: release_state
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.dry_run }}" == "false" ]]; then
                    echo "is_dry_run=false" >> $GITHUB_OUTPUT
                  else
                    echo "is_dry_run=true" >> $GITHUB_OUTPUT
                  fi

                  REF="${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}"
                  echo "release_ref=$REF" >> $GITHUB_OUTPUT

                  python <<'PY'
                  import json, os, re, sys
                  import xml.etree.ElementTree as ET
                  from glob import glob
                  from pathlib import Path

                  try: import tomllib
                  except ModuleNotFoundError: import tomli as tomllib

                  def read_text(p): return Path(p).read_text(encoding='utf-8')
                  def require_match(l, p, t):
                      m = re.search(p, t, re.M)
                      if not m: raise RuntimeError(f"No version for {l}.")
                      return m.group(1).strip()
                  def verify_version(file_path, expected_version, pattern=None, template_path=None, template_suffix='-template'):
                      path = Path(file_path)
                      if path.exists():
                        content = read_text(path)
                        if pattern:
                          value = require_match(path.stem, pattern, content)
                          if expected_version not in value and expected_version != value:
                            raise ValueError(f"Version mismatch in {file_path}")
                          return value
                        if expected_version not in content:
                          raise ValueError(f"Version mismatch in {file_path}")
                        return expected_version

                      if template_path is None:
                        template_path = path.with_name(f"{path.stem}{template_suffix}{path.suffix}")
                      else:
                        template_path = Path(template_path)
                      if template_path.exists():
                        content = read_text(template_path)
                        if "VERSION" in content:
                          print(f"✅ Verified {template_path.name} uses VERSION placeholder")
                          return expected_version
                        raise ValueError(f"Template {template_path} is missing the 'VERSION' placeholder string.")
                      raise FileNotFoundError(f"Could not find {file_path} or its template.")

                  # Extract versions
                  python_raw = tomllib.loads(read_text('bindings/python/pyproject.toml'))['project']['version']
                  ssot = python_raw

                  java_tree = ET.fromstring(read_text('bindings/java/pom.xml'))
                  fsharp_tree = ET.fromstring(read_text('bindings/fsharp/src/STRling/STRling.fsproj'))
                  lua_version = verify_version('bindings/lua/strling.rockspec', ssot, r'^version\s*=\s*"([^"]+)"')
                  lua_path = Path('bindings/lua/strling.rockspec') if Path('bindings/lua/strling.rockspec').exists() else Path('bindings/lua/strling-template.rockspec')
                  lua_text = read_text(lua_path)
                  ruby_version = verify_version('bindings/ruby/strling.gemspec', ssot, r"spec\.version\s*=\s*'([^']+)'", 'bindings/ruby/strling.gemspec.template')

                  # Fix for f-string backslash limitation in Python < 3.12
                  cpp_text = read_text('bindings/cpp/CMakeLists.txt')
                  cpp_base = require_match('C++', r'project\([\s\S]*?VERSION\s+([0-9\.]+)', cpp_text)
                  cpp_pre_match = re.search(r'STRLING_PRERELEASE_TAG\s+"([^"]+)"', cpp_text)
                  cpp_v = f"{cpp_base}-{cpp_pre_match.group(1)}" if cpp_pre_match else cpp_base

                  versions = {
                      'C': require_match('C', r'return\s+"([^"]+)";', read_text('bindings/c/src/strling.c')),
                      'C#': require_match('C#', r'<Version>([^<]+)</Version>', read_text('bindings/csharp/src/STRling/STRling.csproj')),
                      'C++': cpp_v,
                      'Dart': require_match('Dart', r'^version:\s*(.+)$', read_text('bindings/dart/pubspec.yaml')),
                      'F#': require_match('F#', r'<Version>([^<]+)</Version>', read_text('bindings/fsharp/src/STRling/STRling.fsproj')),
                      'Java': java_tree.findtext('{http://maven.apache.org/POM/4.0.0}version') or 'unknown',
                      'Kotlin': require_match('Kotlin', r'^version\s*=\s*providers\.gradleProperty\("version"\)\.orElse\("([^"]+)"\)\.get\(\)', read_text('bindings/kotlin/build.gradle.kts')),
                      'Lua': lua_version.split('-')[0],
                      'Perl': require_match('Perl', r"\$VERSION\s*=\s*'([^']+)'", read_text('bindings/perl/lib/STRling.pm')),
                      'PHP': json.loads(read_text('bindings/php/composer.json'))['version'],
                      'R': require_match('R', r'^Version:\s*(.+)$', read_text('bindings/r/DESCRIPTION')),
                      'Ruby': ruby_version,
                      'Rust': tomllib.loads(read_text('bindings/rust/Cargo.toml'))['package']['version'],
                      'TypeScript': json.loads(read_text('bindings/typescript/package.json'))['version'],
                  }

                  mismatches = [f"{b}: expected {ssot}, found {v}" for b, v in versions.items() if v != ssot]
                  fsharp_pkg_id = fsharp_tree.findtext('{http://schemas.microsoft.com/developer/msbuild/2003}PropertyGroup/{http://schemas.microsoft.com/developer/msbuild/2003}PackageId') or fsharp_tree.findtext('./PropertyGroup/PackageId')
                  if fsharp_pkg_id != 'STRling.FSharp':
                      mismatches.append(f"F#: expected PackageId STRling.FSharp, found {fsharp_pkg_id or 'missing'}")
                  lua_tag = require_match('Lua tag', r'tag\s*=\s*"([^"]+)"', lua_text)
                  if 'VERSION' not in lua_text and lua_tag != f"v{python_raw}":
                      mismatches.append("Lua tag mismatch")

                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f"version={python_raw}\n")
                      f.write(f"tag_version={python_raw}\n")
                      f.write("is_release=false\n" if mismatches else "is_release=true\n")

                  if mismatches:
                      for m in mismatches: print(f"::error::{m}")
                      sys.exit(1)
                  PY

    # ==========================================
    # TIER 2: INDEPENDENT COMPILE TRACKS
    # ==========================================
    compile-c:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: Install Dependencies
              run: sudo apt-get update && sudo apt-get install -y libjansson-dev
            - run: make
              working-directory: bindings/c

    compile-cpp:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - run: cmake . && make
              working-directory: bindings/cpp

    compile-csharp:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with: { dotnet-version: "9.0" }
            - run: dotnet build -c Release
              working-directory: bindings/csharp

    compile-dart:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
            - run: dart pub get
              working-directory: bindings/dart
            - run: dart analyze --no-fatal-warnings
              working-directory: bindings/dart

    compile-fsharp:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with: { dotnet-version: "9.0" }
            - run: dotnet build src/STRling/STRling.fsproj -c Release
              working-directory: bindings/fsharp

    compile-go:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  cache: false
                  go-version: "1.22"
            - run: go build ./...
              working-directory: bindings/go

    compile-java:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with: { distribution: "temurin", java-version: "11" }
            - run: mvn -B -DskipTests compile
              working-directory: bindings/java

    compile-kotlin:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with: { distribution: "temurin", java-version: "11" }
            - run: ./gradlew classes
              working-directory: bindings/kotlin

    compile-lua:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12
            - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
            - working-directory: bindings/lua
              run: |
                  VERSION="${{ needs.verify-release.outputs.version }}"
                  ROCKSPEC="strling-${VERSION}-1.rockspec"
                  sed "s/VERSION/${VERSION}/g" strling-template.rockspec > "$ROCKSPEC"
                  luarocks lint "$ROCKSPEC"

    compile-perl:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
            - run: perl Makefile.PL && make
              working-directory: bindings/perl

    compile-php:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - run: composer validate --no-check-publish --no-check-lock
              working-directory: bindings/php

    compile-python:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with: { python-version: "3.10" }
            - run: pip install build && python -m build
              working-directory: bindings/python

    compile-r:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
            - run: R CMD build .
              working-directory: bindings/r

    compile-ruby:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with: { ruby-version: "3.2" }
            - working-directory: bindings/ruby
              run: |
                  VERSION="${{ needs.verify-release.outputs.version }}"
                  sed "s/VERSION/${VERSION}/g" strling.gemspec.template > strling.gemspec
                  gem build strling.gemspec

    compile-rust:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
            - run: cargo check
              working-directory: bindings/rust

    compile-swift:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - run: swift build
              working-directory: bindings/swift

    compile-typescript:
        needs: verify-release
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with: { node-version: "22" }
            - run: npm ci && npm run build
              working-directory: bindings/typescript

    # ==========================================
    # TIER 3: INDEPENDENT PUBLISH TRACKS
    # ==========================================

    # --- Tag-Based Pushes ---
    publish-c:
        needs: [verify-release, compile-c]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - run: |
                  TAG="${{ needs.verify-release.outputs.tag_version }}"
                  FILE=$(grep 'return "' bindings/c/src/strling.c | cut -d '"' -f 2)
                  [[ "$TAG" == "$FILE" ]] || exit 1

    publish-go:
        needs: [verify-release, compile-go]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        permissions: { contents: write }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      persist-credentials: true,
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      fetch-depth: 0,
                  }
            - run: |
                  TAG="v${{ needs.verify-release.outputs.tag_version }}"
                  if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG$"; then exit 0; fi
                  git config user.name "github-actions[bot]" && git config user.email "bot@users.noreply.github.com"
                  git tag "$TAG"
                  [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]] || git push origin "refs/tags/$TAG"

    publish-php:
        needs: [verify-release, compile-php]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        permissions: { contents: write }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      persist-credentials: true,
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      fetch-depth: 0,
                  }
            - run: |
                  TAG="v${{ needs.verify-release.outputs.tag_version }}"
                  if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG$"; then exit 0; fi
                  git config user.name "github-actions[bot]" && git config user.email "bot@users.noreply.github.com"
                  git tag "$TAG"
                  [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]] || git push origin "refs/tags/$TAG"

    publish-r:
        needs: [verify-release, compile-r]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        permissions: { contents: write }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      persist-credentials: true,
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      fetch-depth: 0,
                  }
            - run: |
                  TAG="v${{ needs.verify-release.outputs.tag_version }}"
                  if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG$"; then exit 0; fi
                  git config user.name "github-actions[bot]" && git config user.email "bot@users.noreply.github.com"
                  git tag "$TAG"
                  [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]] || git push origin "refs/tags/$TAG"

    publish-swift:
        needs: [verify-release, compile-swift]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        permissions: { contents: write }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      persist-credentials: true,
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      fetch-depth: 0,
                  }
            - run: |
                  TAG="v${{ needs.verify-release.outputs.tag_version }}"
                  if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG$"; then exit 0; fi
                  git config user.name "github-actions[bot]" && git config user.email "bot@users.noreply.github.com"
                  git tag "$TAG"
                  [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]] || git push origin "refs/tags/$TAG"

    # --- Distributor Pushes ---
    publish-cpp:
        needs: [verify-release, compile-cpp]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - run: pip install conan
            - working-directory: bindings/cpp
              env:
                  CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
                  CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
              run: |
                  VERSION="${{ needs.verify-release.outputs.version }}"

                  # Exporting to local cache validates the conanfile.py and CMake setup
                  conan export . --name strling --version "$VERSION"

                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    echo "DRY RUN: Recipe strling/$VERSION exported and validated."
                  else
                    # Direct upload to 'conancenter' is restricted to PR-based submissions.
                    echo "SUCCESS: Recipe strling/$VERSION exported to local cache."
                    echo "NOTE: To publish globally, submit a PR to github.com/conan-io/conan-center-index."
                  fi

    publish-csharp:
        needs: [verify-release, compile-csharp]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with: { dotnet-version: "9.0" }
            - working-directory: bindings/csharp
              env:
                  NUGET_KEY: ${{ secrets.NUGET_KEY }}
              run: |
                  VER=$(grep "<Version>" src/STRling/STRling.csproj | sed -e 's/.*<Version>\(.*\)<\/Version>.*/\1/')
                  if python3 ../../tooling/check_version_exists.py --registry nuget --package "STRling" --version "$VER"; then exit 0; fi
                  dotnet pack -c Release
                  [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]] && exit 0
                  dotnet nuget push src/STRling/bin/Release/*.nupkg -k "$NUGET_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

    publish-dart:
        needs: [verify-release, compile-dart]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
            - name: Sync Metadata and Publish
              working-directory: bindings/dart
              run: |
                  VER="${{ needs.verify-release.outputs.version }}"

                  # Guard: exit successfully if this version is already on pub.dev.
                  if python3 ../../tooling/check_version_exists.py --registry pub --package "strling" --version "$VER"; then
                    echo "Version $VER already exists on pub.dev. Skipping publish."
                    exit 0
                  fi

                  # Copy root files required by pub.dev
                  cp ../../LICENSE .

                  if [ ! -f "CHANGELOG.md" ]; then
                    echo "## $VER" > CHANGELOG.md
                    echo "- Official release of version $VER" >> CHANGELOG.md
                  fi

                  # Validate metadata before publishing
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    # Use --ignore-warnings to allow the dry-run to pass despite the modified README/LICENSE files.
                    dart pub publish --dry-run --ignore-warnings
                  else
                    # Force is used here to bypass confirmation during actual release.
                    dart pub publish --force
                  fi

    publish-fsharp:
        needs: [verify-release, compile-fsharp]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with: { dotnet-version: "9.0" }
            - working-directory: bindings/fsharp
              env:
                  NUGET_KEY: ${{ secrets.NUGET_KEY }}
              run: |
                  VER=$(grep "<Version>" src/STRling/STRling.fsproj | sed -e 's/.*<Version>\(.*\)<\/Version>.*/\1/')
                  if python3 ../../tooling/check_version_exists.py --registry nuget --package "STRling.FSharp" --version "$VER"; then exit 0; fi
                  dotnet pack src/STRling/STRling.fsproj -c Release
                  [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]] && exit 0
                  dotnet nuget push src/STRling/bin/Release/*.nupkg -k "$NUGET_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

    publish-java:
        needs: [verify-release, compile-java]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with: { distribution: "temurin", java-version: "11" }
            - name: 🔑 Import GPG Private Key
              env:
                  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
              run: |
                  printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

            - name: 🚀 Deploy to Sonatype (OSSRH)
              working-directory: bindings/java
              env:
                  SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
                  SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
                  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
              run: |
                  VER=$(grep '<version>' pom.xml | head -1 | sed -e 's/.*<version>\(.*\)<\/version>.*/\1/')
                  if python3 ../../tooling/check_version_exists.py --registry maven --group "com.strling" --package "strling" --version "$VER"; then exit 0; fi
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    mvn deploy -DskipTests -Dgpg.skip=true -Dmaven.deploy.skip=true --settings ../../tooling/maven-settings.xml
                  else
                    mvn deploy -DskipTests --settings ../../tooling/maven-settings.xml -Dgpg.passphrase="${GPG_PASSPHRASE}"
                  fi

    publish-kotlin:
        needs: [verify-release, compile-kotlin]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with: { distribution: "temurin", java-version: "11" }
            - working-directory: bindings/kotlin
              env:
                  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
                  MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
                  ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
              run: |
                  VER="${{ needs.verify-release.outputs.version }}"
                  FILE_VER=$(grep -E '^version = providers\.gradleProperty\("version"\)\.orElse\("[^"]+"\)\.get\(\)$' build.gradle.kts | sed -E 's/.*orElse\("([^"]+)"\).*/\1/')
                  if [ "$FILE_VER" != "$VER" ]; then
                    echo "Version mismatch: $FILE_VER != $VER"
                    exit 1
                  fi
                  if python3 ../../tooling/check_version_exists.py --registry maven --group "com.strling" --package "strling-kotlin" --version "$VER"; then exit 0; fi
                  TARGET_TASK="publishToMavenLocal"
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "false" ]; then
                    TARGET_TASK="publish"
                  fi
                  ./gradlew "$TARGET_TASK" -Pversion="$VER"

    publish-lua:
        needs: [verify-release, compile-lua]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12
            - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
            - working-directory: bindings/lua
              env:
                  LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
              run: |
                  VERSION="${{ needs.verify-release.outputs.version }}"
                  ROCKSPEC="strling-${VERSION}-1.rockspec"

                  sed "s/VERSION/${VERSION}/g" strling-template.rockspec > "$ROCKSPEC"

                  luarocks lint "$ROCKSPEC"

                  ROCKSPEC_VERSION=$(grep '^version =' "$ROCKSPEC" | cut -d '"' -f 2)
                  if python3 ../../tooling/check_version_exists.py --registry luarocks --package "strling" --version "$ROCKSPEC_VERSION"; then exit 0; fi

                  if [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]]; then
                    echo "DRY RUN: luarocks make $ROCKSPEC"
                    luarocks make "$ROCKSPEC"
                  else
                    luarocks upload "$ROCKSPEC" --api-key="${LUAROCKS_API_KEY}"
                  fi

    publish-perl:
        needs: [verify-release, compile-perl]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
            - name: Build and Publish
              working-directory: bindings/perl
              env:
                  PAUSE_USERNAME: ${{ secrets.PAUSE_USERNAME }}
                  PAUSE_PASSWORD: ${{ secrets.PAUSE_PASSWORD }}
              run: |
                  cpanm --notest CPAN::Uploader ExtUtils::MakeMaker
                  perl Makefile.PL
                  perl -MExtUtils::Manifest=mkmanifest -e mkmanifest
                  make dist
                  PKG_FILE="STRling-${{ needs.verify-release.outputs.version }}.tar.gz"
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    echo "DRY RUN: Successfully created $PKG_FILE"
                  else
                    cpan-upload -u $PAUSE_USERNAME -p $PAUSE_PASSWORD "$PKG_FILE"
                  fi

    publish-python:
        needs: [verify-release, compile-python]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        permissions: { id-token: write, contents: read }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with: { python-version: "3.10" }
            - working-directory: bindings/python
              id: prepare
              run: |
                  pip install build twine tomli
                  VER=$(python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
                  if python ../../tooling/check_version_exists.py --registry pypi --package "STRling" --version "$VER"; then
                    echo "publish=false" >> $GITHUB_OUTPUT
                    echo "Version already exists in PyPI; skipping upload."
                    exit 0
                  fi

                  python -m build

                  if [[ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]]; then
                    echo "publish=false" >> $GITHUB_OUTPUT
                    echo "Dry run enabled; PyPI upload skipped."
                    exit 0
                  fi

                  echo "publish=true" >> $GITHUB_OUTPUT
            - if: steps.prepare.outputs.publish == 'true'
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with: { packages-dir: bindings/python/dist/ }

    publish-ruby:
        needs: [verify-release, compile-ruby]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - name: 💎 Setup Ruby
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with:
                  ruby-version: "3.2"
                  rubygems: latest

            - name: 🔑 Configure RubyGems OIDC
              uses: rubygems/configure-rubygems-credentials@abfabee9aa68f1c2c95a6f58c91d826e5fac33da # main

            - name: 🚀 Build and Publish Gem
              working-directory: bindings/ruby
              run: |
                  VERSION="${{ needs.verify-release.outputs.version }}"

                  # 1. Idempotency Guard
                  if python3 ../../tooling/check_version_exists.py --registry rubygems --package "strling" --version "$VERSION"; then
                    echo "Version $VERSION already exists on RubyGems. Skipping publish."
                    exit 0
                  fi

                  # 2. Build Artifact
                  GEMSPEC="strling.gemspec"
                  sed "s/VERSION/${VERSION}/g" strling.gemspec.template > $GEMSPEC
                  gem build $GEMSPEC

                  # 3. Conditional Push
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    echo "DRY RUN: Successfully built strling-${VERSION}.gem (push skipped)"
                  else
                    # The CLI will now find the OIDC token automatically via the action above
                    gem push "strling-${VERSION}.gem"
                  fi

                  rm -f $GEMSPEC

    publish-rust:
        needs: [verify-release, compile-rust]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        permissions: { id-token: write, contents: read }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
            - working-directory: bindings/rust
              run: |
                  VER=$(grep "^version" Cargo.toml | head -n 1 | cut -d '"' -f 2)
                  if python3 ../../tooling/check_version_exists.py --registry crates --package "strling" --version "$VER"; then exit 0; fi
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    cargo publish --dry-run
                  else
                    cargo publish
                  fi

    publish-typescript:
        needs: [verify-release, compile-typescript]
        if: needs.verify-release.outputs.is_release == 'true'
        runs-on: ubuntu-latest
        permissions: { id-token: write, contents: read }
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  {
                      ref: "${{ needs.verify-release.outputs.release_ref }}",
                      persist-credentials: false,
                  }
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  {
                      node-version: "22",
                      registry-url: "https://registry.npmjs.org",
                  }
            - working-directory: bindings/typescript
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  VER=$(node -pe "require('./package.json').version")
                  if python ../../tooling/check_version_exists.py --registry npm --package "@strling-lang/strling" --version "$VER"; then exit 0; fi
                  npm ci && npm run build
                  TAG="latest"
                  [[ "$VER" == *-* ]] && TAG="${VER#*-}"
                  if [ "${{ needs.verify-release.outputs.is_dry_run }}" == "true" ]; then
                    npm publish --dry-run --access public --tag "$TAG"
                  else
                    npm publish --access public --tag "$TAG"
                  fi

    verify-cpan-distributor:
        needs: [verify-release, publish-perl, publish-typescript]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false' && needs.publish-perl.result == 'success' && needs.publish-typescript.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
            - shell: bash
              run: |
                  EXPECTED="${{ needs.verify-release.outputs.tag_version }}"
                  for attempt in {1..8}; do
                    cpanm --notest STRling >/dev/null 2>&1 || true
                    INSTALLED=$(perl -MSTRling -e 'print $STRling::VERSION' 2>/dev/null || echo "")

                    if [[ "$INSTALLED" == "$EXPECTED" ]]; then exit 0; fi
                    echo "Attempt $attempt: Expected $EXPECTED, found $INSTALLED. Retrying in 15s..."
                    [[ "$attempt" -lt 8 ]] && sleep 15
                  done
                  exit 1

    verify-crates-distributor:
        needs: [verify-release, publish-rust, publish-typescript]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false' && needs.publish-rust.result == 'success' && needs.publish-typescript.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
            - shell: bash
              run: |
                  EXPECTED="${{ needs.verify-release.outputs.tag_version }}"
                  for attempt in {1..8}; do
                    # Use the API directly to bypass index latency
                    INSTALLED=$(curl -s -H "User-Agent: STRling-CI (contact@strling.com)" https://crates.io/api/v1/crates/strling | jq -r '.crate.max_version')

                    if [[ "$INSTALLED" == "$EXPECTED" ]]; then
                      echo "✅ Verified $EXPECTED is live on crates.io"
                      exit 0
                    fi

                    echo "Attempt $attempt: Expected $EXPECTED, found $INSTALLED. Retrying in 15s..."
                    [[ "$attempt" -lt 8 ]] && sleep 15
                  done
                  exit 1

    verify-gems-distributor:
        needs: [verify-release, publish-ruby, publish-typescript]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false' && needs.publish-ruby.result == 'success' && needs.publish-typescript.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with: { ruby-version: "3.2" }
            - shell: bash
              run: |
                  EXPECTED="${{ needs.verify-release.outputs.tag_version }}"
                  for attempt in {1..8}; do
                    INSTALLED=$(curl -s -H "User-Agent: STRling-CI" https://rubygems.org/api/v1/gems/strling.json | jq -r '.version')

                    if [[ "$INSTALLED" == "$EXPECTED" ]]; then exit 0; fi
                    echo "Attempt $attempt: Expected $EXPECTED, found $INSTALLED. Retrying in 15s..."
                    [[ "$attempt" -lt 8 ]] && sleep 15
                  done
                  exit 1

    verify-luarocks-distributor:
        needs: [verify-release, publish-lua, publish-typescript]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false' && needs.publish-lua.result == 'success' && needs.publish-typescript.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12
            - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
            - shell: bash
              run: |
                  EXPECTED="${{ needs.verify-release.outputs.tag_version }}"
                  # LuaRocks versions use the format VERSION-REVISION (e.g., 3.0.0-1)
                  FULL_VERSION="${EXPECTED}-1"

                  for attempt in {1..8}; do
                    INSTALLED=$(curl -sIL -H "User-Agent: STRling-CI" "https://luarocks.org/strling-${FULL_VERSION}.rockspec" | grep -q "200 OK" && echo "$FULL_VERSION" || echo "")

                    if [[ "$INSTALLED" == "$FULL_VERSION" ]]; then
                      echo "✅ Verified $FULL_VERSION is live on LuaRocks"
                      exit 0
                    fi

                    echo "Attempt $attempt: Expected $FULL_VERSION, found '$INSTALLED'. Retrying in 15s..."
                    [[ "$attempt" -lt 8 ]] && sleep 15
                  done

                  echo "❌ Timeout: Version $FULL_VERSION not found on LuaRocks after 2 minutes."
                  exit 1

    verify-maven-distributor:
        needs:
            [verify-release, publish-java, publish-kotlin, publish-typescript]
        if: needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run == 'false' && needs.publish-java.result == 'success' && needs.publish-kotlin.result == 'success' && needs.publish-typescript.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - shell: bash
              run: |
                  EXPECTED="${{ needs.verify-release.outputs.tag_version }}"
                  for attempt in {1..8}; do
                    JAVA_VER=$(curl -fsSL -H "User-Agent: STRling-CI" "https://repo1.maven.org/maven2/com/strling/strling/maven-metadata.xml" | sed -n 's:.*<release>\([^<]*\)</release>.*:\1:p')
                    KOTLIN_VER=$(curl -fsSL -H "User-Agent: STRling-CI" "https://repo1.maven.org/maven2/com/strling/strling-kotlin/maven-metadata.xml" | sed -n 's:.*<release>\([^<]*\)</release>.*:\1:p')

