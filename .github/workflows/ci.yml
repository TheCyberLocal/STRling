# Integration & Verification Pipeline
# The CI workflow runs tests for all supported language bindings
# Deployment logic is in cd.yml

name: STRling CI
on:
    push:
        branches:
            - main
            - dev
            - "feature/**"
        tags:
            - "v*"
    pull_request:

permissions:
    contents: read

jobs:
    quality-hardgates:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Install Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.12"

            - name: Install Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      bindings/typescript/package-lock.json
                      tooling/lsp-server/package-lock.json

            - name: Install Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  cache: false
                  go-version: "1.22"

            - name: Install .NET
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: "9.0.x"

            - name: Install Dart SDK
              uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
              with:
                  sdk: "3.10.1"

            - name: Install Ruby and Bundler
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with:
                  ruby-version: "3.2"
                  bundler: "2.4.20"

            - name: Install quality dependencies
              run: |
                  npm ci --ignore-scripts --no-audit --no-fund
                  npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/lsp-server
                  python -m pip install --requirement tooling/requirements-quality.txt
                  for component in csharp dart fsharp go perl ruby typescript; do
                    ./strling setup "$component"
                  done

            - name: Install pinned security scanner
              run: cargo install cargo-audit --version 0.22.2 --locked

            - name: Enforce canonical contract, architecture, and quality hardgates
              run: ./strling check

            - name: Enforce network-backed security certification
              run: ./strling certify typescript

    # --- TEST JOBS (ALPHABETICALLY ORDERED) ---
    test-matrix:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                language:
                    [
                        c,
                        cpp,
                        csharp,
                        python,
                        ruby,
                        go,
                        rust,
                        java,
                        kotlin,
                        dart,
                        lua,
                        perl,
                        php,
                        r,
                        swift,
                        typescript,
                        fsharp,
                    ]

        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            - name: 🔧 Universal Setup
              run: chmod +x strling

            # --- TOOLCHAIN INSTALLATION (for languages not pre-installed) ---
            - name: 🔧 Install Node
              if: matrix.language == 'typescript'
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "22"

            - name: 🔧 Install Go
              if: matrix.language == 'go'
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  cache: false
                  go-version: "1.22"

            - name: 🔧 Install .NET
              if: matrix.language == 'csharp' || matrix.language == 'fsharp'
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: "9.0.x"

            - name: 🔧 Install Ruby & Bundler
              if: matrix.language == 'ruby'
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with:
                  ruby-version: "3.2"
                  bundler: "2.4.20"

            - name: 🔧 Install Lua & LuaRocks
              if: matrix.language == 'lua'
              uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12
              with:
                  luaVersion: "5.4"

            - name: 🔧 Install LuaRocks
              if: matrix.language == 'lua'
              uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6

            - name: 🔧 Install R
              if: matrix.language == 'r'
              run: |
                  set -e
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libuv1-dev \
                    r-base \
                    r-base-dev \
                    libcurl4-openssl-dev \
                    libssl-dev \
                    libxml2-dev

                  CODENAME="$(lsb_release --short --codename)"
                  echo "CRAN=https://packagemanager.posit.co/cran/__linux__/${CODENAME}/latest" >> "$GITHUB_ENV"

            - name: 🔧 Install Dart SDK
              if: matrix.language == 'dart'
              uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
              with:
                  sdk: stable

            - name: 🔎 Validate Toolchain
              run: ./strling environment ${{ matrix.language }}

            # --- DYNAMIC CACHING ---
            - name: 📋 Resolve Cache Configuration
              id: cache-config
              run: |
                  # Get cache paths (may be multiple lines for some languages like Rust)
                  CACHE_PATHS=$(./strling cache-dir ${{ matrix.language }})
                  # Convert newlines to the GitHub Actions multiline format
                  if [ -n "$CACHE_PATHS" ]; then
                      # For multiline paths, join with newlines for actions/cache
                      echo "path<<EOF" >> $GITHUB_OUTPUT
                      echo "$CACHE_PATHS" >> $GITHUB_OUTPUT
                      echo "EOF" >> $GITHUB_OUTPUT
                  else
                      echo "path=" >> $GITHUB_OUTPUT
                  fi
                  # Get lockfile name for cache key
                  LOCKFILE=$(./strling lockfile ${{ matrix.language }})
                  echo "lockfile=$LOCKFILE" >> $GITHUB_OUTPUT

            - name: 💾 Restore Dependency Cache
              if: steps.cache-config.outputs.path != ''
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: ${{ steps.cache-config.outputs.path }}
                  # Hardcode the version prefix (e.g., 'v1-') directly into the key
                  key: v1-${{ runner.os }}-${{ matrix.language }}-${{ hashFiles(format('bindings/{0}/{1}', matrix.language, steps.cache-config.outputs.lockfile)) }}
                  restore-keys: |
                      v1-${{ runner.os }}-${{ matrix.language }}-

            - name: 📦 Install Dependencies (Setup)
              run: ./strling setup ${{ matrix.language }}
              continue-on-error: false

            - name: 🔎 Enforce Static Quality
              run: |
                  ./strling lint ${{ matrix.language }}
                  ./strling typecheck ${{ matrix.language }}

            - name: 🔨 Compile (Build)
              run: ./strling build ${{ matrix.language }}

            - name: 🧪 Execute Tests
              run: ./strling test ${{ matrix.language }}
