# Integration & Verification Pipeline
# The CI workflow runs tests for all supported language bindings
# Deployment logic is in cd.yml

name: STRling CI
on:
    push:
        branches:
            - main
            - dev
            - "feature/**"
        tags:
            - "v*"
    pull_request:
    schedule:
        - cron: "17 4 * * 1"
    workflow_dispatch:
        inputs:
            certification_profile:
                description: "Canonical certification profile"
                required: true
                default: local
                type: choice
                options:
                    - local
                    - pull-request
                    - full
                    - release

permissions:
    contents: read

jobs:
    quality-hardgates:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Install Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.12"

            - name: Install Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      bindings/typescript/package-lock.json
                      tooling/lsp-server/package-lock.json

            - name: Install Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  cache: false
                  go-version: "1.22"

            - name: Install .NET
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: "9.0.x"

            - name: Install Dart SDK
              uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
              with:
                  sdk: "3.10.1"

            - name: Install Ruby and Bundler
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with:
                  ruby-version: "3.2"
                  bundler: "2.4.20"

            - name: Install Lua
              uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12
              with:
                  luaVersion: "5.4"

            - name: Install LuaRocks
              uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6

            - name: Install R and Perl prerequisites
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    cpanminus \
                    libcurl4-openssl-dev \
                    libssl-dev \
                    libuv1-dev \
                    libxml2-dev \
                    r-base \
                    r-base-dev
                  codename="$(lsb_release --short --codename)"
                  echo "CRAN=https://packagemanager.posit.co/cran/__linux__/${codename}/latest" >> "$GITHUB_ENV"

            - name: Install pinned interop Rust toolchain
              run: >-
                  rustup toolchain install 1.75.0 --profile minimal
                  --component clippy --component rustfmt
                  --component llvm-tools-preview
                  --target wasm32-unknown-unknown

            - name: Install quality dependencies
              run: |
                  npm ci --ignore-scripts --no-audit --no-fund
                  npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/lsp-server
                  python -m pip install --requirement tooling/requirements-quality.txt
                  cargo +1.75.0 fetch --manifest-path bindings/interop/Cargo.toml --locked
                  cargo +1.75.0 fetch --manifest-path bindings/interop/Cargo.toml --locked --target wasm32-unknown-unknown
                  cargo +1.75.0 build --manifest-path bindings/interop/Cargo.toml -p strling-interop --target wasm32-unknown-unknown --release --locked
                  cpanm --notest P/PL/PLICEASE/FFI-Platypus-2.11.tar.gz
                  (cd bindings/jvm && mvn -B -DskipTests install)
                  ./strling bootstrap all
                  cargo +1.75.0 fetch --manifest-path tests/certification/performance-resource/1.0/runner/Cargo.toml --locked

            - name: Install pinned security scanner
              run: cargo install cargo-audit --version 0.22.2 --locked

            - name: Resolve canonical certification profile
              id: certification_profile
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  GIT_REF: ${{ github.ref }}
                  REQUESTED_PROFILE: ${{ inputs.certification_profile }}
              run: |
                  case "$EVENT_NAME" in
                    workflow_dispatch) profile="$REQUESTED_PROFILE" ;;
                    pull_request) profile="pull-request" ;;
                    schedule) profile="full" ;;
                    push)
                      if [[ "$GIT_REF" == refs/tags/v* ]]; then
                        profile="release"
                      else
                        profile="pull-request"
                      fi
                      ;;
                    *) exit 2 ;;
                  esac
                  case "$profile" in
                    local|pull-request|full|release) ;;
                    *) exit 2 ;;
                  esac
                  echo "profile=$profile" >> "$GITHUB_OUTPUT"
                  echo "artifact_path=artifacts/certification-$profile.json" >> "$GITHUB_OUTPUT"
                  echo "product_artifact_path=artifacts/product-certification-$profile.json" >> "$GITHUB_OUTPUT"
                  echo "product_report_path=artifacts/product-certification-$profile.md" >> "$GITHUB_OUTPUT"

            - name: Prepare governed runtime cache root
              if: steps.certification_profile.outputs.profile != 'local'
              run: |
                  sudo install -d -o "$USER" -g "$(id -gn)" /opt/strling-toolchains
                  sudo install -d -o "$USER" -g "$(id -gn)" /opt/node-v22.23.2-linux-x64
                  sudo install -d -o "$USER" -g "$(id -gn)" /opt/pcre2-10.42-build-default
                  sudo install -d -o "$USER" -g "$(id -gn)" /opt/pcre2-10.43-build-default

            - name: Restore governed runtime cache
              if: steps.certification_profile.outputs.profile != 'local'
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: |
                      /opt/strling-toolchains
                      /opt/node-v22.23.2-linux-x64
                      /opt/pcre2-10.42-build-default
                      /opt/pcre2-10.43-build-default
                  key: exact-regex-runtimes-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('governance/exact-runtime-toolchains.json', 'tooling/exact_runtime_provision.py') }}

            - name: Provision exact governed regex runtimes
              if: steps.certification_profile.outputs.profile != 'local'
              run: >-
                  python3 -m tooling.exact_runtime_provision
                  --provision --github-env "$GITHUB_ENV"

            - name: Install interop adversarial certification toolchain
              if: >-
                  steps.certification_profile.outputs.profile == 'full' ||
                  steps.certification_profile.outputs.profile == 'release'
              run: |
                  rustup toolchain install nightly-2026-08-01 --profile minimal --component rust-src
                  cargo +stable install cargo-fuzz --version 0.13.2 --locked
                  cargo +nightly-2026-08-01 fetch --locked --manifest-path bindings/interop/fuzz/Cargo.toml
                  cargo +nightly-2026-08-01 fetch --locked --target x86_64-unknown-linux-gnu --manifest-path "$(rustc +nightly-2026-08-01 --print sysroot)/lib/rustlib/src/rust/library/Cargo.toml"
                  cargo +1.75.0 build --manifest-path bindings/interop/Cargo.toml -p strling-interop --target wasm32-unknown-unknown --release --locked

            - name: Run canonical certification profile
              env:
                  ARTIFACT_PATH: ${{ steps.certification_profile.outputs.artifact_path }}
                  PROFILE: ${{ steps.certification_profile.outputs.profile }}
              run: |
                  mkdir -p artifacts
                  ./strling profile "$PROFILE" --artifact "$ARTIFACT_PATH"

            - name: Derive structured product certification
              if: >-
                  always() &&
                  (steps.certification_profile.outputs.profile == 'full' ||
                  steps.certification_profile.outputs.profile == 'release')
              env:
                  ARTIFACT_PATH: ${{ steps.certification_profile.outputs.artifact_path }}
                  PRODUCT_ARTIFACT_PATH: ${{ steps.certification_profile.outputs.product_artifact_path }}
                  PRODUCT_REPORT_PATH: ${{ steps.certification_profile.outputs.product_report_path }}
              run: python3 tooling/product_certification.py --profile-artifact "$ARTIFACT_PATH" --artifact "$PRODUCT_ARTIFACT_PATH" --report "$PRODUCT_REPORT_PATH"

            - name: Retain certification evidence
              if: ${{ always() }}
              continue-on-error: true
              uses: &governed-upload-artifact actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: certification-${{ steps.certification_profile.outputs.profile }}-${{ github.run_id }}
                  path: |
                      ${{ steps.certification_profile.outputs.artifact_path }}
                      ${{ steps.certification_profile.outputs.product_artifact_path }}
                      ${{ steps.certification_profile.outputs.product_report_path }}
                      artifacts/adversarial-semantic-runtime/**
                  if-no-files-found: warn
                  retention-days: 30

    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
            - name: Review dependency changes
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

    interop-platform-certification:
        name: Interop ABI (${{ matrix.target }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      runner: ubuntu-latest
                      wasm: true
                    - target: x86_64-pc-windows-msvc
                      runner: windows-latest
                      wasm: false
                    - target: x86_64-apple-darwin
                      runner: macos-15-intel
                      wasm: false
                    - target: aarch64-apple-darwin
                      runner: macos-latest
                      wasm: false
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            - name: Install Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.12"

            - name: Install Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "22"

            - name: Install pinned native Rust toolchain
              run: >-
                  rustup toolchain install 1.75.0 --profile minimal
                  --component clippy --component rustfmt
                  --component llvm-tools-preview

            - name: Install raw WebAssembly target
              if: matrix.wasm
              run: rustup target add wasm32-unknown-unknown --toolchain 1.75.0

            - name: Install contract validator
              run: python -m pip install --requirement tooling/requirements-quality.txt

            - name: Certify native and raw WebAssembly boundary
              run: >-
                  python -m tooling.interop_certification --json
                  --expected-host ${{ matrix.target }}
                  --output artifacts/interop-${{ matrix.target }}.json
                  ${{ matrix.wasm && '--wasm' || '' }}

            - name: Retain interop certification evidence
              if: ${{ always() }}
              uses: *governed-upload-artifact
              with:
                  name: interop-${{ matrix.target }}-${{ github.run_id }}
                  path: artifacts/interop-${{ matrix.target }}.json
                  if-no-files-found: warn
                  retention-days: 30

    interop-adversarial-certification:
        name: Interop fuzz and sanitizers (x86_64 Linux)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            - name: Install Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.12"

            - name: Install Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "22"

            - name: Install pinned stable and adversarial Rust toolchains
              run: |
                  rustup toolchain install 1.75.0 --profile minimal --target wasm32-unknown-unknown
                  rustup toolchain install nightly-2026-08-01 --profile minimal --component rust-src
                  cargo +stable install cargo-fuzz --version 0.13.2 --locked
                  cargo +nightly-2026-08-01 fetch --locked --manifest-path bindings/interop/fuzz/Cargo.toml
                  cargo +nightly-2026-08-01 fetch --locked --target x86_64-unknown-linux-gnu --manifest-path "$(rustc +nightly-2026-08-01 --print sysroot)/lib/rustlib/src/rust/library/Cargo.toml"
                  cargo +1.75.0 build --manifest-path bindings/interop/Cargo.toml -p strling-interop --target wasm32-unknown-unknown --release --locked

            - name: Install contract validator
              run: python -m pip install --requirement tooling/requirements-quality.txt

            - name: Certify fixed-run fuzz, native sanitizers, and WASM host memory
              run: >-
                  python -m tooling.interop_adversarial --json
                  --output artifacts/interop-adversarial-x86_64-linux.json

            - name: Retain adversarial certification evidence
              if: ${{ always() }}
              uses: *governed-upload-artifact
              with:
                  name: interop-adversarial-x86_64-linux-${{ github.run_id }}
                  path: artifacts/interop-adversarial-x86_64-linux.json
                  if-no-files-found: warn
                  retention-days: 30

    lsp-package-certification:
        name: LSP package (${{ matrix.target }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: linux-x64
                      runner: ubuntu-latest
                    - target: win32-x64
                      runner: windows-latest
                    - target: darwin-x64
                      runner: macos-15-intel
                    - target: darwin-arm64
                      runner: macos-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Install Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.12.10"

            - name: Install Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "22.18.0"
                  cache: npm
                  cache-dependency-path: tooling/lsp-server/package-lock.json

            - name: Install pinned Rust toolchain
              run: |
                  rustup toolchain install 1.97.1 --profile minimal
                  rustup default 1.97.1

            - name: Install locked package tooling
              run: npm ci --ignore-scripts --no-audit --no-fund --prefix tooling/lsp-server

            - name: Certify clean-checkout package
              run: >-
                  python tooling/lsp-server/package_extension.py certify
                  --target ${{ matrix.target }}
                  --output artifacts/vscode-strling-1.0.0-${{ matrix.target }}.vsix
                  --evidence artifacts/lsp-package-${{ matrix.target }}.json

            - name: Retain package and certification evidence
              if: ${{ always() }}
              uses: *governed-upload-artifact
              with:
                  name: lsp-package-${{ matrix.target }}-${{ github.run_id }}
                  path: artifacts/*
                  if-no-files-found: warn
                  retention-days: 30

    # --- TEST JOBS (ALPHABETICALLY ORDERED) ---
    test-matrix:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                language:
                    [
                        c,
                        cpp,
                        csharp,
                        python,
                        ruby,
                        go,
                        rust,
                        java,
                        kotlin,
                        dart,
                        lua,
                        perl,
                        php,
                        r,
                        swift,
                        typescript,
                        fsharp,
                    ]

        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false

            - name: 🔧 Universal Setup
              run: chmod +x strling

            # --- TOOLCHAIN INSTALLATION (for languages not pre-installed) ---
            - name: 🔧 Install Node
              if: matrix.language == 'typescript'
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "22"

            - name: 🔧 Install Go
              if: matrix.language == 'go'
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  cache: false
                  go-version: "1.22"

            - name: 🔧 Install .NET
              if: matrix.language == 'csharp' || matrix.language == 'fsharp'
              uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
              with:
                  dotnet-version: "9.0.x"

            - name: 🔧 Install Ruby & Bundler
              if: matrix.language == 'ruby'
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
              with:
                  ruby-version: "3.2"
                  bundler: "2.4.20"

            - name: 🔧 Install Lua & LuaRocks
              if: matrix.language == 'lua'
              uses: leafo/gh-actions-lua@8c9e175e7a3d77e21f809eefbee34a19b858641b # v12
              with:
                  luaVersion: "5.4"

            - name: 🔧 Install LuaRocks
              if: matrix.language == 'lua'
              uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6

            - name: 🔧 Install R
              if: matrix.language == 'r'
              run: |
                  set -e
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libuv1-dev \
                    r-base \
                    r-base-dev \
                    libcurl4-openssl-dev \
                    libssl-dev \
                    libxml2-dev

                  CODENAME="$(lsb_release --short --codename)"
                  echo "CRAN=https://packagemanager.posit.co/cran/__linux__/${CODENAME}/latest" >> "$GITHUB_ENV"

            - name: 🔧 Install Dart SDK
              if: matrix.language == 'dart'
              uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
              with:
                  sdk: stable

            - name: 🔎 Validate Toolchain
              run: ./strling environment ${{ matrix.language }}

            # --- DYNAMIC CACHING ---
            - name: 📋 Resolve Cache Configuration
              id: cache-config
              run: |
                  # Get cache paths (may be multiple lines for some languages like Rust)
                  CACHE_PATHS=$(./strling cache-dir ${{ matrix.language }})
                  # Convert newlines to the GitHub Actions multiline format
                  if [ -n "$CACHE_PATHS" ]; then
                      # For multiline paths, join with newlines for actions/cache
                      echo "path<<EOF" >> $GITHUB_OUTPUT
                      echo "$CACHE_PATHS" >> $GITHUB_OUTPUT
                      echo "EOF" >> $GITHUB_OUTPUT
                  else
                      echo "path=" >> $GITHUB_OUTPUT
                  fi
                  # Get lockfile name for cache key
                  LOCKFILE=$(./strling lockfile ${{ matrix.language }})
                  echo "lockfile=$LOCKFILE" >> $GITHUB_OUTPUT

            - name: 💾 Restore Dependency Cache
              if: steps.cache-config.outputs.path != ''
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: ${{ steps.cache-config.outputs.path }}
                  # Hardcode the version prefix (e.g., 'v1-') directly into the key
                  key: v1-${{ runner.os }}-${{ matrix.language }}-${{ hashFiles(format('bindings/{0}/{1}', matrix.language, steps.cache-config.outputs.lockfile)) }}
                  restore-keys: |
                      v1-${{ runner.os }}-${{ matrix.language }}-

            - name: 📦 Install Dependencies (Setup)
              run: ./strling setup ${{ matrix.language }}
              continue-on-error: false

            - name: 🔎 Enforce Static Quality
              run: |
                  ./strling lint ${{ matrix.language }}
                  ./strling typecheck ${{ matrix.language }}

            - name: 🔨 Compile (Build)
              run: ./strling build ${{ matrix.language }}

            - name: 🧪 Execute Tests
              run: ./strling test ${{ matrix.language }}
